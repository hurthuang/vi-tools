function parseCtb(text) {
    const children = [];
    for (let raw of text.split('\n')) {
        const line = raw.replace(/#.*$/, '').trim();
        if (!line) continue;
        const parts = line.split(/\s+/);
        let op = parts[0].toLowerCase();
        if (op === 'include') {
            if (parts[1] && !SKIP_INC.has(parts[1])) children.push(parts[1]);
            continue;
        }
        let ci=1, di=2;
        if (op==='noback'||op==='nofor') { op=(parts[1]||'').toLowerCase(); ci=2; di=3; }
        if (op === 'correct') {
            const rhs = parts.slice(ci).join(' ');
            if (rhs.includes('%') || rhs.includes('$')) continue;
            // context correct: _N"<prev>"["<curr>"]"<next>"? "<repl>"
            const mc1 = rhs.match(/^_\d+"([^"]*)"\["([^"]*)"\](?:"([^"]*)")?\s+"([^"]*)"/);
            if (mc1) {
                const curr = _decodeCtbStr(mc1[2]), repl = _decodeCtbStr(mc1[4]);
                if (curr.length === 1 && repl.length >= 1)
                    zhCorrectCtxRules.push({ prev: _decodeCtbStr(mc1[1]), curr,
                        next: mc1[3] != null ? _decodeCtbStr(mc1[3]) : null,
                        replacement: repl });
                continue;
            }
            // context correct (no lookbehind): ["<curr>"]"<next>"? "<repl>"
            const mc2 = rhs.match(/^\["([^"]*)"\](?:"([^"]*)")?\s+"([^"]*)"/);
            if (mc2) {
                const curr = _decodeCtbStr(mc2[1]), repl = _decodeCtbStr(mc2[3]);
                if (curr.length === 1 && repl.length >= 1)
                    zhCorrectCtxRules.push({ prev: null, curr,
                        next: mc2[2] != null ? _decodeCtbStr(mc2[2]) : null,
                        replacement: repl });
                continue;
            }
            // simple correct: "<from>" "<to>"
            const ms = rhs.match(/^"([^"]*)"\s+"([^"]*)"/);
            if (ms) {
                const from = _decodeCtbStr(ms[1]), to = _decodeCtbStr(ms[2]);
                if (from.length === 1 && to.length >= 1) zhCorrectMap.set(from, to);
            }
            continue;
        }
        if (op === 'context') {
            const rhs = parts.slice(ci).join(' ');
            if (rhs.includes('%') || rhs.includes('$')) continue;
            const m1 = rhs.match(/^_\d+"([^"]*)"\["([^"]*)"\](?:"([^"]*)")?\s+@([\d-]+)/);
            if (m1) {
                const curr = _decodeCtbStr(m1[2]);
                if (curr.length === 1)
                    try { zhCtxRules.push({ prev: _decodeCtbStr(m1[1]), curr,
                        next: m1[3] != null ? _decodeCtbStr(m1[3]) : null,
                        braille: dotsToUnicode(m1[4]) }); } catch(e) {}
                continue;
            }
            const m2 = rhs.match(/^\["([^"]*)"\](?:"([^"]*)")?\s+@([\d-]+)/);
            if (m2) {
                const curr = _decodeCtbStr(m2[1]);
                if (curr.length === 1)
                    try { zhCtxRules.push({ prev: null, curr,
                        next: m2[2] != null ? _decodeCtbStr(m2[2]) : null,
                        braille: dotsToUnicode(m2[3]) }); } catch(e) {}
            }
            continue;
        }
        if (!CHAR_OPS.has(op)||parts.length<=di) continue;
        const tok=parts[ci], dotsTok=parts[di];
        let char;
        const esc=tok.match(/^\\x([0-9a-fA-F]{1,6})$/);
        if (esc) char=String.fromCodePoint(parseInt(esc[1],16));
        else if (tok.length===1) char=tok;
        else continue;
        // 跳過 ASCII 可見字元（由內建表處理）
        const cp = char.codePointAt(0);
        if (cp >= 0x20 && cp <= 0x7e) continue;
        try { zhMap.set(char, dotsToUnicode(dotsTok)); } catch(e) {}
    }
    return children;
}

const _vis = new Set();
const ZH_TABLE_DIR = 'table/';
async function fetchAndParse(fn) {
    if (_vis.has(fn)) return;
    _vis.add(fn);
    let text;
    try {
        // 若 fn 已含路徑前綴則直接用，否則加上 table/ 前綴
        const url = fn.includes('/') ? fn : ZH_TABLE_DIR + fn;
        const r = await fetch(url);
        if (!r.ok) throw new Error(r.status);
        text = await r.text();
    } catch(e) { console.warn('skip', fn, e.message); return; }
    for (const c of parseCtb(text)) await fetchAndParse(c);
}

async function loadRules() {
    _vis.clear(); zhMap.clear(); zhCtxRules.length = 0;
    zhCorrectMap.clear(); zhCorrectCtxRules.length = 0; isLoaded=false;
    const st = document.getElementById('rules-status');
    st.className='rules-status loading'; st.textContent='正在載入規則...';
    try {
        // 並行載入：中文 CTB 解析 + liblouis 表格預載
        await Promise.all([
            fetchAndParse('zh-tw.ctb'),
            LOU.preloadTables()
        ]);

        // ── PDF 規範覆蓋表 ────────────────────────────────────────
        // CTB 部分值與《台灣注音點字規則整理 [標點符號]》不符，以 PDF 為準覆蓋
        // ．(xFF0E) 全形句號：CTB=46=⠨，PDF 規範=36=⠤（與。相同）
        zhMap.set('\uFF0E', '\u2824');  // ．→ ⠤ (36)
        // ·(U+00B7) 間隔號：CTB=46=⠨，PDF 規範=36=⠤
        zhMap.set('\u00B7', '\u2824');  // · → ⠤ (36)
        // ‧(U+2027) 間隔號另一字型：同上
        zhMap.set('\u2027', '\u2824');  // ‧ → ⠤ (36)
        // ？(xFF1F) 問號：CTB=1456=⠹，PDF 規範=135=⠕
        zhMap.set('\uFF1F', '\u2815');  // ？→ ⠕ (135)
        // ！(xFF01) 驚嘆號：CTB=123=⠇，PDF 規範=123=⠇（一致，無需覆蓋，僅確認）

        // ── PDF 有但 CTB 未收錄的標點，手動補入 ────────────────────
        // 書名號甲式符號（～波浪線）：6-36 → ⠠⠤
        zhMap.set('\uFF5E', '\u2820\u2824');  // ～ → ⠠⠤ (6-36)
        // 星標記號 ※：4-3456 → ⠈⠼
        zhMap.set('\u203B', '\u2808\u283C');  // ※ → ⠈⠼ (4-3456)
        // 精讀記號 ◎：246-135 → ⠪⠕
        zhMap.set('\u25CE', '\u282A\u2815');  // ◎ → ⠪⠕ (246-135)

        isLoaded=true;
        updateStatus();
        render();
    } catch(e) {
        st.className='rules-status error'; st.textContent='載入失敗：'+e.message;
    }
}

// ════════════════════════════════════════════════════════════
//  zh-tw.ctb 差異測試（console 用）
//  用法：await runZhDiff('成長/長大/重複/銀行/子曰/桌子')
//        await runZhDiff()  ← 使用預設語料
// ════════════════════════════════════════════════════════════
window.runZhDiff = async function(text) {
    const CORPUS = '成長長大重複快樂音樂銀行行走子曰桌子行行重行行朝三暮四相見時難別亦難東風無力百花殘春蠶到死絲方盡蠟炬成灰淚始乾';
    const input = text || CORPUS;

    await LOU.loadZhTable();

    // parseCtb 路徑：逐字查規則
    function parseCtbTranslate(t) {
        let out = [];
        for (let i = 0; i < t.length; i++) {
            const ch = t[i];
            if (!_isZhChar(ch)) { out.push({ ch, brl: ch, src: 'skip' }); continue; }
            const corr = _applyZhCorrect(t, i);
            const eff  = corr !== null ? corr : ch;
            const ctx  = _applyZhCtxRule(t, i, eff);
            const brl  = ctx || zhMap.get(eff) || ch;
            out.push({ ch, brl, src: ctx ? 'ctx' : (corr ? 'corr' : 'map') });
        }
        return out;
    }

    // LOU oracle 路徑
    const oracle = LOU.translateZhOracle(input);
    if (!oracle) { console.error('oracle 回傳 null，zh-tw.ctb 可能未載入'); return; }

    // 把 oracle cells 聚合回逐字（每個輸入 char 的點字）
    const oracleByChar = {};
    for (let ci = 0; ci < oracle.cells.length; ci++) {
        const inp = oracle.inputPos[ci];
        if (!(inp in oracleByChar)) oracleByChar[inp] = '';
        oracleByChar[inp] += oracle.cells[ci];
    }

    const parsed = parseCtbTranslate(input);
    let diffCount = 0, catA = [], catB = [], catC = [], catUnk = [];
    const WORD_CHARS = new Set([...'倔几唧子徬据祇茍虮觜迤']);
    const CORRECT_LHS = new Set([...'斗彊尸价种脏袜别发广栖']);

    for (let i = 0; i < input.length; i++) {
        const ch = input[i];
        if (!_isZhChar(ch)) continue;
        const mine = parsed[i].brl;
        const lou  = oracleByChar[i] || '';
        if (mine === lou) continue;
        diffCount++;
        const entry = { i, ch, mine, lou, src: parsed[i].src };
        // 分類
        if (WORD_CHARS.has(ch)) catA.push(entry);
        else if (CORRECT_LHS.has(ch) || (i > 0 && CORRECT_LHS.has(input[i-1])) || (i < input.length-1 && CORRECT_LHS.has(input[i+1]))) catC.push(entry);
        else catB.push(entry);
    }

    console.log(`=== zh-tw diff: ${diffCount} diffs in ${[...input].filter(c=>_isZhChar(c)).length} CJK chars ===`);
    console.log(`(A) word/begword: ${catA.length}  (B) context排序: ${catB.length}  (C) correct pass: ${catC.length}  (?): ${catUnk.length}`);
    if (catA.length) { console.log('--- (A) word/begword ---'); catA.forEach(e => console.log(`  [${e.i}]${e.ch}  mine:${e.mine}  lou:${e.lou}`)); }
    if (catB.length) { console.log('--- (B) context排序 ---'); catB.forEach(e => console.log(`  [${e.i}]${e.ch}  mine:${e.mine}  lou:${e.lou}  src:${e.src}`)); }
    if (catC.length) { console.log('--- (C) correct pass ---'); catC.forEach(e => console.log(`  [${e.i}]${e.ch}  mine:${e.mine}  lou:${e.lou}`)); }
    return { diffCount, catA, catB, catC };
};

// ════════════════════════════════════════════════════════════
//  英文點字轉換
// ════════════════════════════════════════════════════════════

// 中文語境下，與 UEB 衝突的標點應改用 CTB 值
// 來源：zh-tw.ctb 解碼
// U+2026 … → 5-5-5  = ⠐⠐⠐
// U+2014 — → 2578-2578 = ⣒⣒  (8-dot braille)
// U+2013 – → 3678-3678 = ⣤⣤  (8-dot braille)
// 引號類（\u201c/\u201d/\u2018/\u2019）由 tokenizer 直接攔截處理，不在此表
const ZH_CONFLICT_PUNCT = {
    '\u2026': '\u2810\u2810\u2810',  // … ⠐⠐⠐ (5-5-5)
    '\u2014': '\u2810\u2802',         // — ⠐⠂ (5-2)  PDF規範
    '\u2013': '\u2810\u2802',         // – ⠐⠂ (5-2)  與破折號統一
};

// CJK 範圍：基本漢字、CJK相容、全形符號區
const CJK_RE_PUNCT = /[\u2E80-\u9FFF\uF900-\uFAFF\uFE30-\uFE4F\uFF00-\uFFEF]/;

// 判斷一個位置是否處於「中文語境」：
// 前一個非空白字元是 CJK，或後一個非空白字元是 CJK
function isCJKContext(text, pos) {
    for (let j = pos - 1; j >= 0; j--) {
        if (text[j] === ' ' || text[j] === '\u2800') continue;
        if (CJK_RE_PUNCT.test(text[j])) return true;
        break;
    }
    for (let j = pos + 1; j < text.length; j++) {
        if (text[j] === ' ' || text[j] === '\u2800') continue;
        if (CJK_RE_PUNCT.test(text[j])) return true;
        break;
    }
    return false;
}

// pos：字元在原始 text 中的索引（用於語境判斷）；未傳入時退回純 UEB
function getPunct(ch, text, pos) {
    const mode = document.getElementById('en-mode').value;
    if (mode === 'comp8') return COMP8_PUNCT[ch];
    // 若此字元在 ZH_CONFLICT_PUNCT 中，且處於中文語境，改用 CTB 值
    if (ch in ZH_CONFLICT_PUNCT && text != null && isCJKContext(text, pos)) {
        return ZH_CONFLICT_PUNCT[ch];
    }
    return UEB_PUNCT[ch];
}

// UEB 大寫處理：在縮寫 braille 前插入正確的大寫指示符
function wrapCaps(origWord, braille) {
    const isAllCaps = origWord===origWord.toUpperCase() && /[A-Z]/.test(origWord) && origWord.length>1;
    const isInitCap = /^[A-Z]/.test(origWord);
    if (isAllCaps)  return CAP_WORD + braille;
    if (isInitCap)  return CAP1 + braille;
    return braille;
}

// G2 整詞轉換
function translateG2Word(word, _tables) {
    const lw = word.toLowerCase();
    // UEB Lesson 25：單字母若有對應的 alphabetic wordsign，前需加 ⠰ grade1 indicator
    // 但 a / i / o 三個字母沒有 wordsign（不在 UEB wordsign 表中），所以不需要 ⠰
    // 需要 ⠰ 的單字母 wordsigns：b c d e f g h j k l m n p q r s t u v w y
    const WS_LETTERS = new Set(['b','c','d','e','f','g','h','j','k','l','m','n','p','q','r','s','t','u','v','w','y']);
    // a / i / o 明確排除：不加 ⠰，直接輸出字母點字（加大寫指示符如有需要）
    if (lw.length === 1 && !WS_LETTERS.has(lw)) {
        // 單字母但不是 wordsign（含 a/i/o 及其大寫）→ 直接輸出，不加 ⠰
        if (lw === 'a' || lw === 'i' || lw === 'o') {
            const capPfx = /[A-Z]/.test(word[0]) ? CAP1 : '';
            return capPfx + UEB_ALPHA[lw];
        }
        // 其他單字母不在 WS_LETTERS → 走一般序列翻譯
    }
    if (lw.length === 1 && WS_LETTERS.has(lw)) {
        const capPfx = /[A-Z]/.test(word[0]) ? CAP1 : '';
        return G1_SYM + capPfx + UEB_ALPHA[lw];
    }
    const _t = _tables || { always: G2_ALWAYS, anywhere: G2_ANYWHERE, begword: G2_BEGWORD,
        midword: G2_MIDWORD, midend: G2_MIDEND, lowword: G2_LOWWORD, sufword: G2_SUFWORD, word: G2_WORD };
    // 1. lowword：整詞低位點字縮寫（were/was/his/enough）
    if (_t.lowword[lw]) return wrapCaps(word, _t.lowword[lw]);
    // 2. 一般整詞縮寫
    if (_t.word[lw]) return wrapCaps(word, _t.word[lw]);
    // 3. 逐字元，貪婪匹配 groupsigns
    return translateG2Seq(word, _t);
}

// G2 字元序列轉換（修正優先序）
function translateG2Seq(word, _tables) {
    const lw = word.toLowerCase();
    const total = lw.length;
    const isAllCaps = word===word.toUpperCase() && /[A-Z]/.test(word) && total>1;
    let result = isAllCaps ? CAP_WORD : '';
    let i = 0;

    function addCap(p) {
        if (!isAllCaps && word[p] !== word[p].toLowerCase()) result += CAP1;
    }

    // 偵測從位置 p 開始的連續大寫字母數
    function countCaps(p) {
        let n = 0;
        while (p + n < total && /[A-Z]/.test(word[p + n])) n++;
        return n;
    }

    const _t = _tables || { always: G2_ALWAYS, anywhere: G2_ANYWHERE, begword: G2_BEGWORD,
        midword: G2_MIDWORD, midend: G2_MIDEND, lowword: G2_LOWWORD, sufword: G2_SUFWORD, word: G2_WORD };

    const prefixEnd = typeof computePrefixEnd === 'function' ? computePrefixEnd(lw) : -1;
    const _ALLOW_CROSS = new Set(['st','sh','th','wh','gh','ch','ar','er','ed']);

    while (i < total) {
        const isStart = (i === 0);

        // 處理 intra-token 的連續大寫序列（如 GPs → ⠠⠠GP⠠⠄s）
        if (!isAllCaps && /[A-Z]/.test(word[i])) {
            const nCaps = countCaps(i);
            if (nCaps >= 2) {
                // 連續 2+ 大寫 → ⠠⠠ + 序列 (+ ⠠⠄ 若後面有小寫)
                result += CAP_WORD;
                for (let ci = i; ci < i + nCaps; ci++) {
                    // 在 capsword 中，字母直接輸出（無 ⠠ 前綴）
                    const aC2 = Object.keys(_t.always).filter(k => lw.startsWith(k, ci)).sort((a,b)=>b.length-a.length);
                    if (aC2.length && ci + aC2[0].length <= i + nCaps) {
                        result += _t.always[aC2[0]];
                        ci += aC2[0].length - 1;
                    } else {
                        result += UEB_ALPHA[lw[ci]] || lw[ci];
                    }
                }
                // 若後面緊接小寫字母，加 ⠠⠄
                if (i + nCaps < total && /[a-z]/.test(word[i + nCaps])) {
                    result += END_CAPS;
                }
                i += nCaps;
                continue;
            }
        }

        // ①⓪ Shortform 前綴（L15-L17）：字首使用，後面不接元音/y
        // PDF 規則：good/little/first/friend/blind/quick/children 可在字首加後綴使用
        // 注意：must 也有此規則，但 mustang/mustache 已在 G2_ALWAYS 有 st 處理，不列此
        if (i === 0 && !isAllCaps && total > 2) {
            const _SFXVOWELS = new Set(['a','e','i','o','u','y']);
            const SFXMAP = {
                'good': '⠛⠙',    // good: at start, not followed by vowel/y
                'little': '⠇⠇',  // little: at start, not followed by vowel/y
                'first': '⠋⠌',   // first: at start, not followed by vowel/y
                'friend': '⠋⠗',  // friend: at start, not followed by vowel/y
                'blind': '⠃⠇',   // blind: at start, not followed by vowel/y
                'quick': '⠟⠅',   // quick: at start, not followed by vowel/y
                'children': '⠡⠝',// children: at start, not followed by vowel/y
            };
            for (const [sf, br] of Object.entries(SFXMAP).sort((a,b) => b[0].length - a[0].length)) {
                if (lw.startsWith(sf) && total > sf.length) {
                    const nextCh = lw[sf.length];
                    if (!_SFXVOWELS.has(nextCh)) {
                        // Use shortform; translate rest with sequence logic
                        addCap(0);
                        result += br;
                        i = sf.length;
                        break;
                    }
                }
            }
            if (i > 0) continue; // shortform was used, continue main loop
        }

        // ① G2_ALWAYS：任何位置，最高優先，取最長
        // 但部分縮寫有額外的位置條件（PDF Lessons 15–19）
        const _VOWELS_SET = new Set(['a','e','i','o','u']);
        const _prevCh2 = i > 0 ? lw[i - 1] : '';

        const aAll = Object.keys(_t.always)
            .filter(k => lw.startsWith(k, i))
            .sort((a,b) => b.length - a.length);

        let aBest = null;
        for (const k of aAll) {
            const afterPos = i + k.length;
            const afterCh = lw[afterPos] || '';
            const beforeCh = i > 0 ? lw[i - 1] : '';

            if (k === 'there' && blocksThereAlways(lw, i)) { continue; }
            if (k === 'those' && blocksThoseAlways(lw, i)) { continue; }
            // of：科學前綴 + f/w → 阻止 of 縮寫（ctb 311–348）
            if (k === 'of'     && blocksOfAlways(lw, i))         { continue; }
            // 複合詞跨形態邊界 → 不縮
            if ((k==='th'||k==='wh'||k==='sh'||k==='gh'||k==='er'||k==='ow'||k==='ed'||k==='ou') && blocksCrossCompound(k,lw,i)) { continue; }
            if (k==='the' && blocksCrossCompound('th',lw,i)) { continue; }
            // ear → e+ar 僅在字尾（後無字母）且非 re-/pre-/re+vowel 詞；否則讓 ea groupsign 優先
            if (k==='ear' && (i + k.length < total || prefixEnd > 0 || (typeof blocksEaGroupsign !== 'undefined' && blocksEaGroupsign(lw)))) { continue; }
            // 以下各縮寫阻止條件統一呼叫 ueb-g2-rules.js 共用函式
            if (k === 'gh'     && blocksGhAlways(lw, i))         { continue; }
            if (k === 'here'   && blocksHereAlways(lw, i))       { continue; }
            if (k === 'ever'   && blocksEverAlways(lw, i))       { continue; }
            if (k === 'mother' && blocksMotherAlways(lw, i))     { continue; }
            if (k === 'one'    && blocksOneAlways(lw, i))        { continue; }
            if (k === 'under'  && blocksUnderAlways(lw, i))      { continue; }
            if (k === 'had'    && blocksHadAlways(lw, i))        { continue; }
            if (k === 'st'     && blocksStAlways(lw, i))         { continue; }
            // ou vs ound/ount（L21優先）: 若 MIDEND 有更長的 ou* 匹配，跳過 ou
            if (k === 'ou' && !isStart) {
                const longerMidend = Object.keys(_t.midend || {}).find(
                    m => lw.startsWith(m, i) && m.startsWith('ou') && m.length > 2
                );
                if (longerMidend) { continue; }
            }
            // 跨前綴邊界禁用：strong groupsign 不可從前綴內跨入主幹（2字母類除外）
            if (prefixEnd > 0 && i < prefixEnd && i + k.length > prefixEnd && !_ALLOW_CROSS.has(k)) { continue; }
            // ou 跨前綴邊界：若 o 是前綴末字母（如 pro-union）→ 不縮
            if (k === 'ou' && prefixEnd > 0 && i === prefixEnd - 1 && lw[prefixEnd - 1] === 'o') { continue; }

            aBest = k;
            break;
        }

        if (aBest) {
            addCap(i);
            result += _t.always[aBest];
            i += aBest.length;
            continue;
        }

        // ② 位置相關規則：全部候選放在一起，取最長（貪婪）
        let best = null, bestLen = 0, bestBr = '', bestType = '';

        // ANYWHERE（任何位置含字首）
        for (const k of Object.keys(_t.anywhere)) {
            if (lw.startsWith(k, i) && k.length > bestLen) {
                if (k === 'en' && typeof blocksEnAnywhere !== 'undefined' && blocksEnAnywhere(lw, i)) continue;
                bestType = 'anywhere'; bestLen = k.length; bestBr = _t.anywhere[k]; best = k;
            }
        }
        // BEGWORD（字首，後面必須有字元）
        if (isStart && !isAllCaps) {
            for (const k of Object.keys(_t.begword)) {
                if (lw.startsWith(k, i) && i + k.length < total && k.length > bestLen) {
                    if (k === 'be' && !(typeof allowsBeVowelException !== 'undefined' && allowsBeVowelException(lw))) {
                        const suf = lw.slice(i + k.length);
                        const firstAfter = suf[0] || '';
                        if (_VOWELS_SET.has(firstAfter) && firstAfter !== 'i') { continue; }
                        // be+i：只有 be+in 可縮（being, bein'）；beige/beirut 等不縮
                        if (firstAfter === 'i' && suf[1] !== 'n') { continue; }
                        if (!_VOWELS_SET.has(firstAfter)) {
                            const hasVowelNear = (suf.length > 1 && _VOWELS_SET.has(suf[1]));
                            if (!hasVowelNear) { continue; }
                        }
                    }
                    if (k === 'con' && typeof blocksConBegword !== 'undefined' && blocksConBegword(lw)) continue;
                    if (k === 'dis' && typeof blocksDisBegword !== 'undefined' && blocksDisBegword(lw)) continue;
                    bestType = 'beg'; bestLen = k.length; bestBr = _t.begword[k]; best = k;
                }
            }
        }
        // MIDWORD（非字首，後面必須有字元）
        if (!isStart) {
            for (const k of Object.keys(_t.midword)) {
                if (lw.startsWith(k, i) && i + k.length < total && k.length > bestLen) {
                    if (k === 'ea' && typeof blocksEaGroupsign !== 'undefined' && blocksEaGroupsign(lw, i)) continue;
                    if (k === 'ea' && lw[i + 2] === 'r') continue; // ar 優先於 ea（liblouis 行為）
                    bestType = 'mid'; bestLen = k.length; bestBr = _t.midword[k]; best = k;
                }
            }
        }
        // MIDEND（非字首，可在字尾）
        if (!isStart) {
            for (const k of Object.keys(_t.midend)) {
                if (lw.startsWith(k, i) && k.length > bestLen) {
                    bestType = 'midend'; bestLen = k.length; bestBr = _t.midend[k]; best = k;
                }
            }
        }
        // SUFWORD（精確字尾）
        for (const k of Object.keys(_t.sufword)) {
            if (lw.startsWith(k, i) && i + k.length === total && k.length > bestLen) {
                if (k === 'be') continue;  // 'be' 只是 begword，不在字尾縮寫
                bestType = 'suf'; bestLen = k.length; bestBr = _t.sufword[k]; best = k;
            }
        }

        if (best) {
            if (bestType === 'anywhere' || bestType === 'beg') addCap(i);
            result += bestBr;
            i += bestLen;
            continue;
        }

        // ③ 逐字元
        addCap(i);
        result += UEB_ALPHA[lw[i]] || lw[i];
        i++;
    }
    return result;
}

// UEB G1 轉換（只有字母，無縮寫）
function translateG1(word) {
    const lw = word.toLowerCase();
    const isAllCaps = word===word.toUpperCase() && /[A-Z]/.test(word) && word.length>1;
    // UEB Lesson 25：a / i / o 沒有 wordsign，不需要 grade1 indicator
    // 需要 ⠰ 的單字母：b c d e f g h j k l m n p q r s t u v w y
    const WS_LETTERS = new Set(['b','c','d','e','f','g','h','j','k','l','m','n','p','q','r','s','t','u','v','w','y']);
    if (lw.length === 1) {
        const capPfx = /[A-Z]/.test(word[0]) ? CAP1 : '';
        if (WS_LETTERS.has(lw)) {
            // 有 wordsign → 需要 ⠰
            return G1_SYM + capPfx + UEB_ALPHA[lw];
        } else {
            // a / i / o 及其他無 wordsign 字母 → 直接輸出，不加 ⠰
            return capPfx + UEB_ALPHA[lw];
        }
    }
    let result = isAllCaps ? CAP_WORD : '';
    for (let i=0; i<lw.length; i++) {
        const c=lw[i]; const orig=word[i];
        if (!isAllCaps && orig!==orig.toLowerCase()) result += CAP1;
        result += UEB_ALPHA[c] || c;
    }
    return result;
}

// comp8 轉換（字母部分，數字由 tokenizer 另處理）
function translateComp8(word) {
    let r='';
    for (const c of word)
        r += (/[A-Z]/.test(c) ? COMP8_UPPER[c] : UEB_ALPHA[c.toLowerCase()]) || c;
    return r;
}

// 大寫後處理：處理 endcapsword 和 capsphrase
// tokens：render 之後的 token 陣列（有 .braille 和 .isEnglish 標記）
// enough 後處理：後接標點時展開為 en+ou+gh
function postProcessEnough(tokens) {
    const ENOUGH_SINGLE  = '⠢';           // ⠢ lowword
    const ENOUGH_EXPANDED = '⠢⠳⠣'; // ⠢⠳⠣ always enough
    for (let i = 0; i < tokens.length; i++) {
        if (tokens[i].text.toLowerCase() !== 'enough') continue;
        if (tokens[i].braille !== ENOUGH_SINGLE) continue;
        // 找下一個非空格 token
        let next = i + 1;
        while (next < tokens.length && tokens[next].isSpace) next++;
        // 若後接標點（非英文、非空格、非行尾）→ 展開
        if (next < tokens.length && !tokens[next].isEnglish && !tokens[next].isSpace) {
            tokens[i].braille = ENOUGH_EXPANDED;
        }
    }
    return tokens;
}

function postProcessCaps(tokens) {
    // comp8 大寫靠 dot7，不用大寫指示符
    if (document.getElementById('en-mode').value === 'comp8') return tokens;
    const CAP_WORD_STR = CAP_WORD;       // ⠠⠠
    const END_CAPS_STR = END_CAPS;       // ⠠⠄

    // 判斷 token 是否為「整詞大寫」英文
    function isAllCapsToken(t) {
        if (!t.isEnglish) return false;
        const w = t.text;
        // 單字母（如 A）也算 allCaps token（可加入 capsphrase）
        return w === w.toUpperCase() && /[A-Z]/.test(w);
    }
    // 判斷 token 是否為「小寫/混合」英文詞（需要在前面的大寫詞後加 endcapsword）
    function isLowerEngToken(t) {
        if (!t.isEnglish) return false;
        if (!/[a-z]/.test(t.text)) return false;
        // word-sign（單格縮寫）不觸發 endcapsword
        const b = t.braille;
        if (b.length <= 2 && b !== '⠀') return false;
        return true;
    }

    // 找出連續全大寫英文 token 的分組
    // （跳過空格/標點 token）
    let i = 0;
    while (i < tokens.length) {
        if (!isAllCapsToken(tokens[i])) { i++; continue; }

        // 找連續大寫詞（中間允許有空格 token）
        let run = [i];
        let j = i + 1;
        while (j < tokens.length) {
            if (tokens[j].braille === '\u2800' || tokens[j].isSpace) { j++; continue; }
            if (isAllCapsToken(tokens[j])) { run.push(j); j++; }
            else break;
        }

        const runLen = run.length;

        // endcaps 附加位置：找最後一個大寫詞之後的位置
        // 若緊接標點 → endcaps 附在標點 token 末尾（UEB規範）
        // 否則附在最後一個大寫詞 token 末尾
        function attachEndCaps(lastIdx) {
            let p = lastIdx + 1;
            while (p < tokens.length && tokens[p].isSpace) p++;
            if (p < tokens.length && !tokens[p].isEnglish && !tokens[p].isSpace
                && tokens[p].braille !== '\u2800') {
                // 找所有連續標點的末尾（如 !! 兩個標點）
                let lastPunct = p;
                let q = p + 1;
                while (q < tokens.length && !tokens[q].isEnglish
                       && !tokens[q].isSpace && tokens[q].braille !== '\u2800') {
                    lastPunct = q; q++;
                }
                tokens[lastPunct].braille += END_CAPS_STR;
            } else {
                tokens[lastIdx].braille += END_CAPS_STR;
            }
        }

        if (runLen >= 3) {
            // ── capsphrase（⠠⠠⠠）: 3+ 連續全大寫詞 ──
            const first = run[0];
            tokens[first].braille = '\u2820\u2820\u2820' +
                tokens[first].braille
                    .replace(CAP_WORD_STR, '')
                    .replace(/^\u2820/, '');
            for (let k = 1; k < runLen; k++) {
                tokens[run[k]].braille = tokens[run[k]].braille
                    .replace(CAP_WORD_STR, '')
                    .replace(/^\u2820/, '');
            }
            const lastIdx = run[runLen - 1];
            let after = lastIdx + 1;
            while (after < tokens.length && tokens[after].isSpace) after++;
            if (after >= tokens.length || !isAllCapsToken(tokens[after])) {
                attachEndCaps(lastIdx);
            }
            i = j;
        } else {
            // ── capsword（⠠⠠）: 1~2 詞 ──
            // Lesson 27: 若緊接小寫字母開頭的 token（如 GPs → ⠠⠠⠛⠏⠠⠄⠎），需要加 ⠠⠄
            // capsword mode 遇到空格或非字母符號自動終止，不需要 ⠠⠄
            // 但若緊接同一「詞」中的小寫字母（無空格）則需要 ⠠⠄
            const lastIdx = run[runLen - 1];
            let after = lastIdx + 1;
            // 跳過空格，找下一個實質 token
            while (after < tokens.length && tokens[after].isSpace) after++;
            if (after < tokens.length) {
                const nextTok = tokens[after];
                // 若緊接的 token 是英文且以小寫字母開頭，且中間沒有空格
                // （中間沒有空格 = after === lastIdx+1，因為空格已被跳過）
                const noSpaceBetween = (after === lastIdx + 1);
                if (noSpaceBetween && nextTok.isEnglish && /^[a-z]/.test(nextTok.text)) {
                    attachEndCaps(lastIdx);
                }
            }
            i = j;
        }
    }
    return tokens;
}

function translateEnglish(word) {
    const mode = document.getElementById('en-mode').value;
    // 優先使用 liblouis（如果已就緒且表格已載入）
    if (LOU.isReady()) {
        const result = LOU.translateEnglish(word, mode);
        if (result !== null) return result;
        console.warn('liblouis fallback:', word, mode);
    }
    // fallback：內建邏輯
    if (mode==='comp8')  return translateComp8(word);
    if (mode==='ueb-g1') return translateG1(word);
    return translateG2Word(word, getActiveG2Tables());
}

// customRules: Array of { text: string, braille: string (unicode) }
// text is the source string; braille is the replacement (unicode point chars)
let customRules = [];

function getCustomBraille(ch) {
    // longest-match first (rules are sorted by text.length desc on add)
    return null; // per-char lookup handled in tokenize via customRuleMatch
}

// Find longest custom rule match starting at position i in text
function customRuleMatch(text, i) {
    let best = null;
    for (const rule of customRules) {
        if (rule.text.length > (best ? best.text.length : 0) &&
            text.startsWith(rule.text, i)) {
            best = rule;
        }
    }
    if (isZhSupplementEnabled() && builtinZhRulesLoaded) {
        for (const rule of builtinZhRules) {
            if (rule.text.length > (best ? best.text.length : 0) &&
                text.startsWith(rule.text, i)) {
                best = rule;
            }
        }
    }
    return best;
}

//  來源：得/地補充字典 + my_dict.dic（NVDA/心測中心）+ 破音詞庫（鄭明芳老師），
//  用萌典交叉驗證過的詞條，格式跟 customRules 一致（整詞比對 → 整詞點字覆蓋）
// ════════════════════════════════════════════════════════════
let builtinZhRules = [];
let builtinZhRulesLoaded = false;
const ZH_SUPPLEMENT_KEY = 'vi-bt-zh-supplement-enabled';

function isZhSupplementEnabled() {
    return localStorage.getItem(ZH_SUPPLEMENT_KEY) === '1';
}

async function loadBuiltinZhRules() {
    if (builtinZhRulesLoaded) return;
    try {
        const r = await fetch('bt-zh-supplement-rules.json');
        if (!r.ok) throw new Error(r.status);
        builtinZhRules = await r.json();
        builtinZhRulesLoaded = true;
    } catch (e) {
        console.warn('補充規則載入失敗：', e.message);
        builtinZhRules = [];
    }
}

async function toggleZhSupplementRules() {
    const cb = document.getElementById('zh-supplement-toggle');
    localStorage.setItem(ZH_SUPPLEMENT_KEY, cb.checked ? '1' : '0');
    if (cb.checked && !builtinZhRulesLoaded) await loadBuiltinZhRules();
    _customRulesVersion++;
    render();
}

// ════════════════════════════════════════════════════════════
//  整句英文翻譯（解決逐詞呼叫 context 問題的根本解）
// ════════════════════════════════════════════════════════════
// 把 tokenizer 產生的 token 陣列中，連續的英文 token 合併成一個字串，
// 一次送進 liblouis，再用 outputPos 對應表把點字切回各 token。
//
// 適用 token 類型：isEnglish=true 的 token（字母詞）及 isSpace 在英文 span 中間的空格。
// 不適用：自定義規則、數字、中文、標點、換行、Nemeth。
//
// 輸入 tokens（已過 postProcessCaps/Enough）
// 輸出：tokens 的 braille 欄位被整句翻譯結果覆蓋，isContraction 重新計算

function applySpanTranslation(tokens) {
    const mode = document.getElementById('en-mode').value;
    if (mode !== 'ueb-g2' && mode !== 'ueb-custom') return tokens;
    if (!LOU.isReady()) return tokens;

    const result = tokens.slice();
    const n = tokens.length;

    // 策略：對每個英文 token，送「前一詞 空格 目標詞 空格 後一詞」給 liblouis，
    // 減去前綴和後綴的翻譯長度，取出中間段。
    for (let i = 0; i < n; i++) {
        const t = result[i];
        if (!t.isEnglish || t.isCustom || t.isNemeth) continue;

        const word = t.text;

        // 找前一個英文 token
        let prevWord = '';
        for (let p = i - 1; p >= 0; p--) {
            if (result[p].isSpace) continue;
            if (result[p].isEnglish && !result[p].isCustom) prevWord = result[p].text;
            break;
        }

        // 找後一個英文 token
        let nextWord = '';
        for (let p = i + 1; p < n; p++) {
            if (result[p].isSpace) continue;
            if (result[p].isEnglish && !result[p].isCustom) nextWord = result[p].text;
            break;
        }

        // 組合 context 字串並送整句
        const parts = [];
        if (prevWord) parts.push(prevWord);
        parts.push(word);
        if (nextWord) parts.push(nextWord);
        const fullText = parts.join(' ');

        const fullBrl = LOU.translateSpan(fullText, mode);
        if (!fullBrl) continue;

        // 取前綴翻譯長度
        let prefixLen = 0;
        if (prevWord) {
            const prefixBrl = LOU.translateSpan(prevWord + ' ', mode);
            if (prefixBrl) prefixLen = Array.from(prefixBrl).length;
        }

        // 取後綴翻譯長度
        let suffixLen = 0;
        if (nextWord) {
            const suffixBrl = LOU.translateSpan(' ' + nextWord, mode);
            if (suffixBrl) suffixLen = Array.from(suffixBrl).length;
        }

        const fullArr = Array.from(fullBrl);
        const wordBrl = fullArr.slice(prefixLen, suffixLen > 0 ? fullArr.length - suffixLen : undefined).join('');

        if (wordBrl) {
            t.braille = wordBrl;
            const g1b = translateWordWithApos(word, 'ueb-g1');
            t.isContraction = (wordBrl !== g1b);
        }
    }

    return result;
}

const _lineCache = new Map();
let _lineCacheModeKey = null;
let _customRulesVersion = 0;
let _btZhEditsVersion = 0;

// ── 低年級空行空方 ──────────────────────────────────────────────
const ZH_PUNCT_SPACE = new Set([...'。，、？！：；）」』】〕〉》（「『【〔〈《…—·']);
const _lgSpaceSet    = new Set();   // raw offset of punct where space before is toggled ON
let   _lgCurrentRawMap  = null;     // preprocessed-pos → raw-pos mapping
let   _lgPunctPositions = null;     // Set of raw offsets eligible for toggle

function _lgPreprocess(rawText, noSpaceSet, spaceMode) {
    // spaceMode: 是否插入字間/標點空方（空行永遠插入；此參數只控制空方）
    const chars = Array.from(rawText);
    const out = [], rawMap = [];
    const punctPos = new Set();
    for (let ri = 0; ri < chars.length; ri++) {
        const ch = chars[ri];
        if (ch === '\n') {
            let trailing = 0;
            for (let k = out.length - 1; k >= 0 && out[k] === '\n'; k--) trailing++;
            if (trailing < 3) {
                out.push('\n'); rawMap.push(ri);
                if (trailing < 2) { out.push('\n'); rawMap.push(-1); }
            }
            continue;
        }
        if (!spaceMode) {
            out.push(ch); rawMap.push(ri);
            continue;
        }
        if (ZH_PUNCT_SPACE.has(ch)) {
            punctPos.add(ri);
            const prev = out.length > 0 ? out[out.length - 1] : '';
            if (out.length > 0 && prev !== ' ' && prev !== '\n' && noSpaceSet.has(ri)) {
                out.push(' '); rawMap.push(-1);
            }
            out.push(ch); rawMap.push(ri);
            const next = chars[ri + 1];
            if (next && next !== '\n') { out.push(' '); rawMap.push(-1); }
        } else {
            out.push(ch); rawMap.push(ri);
            const next = chars[ri + 1];
            if (!next || next === '\n') continue;
            if (_isZhChar(ch) && _isZhChar(next)) {
                out.push(' '); rawMap.push(-1);
            }
        }
    }
    return { text: out.join(''), rawMap, punctPos };
}

// ── 多音字點字修正 ─────────────────────────────────────────────
const _btZhEdits = new Map(); // ctxKey → 修正後的 Unicode 點字字串（可多格）

function _isZhChar(c) {
    const cp = c.codePointAt(0);
    return (cp >= 0x4E00 && cp <= 0x9FFF) || (cp >= 0x3400 && cp <= 0x4DBF);
}

function _zhCtxKey(text, i) {
    let prev = '';
    for (let j = i - 1; j >= 0 && prev.length < 2; j--) {
        if (_isZhChar(text[j])) prev = text[j] + prev;
    }
    let next = '';
    for (let j = i + 1; j < text.length && next.length < 1; j++) {
        if (_isZhChar(text[j])) { next = text[j]; break; }
    }
    return prev + '|' + text[i] + '|' + next; // '|' 分隔避免前後文碰撞
}

        const el2 = document.getElementById('zh-brl-ed');
        if (el2 && el2.style.display !== 'none' &&
            !el2.contains(e.target) && !e.target.classList.contains('zh-clickable'))
            _zhEdClose();
    }, true);
}

function _zhEdDoInsert(ch) {
    const cells = Array.from(_zhEdBraille);
    cells.splice(_zhEdCursor, 0, ch);
    _zhEdBraille = cells.join('');
    _zhEdCursor++;
}

function _zhEdRefresh() {
    const el = document.getElementById('zh-brl-ed');
    if (!el) return;
    el.querySelectorAll('.zh-ed-dot').forEach(btn => {
        btn.classList.toggle('on', (_zhEdComposer & +btn.dataset.bit) !== 0);
    });
    el.querySelector('.zh-ed-cur').textContent = String.fromCharCode(0x2800 + _zhEdComposer);
    const cells = Array.from(_zhEdBraille);
    let html = '';
    for (let i = 0; i <= cells.length; i++) {
        if (i === _zhEdCursor) html += '<span class="zh-ed-cursor">│</span>';
        if (i < cells.length) html += cells[i]; // braille chars are safe, no HTML escaping needed
    }
    el.querySelector('.zh-ed-seq').innerHTML = html;
}

function _openZhBrailleEditor(brlCell) {
    _zhPyEdClose();
    _zhEdEnsureDOM();
    const el = document.getElementById('zh-brl-ed');
    _zhEdCtxKey  = brlCell.dataset.ctxkey;
    const orig   = brlCell.dataset.orig || '';
    const ch     = brlCell.dataset.char || '';
    const override = _btZhEdits.get(_zhEdCtxKey);
    _zhEdBraille = override !== undefined ? override : orig;
    _zhEdCursor  = Array.from(_zhEdBraille).length; // 游標預設在末尾
    _zhEdComposer = 0; _zhEdChordFired = false;

    el.querySelector('.zh-ed-hdr').textContent =
        `修正「${ch}」點字（前後文：${_zhEdCtxKey.replace(/\|/g, '')}）`;
    _zhEdRefresh();

    const r = brlCell.getBoundingClientRect();
    let top = r.bottom + 6, left = r.left;
    el.style.top  = top  + 'px';
    el.style.left = left + 'px';
    el.style.display = 'block';

    requestAnimationFrame(() => {
        const er = el.getBoundingClientRect();
        if (left + er.width  > window.innerWidth  - 8) left = window.innerWidth  - er.width  - 8;
        if (top  + er.height > window.innerHeight - 8) top  = r.top - er.height - 6;
        el.style.top  = top  + 'px';
        el.style.left = left + 'px';
    });

    _zhEdKd && document.removeEventListener('keydown', _zhEdKd);
    _zhEdKu && document.removeEventListener('keyup',   _zhEdKu);
    const KEY_BIT = { f:1, d:2, s:4, j:8, k:16, l:32 };
    _zhEdKd = e => {
        if (!document.getElementById('zh-brl-ed') ||
            document.getElementById('zh-brl-ed').style.display === 'none') return;
        const k = e.key.toLowerCase();
        if (k in KEY_BIT) {
            e.preventDefault();
            if (_zhEdChordFired) { _zhEdComposer = 0; _zhEdChordFired = false; }
            _zhEdComposer |= KEY_BIT[k];
            _zhEdRefresh();
        } else if (k === 'arrowleft') {
            e.preventDefault();
            if (_zhEdComposer) { _zhEdComposer = 0; }
            _zhEdCursor = Math.max(0, _zhEdCursor - 1);
            _zhEdRefresh();
        } else if (k === 'arrowright') {
            e.preventDefault();
            _zhEdCursor = Math.min(Array.from(_zhEdBraille).length, _zhEdCursor + 1);
            _zhEdRefresh();
        } else if (k === 'backspace') {
            e.preventDefault();
            if (_zhEdComposer) { _zhEdComposer = 0; _zhEdRefresh(); }
            else if (_zhEdCursor > 0) {
                const cells = Array.from(_zhEdBraille);
                cells.splice(_zhEdCursor - 1, 1);
                _zhEdBraille = cells.join('');
                _zhEdCursor--;
                _zhEdRefresh();
            }
        } else if (k === ' ') {
            e.preventDefault();
            if (_zhEdComposer) { _zhEdDoInsert(String.fromCharCode(0x2800 + _zhEdComposer)); _zhEdComposer = 0; }
            else { _zhEdDoInsert('⠀'); }
            _zhEdChordFired = false;
            _zhEdRefresh();
        } else if (k === 'enter') { e.preventDefault(); _zhEdConfirm(); }
        else if (k === 'escape') { e.preventDefault(); _zhEdClose(); }
    };
    _zhEdKu = e => {
        const k = e.key.toLowerCase();
        if ((k in KEY_BIT) && _zhEdComposer && !_zhEdChordFired) {
            _zhEdDoInsert(String.fromCharCode(0x2800 + _zhEdComposer));
            _zhEdComposer = 0;
            _zhEdChordFired = true;
            _zhEdRefresh();
        }
    };
    document.addEventListener('keydown', _zhEdKd);
    document.addEventListener('keyup',   _zhEdKu);
}

function _zhEdConfirm() {
    if (_zhEdCtxKey !== null) {
        if (_zhEdComposer) {
            _zhEdDoInsert(String.fromCharCode(0x2800 + _zhEdComposer));
            _zhEdComposer = 0;
        }
        if (_zhEdBraille) _btZhEdits.set(_zhEdCtxKey, _zhEdBraille);
        else              _btZhEdits.delete(_zhEdCtxKey);
        _btZhEditsVersion++;
    }
    _zhEdClose(); render(); btSaveSession();
}
function _zhEdReset() {
    if (_zhEdCtxKey !== null) { _btZhEdits.delete(_zhEdCtxKey); _btZhEditsVersion++; }
    _zhEdClose(); render(); btSaveSession();
}
function _zhEdClose() {
    const el = document.getElementById('zh-brl-ed');
    if (el) el.style.display = 'none';
    _zhEdKd && document.removeEventListener('keydown', _zhEdKd);
    _zhEdKu && document.removeEventListener('keyup',   _zhEdKu);
    _zhEdKd = null; _zhEdKu = null; _zhEdCtxKey = null;
}

// ── 注音修正浮動編輯器（文字輸入，經 mcbopomofo 往返驗證後換算成點字）──
let _zhPyEdCtxKey = null;

// 標準（大千式）注音鍵盤排列，供沒有系統注音輸入法的使用者用滑鼠/觸控輸入
// 來源：與 vChewing 輸入法手冊、維基教科書「注音字母與鍵位」交叉核對過的鍵位表
const ZPK_ROWS = [
    [['1','ㄅ'],['2','ㄉ'],['3','ˇ'],['4','ˋ'],['5','ㄓ'],['6','ˊ'],['7','˙'],['8','ㄚ'],['9','ㄞ'],['0','ㄢ'],['-','ㄦ']],
    [['q','ㄆ'],['w','ㄊ'],['e','ㄍ'],['r','ㄐ'],['t','ㄔ'],['y','ㄗ'],['u','ㄧ'],['i','ㄛ'],['o','ㄟ'],['p','ㄣ']],
    [['a','ㄇ'],['s','ㄋ'],['d','ㄎ'],['f','ㄑ'],['g','ㄕ'],['h','ㄙ'],['j','ㄨ'],['k','ㄜ'],['l','ㄠ'],[';','ㄤ']],
    [['z','ㄈ'],['x','ㄌ'],['c','ㄏ'],['v','ㄒ'],['b','ㄖ'],['n','ㄘ'],['m','ㄩ'],[',','ㄝ'],['.','ㄡ'],['/','ㄥ']],
];
const ZPK_TONE_SYMS = new Set(['ˊ','ˇ','ˋ','˙']);

function _zpkBuildGridHtml() {
    return ZPK_ROWS.map(row =>
        '<div class="zpk-row">' +
        row.map(([cap, sym]) =>
            `<button type="button" class="zpk-key${ZPK_TONE_SYMS.has(sym) ? ' zpk-tone' : ''}" data-sym="${sym}" title="鍵位：${cap === ',' ? '逗號' : cap === '.' ? '句號' : cap === '/' ? '斜線' : cap === ';' ? '分號' : cap === '-' ? '減號' : cap}">${sym}</button>`
        ).join('') +
        '</div>'
    ).join('');
}

function _zhPyEdEnsureDOM() {
    if (document.getElementById('zh-py-ed')) return;
    const el = document.createElement('div');
    el.id = 'zh-py-ed';
    el.innerHTML =
        `<div class="zh-ed-hdr"></div>
         <div class="zh-py-ed-inputrow">
           <input type="text" id="zh-py-ed-input" class="zh-py-ed-input" autocomplete="off" spellcheck="false">
           <button type="button" id="zh-py-ed-bksp" class="zpk-bksp" title="刪除游標前一個符號">⌫</button>
         </div>
         <div id="zh-py-ed-err" class="zh-py-ed-err" style="display:none"></div>

         <div class="zh-ed-hint">可直接打字（系統注音輸入法）或點下方虛擬鍵盤（標準/大千式排列）<br>空白鍵＝第一聲不標；輕聲請在最後點「˙」；留空＝清除修正<br>Enter 確認；Esc 取消</div>
         <div class="zh-ed-btns">
           <button id="zh-py-ed-ok">確認</button>
           <button id="zh-py-ed-rst">還原原始</button>

    document.body.appendChild(el);

    document.getElementById('zh-py-ed-cl').addEventListener('click', _zhPyEdClose);
    document.getElementById('zh-py-ed-bksp').addEventListener('mousedown', e => { e.preventDefault(); _zpkBackspace(); });
    el.querySelector('.zpk-grid').addEventListener('mousedown', e => {
        const btn = e.target.closest('.zpk-key');
        if (!btn) return;
        e.preventDefault(); // 保持輸入框焦點/游標位置不被按鈕搶走
        _zpkInsert(btn.dataset.sym);
    });
    const inp = document.getElementById('zh-py-ed-input');
    inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); _zhPyEdConfirm(); }
        else if (e.key === 'Escape') { e.preventDefault(); _zhPyEdClose(); }
    });
    document.addEventListener('mousedown', e => {
        const el2 = document.getElementById('zh-py-ed');
        if (el2 && el2.style.display !== 'none' &&
            !el2.contains(e.target) && !e.target.classList.contains('zh-py-clickable'))
            _zhPyEdClose();
    }, true);
}

// 在游標位置插入一個注音符號（不覆蓋既有內容，方便逐字輸入）
function _zpkInsert(sym) {
    const inp = document.getElementById('zh-py-ed-input');
    const start = inp.selectionStart ?? inp.value.length;
    const end   = inp.selectionEnd   ?? inp.value.length;
    inp.value = inp.value.slice(0, start) + sym + inp.value.slice(end);
    const pos = start + sym.length;
    inp.focus();
    inp.setSelectionRange(pos, pos);
    document.getElementById('zh-py-ed-err').style.display = 'none';
}
function _zpkBackspace() {
    const inp = document.getElementById('zh-py-ed-input');
    const start = inp.selectionStart ?? inp.value.length;
    const end   = inp.selectionEnd   ?? inp.value.length;
    if (start === end) {
        if (start === 0) { inp.focus(); return; }
        inp.value = inp.value.slice(0, start - 1) + inp.value.slice(end);
        inp.focus();
        inp.setSelectionRange(start - 1, start - 1);
    } else {
        inp.value = inp.value.slice(0, start) + inp.value.slice(end);
        inp.focus();
        inp.setSelectionRange(start, start);
    }
}
