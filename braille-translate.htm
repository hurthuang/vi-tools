// ── 校對存檔（localStorage + JSON 匯出/匯入）────────────────────

const _BT_SESSION_KEY = 'vi-bt-session';
let _btSaveTimer = null;

function _btCollectSettings() {
    return {
        enMode:   document.getElementById('en-mode').value,
        nemeth:   document.getElementById('nemeth-mode').checked,
        lowGrade: document.getElementById('low-grade-mode').value,
        ucpValues: Array.from(document.querySelectorAll('input[name="ucp"]:checked')).map(el => el.value)
    };
}

function _btApplySettings(s) {
    if (!s) return;
    if (s.enMode)   document.getElementById('en-mode').value = s.enMode;
    if (s.nemeth   !== undefined) document.getElementById('nemeth-mode').checked   = s.nemeth;
    if (s.lowGrade !== undefined) {
        // 相容舊版 boolean 儲存格式（checkbox 年代）
        const lg = typeof s.lowGrade === 'boolean' ? (s.lowGrade ? 'full' : 'off') : s.lowGrade;
        document.getElementById('low-grade-mode').value = lg;
    }
    if (Array.isArray(s.ucpValues)) {
        document.querySelectorAll('input[name="ucp"]').forEach(el => {
            el.checked = s.ucpValues.includes(el.value);
        });
        // 同步群組 checkbox
        document.querySelectorAll('.ucp-group-cb').forEach(gcb => {
            const grp  = gcb.dataset.group;
            const all  = document.querySelectorAll(`input[name="ucp"][data-group="${grp}"]`);
            const chk  = [...all].filter(el => el.checked);
            gcb.checked       = chk.length > 0;
            gcb.indeterminate = chk.length > 0 && chk.length < all.length;
        });
    }
}

function btSaveSession() {
    const data = {
        v: 1,
        type: 'bt',
        savedAt:   new Date().toISOString(),
        inputText: document.getElementById('input-text').value,
        settings:  _btCollectSettings(),
        zhEdits:   [..._btZhEdits.entries()]
    };
    try { localStorage.setItem(_BT_SESSION_KEY, JSON.stringify(data)); } catch(e) {}
}

function _btValidateSession(data) {
    if (!data || typeof data !== 'object') return '不是有效的 JSON 物件。';
    if (data.v !== 1) return '版本不符（需要 v:1），此存檔可能來自不相容的舊版或未來版本。';
    // type 欄位明確標示其他工具
    if (data.type === 'b2t' || data.type === 'nc') {
        const names = { b2t: '點字轉文字', nc: '數學點字' };
        return `此存檔是「${names[data.type]}」的存檔，無法載入至「文字轉點字」。`;
    }
    // 備援：b2t 存檔沒有 settings 欄位，bt 一定有
    if (data.settings === undefined) return '此存檔是「點字轉文字」的存檔，無法載入至「文字轉點字」。';
    if (typeof data.inputText !== 'string') return '存檔缺少 inputText 欄位。';
    if (!Array.isArray(data.zhEdits)) return '存檔缺少 zhEdits 欄位。';
    return null;
}

function btSaveSessionDebounced() {
    clearTimeout(_btSaveTimer);
    _btSaveTimer = setTimeout(btSaveSession, 800);
}

function btLoadSessionData(data) {
    const err = _btValidateSession(data);
    if (err) { alert('無法載入存檔：' + err); return; }
    _btApplySettings(data.settings);
    document.getElementById('input-text').value = data.inputText || '';
    _btZhEdits.clear();
    if (Array.isArray(data.zhEdits)) data.zhEdits.forEach(([k, v]) => _btZhEdits.set(k, v));
    _btZhEditsVersion++;
    render();
}

function btExportSession() {
    btSaveSession();
    const raw = localStorage.getItem(_BT_SESSION_KEY);
    if (!raw) { alert('目前沒有存檔。'); return; }
    const ts = (JSON.parse(raw).savedAt || '').slice(0, 10) || 'unknown';
    const blob = new Blob([raw], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'bt-' + ts + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
}

function btImportSession() {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,.html,.htm';
    inp.onchange = function(e) {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            try {
                let data;
                if (/\.html?$/i.test(file.name)) {
                    data = _extractSessionFromHtml(ev.target.result);
                    if (!data) { alert('無法載入存檔：此 HTML 檔案不含校對存檔資料。'); return; }
                } else {
                    data = JSON.parse(ev.target.result);
                }
                const valErr = _btValidateSession(data);
                if (valErr) { alert('無法載入存檔：' + valErr); return; }
                btLoadSessionData(data);
                localStorage.setItem(_BT_SESSION_KEY, JSON.stringify(data));
                document.getElementById('bt-session-banner')?.remove();
            } catch(err) { alert('無法載入存檔：格式錯誤。'); }
        };
        reader.readAsText(file);
    };
    inp.click();
}

function _extractSessionFromHtml(htmlText) {
    const doc = new DOMParser().parseFromString(htmlText, 'text/html');
    const el = doc.getElementById('vi-session');
    return el ? JSON.parse(el.textContent) : null;
}

function btCheckSavedSession() {
    try {
        const raw = localStorage.getItem(_BT_SESSION_KEY); if (!raw) return;
        const data = JSON.parse(raw);
        if (!data || !data.savedAt) return;
        const editCount = Array.isArray(data.zhEdits) ? data.zhEdits.length : 0;
        if (!data.inputText && editCount === 0) return;
        const date = new Date(data.savedAt).toLocaleString('zh-TW');
        const banner = document.createElement('div');
        banner.id = 'bt-session-banner';
        banner.style.cssText = 'padding:8px 14px;background:#e8f5e9;border:1px solid #a5d6a7;border-radius:6px;margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:0.9em;';
        banner.innerHTML =
            `<span>📂 有上次的校對存檔（${date}${editCount ? '，' + editCount + ' 筆手動修正' : ''}）</span>`
            + `<button onclick="btLoadSessionData(JSON.parse(localStorage.getItem('vi-bt-session')));document.getElementById('bt-session-banner').remove();" style="padding:3px 10px;font-size:0.85em;background:#388e3c;color:white;border:none;border-radius:4px;cursor:pointer;">繼續</button>`
            + `<button onclick="localStorage.removeItem('vi-bt-session');document.getElementById('bt-session-banner').remove();" style="padding:3px 10px;font-size:0.85em;background:#757575;color:white;border:none;border-radius:4px;cursor:pointer;">捨棄</button>`
            + `<span style="font-size:0.82em;color:#888;">存檔僅保存於本裝置，不會上傳</span>`;
        const container = document.querySelector('.parallel-container');
        if (container) container.parentNode.insertBefore(banner, container);
    } catch(e) {}
}

function _getLineModeKey() {
    const mode = document.getElementById('en-mode').value;
    const nemeth = document.getElementById('nemeth-mode').checked ? '1' : '0';
    let groups = '';
    if (mode === 'ueb-g2' || mode === 'ueb-custom') {
        groups = Array.from(document.querySelectorAll('.ucp-group-cb'))
                      .map(cb => cb.checked ? '1' : '0').join('');
    }
    const lowGrade = document.getElementById('low-grade-mode').value;
    return mode + '|' + nemeth + '|' + groups + '|' + _customRulesVersion + '|' + _btZhEditsVersion + '|' + lowGrade;
}

function _getLineTokens(line, modeKey) {
    const cached = _lineCache.get(line);
    if (cached && cached.key === modeKey) return cached.tokens;
    let tokens = tokenizeWithCustom(line);
    tokens = postProcessCaps(tokens);
    tokens = applySpanTranslation(tokens);
    tokens = postProcessEnough(tokens);
    if (_lineCache.size >= 500) _lineCache.delete(_lineCache.keys().next().value);
    _lineCache.set(line, { key: modeKey, tokens });
    return tokens;
}

// ── render ──────────────────────────────────────────────────
function render() {
    if (!isLoaded) return;
    let input     = document.getElementById('input-text').value;
    const max     = parseInt(document.getElementById('cell-limit').value)||40;
    const isAscii = currentIsAscii();
    const outArea = document.getElementById('output-text');

    const lgVal      = document.getElementById('low-grade-mode').value; // off | full | line
    const lgMode      = lgVal !== 'off';       // 空行（含 auto-break 額外空行）
    const lgSpaceMode = lgVal === 'full';      // 另外加字間/標點空方
    if (lgMode) {
        const prep = _lgPreprocess(input, _lgSpaceSet, lgSpaceMode);
        input = prep.text;
        _lgCurrentRawMap  = prep.rawMap;
        _lgPunctPositions = prep.punctPos;
    } else {
        _lgCurrentRawMap  = null;
        _lgPunctPositions = null;
    }

    const modeKey = _getLineModeKey();
    if (modeKey !== _lineCacheModeKey) { _lineCache.clear(); _lineCacheModeKey = modeKey; }

    const inputLines = input.split('\n');
    let tokens = [];
    let charOffset = 0;
    for (let li = 0; li < inputLines.length; li++) {
        if (li > 0) { tokens.push({ braille: '\n', text: '\n' }); charOffset++; }
        for (const t of _getLineTokens(inputLines[li], modeKey)) {
            tokens.push(t.srcStart !== undefined
                ? { ...t, srcStart: t.srcStart + charOffset, srcEnd: t.srcEnd + charOffset }
                : { ...t });
        }
        charOffset += inputLines[li].length;
    }

    outArea.className = isAscii ? 'font-ascii' : 'font-unicode';

    let resultUnicode = '', lineCells = 0;
    const renderTokens = [];

    tokens.forEach((t, idx) => {
        // ── 明確換行（\n 在原文中）──
        if (t.braille === '\n') {
            resultUnicode += '\n'; lineCells = 0;
            renderTokens.push({ ...t, isLineBreak: true, isExplicitBreak: true });
            return;
        }

        const bArr = Array.from(t.braille || '');
        const bLen = bArr.length;
        if (bLen === 0) {
            renderTokens.push({ ...t });
            return;
        }

        // ── 計算「此 token 必須跟著走」的後繼長度 ──
        // 標點不能在行首：找下一個非空格實質 token，若是不可行首標點，
        // 則把中間所有空格 + 標點的長度都加入 extra
        let extra = 0;
        {
            let ni = idx + 1;
            let spaceLen = 0;
            // 跳過空格，計算空格總長
            while (ni < tokens.length && tokens[ni].isSpace) {
                spaceLen += Array.from(tokens[ni].braille).length;
                ni++;
            }
            if (ni < tokens.length && NO_LINE_BEGIN.has(tokens[ni].text)) {
                extra = spaceLen + Array.from(tokens[ni].braille).length;
            }
        }

        // ── 是否需要自動換行 ──
        if (lineCells + bLen + extra > max && lineCells > 0) {
            // Bug 1 修正：若上一個 token 是空格，行尾不留空格 → 回退掉它
            if (resultUnicode.length > 0) {
                const lastChar = resultUnicode[resultUnicode.length - 1];
                if (lastChar === '\u2800') {
                    resultUnicode = resultUnicode.slice(0, -1);
                    // 也從 renderTokens 尾端移除那個空格 token（標記為已移除）
                    for (let ri = renderTokens.length - 1; ri >= 0; ri--) {
                        if (renderTokens[ri].isSpace && !renderTokens[ri].isLineBreak) {
                            renderTokens[ri]._hiddenTrailingSpace = true;
                            break;
                        }
                    }
                }
            }
            resultUnicode += '\n'; lineCells = 0;
            renderTokens.push({ text:'', braille:'\n', isLineBreak:true, isAutoBreak:true });
            if (lgMode) {
                resultUnicode += '\n';
                renderTokens.push({ text:'', braille:'\n', isLineBreak:true, isAutoBreak:true });
            }

            // Bug 1 修正：若目前 token 是空格（行首），跳過它
            if (t.isSpace) return;
        }

        renderTokens.push({ ...t });
        resultUnicode += t.braille;
        lineCells += bLen;
    });

    // 標記低年級可切換標點（僅空行空方模式才有空方可切換）
    if (lgSpaceMode && _lgCurrentRawMap && _lgPunctPositions) {
        for (const rt of renderTokens) {
            if (rt.srcStart !== undefined && rt.braille !== '\n') {
                const rawOff = _lgCurrentRawMap[rt.srcStart];
                if (rawOff !== undefined && rawOff >= 0 && _lgPunctPositions.has(rawOff)) {
                    rt.isLgPunct = true;
                    rt.lgRawOffset = rawOff;
                }
            }
        }
    }

    outArea.value = isAscii ? unicodeToAscii(resultUnicode) : resultUnicode;
    clearTimeout(_parallelViewTimer);
    _parallelViewTimer = setTimeout(() => { if (!brailleInputMode) renderParallelView(renderTokens); }, 600);
}

// ════════════════════════════════════════════════════════════
//  UEB 英數混合轉換（Lesson 24/25）
// ════════════════════════════════════════════════════════════
// 數字相關符號，在 numeric mode 中不終止 numeric mode
const NUM_MODE_KEEP = new Set(['.', ',', '\u2800']); // 小數點、千位符、numeric space

// 把一個英數混合 token（如 ready4work、activ8ing、row22b）翻譯成 UEB 點字
// 規則：
//   - 數字群：前加 ⠼（numsign），進入 numeric mode
//   - numeric mode 被 space / hyphen / dash 終止；不被字母終止（若字母跟在數字後）
//   - 數字後的 a-j 需要 ⠰ grade1 indicator（避免誤讀為數字）
//   - 數字後的 k-z 和大寫字母不需要 grade1 indicator
//   - 數字後的英文字母（k-z 或 A-Z）直接接續，不重新下 numsign
function translateUEBMixed(str) {
    // str: 連續的字母+數字字串（已知不含空格、連字號、斜線等終止符）
    // 依模式逐字元輸出
    const mode = document.getElementById('en-mode').value;
    if (mode === 'comp8') return translateComp8Mixed(str);

    const lw = str.toLowerCase();
    const total = str.length;
    let result = '';
    let inNumericMode = false;
    let i = 0;

    while (i < total) {
        const ch   = str[i];
        const chl  = lw[i];
        const isDigit = /[0-9]/.test(ch);
        const isUpper = /[A-Z]/.test(ch);
        const isLower = /[a-z]/.test(ch);

        if (isDigit) {
            if (!inNumericMode) {
                result += UEB_NUMSIGN;
                inNumericMode = true;
            }
            result += UEB_DIGIT[ch];
            i++;
            continue;
        }

        if (isLower || isUpper) {
            if (inNumericMode) {
                // numeric mode 後的字母
                // a-j (lowercase) 需要 G1 indicator（避免誤讀為數字）
                if (isLower && NUMERIC_AJ.has(chl)) {
                    result += G1_SYM;
                }
                // uppercase A-J 不需要 G1，因為大寫在 numeric context 無歧義
                // uppercase 加 ⠠
                if (isUpper) result += CAP1;
                result += UEB_ALPHA[chl] || ch;
                // 字母不終止 numeric mode（UEB §3.11 — numeric mode 繼續到下一空格）
                // 但字母之後若再遇數字，numeric mode 已被字母打斷，需重新 numsign
                // 實作：進入字母後設 inNumericMode = false
                inNumericMode = false;
            } else {
                // 一般字母（非 numeric mode 後）
                if (isUpper) result += CAP1;
                result += UEB_ALPHA[chl] || ch;
            }
            i++;
            continue;
        }

        // 數字中間的小數點/千位逗號（如 v1.5）：輸出標點點字，不影響 numeric mode
        // （外層 tokenizer 只在前後皆數字時才會把 . / , 併入 run，故此處不需要重新確認位置）
        if (ch === '.' || ch === ',') {
            result += UEB_PUNCT[ch] || ch;
            i++;
            continue;
        }

        // 其他字元（不應到達這裡，由外層 tokenizer 分隔）
        result += ch;
        i++;
    }
    return result;
}

// comp8 英數混合：數字也是 ⠼ + a-j（comp8 不用 dot8），字母不加大寫 indicator（大寫靠 dot7）
function translateComp8Mixed(str) {
    let result = '';
    let inNum = false;
    for (const ch of str) {
        if (/[0-9]/.test(ch)) {
            if (!inNum) { result += UEB_NUMSIGN; inNum = true; }
            result += COMP8_DIGIT[ch];
        } else if (/[A-Z]/.test(ch)) {
            inNum = false;
            result += COMP8_UPPER[ch] || ch;
        } else if (ch === '.' || ch === ',') {
            // 數字中間的小數點/千位逗號：輸出標點點字，維持 inNum 不變（不重下數字號）
            result += COMP8_PUNCT[ch] || ch;
        } else if (/[a-z]/.test(ch)) {
            inNum = false;
            result += UEB_ALPHA[ch] || ch;
        } else {
            result += ch;
        }
    }
    return result;
}

// UEB 10.1.2/10.2.2：alphabetic/strong wordsign 後接撇號時，只有這幾種後綴才能繼續用縮寫
// （can't/you're/it's/that'll/you've/this'd…）；其他後綴（more'n、you'm、this'n 等古語/方言）
// 規則書明訂排除，要退回逐字母拼寫，不能用 wordsign。
const ALLOWED_APOS_SUFFIXES = new Set(['d', 'll', 're', 's', 't', 've']);

// 翻譯可能含撇號縮寫的詞（如 I'm、they've、don't）
// run 中的撇號為原始字元（' / ' / '）
function translateWordWithApos(run, modeVal) {
    const APOS_RE = /['\u2018\u2019]/;
    const aposIdx = run.search(APOS_RE);

    if (aposIdx === -1) {
        // 無撇號，正常翻譯
        const hasDigit = /[0-9]/.test(run);
        const hasAlpha = /[a-zA-Z]/.test(run);
        if (!hasDigit) {
            if (modeVal === 'comp8')  return translateComp8(run);
            if (modeVal === 'ueb-g1') return translateG1(run);
            return translateG2Word(run, getActiveG2Tables());
        } else if (!hasAlpha) {
            let b = UEB_NUMSIGN;
            const digitMap = modeVal === 'comp8' ? COMP8_DIGIT : UEB_DIGIT;
            const punctMap = modeVal === 'comp8' ? COMP8_PUNCT : UEB_PUNCT;
            for (const d of run) {
                // 數字內的小數點/千位逗號：輸出對應標點點字，不重下數字號（numeric mode 持續）
                b += (d === '.' || d === ',') ? (punctMap[d] || d) : (digitMap[d] || d);
            }
            return b;
        } else {
            return translateUEBMixed(run);
        }
    }

    // 含撇號：分成「主詞」和「後綴」分別翻譯，中間插入撇號點字 ⠄
    const main   = run.slice(0, aposIdx);
    const suffix = run.slice(aposIdx + 1); // 撇號後的字母（如 m、re、ll 等）

    let mainB = '';
    if (main.length > 0) {
        if (modeVal === 'comp8')  mainB = translateComp8(main);
        else if (modeVal === 'ueb-g1') mainB = translateG1(main);
        else {
            // 特殊處理：main 可能是 shortform + 尾字母（如 couldn = could + n）
            // 嘗試以 G2_WORD 鍵值作為前綴匹配，找到最長的 shortform 前綴
            const _tables = getActiveG2Tables();
            const mainLow = main.toLowerCase();
            let sfPrefix = null, sfBraille = null;
            for (const [k, v] of Object.entries(_tables.word || G2_WORD)) {
                // 只有多格縮寫（could/should/would/had 等）才能作前綴
                // 單格 wordsigns（do/have/go/be 等）不縮前綴，避免 don't→⠙⠝ 誤譯
                if (mainLow.startsWith(k) && k.length < main.length && v.length > 1) {
                    if (!sfPrefix || k.length > sfPrefix.length) {
                        sfPrefix = k; sfBraille = v;
                    }
                }
            }
            if (sfPrefix) {
                // 前綴是 shortform，其餘字母逐字輸出（不加縮寫，與 suffix 同邏輯）
                const rest = main.slice(sfPrefix.length);
                let restB = '';
                for (const c of rest.toLowerCase()) restB += UEB_ALPHA[c] || c;
                mainB = sfBraille + restB;
            } else if ((WS_ALPHA_SET.has(mainLow) || WS_STRONG_SET.has(mainLow)) &&
                       !ALLOWED_APOS_SUFFIXES.has(suffix.toLowerCase())) {
                // main 整詞就是 wordsign，但後綴不在 d/ll/re/s/t/ve 之列（more'n、you'm、this'n…）
                // → 不用 wordsign，main 退回逐字母拼寫
                let mb = '';
                for (const c of main.toLowerCase()) mb += UEB_ALPHA[c] || c;
                mainB = mb;
            } else {
                mainB = translateG2Word(main, _tables);
            }
        }
    }

    // 撇號 = ⠄ (UEB dots 3)
    const apostropheB = '\u2804';

    let suffixB = '';
    if (suffix.length > 0) {
        // UEB Lesson 25 Apostrophe 規則：
        // 撇號後的字母（'d、's、't、'm、'n 等單字母，以及 're、'll、've 多字母後綴）
        // 直接輸出字母點字，不加 grade 1 indicator、不加縮寫
        // （撇號本身已起到分隔作用，不會被誤讀）
        if (modeVal === 'comp8') {
            suffixB = translateComp8(suffix);
        } else {
            // 逐字元輸出字母，不使用任何 wordsign 或 grade1 indicator
            for (const c of suffix.toLowerCase()) {
                suffixB += UEB_ALPHA[c] || c;
            }
        }
    }

    return mainB + apostropheB + suffixB;
}

// UEB 自定：取得目前使用的 G2 表格（mode=ueb-custom 時使用過濾版）
function getActiveG2Tables() {
    const modeVal = document.getElementById('en-mode').value;
    if (modeVal === 'ueb-custom') return buildFilteredTables(ucpEnabled());
    // ueb-g2：回傳完整表格
    return {
        always: G2_ALWAYS, anywhere: G2_ANYWHERE, begword: G2_BEGWORD,
        midword: G2_MIDWORD, midend: G2_MIDEND, lowword: G2_LOWWORD,
        sufword: G2_SUFWORD, word: G2_WORD
    };
}

// tokenize with custom rules taking priority
// ════════════════════════════════════════════════════════════
//  Pre-pass：分類 U+0027 為引號或 apostrophe
//  規則：
//    空格/行首 + ' + 字母，且後方「同一句內」有對應的 ' + 空格/標點/行尾 → 配對引號
//    常見省略詞（'n、'til、'cause…）一律當 apostrophe，不進入配對搜尋
//    否則 → apostrophe
//  回傳 Set，內含「是引號」的位置索引
// ════════════════════════════════════════════════════════════
// 固定省略詞：撇號後接這些詞時一律是省略號，不當開引號候選
// （例：rock 'n' roll、'til、'cause、'tis、'twas… 避免跟後方所有格撇號誤配對）
const APOS_ELISION_WORDS = new Set([
    'n', 'til', 'cause', 'em', 'tis', 'twas', 'twill', 'round', 'bout', 'fraid', 'nuff'
]);
// UEB 2.6.1/2.6.2：「standing alone」左邊界＝空格/連字號/破折號，或前面再接開括號類
// （原本只認空格跟 '(' ，比官方定義窄，漏掉連字號/破折號/方括號/大括號）
const _APOS_LEFT_BOUNDARY = /[\s\-‐-―([{]/;
// UEB 2.6.1/2.6.3：「standing alone」右邊界＝空格/連字號/破折號/常見標點，或再接右括號類
const _APOS_RIGHT_BOUNDARY = /[\s.,!?;:)\]}"'\-‐-―]/;
function classifyApostrophes(text) {
    const quotePositions = new Set();
    const n = text.length;
    let i = 0;
    while (i < n) {
        if (text[i] !== "'") { i++; continue; }
        const prevCh = i > 0 ? text[i - 1] : '';
        const nextCh = i + 1 < n ? text[i + 1] : '';
        // 開引號條件：前面是空格/行首/連字號/破折號/開括號，後面是字母
        const isOpenCandidate = _APOS_LEFT_BOUNDARY.test(prevCh) || prevCh === ''
            ? /[A-Za-z]/.test(nextCh)
            : false;
        if (isOpenCandidate) {
            // 固定省略詞：不進入配對搜尋，直接當 apostrophe
            const wordMatch = /^[A-Za-z]+/.exec(text.slice(i + 1));
            const word = wordMatch ? wordMatch[0].toLowerCase() : '';
            if (APOS_ELISION_WORDS.has(word)) { i++; continue; }

            // 前瞻：找對應的閉引號（' 後接空格/標點/行尾），限同一句內
            for (let j = i + 1; j < n; j++) {
                if (text[j] !== "'") {
                    // 句界（. ! ? 後接空白/行尾）→ 放棄配對，不跨句搜尋
                    const nextAfter = j + 1 < n ? text[j + 1] : '';
                    if ((text[j] === '.' || text[j] === '!' || text[j] === '?') &&
                        (nextAfter === '' || /\s/.test(nextAfter))) {
                        break;
                    }
                    continue;
                }
                const afterJ = j + 1 < n ? text[j + 1] : '';
                const beforeJ = j > 0 ? text[j - 1] : '';
                // 閉引號條件：前面是字母/數字/標點/右括號類，後面是空格/連字號/破折號/標點/行尾/引號
                if (/[A-Za-z0-9.,!?;:)\]}]/.test(beforeJ) &&
                    (_APOS_RIGHT_BOUNDARY.test(afterJ) || afterJ === '')) {
                    // 確認中間沒有換行（同一段落內）
                    const between = text.slice(i + 1, j);
                    if (!between.includes('\n')) {
                        quotePositions.add(i); // 開引號
                        quotePositions.add(j); // 閉引號
                    }
                    break;
                }
            }
            // 找不到配對 → apostrophe，不加入 quotePositions
        }
        i++;
    }
    return quotePositions;
}

function tokenizeWithCustom(text) {
    const tokens = []; let i = 0;
    const apoQuotes = classifyApostrophes(text); // pre-pass：標記哪些 ' 是引號
    const mode = () => document.getElementById('en-mode').value;

    // 每個 push 都自動帶上來源字元範圍
    // srcStart = 迴圈頂記錄的 i；srcEnd 在下一個迴圈頂（或 i++ 後）由 finalizeSrc() 補上
    let _srcStart = 0;
    let _lastTok  = null;
    function pushTok(tok) {
        // 先補上一個 token 的 srcEnd（現在才知道 i 走到哪）
        if (_lastTok) _lastTok.srcEnd = i;
        tok.srcStart = _srcStart;
        tok.srcEnd   = i; // 暫時值，下一個 pushTok 或 finalizeSrc 會修正
        _lastTok = tok;
        tokens.push(tok);
    }
    function finalizeSrc() {
        if (_lastTok) _lastTok.srcEnd = i;
    }

    // 引號奇偶計數：奇數次 = 開，偶數次 = 閉
    let dqCount = 0;  // 直雙引號 " (U+0022)
    let sqCount = 0;  // 直單引號 ' (U+0027)
    // 直引號的中文語境判斷：用整行（換行前）是否含 CJK 決定
    // 比鄰字判斷更穩定，因引號常包住英文詞但整句是中文
    const CJK_RE_LINE = /[\u2E80-\u9FFF\uF900-\uFAFF\uFE30-\uFE4F\uFF00-\uFFEF]/;
    function lineHasCJK(text, pos) {
        const start = text.lastIndexOf('\n', pos - 1) + 1;
        const end   = text.indexOf('\n', pos);
        const line  = text.slice(start, end === -1 ? undefined : end);
        return CJK_RE_LINE.test(line);
    }

    while (i < text.length) {
        if (_lastTok) _lastTok.srcEnd = i;  // 補上上一個 token 的真實 srcEnd
        _srcStart = i;
        const ch = text[i];

        // 空白
        if (ch === ' ' || ch === '\u2800') {
            pushTok({ text:'空', braille:'\u2800', isSpace:true }); i++; continue;
        }
        // 換行（重設引號計數，避免跨行污染）
        if (ch === '\n') {
            pushTok({ text:'↵', braille:'\n' }); i++;
            dqCount = 0; sqCount = 0;
            continue;
        }

        // ── 連續三個英文句號 → 省略號（中文語境用 CTB，英文語境用 UEB）──
        if (ch === '.' && text[i+1] === '.' && text[i+2] === '.') {
            const b = isCJKContext(text, i)
                ? '\u2810\u2810\u2810'   // CTB: ⠐⠐⠐ (dot5×3)
                : '\u2832\u2832\u2832';  // UEB: ⠲⠲⠲ (dots256×3)
            pushTok({ text: '...', braille: b });
            i += 3;
            continue;
        }

        // ── 直雙引號 " → 奇數次=開⠦, 偶數次=閉⠴；中文行用雙格 ──
        if (ch === '"') {
            dqCount++;
            const isOpen = (dqCount % 2 === 1);
            const b = lineHasCJK(text, i)
                ? (isOpen ? '\u2826\u2826' : '\u2834\u2834')  // CTB ⠦⠦/⠴⠴
                : (isOpen ? '\u2826'        : '\u2834');         // UEB ⠦/⠴
            pushTok({ text: ch, braille: b }); i++; continue;
        }

        // ── 彎曲雙引號 "/"“” → 字元本身已區分開/閉；中文行用雙格 ──
        if (ch === '\u201c' || ch === '\u201d') {
            const isOpen = (ch === '\u201c');
            const b = lineHasCJK(text, i)
                ? (isOpen ? '\u2826\u2826' : '\u2834\u2834')  // CTB ⠦⠦/⠴⠴
                : (isOpen ? '\u2826'        : '\u2834');         // UEB ⠦/⠴
            pushTok({ text: ch, braille: b }); i++; continue;
        }

        // ── 直單引號 ' → 縮寫撇號優先；否則奇=開⠠⠦ 偶=閉⠠⠴；中文行用 CTB ──
        if (ch === "'") {
            const prevCh = i > 0 ? text[i-1] : '';
            const nextCh = i + 1 < text.length ? text[i+1] : '';
            // 用 pre-pass 結果判斷：是引號位置就輸出引號，否則輸出 apostrophe
            if (apoQuotes.has(i)) {
                // pre-pass 判定為配對引號
                const isOpen = apoQuotes._openSet ? apoQuotes._openSet.has(i) : true;
                // 用索引奇偶判斷開閉（第一個出現的是開）
                const positions = [...apoQuotes].sort((a,b)=>a-b);
                const posIdx = positions.indexOf(i);
                const isOpenQuote = (posIdx % 2 === 0);
                const b = lineHasCJK(text, i)
                    ? (isOpenQuote ? '\u2808' : '\u2804')
                    : (isOpenQuote ? '\u2820\u2826' : '\u2820\u2834');
                pushTok({ text: ch, braille: b }); i++; continue;
            }
            // 不在 apoQuotes → apostrophe（縮寫、所有格、詞首省略）
            // 字母間：縮寫（don't）→ 讓後面 run 吸收；其他直接輸出 ⠄
            if (/[a-zA-Z]/.test(prevCh) && /[a-zA-Z]/.test(nextCh)) {
                // fall through 到 run 邏輯（run 會吸收撇號+後綴）
            } else {
                pushTok({ text: ch, braille: '\u2804' }); i++; continue; // ⠄
            }
        }

        // ── 彎曲單引號 '/’ → 字元本身已區分開/閉；中文行用 CTB ──
        // 例外：U+2019 在字母旁且前方沒有未閉合的 U+2018 時，視為 apostrophe，
        // fall through 讓英文 run 吸收（couldn’t、students’ 等）
        if (ch === '\u2018' || ch === '\u2019') {
            const prevCh = i > 0 ? text[i - 1] : '';
            const nextCh = i + 1 < text.length ? text[i + 1] : '';
            // 計算目前位置之前未閉合的 U+2018 數量
            // apostrophe 條件：
            // 1. U+2019 在字母後（所有格、縮寫），且後面不是引號類
            // 2. U+2019 前面是空格/行首，後面是字母（詞首省略，如 'twas）
            const nextIsQuote = /[\u2018\u2019\u201c\u201d\u0022]/.test(nextCh);
            const isWordInitialApos = ch === '\u2019'
                && /[A-Za-z]/.test(nextCh)
                && (/^\s$/.test(prevCh) || prevCh === '');
            const isAposContext = ch === '\u2019'
                && /[A-Za-z]/.test(prevCh)
                && !nextIsQuote;
            if (isWordInitialApos) {
                // 詞首省略（'twas、'tis）→ apostrophe ⠄，不是引號
                const b = lineHasCJK(text, i) ? '\u2804' : '\u2804'; // ⠄
                pushTok({ text: ch, braille: b }); i++; continue;
            }
            if (!isAposContext) {
                const isOpen = (ch === '\u2018');
                const b = lineHasCJK(text, i)
                    ? (isOpen ? '\u2808' : '\u2804')               // CTB ⠈/⠄
                    : (isOpen ? '\u2820\u2826' : '\u2820\u2834'); // UEB ⠠⠦/⠠⠴
                pushTok({ text: ch, braille: b }); i++; continue;
            }
            // isAposContext: fall through 到英文 run 判斷
        }

        // 自定義規則（最長優先）
        const cr = customRuleMatch(text, i);
        if (cr) {
            pushTok({ text: cr.text, braille: cr.braille, isCustom: true });
            i += cr.text.length;
            continue;
        }

        // ── 英數混合串（含撇號縮寫 'd/'ll/'re/'s/'t/'ve/'m/'n 等）──
        // 收集連續字母和數字（不含空格），並在其後貪婪地吸收 'suffix
        if (/[a-zA-Z0-9]/.test(ch)) {
            let run = '';
            while (i < text.length) {
                if (/[a-zA-Z0-9]/.test(text[i])) {
                    run += text[i]; i++;
                    continue;
                }
                // 數字中間的小數點/千位逗號（如 0.5、3,141.59）：
                // 前一字元是數字、後一字元也是數字時，併入同一個 run，
                // 避免小數點打斷 numeric mode 而在小數點後多下一個數字號
                if ((text[i] === '.' || text[i] === ',') &&
                    /[0-9]$/.test(run) && /[0-9]/.test(text[i + 1] || '')) {
                    run += text[i]; i++;
                    continue;
                }
                break;
            }
            // 嘗試吸收後接的撇號縮寫（如 's、'd、'll、're、've、't、'm、'n）
            // 撇號可以是 ' (U+0027)、' (U+2019)、' (U+2018)
            const APOS = new Set(["'", '\u2019', '\u2018']);
            // 縮寫後綴（不含前置撇號）
            const CONTRACTION_SFXS = ["ve","ll","re","d","s","t","m","n"];
            if (i < text.length && APOS.has(text[i])) {
                // 看後面接的字母串是不是縮寫後綴
                let sfxLen = 0;
                for (const sfx of CONTRACTION_SFXS.sort((a,b)=>b.length-a.length)) {
                    if (text.slice(i+1, i+1+sfx.length).toLowerCase() === sfx
                        && (i+1+sfx.length >= text.length || !/[a-zA-Z0-9]/.test(text[i+1+sfx.length]))) {
                        sfxLen = sfx.length;
                        break;
                    }
                }
                if (sfxLen > 0) {
                    // 吸收撇號 + 後綴到 run 中，以特殊分隔符記錄撇號位置
                    const apostrophe = text[i];
                    const suffix = text.slice(i+1, i+1+sfxLen);
                    run = run + apostrophe + suffix;
                    i += 1 + sfxLen;
                } else {
                    // 無縮寫後綴：可能是所有格尾（students'）
                    // 排除條件：後面緊接引號類字元，或 pre-pass（classifyApostrophes）已判定
                    // 這個位置是配對好的閉引號（例：'Yesterday'. 閉引號後接句號而非引號字元，
                    // 只看下一字元抓不到，要靠 apoQuotes 才知道這其實是閉引號不是所有格尾）
                    const nextAfterApos = i + 1 < text.length ? text[i + 1] : '';
                    const nextIsQuote = /[\u2018\u2019\u201c\u201d\u0022]/.test(nextAfterApos);
                    if (!/[A-Za-z0-9]/.test(nextAfterApos) && !nextIsQuote && !apoQuotes.has(i)) {
                        run = run + text[i]; // 吸收 '/'/' 本身（所有格尾）
                        i += 1;
                    }
                }
            }

        // 翻譯 run（可能含撇號）
        // ── Nemeth 模式：純數字 run → 用 Nemeth 下位數字 ──
        // 但題號格式（數字後接 . 再接空格/換行）例外：維持 UEB 上位格式
        let b;
        const hasAlnum = /[a-zA-Z0-9]/.test(run);
        const hasDigit = /[0-9]/.test(run);
        const hasAlpha = /[a-zA-Z]/.test(run);

        // 偵測題號：run 全是數字，且後方緊接 '.' 再接空格/換行/行末，且在行首（可有前導縮排）
        // 限制在行首是為了跟句尾數字（如「x = 5.」「答案是 12.」）區分——數字前面還有其他內容就不是題號
        const _qNumRunStart = i - run.length;
        let _qNumIsLineStart = true;
        for (let _j = _qNumRunStart - 1; _j >= 0; _j--) {
            if (text[_j] === ' ' || text[_j] === '⠀') continue;
            _qNumIsLineStart = (text[_j] === '\n');
            break;
        }
        const isQNum = isNemethMode() && hasDigit && !hasAlpha &&
            /^\d+$/.test(run) &&
            text[i] === '.' &&
            (i + 1 >= text.length || text[i + 1] === ' ' || text[i + 1] === '\u2800' || text[i + 1] === '\n') &&
            _qNumIsLineStart;

        if (isNemethMode() && hasDigit && !hasAlpha && !isQNum) {
            // 純數字 → Nemeth
            // 關鍵：檢查前一個非空格 token 是否為 Nemeth 運算符號
            // 若是，則跳過數字號（§3.4.1：緊接運算符後不加⠼）
            let prevNonSpaceTok = null;
            for (let ti = tokens.length - 1; ti >= 0; ti--) {
                if (!tokens[ti].isSpace && !tokens[ti].isLineBreak) {
                    prevNonSpaceTok = tokens[ti]; break;
                }
            }
            const skipNumsign = prevNonSpaceTok && prevNonSpaceTok.isNemethOp === true;
            b = translateNemethInline(run, skipNumsign);
        } else if (isNemethMode() && hasDigit && hasAlpha) {
            // Nemeth 英數混合（如 3x、2y、3a）
            // Nemeth 下位數字與字母字形不重疊，數字後的字母不需字母指示符 ⠰
            let prevNonSpaceTok = null;
            for (let ti = tokens.length - 1; ti >= 0; ti--) {
                if (!tokens[ti].isSpace && !tokens[ti].isLineBreak) {
                    prevNonSpaceTok = tokens[ti]; break;
                }
            }
            const skipNumsign = prevNonSpaceTok && prevNonSpaceTok.isNemethOp === true;
            b = '';
            let inN = false;
            for (let ci = 0; ci < run.length; ci++) {
                const c = run[ci];
                if (/[0-9]/.test(c)) {
                    if (!inN) {
                        if (!(ci === 0 && skipNumsign)) b += NEMETH_NUMSIGN;
                        inN = true;
                    }
                    b += NEMETH_DIGIT[c];
                } else if (/[a-zA-Z]/.test(c)) {
                    inN = false;
                    if (/[A-Z]/.test(c)) b += CAP1;
                    b += UEB_ALPHA[c.toLowerCase()] || c;
                } else if (c === '.' || c === ',') {
                    // 數字中間的小數點/千位逗號：不影響 inN（numeric mode 持續，不重下數字號）
                    b += (c === '.') ? NEMETH_DECIMAL : '';
                } else {
                    inN = false;
                    b += c;
                }
            }
        } else {
            b = translateWordWithApos(run, mode());
        }

        // 偵測是否使用了縮寫（G2/自定模式下，與 G1 輸出不同即為縮寫）
        let isContraction = false;
        if (hasAlpha && (mode() === 'ueb-g2' || mode() === 'ueb-custom')) {
            const g1b = translateWordWithApos(run, 'ueb-g1');
            isContraction = (b !== g1b);
        }
            pushTok({
                text: run,
                braille: b,
                isEnglish: hasAlpha,
                isNumber: !hasAlpha && hasDigit,
                isContraction: isContraction
            });
            continue;
        }

        // ── 標點 ────────────────────────────────────────────────
        // Nemeth 模式：數學符號優先用 Nemeth 碼
        if (isNemethMode() && NEMETH_MATH_PUNCT[ch]) {
            // 標記是運算符號還是關係符號，供後面數字 token 判斷是否需要數字號
            const isOp  = new Set(['+','-','−','×','÷','/','*','·','±','∓']).has(ch);
            const isRel = new Set(['=','<','>','≤','≥','≠','≈','≡','∼','~']).has(ch);
            // 關係符號前後強制空格（不管原文有無空格）
            if (isRel) {
                // 前空格：若前一個 token 不是空格，插入一個
                if (tokens.length > 0 && !tokens[tokens.length - 1].isSpace && !tokens[tokens.length - 1].isLineBreak) {
                    pushTok({ text:'空', braille:'\u2800', isSpace:true, isAutoSpace:true });
                }
            }
            pushTok({
                text: ch,
                braille: NEMETH_MATH_PUNCT[ch],
                isNemeth: true,
                isNemethOp:  isOp,
                isNemethRel: isRel,
            });
            i++;
            // 關係符號後：跳過原文中的空格，並插入一個強制空格
            if (isRel) {
                while (i < text.length && (text[i] === ' ' || text[i] === '\u2800')) i++;
                pushTok({ text:'空', braille:'\u2800', isSpace:true, isAutoSpace:true });
            }
            continue;
        }
        // Nemeth 模式：特殊數學符號（多字元 Unicode）— 已含在上面的 NEMETH_MATH_PUNCT
        if (isNemethMode()) {
            const nmb = NEMETH_MATH_PUNCT[ch];
            if (nmb) { pushTok({ text: ch, braille: nmb, isNemeth: true }); i++; continue; }
        }

        // ── Nemeth 模式：題號句點（數字後的 . 跟著空格/換行/行末）→ 用上位 UEB ⠲ ──
        // 判斷方式：往前掃描跳過空格，找到前一個非空格 token，若為數字 token
        // 且後面接空格或換行（題號格式 "1. " "10. "），則用 UEB 上位句號
        if (isNemethMode() && ch === '.') {
            // 往前找最近一個非空格 token
            let prevNonSpace = null;
            for (let ti = tokens.length - 1; ti >= 0; ti--) {
                if (!tokens[ti].isSpace) { prevNonSpace = tokens[ti]; break; }
            }
            const nextCh = i + 1 < text.length ? text[i + 1] : '';
            const isAfterNumber = prevNonSpace && prevNonSpace.isNumber;
            const isFollowedByBreak = (nextCh === ' ' || nextCh === '\u2800' || nextCh === '\n' || i + 1 >= text.length);
            if (isAfterNumber && isFollowedByBreak) {
                // 題號句點：上位 UEB ⠲，不加終止空格（題號後空格由原文的空格處理）
                pushTok({ text: ch, braille: '\u2832' }); // ⠲ dots 256
                i++;
                continue;
            }
        }

        const p = getPunct(ch, text, i);
        if (p) {
            pushTok({ text: ch, braille: p }); i++;
            if (TERMINAL.has(ch)) {
                pushTok({ text:'空', braille:'\u2800', isSpace:true });
                if (i < text.length && (text[i] === ' ' || text[i] === '\u2800')) i++;
            }
            continue;
        }

        // 中文 / 其他字元
        const _corrected = _isZhChar(ch) ? _applyZhCorrect(text, i) : null;
        const _eff = _corrected !== null ? _corrected : ch;
        const b = (_isZhChar(_eff) ? _applyZhCtxRule(text, i, _eff) : null) || zhMap.get(_eff) || ch;
        if (_isZhChar(ch)) {
            const ctxKey = _zhCtxKey(text, i);
            const override = _btZhEdits.get(ctxKey);
            pushTok({ text: ch, braille: override !== undefined ? override : b,
                      isZhChar: true, ctxKey, _origBraille: b }); i++;
        } else {
            pushTok({ text: ch, braille: b }); i++;
        }
        if (TERMINAL.has(ch)) {
            pushTok({ text:'空', braille:'\u2800', isSpace:true });
            if (i < text.length && (text[i] === ' ' || text[i] === '\u2800')) i++;
        }
    }
    finalizeSrc(); // 補上最後一個 token 的 srcEnd

    // ── 中英文邊界自動插入空格 ──────────────────────────────────
    // 規則：CJK 字元和英數之間，若沒有空格則自動插入一個空格 token
    const CJK_RE = /[\u2E80-\u9FFF\uF900-\uFAFF\uFE30-\uFE4F]/;
    const spaced = [];
    for (let ti = 0; ti < tokens.length; ti++) {
        const cur  = tokens[ti];
        const prev = spaced.length ? spaced[spaced.length - 1] : null;

        // 只在 prev 和 cur 都不是空白/換行時才考慮插入
        if (prev && !prev.isSpace && !prev.isLineBreak &&
                    !cur.isSpace  && !cur.isLineBreak) {
            const prevLastCh = prev.text ? prev.text[prev.text.length - 1] : '';
            const curFirstCh = cur.text  ? cur.text[0]                     : '';
            const prevIsCJK  = CJK_RE.test(prevLastCh);
            const curIsCJK   = CJK_RE.test(curFirstCh);
            const prevIsAlnum = !prevIsCJK && (prev.isEnglish || prev.isNumber);
            const curIsAlnum  = !curIsCJK  && (cur.isEnglish  || cur.isNumber);
            if ((prevIsCJK && curIsAlnum) || (prevIsAlnum && curIsCJK)) {
                spaced.push({ text:'空', braille:'\u2800', isSpace:true, isAutoSpace:true });
            }
        }
        spaced.push(cur);
    }
    return spaced;
}

function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function currentIsAscii() {
    return document.querySelector('input[name="output-format"]:checked').value === 'ascii';
}
function unicodeToAscii(str) {
    return Array.from(str).map(c => BR_TO_ASCII[c] !== undefined ? BR_TO_ASCII[c] : c).join('');
}

// ── parallel view ────────────────────────────────────────────
function renderParallelView(tokens) {
    window._lastTokens = tokens;  // save for checkbox re-render
    const isAscii = currentIsAscii();
    const highlightCon = document.getElementById('highlight-contractions') &&
                         document.getElementById('highlight-contractions').checked;
    const legendEl = document.getElementById('contraction-legend');
    if (legendEl) legendEl.style.display = highlightCon ? '' : 'none';
    // 動態顯示 Nemeth / 手動修正 legend（有對應 token 時顯示）
    const hasNemeth   = tokens.some(t => t.isNemeth || (isNemethMode() && t.isNumber));
    const hasZhEdited = tokens.some(t => t.isZhChar && t.ctxKey && _btZhEdits.has(t.ctxKey));
    const nemethLeg = document.getElementById('nemeth-legend');
    const zhEdLeg   = document.getElementById('zh-edited-legend');
    if (nemethLeg)  nemethLeg.style.display  = hasNemeth   ? '' : 'none';
    if (zhEdLeg)    zhEdLeg.style.display    = hasZhEdited ? '' : 'none';
    const view = document.getElementById('parallel-view');
    view.innerHTML = '';

    tokens.forEach(t => {
        if (t.isAutoBreak) {
            const br = document.createElement('div');
            br.className = 'line-break'; view.appendChild(br);
            return;
        }
        if (t._hiddenTrailingSpace) return;
        if (t.isLineBreak) {
            const br = document.createElement('div');
            br.className = 'line-break'; view.appendChild(br);
            return;
        }
        const dispB = isAscii ? unicodeToAscii(t.braille) : t.braille;
        const g = document.createElement('div');
        let cls = 'token-group';
        if (t.isSpace)   cls += ' token-space';
        if (t.isCustom)  cls += ' custom-rule';
        if (highlightCon && t.isContraction) cls += ' is-contraction';
        if (t.isNemeth || (isNemethMode() && t.isNumber)) cls += ' is-nemeth';
        if (t.isZhChar && t.ctxKey && _btZhEdits.has(t.ctxKey)) cls += ' zh-edited';
        g.className = cls;
        const brlCls = 'token-braille ' + (isAscii ? 'font-ascii' : 'font-unicode')
                     + (t.isZhChar ? ' zh-clickable' : '');
        const brlAttrs = t.isZhChar
            ? ` data-ctxkey="${escHtml(t.ctxKey)}" data-orig="${escHtml(t._origBraille||t.braille)}" data-char="${escHtml(t.text)}" title="點擊修正「${escHtml(t.text)}」點字"`
            : '';
        let zyHtml = '';
        if (t.isZhChar) {
            const zy = _zhBrailleToBpmf(t.braille);
            const zyAttrs = ` data-ctxkey="${escHtml(t.ctxKey)}" data-char="${escHtml(t.text)}" data-bpmf="${escHtml(zy)}" title="點擊修正「${escHtml(t.text)}」注音"`;
            zyHtml = `<div class="token-zhuyin zh-py-clickable"${zyAttrs}>${escHtml(zy || '－')}</div>`;
        }
        g.innerHTML = `<div class="token-text">${escHtml(t.text)}</div>`
                    + `<div class="${brlCls}"${brlAttrs}>${escHtml(dispB)}</div>`
                    + zyHtml;

        if (t.isZhChar) {
            g.querySelector('.zh-clickable').addEventListener('click', function(e) {
                e.stopPropagation();
                _openZhBrailleEditor(this);
            });
            g.querySelector('.zh-py-clickable').addEventListener('click', function(e) {
                e.stopPropagation();
                _openZhBpmfEditor(this);
            });
        }

        if (t.isLgPunct) {
            const spaceOn = _lgSpaceSet.has(t.lgRawOffset);
            g.classList.add('lg-punct');
            if (!spaceOn) g.classList.add('lg-nospace');
            g.title = spaceOn ? '點擊取消此標點前的空格' : '點擊加入此標點前的空格';
            g.style.cursor = 'pointer';
            const badge = document.createElement('div');
            badge.className = 'lg-punct-badge';
            badge.textContent = spaceOn ? '⎵' : '⊘';
            g.appendChild(badge);
            g.addEventListener('click', function() {
                if (_lgSpaceSet.has(t.lgRawOffset)) _lgSpaceSet.delete(t.lgRawOffset);
                else _lgSpaceSet.add(t.lgRawOffset);
                render();
            });
        } else if (t.srcStart !== undefined) {
            // 直接用 token 的來源字元範圍跳轉
            const s = t.srcStart;
            const e = (t.srcEnd > t.srcStart) ? t.srcEnd : t.srcStart + 1;
            g.title  = '點擊跳至輸入區對應位置';
            g.style.cursor = 'pointer';
            g.addEventListener('click', function() {
                parallelJumpToOffset(s, e);
            });
        }

        view.appendChild(g);
    });
}

// 點擊雙視 block → 選取對應文字
function parallelJumpToOffset(selStart, selEnd) {
    const ta = document.getElementById('input-text');
    if (!ta) return;

    ta.focus({ preventScroll: true });
    ta.setSelectionRange(selStart, selEnd);

    const orig = ta.style.outline;
    ta.style.outline = '3px solid #ff9800';
    setTimeout(function() { ta.style.outline = orig; }, 600);
}

// ════════════════════════════════════════════════════════════
//  自定義點字 textarea 六點輸入
// ════════════════════════════════════════════════════════════
const ruleBrailleTA = document.getElementById('rule-braille-input');
let ruleComposerBits = 0;
let ruleChordFired   = false;

ruleBrailleTA.addEventListener('keydown', function(e) {
    const code = e.keyCode;
    if ([8, 46, 37, 38, 39, 40, 9, 13].includes(code)) {
        ruleComposerBits = 0; ruleChordFired = false;
        return;
    }
    if (code === 32) {
        e.preventDefault();
        insertRuleCell('\u2800');
        ruleComposerBits = 0; ruleChordFired = false;
        return;
    }
    const dotBit = { 83:4, 68:2, 70:1, 74:8, 75:16, 76:32 }[code];
    if (dotBit !== undefined) { e.preventDefault(); ruleComposerBits |= dotBit; return; }
    e.preventDefault();
});

ruleBrailleTA.addEventListener('keyup', function(e) {
    const dotBit = { 83:4, 68:2, 70:1, 74:8, 75:16, 76:32 }[e.keyCode];
    if (dotBit === undefined) return;
    if (!ruleChordFired && ruleComposerBits > 0) {
        insertRuleCell(String.fromCharCode(0x2800 + ruleComposerBits));
        ruleChordFired = true;
    }
    ruleComposerBits &= ~dotBit;
    if (ruleComposerBits === 0) ruleChordFired = false;
});

function insertRuleCell(unicodeCell) {
    const isAscii = document.getElementById('rule-braille-ascii-mode').checked;
    const ch = isAscii ? (BR_TO_ASCII[unicodeCell] || unicodeCell) : unicodeCell;
    const pos = ruleBrailleTA.selectionStart;
    const val = ruleBrailleTA.value;
    ruleBrailleTA.value = val.slice(0, pos) + ch + val.slice(ruleBrailleTA.selectionEnd);
    ruleBrailleTA.setSelectionRange(pos + 1, pos + 1);
}

function clearRuleBraille() {
    ruleBrailleTA.value = '';
    ruleBrailleTA.focus();
}

function toggleRuleAsciiMode() {
    const isAscii = document.getElementById('rule-braille-ascii-mode').checked;
    const current = ruleBrailleTA.value;
    if (isAscii) {
        ruleBrailleTA.value = unicodeToAscii(current);
        ruleBrailleTA.classList.add('ascii-font');
    } else {
        if (!toggleRuleAsciiMode._rev) {
            toggleRuleAsciiMode._rev = {};
            for (const [u,a] of Object.entries(BR_TO_ASCII)) toggleRuleAsciiMode._rev[a] = u;
        }
        ruleBrailleTA.value = Array.from(current).map(c => toggleRuleAsciiMode._rev[c] || c).join('');
        ruleBrailleTA.classList.remove('ascii-font');
    }
}

function getRuleBrailleUnicode() {
    const isAscii = document.getElementById('rule-braille-ascii-mode').checked;
    if (!getRuleBrailleUnicode._rev) {
        getRuleBrailleUnicode._rev = {};
        for (const [u,a] of Object.entries(BR_TO_ASCII)) getRuleBrailleUnicode._rev[a] = u;
    }
    const val = ruleBrailleTA.value;
    if (!isAscii) return val;
    return Array.from(val).map(c => getRuleBrailleUnicode._rev[c] || c).join('');
}

function addCustomRule() {
    const textInput = document.getElementById('rule-text-input');
    const ruleText  = textInput.value.trim();
    if (!ruleText) { alert('請填入印刷字'); return; }
    const ruleBraille = getRuleBrailleUnicode();
    if (!ruleBraille) { alert('請在點字欄位輸入至少一個點字格'); return; }
    // Prevent duplicates
    if (customRules.some(r => r.text === ruleText)) {
        if (!confirm(`「${ruleText}」已存在規則，要覆蓋嗎？`)) return;
        customRules = customRules.filter(r => r.text !== ruleText);
    }
    customRules.push({ text: ruleText, braille: ruleBraille });
    // Sort by length descending for longest-match
    customRules.sort((a,b) => b.text.length - a.text.length);
    // Reset form
    textInput.value = '';
    ruleBrailleTA.value = '';
    ruleBrailleTA.focus();
    renderRulesTable();
    _customRulesVersion++;
    render();
}

}

function handleImportFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        try {
            const data = JSON.parse(ev.target.result);
            if (!Array.isArray(data)) throw new Error('格式錯誤');
            let added = 0, skipped = 0;
            data.forEach(rule => {
                if (!rule.text || !rule.braille) { skipped++; return; }
                if (customRules.some(r => r.text === rule.text)) { skipped++; return; }
                customRules.push({ text: rule.text, braille: rule.braille });
                added++;
            });
            customRules.sort((a,b) => b.text.length - a.text.length);
            renderRulesTable();
            _customRulesVersion++;
            render();
            alert(`匯入完成：新增 ${added} 條，略過 ${skipped} 條（重複）`);
        } catch(err) {
            alert('匯入失敗：' + err.message);
        }
    };
    reader.readAsText(file);
    e.target.value = '';
}

    // 存檔匯出要能帶到別的裝置開，字型用 base64 內嵌，不依賴外部 SIMBRL.TTF 相對路徑

function syncBrailleDirectOutput() {

        ? Array.from(val).map(c => BR_TO_ASCII[c] !== undefined ? BR_TO_ASCII[c] : c).join('')

// 只更新雙視區，不動輸出區（供進入點字模式時使用）
function syncBrailleParallelView() {
    const val = inputTA.value;
    const tokens = [];
    for (const c of val) {
        if (c === '\n') {
            tokens.push({ text:'↵', braille:'\n', isLineBreak:true });
        } else if (c === '\u2800' || c === ' ') {
            tokens.push({ text:'空', braille:'\u2800', isSpace:true });
        } else if (c >= '\u2801' && c <= '\u28FF') {
            const cp = c.charCodeAt(0) - 0x2800;
            const dots = [1,2,3,4,5,6].filter(d => cp & (1 << (d-1))).join('');
            tokens.push({ text: dots ? `點${dots}` : '⠀', braille: c });
        } else {
            tokens.push({ text: c, braille: c });
        }
    }
    clearTimeout(_parallelViewTimer);
    renderParallelView(tokens);
}

let _suppressInput = false;

// 共用六點輸入處理：在任意 textarea 插入一個點字格
function insertBrailleCellInto(ta, unicodeCell) {
    const isAscii = currentIsAscii();
    const ch = isAscii ? (BR_TO_ASCII[unicodeCell] || unicodeCell) : unicodeCell;
    const pos = ta.selectionStart;
    const val = ta.value;
    _suppressInput = true;
    ta.value = val.slice(0, pos) + ch + val.slice(ta.selectionEnd);
    ta.setSelectionRange(pos + 1, pos + 1);
    _suppressInput = false;
    // 只有主輸入框才同步雙視區；格式調整區不需要
    if (ta === inputTA) syncBrailleDirectOutput();
}

// 共用 keydown 處理邏輯
function handleBrailleKeydown(e, ta) {
    if (e.ctrlKey && (e.key === 'b' || e.key === 'B')) {
        e.preventDefault();
        setBrailleInputMode(!brailleInputMode);
        return;
    }
    if (!brailleInputMode) return;

    const code = e.keyCode;

    if (code === 27) { e.preventDefault(); setBrailleInputMode(false); return; }
    if (e.ctrlKey || e.metaKey) { ruleComposerBits = 0; ruleChordFired = false; return; }
    if ([8, 46, 35, 36, 33, 34, 37, 38, 39, 40, 9, 13].includes(code)) {
        ruleComposerBits = 0; ruleChordFired = false; return;
    }
    if (code === 32) {
        e.preventDefault();
        insertBrailleCellInto(ta, '\u2800');
        ruleComposerBits = 0; ruleChordFired = false;
        return;
    }
    const dotBit = { 83:4, 68:2, 70:1, 74:8, 75:16, 76:32 }[code];
    if (dotBit !== undefined) { e.preventDefault(); ruleComposerBits |= dotBit; return; }
    e.preventDefault();
}

// 共用 keyup 處理邏輯
function handleBrailleKeyup(e, ta) {
    if (!brailleInputMode) return;
    const dotBit = { 83:4, 68:2, 70:1, 74:8, 75:16, 76:32 }[e.keyCode];
    if (dotBit === undefined) return;
    if (!ruleChordFired && ruleComposerBits > 0) {
        insertBrailleCellInto(ta, String.fromCharCode(0x2800 + ruleComposerBits));
        ruleChordFired = true;
    }
    ruleComposerBits &= ~dotBit;
    if (ruleComposerBits === 0) ruleChordFired = false;
}

function btHandleOpenFile(event) {
    const file = event.target.files[0]; if (!file) return;

        reader.onload = function(ev) {
            try {

                if (!data) { alert('無法載入：此 HTML 檔案不含校對存檔資料。'); return; }

        handleOpenFile(event, 'input-text', render);

}

    // 用當前時間作為預設檔名
    var now  = new Date();
    var ts   = now.getFullYear() +
               String(now.getMonth()+1).padStart(2,'0') +
               String(now.getDate()).padStart(2,'0') + '_' +
               String(now.getHours()).padStart(2,'0') +
               String(now.getMinutes()).padStart(2,'0');

    a.download = 'input_' + ts + '.txt';

    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

        zhSupplementCb.checked = isZhSupplementEnabled();
        if (zhSupplementCb.checked) loadBuiltinZhRules();
    }
});

// ── 框架主題控制 ──
window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'setTheme') {
        document.documentElement.setAttribute('data-theme', e.data.theme);
    }
});

loadRules();

</script>
