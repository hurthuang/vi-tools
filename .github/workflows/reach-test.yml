# 暫時：測 GitHub Actions 連不連得到 class.kh.edu.tw（合併前刪掉）
name: 連線測試（暫時）
on:
  push:
    branches: [site-search]
jobs:
  reach:
    runs-on: ubuntu-latest
    steps:
      - run: |
          node --version
          curl -sS -o /dev/null -w "列表頁 %{http_code} %{time_total}s\n" -A "vi-tools-search-indexer" https://class.kh.edu.tw/19061/bulletin/msg_list/11
          curl -sS -o /dev/null -w "文章頁 %{http_code} %{time_total}s\n" -A "vi-tools-search-indexer" https://class.kh.edu.tw/19061/bulletin/msg_view/1095
          node -e "fetch('https://class.kh.edu.tw/19061/page/view/10').then(r=>r.text()).then(t=>console.log('node fetch 分類頁', t.length, (t.match(/msg_view/g)||[]).length))"
