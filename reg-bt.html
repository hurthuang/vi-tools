<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BT Engine Regression</title>
<style>
  :root{--ac:#1565c0;--ok:#2e7d32;--fail:#c62828;--warn:#e65100;--bg:#f5f5f5;--sf:#fff;--bd:#e0e0e0;--tx:#212121;--tx2:#666;}
  body{margin:0;font-family:sans-serif;background:var(--bg);font-size:.875rem;display:flex;flex-direction:column;height:100vh;}
  .header{padding:10px 20px;background:var(--ac);color:#fff;display:flex;align-items:center;gap:16px;flex-shrink:0;}
  .header h1{margin:0;font-size:1rem;}
  .note{font-size:.78rem;opacity:.75;}
  .summary{padding:10px 20px;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;gap:20px;align-items:center;flex-shrink:0;}
  .stat{font-weight:600;}
  .stat.ok{color:var(--ok);}
  .stat.fail{color:var(--fail);}
  .run-btn{padding:5px 16px;border-radius:6px;border:1px solid var(--ac);background:var(--ac);color:#fff;cursor:pointer;font-size:.85rem;}
  table{width:100%;border-collapse:collapse;font-size:.82rem;}
  th{background:#e8eaf6;padding:6px 10px;text-align:left;position:sticky;top:0;z-index:1;font-weight:500;}
  td{padding:5px 10px;border-bottom:1px solid var(--bd);}
  tr.fail td{background:#ffebee;}
  .brl{font-family:serif;font-size:1.1em;}
  .tag-ok{color:var(--ok);font-weight:600;}
  .tag-fail{color:var(--fail);font-weight:600;}
  #result-wrap{flex:1;overflow:auto;}
  /* 即時比對 */
  .cmp-panel{padding:8px 20px;background:#e8eaf6;border-bottom:1px solid #c5cae9;flex-shrink:0;}
  .cmp-row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .cmp-label{font-weight:600;color:var(--ac);white-space:nowrap;font-size:.82rem;}
  #cmp-input{padding:4px 8px;border:1px solid #9fa8da;border-radius:4px;font-size:.875rem;width:160px;}
  .cmp-btn{padding:4px 12px;border-radius:4px;border:1px solid var(--ac);background:var(--ac);color:#fff;cursor:pointer;font-size:.82rem;}
  .ll-status{font-size:.75rem;color:var(--tx2);}
  .ll-status.ready{color:var(--ok);}
  .ll-status.error{color:var(--fail);}
  .cmp-out{margin-top:6px;display:flex;flex-direction:column;gap:3px;}
  .cmp-line{display:flex;align-items:baseline;gap:8px;}
  .cmp-src{font-size:.75rem;color:var(--tx2);width:68px;flex-shrink:0;}
  .cmp-brl{font-family:serif;font-size:1.05em;}
  .cmp-tag{font-weight:600;font-size:.8rem;}
  .cmp-tag.ok{color:var(--ok);}
  .cmp-tag.fail{color:var(--fail);}
  .cmp-snippet{display:block;margin-top:4px;font-family:monospace;font-size:.78rem;background:#fff;border:1px solid #9fa8da;border-radius:3px;padding:2px 8px;user-select:all;color:#333;}
  .cmp-hint{font-size:.72rem;color:var(--tx2);margin-top:1px;}
</style>
</head>
<body>
<div class="header">
  <h1>BT Engine Regression</h1>
  <span class="note">braille-translate.htm translateG2Word vs liblouis — 全規則啟用</span>
  <button class="run-btn" onclick="run()">▶ 執行</button>
</div>

<div class="cmp-panel">
  <div class="cmp-row1">
    <span class="cmp-label">即時比對</span>

<div class="summary" id="summary">尚未執行</div>
<div id="result-wrap">
  <table id="tbl" style="display:none">
    <thead><tr><th>輸入</th><th>BT 輸出</th><th>LL Ground Truth</th><th>結果</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>

<script src="ueb-g2-rules.js"></script>
<script src="build-no-tables-utf32.js"></script>
<script>
// ── liblouis 包裝層（從 braille-translate.htm 複製，僅保留 ueb-g2）──
const LOU = (() => {
    const M = (typeof liblouisBuild !== 'undefined') ? liblouisBuild : null;
    const _tableCache = new Set();
    const TABLE_DIR = 'table/';
    const TABLE_DEPS = {
        'en-ueb-g2.ctb':      ['en-ueb-g1.ctb'],
        'en-ueb-g1.ctb':      ['en-ueb-chardefs.uti','en-ueb-math.ctb','braille-patterns.cti'],
        'en-ueb-chardefs.uti':['text_nabcc.dis','spaces.uti','latinLetterDef6Dots.uti','latinUppercaseComp6.uti'],
    };

    function isReady() { return !!(M && M.calledRun); }

    async function _loadTableFile(filename) {
        if (_tableCache.has(filename)) return;
        _tableCache.add(filename);
        try {
            const resp = await fetch(TABLE_DIR + filename);
            if (!resp.ok) throw new Error(resp.status);
            const arrayBuf = await resp.arrayBuffer();
            try { M.FS.mkdir('/tables'); } catch(e) {}
            const bytes = new Uint8Array(arrayBuf);
            let fileStr = '';
            for (let b = 0; b < bytes.length; b++) fileStr += String.fromCharCode(bytes[b]);
            if (filename.endsWith('.ctb') || filename.endsWith('.uti')) {
                fileStr = fileStr.split('\n').map(line => {
                    const t = line.trim();
                    if (t.startsWith('seqdelimiter') || t.startsWith('seqbeforechars') ||
                        t.startsWith('seqafterchars') || t.startsWith('seqafterexpression') ||
                        t.startsWith('seqafterpattern')) return '# ' + line;
                    return line;
                }).join('\n');
            }
            M.FS.writeFile('/tables/' + filename, fileStr);
        } catch(e) {
            console.warn('liblouis: 無法載入表格', filename, e.message);
        }
        const deps = TABLE_DEPS[filename] || [];
        await Promise.all(deps.map(d => _loadTableFile(d)));
    }

    const NABCC_TO_UNI = {
        32:0x2800,97:0x2801,49:0x2802,98:0x2803,39:0x2804,
        107:0x2805,50:0x2806,108:0x2807,96:0x2808,99:0x2809,
        105:0x280a,102:0x280b,47:0x280c,109:0x280d,115:0x280e,
        112:0x280f,34:0x2810,101:0x2811,51:0x2812,104:0x2813,
        57:0x2814,111:0x2815,54:0x2816,114:0x2817,126:0x2818,
        100:0x2819,106:0x281a,103:0x281b,62:0x281c,110:0x281d,
        116:0x281e,113:0x281f,44:0x2820,42:0x2821,53:0x2822,
        60:0x2823,45:0x2824,117:0x2825,56:0x2826,118:0x2827,
        46:0x2828,37:0x2829,123:0x282a,36:0x282b,43:0x282c,
        120:0x282d,33:0x282e,38:0x282f,59:0x2830,58:0x2831,
        52:0x2832,124:0x2833,48:0x2834,122:0x2835,55:0x2836,
        40:0x2837,95:0x2838,63:0x2839,119:0x283a,125:0x283b,
        35:0x283c,121:0x283d,41:0x283e,61:0x283f
    };

    function _louTranslate(tableFile, text) {
        if (!isReady()) return null;
        try {
            const inputLen = text.length;
            const inBuf = M._malloc((inputLen + 1) * 4);
            for (let i = 0; i < inputLen; i++)
                M.setValue(inBuf + i * 4, text.codePointAt(i), 'i32');
            M.setValue(inBuf + inputLen * 4, 0, 'i32');
            const outMax = inputLen * 4;
            const outBuf    = M._malloc((outMax + 1) * 4);
            const inLenPtr  = M._malloc(4);
            const outLenPtr = M._malloc(4);
            M.setValue(inLenPtr,  inputLen, 'i32');
            M.setValue(outLenPtr, outMax,   'i32');
            const tableStr = M.allocate(M.intArrayFromString('/tables/' + tableFile), 'i8', M.ALLOC_NORMAL);
            const ret = M._lou_translateString(tableStr, inBuf, inLenPtr, outBuf, outLenPtr, 0, 0, 0);
            M._free(tableStr);
            let result = null;
            if (ret > 0) {
                const outLen = M.getValue(outLenPtr, 'i32');
                let out = '';
                for (let i = 0; i < outLen; i++) {
                    const val = M.getValue(outBuf + i * 4, 'i32');
                    const uni = NABCC_TO_UNI[val];
                    out += String.fromCharCode(uni !== undefined ? uni : 0x2800 + val);
                }
                result = out;
            }
            M._free(inBuf); M._free(outBuf);
            M._free(inLenPtr); M._free(outLenPtr);
            return result;
        } catch(e) {
            console.error('liblouis translate error:', e);
            return null;
        }
    }

    function translateG2(text) {
        return _louTranslate('en-ueb-g2.ctb', text);
    }

    async function preload() {
        if (!isReady()) return false;
        await _loadTableFile('en-ueb-g2.ctb');
        return true;
    }

    return { translateG2, isReady, preload };
})();

// ── 從 braille-translate.htm 複製的最小依賴 ──────────────────────
const UEB_ALPHA = {
    'a':'⠁','b':'⠃','c':'⠉','d':'⠙','e':'⠑',
    'f':'⠋','g':'⠛','h':'⠓','i':'⠊','j':'⠚',
    'k':'⠅','l':'⠇','m':'⠍','n':'⠝','o':'⠕',
    'p':'⠏','q':'⠟','r':'⠗','s':'⠎','t':'⠞',
    'u':'⠥','v':'⠧','w':'⠺','x':'⠭','y':'⠽',
    'z':'⠵'
};
const CAP1      = '⠠';
const CAP_WORD  = '⠠⠠';
const END_CAPS  = '⠠⠄';
const G1_SYM    = '⠰';

const BT_TABLES = {
    always: G2_ALWAYS, anywhere: G2_ANYWHERE, begword: G2_BEGWORD,
    midword: G2_MIDWORD, midend: G2_MIDEND, lowword: G2_LOWWORD,
    sufword: G2_SUFWORD, word: G2_WORD
};

function wrapCaps(origWord, braille) {
    const isAllCaps = origWord===origWord.toUpperCase() && /[A-Z]/.test(origWord) && origWord.length>1;
    const isInitCap = /^[A-Z]/.test(origWord);
    if (isAllCaps)  return CAP_WORD + braille;
    if (isInitCap)  return CAP1 + braille;
    return braille;
}

function translateG2Word(word, _tables) {
    const lw = word.toLowerCase();
    const WS_LETTERS = new Set(['b','c','d','e','f','g','h','j','k','l','m','n','p','q','r','s','t','u','v','w','y']);
    if (lw.length === 1 && !WS_LETTERS.has(lw)) {
        if (lw === 'a' || lw === 'i' || lw === 'o') {
            const capPfx = /[A-Z]/.test(word[0]) ? CAP1 : '';
            return capPfx + UEB_ALPHA[lw];
        }
    }
    if (lw.length === 1 && WS_LETTERS.has(lw)) {
        const capPfx = /[A-Z]/.test(word[0]) ? CAP1 : '';
        return G1_SYM + capPfx + UEB_ALPHA[lw];
    }
    const _t = _tables || BT_TABLES;
    if (_t.lowword[lw]) return wrapCaps(word, _t.lowword[lw]);
    if (_t.word[lw])    return wrapCaps(word, _t.word[lw]);
    return translateG2Seq(word, _t);
}

function translateG2Seq(word, _tables) {
    const lw = word.toLowerCase();
    const total = lw.length;
    const isAllCaps = word===word.toUpperCase() && /[A-Z]/.test(word) && total>1;
    let result = isAllCaps ? CAP_WORD : '';
    let i = 0;
    function addCap(p) { if (!isAllCaps && word[p] !== word[p].toLowerCase()) result += CAP1; }
    function countCaps(p) { let n=0; while(p+n<total&&/[A-Z]/.test(word[p+n]))n++; return n; }
    const _t = _tables || BT_TABLES;
    const prefixEnd = typeof computePrefixEnd === 'function' ? computePrefixEnd(lw) : -1;
    const _ALLOW_CROSS = new Set(['st','sh','th','wh','gh','ch','ar','er','ed']);
    while (i < total) {
        const isStart = (i === 0);
        if (!isAllCaps && /[A-Z]/.test(word[i])) {
            const nCaps = countCaps(i);
            if (nCaps >= 2) {
                result += CAP_WORD;
                for (let ci = i; ci < i + nCaps; ci++) {
                    const aC2 = Object.keys(_t.always).filter(k=>lw.startsWith(k,ci)).sort((a,b)=>b.length-a.length);
                    if (aC2.length && ci+aC2[0].length<=i+nCaps) { result+=_t.always[aC2[0]]; ci+=aC2[0].length-1; }
                    else result += UEB_ALPHA[lw[ci]] || lw[ci];
                }
                if (i+nCaps<total && /[a-z]/.test(word[i+nCaps])) result += END_CAPS;
                i += nCaps; continue;
            }
        }
        if (i === 0 && !isAllCaps && total > 2) {
            const _SFXV = new Set(['a','e','i','o','u','y']);
            const SFXMAP = {'good':'⠛⠙','little':'⠇⠇','first':'⠋⠌','friend':'⠋⠗','blind':'⠃⠇','quick':'⠟⠅','children':'⠡⠝'};
            for (const [sf,br] of Object.entries(SFXMAP).sort((a,b)=>b[0].length-a[0].length)) {
                if (lw.startsWith(sf) && total>sf.length && !_SFXV.has(lw[sf.length])) {
                    addCap(0); result+=br; i=sf.length; break;
                }
            }
            if (i > 0) continue;
        }
        const _VOWELS_SET = new Set(['a','e','i','o','u']);
        const aAll = Object.keys(_t.always).filter(k=>lw.startsWith(k,i)).sort((a,b)=>b.length-a.length);
        let aBest = null;
        for (const k of aAll) {
            if (k==='there' && blocksThereAlways(lw,i))       continue;
            if (k==='those' && blocksThoseAlways(lw,i))       continue;
            if (k==='of'    && blocksOfAlways(lw,i))          continue;
            if ((k==='th'||k==='wh'||k==='sh'||k==='gh'||k==='er'||k==='ow'||k==='ed'||k==='ou') && blocksCrossCompound(k,lw,i)) continue;
            if (k==='the' && blocksCrossCompound('th',lw,i)) continue;
            if (k==='ear' && (i + k.length < total || prefixEnd > 0 || (typeof blocksEaGroupsign !== 'undefined' && blocksEaGroupsign(lw)))) continue;
            if (k==='gh'    && blocksGhAlways(lw,i))          continue;
            if (k==='here'  && blocksHereAlways(lw,i))        continue;
            if (k==='ever'  && blocksEverAlways(lw,i))        continue;
            if (k==='mother'&& blocksMotherAlways(lw,i))      continue;
            if (k==='one'   && blocksOneAlways(lw,i))         continue;
            if (k==='under' && blocksUnderAlways(lw,i))       continue;
            if (k==='had'   && blocksHadAlways(lw,i))         continue;
            if (k==='st'    && blocksStAlways(lw,i))          continue;
            if (k==='ou' && !isStart) {
                const lm = Object.keys(_t.midend||{}).find(m=>lw.startsWith(m,i)&&m.startsWith('ou')&&m.length>2);
                if (lm) continue;
            }
            if (prefixEnd>0 && i<prefixEnd && i+k.length>prefixEnd && !_ALLOW_CROSS.has(k)) continue;
            if (k==='ou' && prefixEnd>0 && i===prefixEnd-1 && lw[prefixEnd-1]==='o') continue;
            aBest=k; break;
        }
        if (aBest) { addCap(i); result+=_t.always[aBest]; i+=aBest.length; continue; }

        let best=null,bestLen=0,bestBr='',bestType='';
        for (const k of Object.keys(_t.anywhere)) {
            if (lw.startsWith(k,i) && k.length>bestLen) { bestType='anywhere'; bestLen=k.length; bestBr=_t.anywhere[k]; best=k; }
        }
        if (isStart && !isAllCaps) {
            for (const k of Object.keys(_t.begword)) {
                if (lw.startsWith(k,i) && i+k.length<total && k.length>bestLen) {
                    if (k==='be') {
                        const suf=lw.slice(i+k.length), fa=suf[0]||'';
                        if (_VOWELS_SET.has(fa) && fa!=='i') continue;
                        if (fa==='i' && suf[1]!=='n') continue;
                        if (!_VOWELS_SET.has(fa) && !(suf.length>1 && _VOWELS_SET.has(suf[1]))) continue;
                    }
                    if (k==='con' && typeof blocksConBegword!=='undefined' && blocksConBegword(lw)) continue;
                    if (k==='dis' && typeof blocksDisBegword!=='undefined' && blocksDisBegword(lw)) continue;
                    bestType='beg'; bestLen=k.length; bestBr=_t.begword[k]; best=k;
                }
            }
        }
        if (!isStart) {
            for (const k of Object.keys(_t.midword)) {
                if (lw.startsWith(k,i) && i+k.length<total && k.length>bestLen) {
                    if (k==='ea' && typeof blocksEaGroupsign!=='undefined' && blocksEaGroupsign(lw, i)) continue;
                    if (k==='ea' && lw[i+2]==='r') continue;
                    bestType='mid'; bestLen=k.length; bestBr=_t.midword[k]; best=k;
                }
            }
            for (const k of Object.keys(_t.midend)) {
                if (lw.startsWith(k,i) && k.length>bestLen) { bestType='midend'; bestLen=k.length; bestBr=_t.midend[k]; best=k; }
            }
        }
        for (const k of Object.keys(_t.sufword)) {
            if (lw.startsWith(k,i) && i+k.length===total && k.length>bestLen) {
                if (k==='be') continue;
                bestType='suf'; bestLen=k.length; bestBr=_t.sufword[k]; best=k; }
        }
        if (best) { if(bestType==='anywhere'||bestType==='beg') addCap(i); result+=bestBr; i+=bestLen; continue; }
        addCap(i); result+=UEB_ALPHA[lw[i]]||lw[i]; i++;
    }
    return result;
}

// 處理帶撇號的詞（對應 bt translateWordWithApos 的 ueb-g2 分支）
function btTranslate(word) {
    const aposIdx = word.search(/[''']/);
    if (aposIdx === -1) return translateG2Word(word, BT_TABLES);
    const main   = word.slice(0, aposIdx);
    const suffix = word.slice(aposIdx + 1);
    let mainB = '';
    if (main.length > 0) {
        const mainLow = main.toLowerCase();
        let sfPrefix = null, sfBraille = null;
        for (const [k, v] of Object.entries(BT_TABLES.word)) {
            if (mainLow.startsWith(k) && k.length < main.length && v.length > 1) {
                if (!sfPrefix || k.length > sfPrefix.length) { sfPrefix=k; sfBraille=v; }
            }
        }
        if (sfPrefix) {
            let restB = '';
            for (const c of main.slice(sfPrefix.length).toLowerCase()) restB += UEB_ALPHA[c]||c;
            mainB = sfBraille + restB;
        } else {
            mainB = translateG2Word(main, BT_TABLES);
        }
    }
    let suffixB = '';
    for (const c of suffix.toLowerCase()) suffixB += UEB_ALPHA[c]||c;
    return mainB + '⠄' + suffixB;
}

// ── 即時比對 ─────────────────────────────────────────────────────
async function compare() {
    const word = document.getElementById('cmp-input').value.trim();
    if (!word) return;

    const btOut = btTranslate(word);
    document.getElementById('cmp-bt').textContent = btOut;

    if (!LOU.isReady()) {
        document.getElementById('cmp-out').style.display = '';
        document.getElementById('cmp-ll').textContent = '（liblouis 尚未就緒）';
        document.getElementById('cmp-tag').textContent = '';
        document.getElementById('cmp-snippet').style.display = 'none';
        document.getElementById('cmp-hint').style.display = 'none';
        return;
    }

    const llRaw = LOU.translateG2(word);
    const llOut = llRaw ? llRaw.replace(/⠀/g, '').trim() : null;

    document.getElementById('cmp-ll').textContent = llOut || '（轉譯失敗）';

    const tagEl = document.getElementById('cmp-tag');
    const snippet = document.getElementById('cmp-snippet');
    const hint = document.getElementById('cmp-hint');

    if (llOut && btOut === llOut) {
        tagEl.textContent = '✓ 相符';
        tagEl.className = 'cmp-tag ok';
        snippet.style.display = 'none';
        hint.style.display = 'none';
    } else {
        tagEl.textContent = '✗ 不符';
        tagEl.className = 'cmp-tag fail';
        if (llOut) {
            snippet.textContent = `"${word}":"${llOut}"`;
            snippet.style.display = 'block';
            hint.style.display = 'block';
        } else {
            snippet.style.display = 'none';
            hint.style.display = 'none';
        }
    }
    document.getElementById('cmp-out').style.display = '';
}

// ── 執行 regression ──────────────────────────────────────────────
function run() {
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '';
    let pass = 0, fail = 0;
    const failures = [];
    for (const [w, exp] of Object.entries(REGRESSION_CASES)) {
        const got = btTranslate(w);
        const ok  = got === exp;
        if (ok) { pass++; continue; }
        fail++;
        failures.push({w, got, exp});
    }
    for (const {w, got, exp} of failures) {
        const tr = document.createElement('tr');
        tr.className = 'fail';
        tr.innerHTML = `<td>${esc(w)}</td><td class="brl">${esc(got)}</td><td class="brl">${esc(exp)}</td><td class="tag-fail">✗</td>`;
        tbody.appendChild(tr);
    }
    const total = pass + fail;
    document.getElementById('summary').innerHTML =
        `<span class="stat ok">✓ ${pass}</span> / ${total} &nbsp;|&nbsp; <span class="stat fail">✗ ${fail}</span>` +
        (fail === 0 ? ' &nbsp;— 全部通過' : '');
    document.getElementById('tbl').style.display = fail > 0 ? '' : 'none';
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

window.addEventListener('load', async () => {
    run();
    const statusEl = document.getElementById('ll-status');
    if (typeof liblouisBuild === 'undefined') {
        statusEl.textContent = 'liblouis ✗（未載入）';
        statusEl.className = 'll-status error';
        return;
    }
    try {
        await LOU.preload();
        statusEl.textContent = 'liblouis ✓';
        statusEl.className = 'll-status ready';
    } catch(e) {
        statusEl.textContent = 'liblouis ✗';
        statusEl.className = 'll-status error';
    }
});
</script>
