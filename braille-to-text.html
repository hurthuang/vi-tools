<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>點字轉文字</title>
<style>
@font-face { font-family: 'SimBraille'; src: url('SIMBRL.TTF') format('truetype'); }
:root { --base-font-size: 20px; }
.font-ascii { font-family: 'SimBraille', sans-serif !important; letter-spacing: 0px; }

body {
    font-family: "Microsoft JhengHei", "Segoe UI", sans-serif;
    max-width: 1400px; margin: 0 auto; padding: 20px;
    background-color: #f4f7f9; color: #333;
}

/* ── Dark theme ── */
html[data-theme="dark"] body { background-color: #0f1117 !important; color: #e2e8f0 !important; }
html[data-theme="dark"] .header h1 { color: #e2e8f0; }
html[data-theme="dark"] .control-panel,
html[data-theme="dark"] .container,
html[data-theme="dark"] .parallel-container { background-color: #1a1d27 !important; border-color: #2e3350 !important; color: #e2e8f0 !important; }
html[data-theme="dark"] textarea,
html[data-theme="dark"] select,
html[data-theme="dark"] input[type="text"] { background-color: #1a1d27 !important; border-color: #2e3350 !important; color: #e2e8f0 !important; }
html[data-theme="dark"] label { color: #b0bec5 !important; }
html[data-theme="dark"] .parallel-title { background: #1a1d27 !important; color: #cfd8dc !important; }
html[data-theme="dark"] .token-group { background-color: #1b2e1b !important; border-color: #2e7d32 !important; }
html[data-theme="dark"] .token-group.token-zh { background-color: #0d2137 !important; border-color: #1565c0 !important; }
html[data-theme="dark"] .token-space { background-color: #2d2a00 !important; border-color: #a16207 !important; }
html[data-theme="dark"] .bmi-panel { background: #1b2e1b !important; border-color: #2e7d32 !important; color: #81c784 !important; }

/* ── Header ── */
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.header h1 { font-size: 1.4em; }
.rules-status { font-size: 0.85em; color: #666; background: #e8f5e9; border: 1px solid #a5d6a7; border-radius: 4px; padding: 4px 10px; }

/* ── Control panel ── */
.control-panel {
    background: white; padding: 15px 20px; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1); margin-bottom: 20px;
    display: flex; flex-wrap: wrap; gap: 20px; align-items: center;
}
.control-item { display: flex; align-items: center; gap: 8px; }
.control-item strong { white-space: nowrap; }
.btn-group { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; }
button { padding: 6px 14px; border: 1px solid #ccc; border-radius: 4px;
         background: white; cursor: pointer; font-size: 0.9em; transition: background 0.15s; }
button:hover { background: #f0f0f0; }
button.primary { background: #4caf50; color: white; border-color: #388e3c; }
button.primary:hover { background: #388e3c; }
select { padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; background: white; cursor: pointer; }
input[type="radio"] { cursor: pointer; }


/* ── Main container ── */
.container { display: flex; gap: 20px; margin-bottom: 20px; align-items: stretch; }
.input-area  { flex: 1; display: flex; flex-direction: column; }
.output-area { flex: 3; display: flex; flex-direction: column; }
.area-label { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.area-label label { margin: 0; font-weight: 600; }

textarea {
    flex: 1; min-height: 280px; padding: 12px;
    border: 1px solid #ccc; border-radius: 6px;
    font-size: var(--base-font-size); line-height: 1.8;
    font-family: inherit; resize: vertical;
    background: white; color: #333;
}
textarea:focus { outline: none; border-color: #4caf50; box-shadow: 0 0 0 2px rgba(76,175,80,.2); }
#output-text { font-family: "Courier New", monospace; background: #fafafa; }

/* ── Parallel view ── */
.parallel-container {
    background: white; padding: 20px 25px; border-radius: 8px;
    border: 1px solid #e0e0e0; max-height: 520px; overflow-y: auto;
    box-shadow: inset 0 2px 4px rgba(0,0,0,.05);
}
.parallel-title {
    font-weight: bold; font-size: 1em; margin-bottom: 14px;
    border-left: 5px solid #4caf50; padding-left: 10px;
    position: sticky; top: 0; background: white; z-index: 10; padding-top: 4px;
}
#parallel-view { display: flex; flex-wrap: wrap; gap: 8px; row-gap: 18px; align-items: flex-start; }
.token-group {
    display: flex; flex-direction: column; align-items: center;
    padding: 6px; background-color: #f1f8e9;
    border: 1px solid #a5d6a7; border-radius: 4px;
    transition: background-color 0.12s, border-color 0.12s, transform 0.08s;
}
.token-group:hover {
    background-color: #e3f2fd !important; border-color: #90caf9 !important;
    transform: translateY(-1px); box-shadow: 0 2px 6px rgba(33,150,243,.18);
}
/* 注音點字段：藍色系 */
.token-group.token-zh {
    background-color: #e3f2fd; border-color: #90caf9;
}
.token-group.token-zh .token-text  { color: #1565c0; border-color: #bbdefb; }
.token-group.token-zh .token-braille { color: #1565c0; }
/* 文字在上、點字在下 */
.token-text {
    font-size: calc(var(--base-font-size) * 0.6); color: #388e3c;
    border-bottom: 1px solid #c8e6c9; width: 100%;
    text-align: center; margin-bottom: 4px; padding-bottom: 2px;
    word-break: break-all; max-width: 120px;
}
.token-braille {
    font-size: calc(var(--base-font-size) * 1.3);
    line-height: 1; color: #2e7d32; text-align: center;
}
.token-space { background-color: #fffde7 !important; border-color: #fff176 !important; }
.token-space .token-text    { color: #f9a825 !important; border-color: #fff9c4 !important; }
.token-space .token-braille { color: #f9a825 !important; }
/* 手動修改過的中文格：橘色 */
.token-group.token-edited { background-color: #fff3e0 !important; border-color: #ff9800 !important; }
.token-group.token-edited .token-text { color: #e65100 !important; border-color: #ffcc80 !important; }
html[data-theme="dark"] .token-group.token-edited { background-color: #2d1600 !important; border-color: #ff9800 !important; }
html[data-theme="dark"] .token-group.token-edited .token-text { color: #ffb74d !important; border-color: #e65100 !important; }
.token-text[contenteditable="true"] { cursor: text; }
.token-text[contenteditable="true"]:focus { background: rgba(255,152,0,.15); border-radius: 2px; outline: none; }
/* McBopomofoWeb 歸屬標示 */
.mcb-credit { font-size: 0.82em; color: #388e3c; }
.mcb-credit a { color: inherit; text-decoration: underline; }
html[data-theme="dark"] .mcb-credit { color: #81c784; }
.line-break { flex-basis: 100%; height: 25px; border-top: 1px dashed #cfd8dc; margin: 15px 0; }

/* ── Status bar ── */
#status-bar { font-size: 0.82em; color: #666; margin-top: 6px; min-height: 18px; }
#status-bar.err { color: #c62828; }
#status-bar.ok  { color: #2e7d32; }


@media (max-width: 700px) {
    .container { flex-direction: column; }
    .btn-group { margin-left: 0; }
}
</style>
<script src="build-no-tables-utf32.js"></script>
</head>
<body>

<div class="header">
    <h1>← 點字轉文字</h1>
    <div class="rules-status" id="rules-status">正在載入…</div>
</div>

<div class="control-panel">
    <div class="control-item">
        <strong>輸入格式：</strong>
        <label><input type="radio" name="input-disp" value="unicode" checked onchange="setInputDisp(this.value)"> Unicode ⠠⠅</label>
        <label><input type="radio" name="input-disp" value="ascii"   onchange="setInputDisp(this.value)"> ASCII ,k</label>
        <label><input type="radio" name="input-disp" value="sim"     onchange="setInputDisp(this.value)"> ASCII+點字字型</label>
    </div>
    <div class="btn-group">
        <input type="file" id="open-file-input" accept=".txt,.docx,.odt,.rtf,.pdf" style="display:none"
               aria-hidden="true" tabindex="-1"
               onchange="handleOpenFile(event,'input-text',doConvert)">
        <button onclick="document.getElementById('open-file-input').click()" style="background:#795548;color:white;border-color:#5d4037;" aria-label="開啟檔案"><span aria-hidden="true">📂</span> 開啟檔案</button>
        <button onclick="copyOutput()" style="background:#1565c0;color:white;border-color:#0d47a1;">複製輸出</button>
    </div>
</div>


<div class="container">
    <div class="input-area">
        <div class="area-label">
            <label for="input-text">點字輸入（UEB/注音點字）：</label>
            <button id="dot-pad-btn" class="brlp-trigger" aria-label="點字輸入" aria-expanded="false" title="點字輸入（點擊開啟面板）&#10;Ctrl+B：開關六點鍵盤（S=1 D=2 F=3 | J=4 K=5 L=6）&#10;點陣：點選點位後按「插入」">⠿ 點字輸入</button>
        </div>
        <textarea id="input-text" autofocus
            placeholder="輸入 ASCII 點字（,k is p{}4）&#10;或 Unicode 點字（⠠⠅ ⠊⠎ ⠏⠪⠻⠲）&#10;或注音點字（⠋⠞⠄⠚⠡⠐⠗⠩⠈）&#10;Ctrl+B 開啟六點輸入"></textarea>
    </div>
    <div class="output-area">
        <div class="area-label">
            <label for="output-text">輸出：</label>
            <span class="mcb-credit">注音點字轉國字使用 <a href="https://github.com/openvanilla/McBopomofoWeb" target="_blank" rel="noopener">McBopomofoWeb</a> 引擎</span>
            <button onclick="_openOutputFormat()" style="background:#546e7a;color:white;border-color:#37474f;margin-left:auto;" aria-label="輸出格式調整"><span aria-hidden="true">📋</span> 格式調整</button>
        </div>
        <textarea id="output-text" readonly spellcheck="false" placeholder="轉換結果將顯示於此…" aria-label="輸出結果"></textarea>
    </div>
</div>
<div id="status-bar"></div>

<div class="parallel-container">
    <div class="parallel-title"><span aria-hidden="true">🔍</span> 逐格對照
        <span style="font-weight:normal;font-size:0.8em;color:#888;">
            &nbsp;綠色 = UEB 英文&nbsp;｜&nbsp;藍色 = 注音點字
        </span>
    </div>
    <div id="parallel-view">
        <span style="color:#999;font-size:0.9em;">轉換後顯示對照</span>
    </div>
</div>
<script>
'use strict';


// ── NABCC / BR_TO_ASCII ──────────────────────────────────────
const BR_TO_ASCII = {
    '⠁':'a','⠂':'1','⠃':'b','⠄':'\'','⠅':'k',
    '⠆':'2','⠇':'l','⠈':'`','⠉':'c','⠊':'i',
    '⠋':'f','⠌':'/','⠍':'m','⠎':'s','⠏':'p',
    '⠐':'"','⠑':'e','⠒':'3','⠓':'h','⠔':'9',
    '⠕':'o','⠖':'6','⠗':'r','⠘':'~','⠙':'d',
    '⠚':'j','⠛':'g','⠜':'>','⠝':'n','⠞':'t',
    '⠟':'q','⠠':',','⠡':'*','⠢':'5','⠣':'<',
    '⠤':'-','⠥':'u','⠦':'8','⠧':'v','⠨':'.',
    '⠩':'%','⠪':'{','⠫':'$','⠬':'+','⠭':'x',
    '⠮':'!','⠯':'&','⠰':';','⠱':':','⠲':'4',
    '⠳':'|','⠴':'0','⠵':'z','⠶':'7','⠷':'(',
    '⠸':'_','⠹':'?','⠺':'w','⠻':'}','⠼':'#',
    '⠽':'y','⠾':')','⠿':'=','⠀':' '
};
const ASCII_TO_UNI = {};
for (const [u,a] of Object.entries(BR_TO_ASCII)) ASCII_TO_UNI[a] = u;

const NABCC_TO_UNI = {
    32:0x2800,97:0x2801,49:0x2802,98:0x2803,39:0x2804,107:0x2805,50:0x2806,108:0x2807,
    96:0x2808,99:0x2809,105:0x280a,102:0x280b,47:0x280c,109:0x280d,115:0x280e,112:0x280f,
    34:0x2810,101:0x2811,51:0x2812,104:0x2813,57:0x2814,111:0x2815,54:0x2816,114:0x2817,
    126:0x2818,100:0x2819,106:0x281a,103:0x281b,62:0x281c,110:0x281d,116:0x281e,113:0x281f,
    44:0x2820,42:0x2821,53:0x2822,60:0x2823,45:0x2824,117:0x2825,56:0x2826,118:0x2827,
    46:0x2828,37:0x2829,123:0x282a,36:0x282b,43:0x282c,120:0x282d,33:0x282e,38:0x282f,
    59:0x2830,58:0x2831,52:0x2832,124:0x2833,48:0x2834,122:0x2835,55:0x2836,40:0x2837,
    95:0x2838,63:0x2839,119:0x283a,125:0x283b,35:0x283c,121:0x283d,41:0x283e,61:0x283f
};

function unicodeToAscii(str) {
    return Array.from(str).map(c => BR_TO_ASCII[c] !== undefined ? BR_TO_ASCII[c] : c).join('');
}
function asciiToUnicode(str) {
    return Array.from(str).map(c => ASCII_TO_UNI[c] !== undefined ? ASCII_TO_UNI[c] : c).join('');
}
function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── liblouis ──────────────────────────────────────────────────
let M = null;
function _isReady() { return !!(M && M.calledRun); }
const _tableCache = new Set();
const TABLE_DIR = 'table/';
const TABLE_DEPS = {
    'en-ueb-g2.ctb':      ['en-ueb-math.ctb','en-ueb-chardefs.uti','en-ueb-g1.ctb','spaces.uti'],
    'en-ueb-g1.ctb':      ['text_nabcc.dis','en-ueb-chardefs.uti','spaces.uti'],
    'en-ueb-chardefs.uti':['en-chardefs.cti','latinLetterDef6Dots.uti','litdigits6Dots.uti','loweredDigits6Dots.uti'],
    'en-us-comp8.ctb':    ['latinLetterDef8Dots.uti','latinUppercaseComp6.uti','spaces.uti','braille-patterns.cti'],
};

async function _loadTableFile(filename) {
    if (_tableCache.has(filename)) return;
    _tableCache.add(filename);
    try {
        const resp = await fetch(TABLE_DIR + filename);
        if (!resp.ok) throw new Error(resp.status);
        const ab = await resp.arrayBuffer();
        const bytes = new Uint8Array(ab);
        let s = '';
        for (let b = 0; b < bytes.length; b++) s += String.fromCharCode(bytes[b]);
        if (filename.endsWith('.ctb') || filename.endsWith('.uti')) {
            s = s.split('\n').map(line => {
                const t = line.trim();
                if (t.startsWith('seqdelimiter')||t.startsWith('seqbeforechars')||
                    t.startsWith('seqafterchars')||t.startsWith('seqafterexpression')||
                    t.startsWith('seqafterpattern')) return '# '+line;
                return line;
            }).join('\n');
        }
        try { M.FS.mkdir('/tables'); } catch(e) {}
        M.FS.writeFile('/tables/'+filename, s);
    } catch(e) { console.warn('table load failed:', filename, e.message); }
    await Promise.all((TABLE_DEPS[filename]||[]).map(d => _loadTableFile(d)));
}

function _louBackTranslate(tableFile, uniStr) {
    if (!_isReady()) return null;
    if (typeof M._lou_backTranslateString !== 'function') return null;
    try {
        const n = uniStr.length;
        const inBuf = M._malloc((n+1)*4);
        for (let i = 0; i < n; i++) M.setValue(inBuf+i*4, uniStr.codePointAt(i), 'i32');
        M.setValue(inBuf+n*4, 0, 'i32');
        const outMax = Math.max(n * 8, 256);
        const outBuf = M._malloc((outMax+1)*4);
        const inP = M._malloc(4), outP = M._malloc(4);
        M.setValue(inP, n, 'i32'); M.setValue(outP, outMax, 'i32');
        const tblStr = M.allocate(M.intArrayFromString('/tables/'+tableFile),'i8',M.ALLOC_NORMAL);
        const ret = M._lou_backTranslateString(tblStr, inBuf, inP, outBuf, outP, 0, 0, 0);
        M._free(tblStr);
        let result = null;
        if (ret > 0) {
            const len = M.getValue(outP,'i32');
            let out = '';
            for (let i = 0; i < len; i++) out += String.fromCharCode(M.getValue(outBuf+i*4,'i32'));
            result = out;
        }
        M._free(inBuf); M._free(outBuf); M._free(inP); M._free(outP);
        return result;
    } catch(e) { return null; }
}

// ── McBopomofo（注音點字引擎，lazy load）─────────────────────
let svcMcB = null;

function _onMcBLoad() {
    try {
        svcMcB = new mcbopomofo.Service();
        const st = document.getElementById('rules-status');
        st.textContent = st.textContent + ' | 注音點字 ✓';
        // 已有輸入的話重新轉換
        if (document.getElementById('input-text').value.trim()) doConvert();
    } catch(e) {
        console.warn('McBopomofo init failed', e);
    }
}

// ── 分段：偵測注音點字 vs UEB ────────────────────────────────
function _isChineseChunk(brailleStr) {
    if (!svcMcB || !brailleStr) return false;
    // ⠐ (dots 4) 是 UEB 縮寫前綴指示符，不可能是中文音節開頭
    if (brailleStr[0] === '⠐') return false;
    const tokens = mcbopomofo.BopomofoBrailleConverter.convertBrailleToTokens(brailleStr);
    if (!tokens.length) return false;
    const first = tokens[0];
    return typeof first === 'object' && first !== null && typeof first.bpmf === 'string';
}

function _segmentLine(uniLine) {
    const SPACE = '⠀';
    // 以空格切塊
    const chunks = [];
    let buf = '';
    for (const ch of uniLine) {
        if (ch === SPACE) {
            if (buf) { chunks.push(buf); buf = ''; }
        } else {
            buf += ch;
        }
    }
    if (buf) chunks.push(buf);
    if (!chunks.length) return [];

    // 分類並合併相鄰同類型塊
    // 注意：合併時用 ASCII space ' ' 而非 ⠀，McB converter 只認 ASCII space 作為詞界
    const segments = [];
    for (const chunk of chunks) {
        const type = _isChineseChunk(chunk) ? 'zh' : 'ueb';
        const last = segments[segments.length - 1];
        if (last && last.type === type) {
            last.braille += (type === 'zh' ? ' ' : '⠀') + chunk;
        } else {
            segments.push({ type, braille: chunk });
        }
    }
    return segments;
}

// ── 注音點字逐字對照 ──────────────────────────────────────────
// 回傳 [{braille, text, isSpace}] 給 renderParallel 逐格顯示
function _buildChineseCharTokens(brailleStr) {
    const tokens = mcbopomofo.BopomofoBrailleConverter.convertBrailleToTokens(brailleStr);
    const fullText = svcMcB.convertBrailleToText(brailleStr);
    const result = [];
    let textIdx = 0;

    for (const token of tokens) {
        if (typeof token === 'object' && token !== null && typeof token.bpmf === 'string') {
            // BopomofoSyllable → 一個中文字
            const char = textIdx < fullText.length ? fullText[textIdx] : '';
            // 從 bpmf 反推回點字格（單音節，不含多餘空格）
            let brl = '';
            try { brl = mcbopomofo.BopomofoBrailleConverter.convertBpmfToBraille(token.bpmf).trim(); } catch(e) {}
            result.push({ braille: brl, text: char, isSpace: false });
            textIdx++;
        } else {
            // 標點、數字、字母（string token，已是解碼後文字）
            const tokenStr = typeof token === 'string' ? token : String(token);
            if (!tokenStr.trim()) {
                // 詞間空格 → 顯示為空格 token
                result.push({ isSpace: true, braille: '⠀' });
            } else {
                // 標點/數字：反推點字格
                let brl = '';
                try { brl = mcbopomofo.BopomofoBrailleConverter.convertBpmfToBraille(tokenStr).trim(); } catch(e) {}
                result.push({ braille: brl, text: tokenStr, isSpace: false });
            }
            textIdx += tokenStr.length;
        }
    }
    return result;
}

// ── Init ──────────────────────────────────────────────────────
async function _init() {
    for (let i = 0; i < 100; i++) {
        if (typeof liblouisBuild !== 'undefined' && liblouisBuild.calledRun) break;
        await new Promise(r => setTimeout(r, 50));
    }
    if (typeof liblouisBuild === 'undefined') {
        setStatus('✗ 無法載入 liblouis', 'err'); return;
    }
    M = liblouisBuild;
    setStatus('載入點字表…');
    await Promise.all([
        _loadTableFile('en-ueb-g2.ctb'),
        _loadTableFile('en-us-comp8.ctb'),
    ]);
    const hasBack = typeof M._lou_backTranslateString === 'function';
    document.getElementById('rules-status').textContent =
        'liblouis ✓' + (hasBack ? '' : ' （無反向轉換）');
    if (!hasBack) {
        setStatus('✗ 此版 liblouis WASM 不支援 lou_backTranslateString', 'err');
        return;
    }
    setStatus('就緒', 'ok');
}
document.addEventListener('DOMContentLoaded', _init);

// ── Input normalisation ───────────────────────────────────────
function normaliseInput(raw) {
    if (/[⠀-⣿]/.test(raw)) {
        return Array.from(raw).map(c => {
            if (c >= '⠀' && c <= '⣿') return c;
            if (c === '\n') return '\n';
            return ASCII_TO_UNI[c] !== undefined ? ASCII_TO_UNI[c] : c;
        }).join('');
    }
    return Array.from(raw).map(c => c === '\n' ? '\n' : (ASCII_TO_UNI[c] !== undefined ? ASCII_TO_UNI[c] : c)).join('');
}

// ── Convert ───────────────────────────────────────────────────
let _lastTokens = [];
const _zhEdits = new Map(); // braille格值 → 手動修改後的中文字
let _inputDisp = 'unicode';
let _canonical = '';

function doConvert() {
    if (!_isReady()) { setStatus('liblouis 尚未就緒', 'err'); return; }
    _canonical = _taRead();
    const uni = _canonical;
    if (!uni.trim()) {
        document.getElementById('output-text').value = '';
        document.getElementById('parallel-view').innerHTML =
            '<span style="color:#999;font-size:0.9em;">轉換後顯示對照</span>';
        _zhEdits.clear();
        setStatus('');
        return;
    }

    _lastTokens = [];
    const outLines = [];

    for (const line of uni.split('\n')) {
        if (_lastTokens.length > 0) _lastTokens.push({ isLineBreak: true });
        if (!line.trim()) { outLines.push(''); continue; }

        const segments = svcMcB ? _segmentLine(line) : [{ type: 'ueb', braille: line }];
        const lineParts = [];
        let firstSeg = true;

        for (const seg of segments) {
            // 不同段之間加空格 token
            if (!firstSeg) _lastTokens.push({ isSpace: true, braille: '⠀' });
            firstSeg = false;

            if (seg.type === 'zh') {
                // 注音點字：交給 McBopomofo，逐字展開
                const text = svcMcB.convertBrailleToText(seg.braille);
                lineParts.push(text);
                for (const ct of _buildChineseCharTokens(seg.braille)) {
                    _lastTokens.push(ct.isSpace
                        ? { isSpace: true, braille: '⠀' }
                        : { type: 'zh', braille: ct.braille, text: ct.text, isSpace: false });
                }
            } else {
                // UEB：交給 liblouis，按空格切詞
                const text = _louBackTranslate('en-ueb-g2.ctb', seg.braille) ?? '';
                lineParts.push(text);
                const brlWords = seg.braille.split('⠀').filter(w => w.length > 0);
                const txtWords = text.split(/\s+/).filter(w => w.length > 0);
                for (let i = 0; i < brlWords.length; i++) {
                    if (i > 0) _lastTokens.push({ isSpace: true, braille: '⠀' });
                    _lastTokens.push({ type: 'ueb', braille: brlWords[i], text: txtWords[i] || '', isSpace: false });
                }
            }
        }
        outLines.push(lineParts.join(' '));
    }

    document.getElementById('output-text').value = outLines.join('\n');
    renderParallel();
    setStatus('✓ 轉換完成', 'ok');
}

// ── 從 token 重建輸出文字（套用手動修改）────────────────────────
function _buildOutputFromTokens() {
    const lines = [];
    let cur = '';
    for (const t of _lastTokens) {
        if (t.isLineBreak)        { lines.push(cur); cur = ''; }
        else if (t.isSpace)       { cur += ' '; }
        else if (t.type === 'zh') { cur += (_zhEdits.has(t.braille) ? _zhEdits.get(t.braille) : t.text) || ''; }
        else                      { cur += t.text || ''; }
    }
    lines.push(cur);
    return lines.join('\n');
}

// ── Render parallel ───────────────────────────────────────────
function renderParallel() {
    const view = document.getElementById('parallel-view');
    view.innerHTML = '';
    if (!_lastTokens.length) {
        view.innerHTML = '<span style="color:#999;font-size:0.9em;">無內容</span>';
        return;
    }
    const isAscii = (_inputDisp === 'ascii' || _inputDisp === 'sim');
    const isSim   = (_inputDisp === 'sim');

    for (const t of _lastTokens) {
        if (t.isLineBreak) {
            const br = document.createElement('div');
            br.className = 'line-break';
            view.appendChild(br);
            continue;
        }

        const g = document.createElement('div');
        const tDiv = document.createElement('div');
        tDiv.className = 'token-text';
        const bDiv = document.createElement('div');

        if (t.isSpace) {
            g.className = 'token-group token-space';
            bDiv.className = 'token-braille ' + (isSim ? 'font-ascii' : 'font-unicode');
            bDiv.textContent = isAscii ? ' ' : '⠀';
            tDiv.textContent = '␣';
        } else if (t.type === 'zh') {
            // 注音點字段：藍色，可手動修改（一格一字），修改過變橘色
            const brlKey  = t.braille;
            const origText = t.text || '';
            const editedText = _zhEdits.get(brlKey);
            g.className = 'token-group token-zh' + (editedText !== undefined ? ' token-edited' : '');
            bDiv.className = 'token-braille font-unicode';
            bDiv.textContent = brlKey;
            tDiv.textContent = editedText !== undefined ? editedText : origText;
            tDiv.contentEditable = 'true';
            let _composing = false;
            tDiv.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') e.preventDefault();
            });
            tDiv.addEventListener('compositionstart', function() { _composing = true; });
            tDiv.addEventListener('compositionend', function() {
                _composing = false;
                _applyOneChar(this);
            });
            tDiv.addEventListener('input', function() {
                if (_composing) return; // IME 組字中，等 compositionend 再處理
                _applyOneChar(this);
            });
            const _applyOneChar = (el) => {
                const chars = [...el.textContent].filter(c => c !== '\n' && c !== '\r');
                if (chars.length > 1) {
                    el.textContent = chars[0];
                    const sel = window.getSelection();
                    const range = document.createRange();
                    const node = el.firstChild;
                    if (node) { range.setStart(node, el.textContent.length); }
                    else      { range.setStart(el, 0); }
                    range.collapse(true);
                    sel.removeAllRanges();
                    sel.addRange(range);
                }
                const newText = chars.length ? chars[0] : '';
                if (newText && newText !== origText) {
                    _zhEdits.set(brlKey, newText);
                    g.classList.add('token-edited');
                } else {
                    _zhEdits.delete(brlKey);
                    g.classList.remove('token-edited');
                }
                document.getElementById('output-text').value = _buildOutputFromTokens();
            };
        } else {
            // UEB 段：綠色
            g.className = 'token-group';
            bDiv.className = 'token-braille ' + (isSim ? 'font-ascii' : 'font-unicode');
            bDiv.textContent = isAscii ? unicodeToAscii(t.braille) : t.braille;
            tDiv.textContent = t.text || '';
        }

        g.appendChild(tDiv);
        g.appendChild(bDiv);
        view.appendChild(g);
    }
}

// ── Input display mode ────────────────────────────────────────
function _taRead() {
    return normaliseInput(document.getElementById('input-text').value);
}

function _taWrite(uni) {
    const ta = document.getElementById('input-text');
    const sel = ta.selectionStart;
    if (_inputDisp === 'unicode') {
        ta.value = uni;
        ta.classList.remove('font-ascii');
    } else {
        ta.value = Array.from(uni).map(c =>
            c === '\n' ? '\n' : (BR_TO_ASCII[c] !== undefined ? BR_TO_ASCII[c] : c)
        ).join('');
        ta.classList.toggle('font-ascii', _inputDisp === 'sim');
    }
    try { ta.selectionStart = ta.selectionEnd = sel; } catch(e) {}
}

function setInputDisp(mode) {
    _canonical = _taRead();
    _inputDisp = mode;
    _taWrite(_canonical);
    renderParallel();
}

// ── Utilities ─────────────────────────────────────────────────
function _applyBrailleMerge(decisions) {
    const lines = _canonical.split('\n');
    let out = '';
    for (let i = 0; i < lines.length; i++) {
        if (decisions[i] && decisions[i] !== 'keep' && i < lines.length - 1) {
            const line = lines[i];
            // 行尾沒有點字空格才補一個，保持詞界
            out += line + (line.length > 0 && !line.endsWith('⠀') ? '⠀' : '');
        } else {
            out += lines[i] + (i < lines.length - 1 ? '\n' : '');
        }
    }
    return out;
}

function _openOutputFormat() {
    openFormatModal('output-text', function() {
        const decs = window._fwpLastDecisions;
        if (decs) {
            // 合併換行：反推回輸入區並重新轉換，對照視圖一起恢復
            window._fwpLastDecisions = null;
            const merged = _applyBrailleMerge(decs);
            _canonical = merged;
            _taWrite(merged);
            doConvert();
        } else {
            // 其他格式調整（取代等）：對照視圖停用
            _lastTokens = [];
            _zhEdits.clear();
            document.getElementById('parallel-view').innerHTML =
                '<span style="color:#999;font-size:0.9em;">輸出已格式調整，對照視圖已停用。如需重新對照，請重新轉換。</span>';
        }
    }, null, { noAutoClean: true });
}

function copyOutput() {
    const t = document.getElementById('output-text').value;
    if (!t) return;
    navigator.clipboard.writeText(t).then(() => setStatus('✓ 已複製', 'ok'));
}

function setStatus(msg, cls) {
    const el = document.getElementById('status-bar');
    el.textContent = msg;
    el.className = cls || '';
}

// ── Theme ─────────────────────────────────────────────────────
(function() {
    try {
        const t = localStorage.getItem('site-theme');
        if (t === 'dark') document.documentElement.setAttribute('data-theme','dark');
    } catch(e) {}
})();
window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'setTheme')
        document.documentElement.setAttribute('data-theme', e.data.theme);
});
</script>

<script src="shared.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    initBraillePanel({
        triggerId:    'dot-pad-btn',
        targetId:     'input-text',
        globalToggle:  true,
        onInsert:      function() {
            if (_inputDisp !== 'unicode') {
                const ta = document.getElementById('input-text');
                const cursorPos = ta.selectionStart;
                const mixed = ta.value;
                const asUni = Array.from(mixed).map(c =>
                    c === '\n' ? '\n' :
                    (c >= '⠀' && c <= '⣿') ? c :
                    (ASCII_TO_UNI[c] !== undefined ? ASCII_TO_UNI[c] : c)
                ).join('');
                _canonical = asUni;
                _taWrite(asUni);
                try { ta.selectionStart = ta.selectionEnd = cursorPos; } catch(e) {}
            } else {
                _canonical = _taRead();
            }
            clearTimeout(window._g2Timer);
            window._g2Timer = setTimeout(doConvert, 400);
        },
    });

    document.getElementById('input-text').addEventListener('input', function() {
        _canonical = _taRead();
        clearTimeout(window._g2Timer);
        window._g2Timer = setTimeout(doConvert, 400);
    });
    document.getElementById('input-text').addEventListener('keydown', function(e) {
        if ((e.ctrlKey||e.metaKey) && e.key === 'Enter') { e.preventDefault(); doConvert(); }
    });
});
</script>
