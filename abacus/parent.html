<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>珠算家長版</title>
<link rel="icon" href="../favicon.ico" sizes="16x16 24x24 32x32 48x48 64x64">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<script src="../music/js/theme.js"></script>
<script src="abacus-dir.js"></script>
<script src="abacus-levels.js"></script>
<script src="abacus-core.js"></script>
<script src="abacus-picker.js"></script>
<script src="abacus-code.js"></script>
<script src="abacus-anim.js"></script>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--muted:#5d5d58;--line:#d6d4cc;--card:#fff;--accent:#1f5fa8;--ok:#1e7a3c;--bad:#b3261e;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161615;--fg:#ecebe6;--muted:#a8a69e;--line:#3b3a36;--card:#1f1f1d;--accent:#7fb0f0;--ok:#6fcf8f;--bad:#f08a80;}}
:root[data-theme="dark"]{--bg:#161615;--fg:#ecebe6;--muted:#a8a69e;--line:#3b3a36;--card:#1f1f1d;--accent:#7fb0f0;--ok:#6fcf8f;--bad:#f08a80;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.6 system-ui,"Microsoft JhengHei","PingFang TC",sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:1.5rem;margin:0 0 4px}
p.lead{color:var(--muted);margin:0 0 16px}
fieldset{border:1px solid var(--line);border-radius:8px;background:var(--card);margin:0 0 16px;padding:12px 16px;min-width:0}
legend{font-weight:700;padding:0 6px}
label{display:inline-flex;gap:8px;align-items:baseline;margin:4px 16px 4px 0;cursor:pointer}
input[type=text],input[type=number]{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
button{font:inherit;padding:8px 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;margin:4px 8px 4px 0}
/* 深色主題的 --accent 是淺藍，白字看不清楚：實心按鈕固定用深藍 */
button:not(.secondary){background:#1f5fa8;border-color:#1f5fa8}
button.secondary{background:transparent;color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.hint{color:var(--muted);font-size:.95rem}
.feedback.bad{color:var(--bad)}
/* 設定：級數是一顆一顆的按鈕，其他設定收在「更多設定」 */
.lv-group{margin:0 0 10px}
.lv-group h2{font-size:.95rem;font-weight:400;color:var(--muted);margin:0 0 4px}
.lv-btns{display:grid;grid-template-columns:repeat(5,minmax(0,4.6em));gap:6px}
.lv-btns button{margin:0;padding:10px 2px;font-size:1.05rem;white-space:nowrap;background:var(--card);color:var(--fg);border:1px solid var(--line)}
/* 選了的按鈕：深藍底白字加 ✓（深色主題的 --accent 是淺藍，白字看不清楚，固定用深藍） */
.lv-btns button[aria-pressed=true]{background:#1f5fa8;border-color:#1f5fa8;color:#fff}
.lv-btns button[aria-pressed=true]::before{content:'✓ '}
.picked{min-height:1.6em;margin:4px 0 12px}
button.big{width:100%;font-size:1.3rem;padding:14px}
.more{margin:20px 0 0;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:8px 16px}
.more summary{cursor:pointer;padding:6px 0;color:var(--muted)}
.code-row label{display:block;margin:0 0 4px}
.code-ctl{display:flex;gap:8px}
.code-ctl input{flex:1 1 auto;min-width:0;font:inherit;font-size:1.2rem;letter-spacing:.08em;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.more[open] summary{margin-bottom:8px}
label.stack,p.stack{display:block;margin:0 0 12px}
label.stack input{display:block;width:100%;margin-top:4px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* 練習：題目在左、按鈕在旁邊；手機上按鈕排到題目下面 */
.q-row{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch;margin:8px 0}
.problem{flex:1 1 16rem;font-size:2.8rem;font-weight:600;text-align:center;padding:20px 8px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-variant-numeric:tabular-nums}
.q-tools{display:flex;flex-direction:column;gap:8px;justify-content:center}
.q-tools button{margin:0;min-width:8.5em}
/* 孩子的答案（選填）：數字鍵盤，除法多一格餘數 */
.ans-row{margin:8px 0}
.ans-row label{display:block;margin:0 0 4px}
.ans-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ans-ctl input{font:inherit;font-size:1.4rem;width:6.5em;padding:6px 10px;font-variant-numeric:tabular-nums}
.ans-ctl button{margin:0}
.ans-msg{margin:6px 0 0;min-height:1.4em}
.ans-msg.bad{color:var(--bad)}
.ans-msg.ok{color:var(--ok)}
.answer{font-size:1.6rem;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin:8px 0}
/* 操作列：貼在畫面最下面，捲到動畫時也按得到。每題都是「答對／答錯」→「下一題」 */
.bar{position:sticky;bottom:0;margin:16px -16px 0;padding:8px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -4px 12px rgba(0,0,0,.12)}
.bar-status{margin:0 0 6px;font-weight:600}
.bar-status .ok{color:var(--ok)}
.bar-status .bad{color:var(--bad)}
.bar-btns{display:flex;gap:12px}
.bar-btns button{flex:1;font-size:1.2rem;padding:12px;margin:0}
.bar-btns button.secondary{flex:0 1 auto;font-size:1rem}
/* 深色主題的 --ok、--bad 是淺色，白字看不清楚，按鈕固定用深色 */
.bar .ok-btn{background:#1e7a3c;border-color:#1e7a3c}
.bar .bad-btn{background:#b3261e;border-color:#b3261e}
.lv-note{margin:12px 0 0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--card)}
@media (max-width:600px){.q-tools{flex-direction:row;flex:1 1 100%}.q-tools button{flex:1;min-width:0}}
/* 自己出一題：兩個數字、四個運算按鈕 */
/* 數字、運算、數字排一行（手機上也是），像一個算式 */
.cu-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;margin:8px 0;max-width:30rem}
.cu-row input{font:inherit;font-size:1.4rem;width:100%;min-width:0;padding:6px 8px;text-align:center;font-variant-numeric:tabular-nums}
.cu-ops{display:flex;gap:4px;border:0;margin:0;padding:0;min-width:0}
.cu-ops label{margin:0}
.cu-ops input{position:absolute;opacity:0;width:1px;height:1px}
.cu-ops span{display:inline-block;min-width:1.9em;text-align:center;font-size:1.3rem;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.cu-ops input:checked+span{background:#1f5fa8;border-color:#1f5fa8;color:#fff}
.cu-ops input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.cu-result .cu-expr{font-size:2rem;font-weight:600;margin:8px 0;font-variant-numeric:tabular-nums}
/* 各級撥珠教法的浮動視窗：整個畫面蓋住，上面一條「回到練習」 */
#guide-ov{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--bg)}
#guide-ov .ov-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--card)}
#guide-ov h2{font-size:1.05rem;margin:0}
#guide-ov button{margin:0}
#guide-ov iframe{flex:1;width:100%;border:0;background:var(--bg)}
button.guide-link{font-size:.95rem;padding:4px 12px;margin:6px 0 0;display:block}
/* 結果：一個手機畫面截得下 */
#result h1{font-size:1.3rem}
.meta{margin:0;color:var(--muted);font-size:.95rem}
.summary{font-size:1.15rem;font-weight:600;margin:8px 0}
#detail{margin:8px 0;padding:8px 8px 8px 2.6em;background:var(--card);border:1px solid var(--line);border-radius:8px;font-size:1rem;line-height:1.5;font-variant-numeric:tabular-nums}
#detail .lv{color:var(--muted);font-size:.85rem}
#detail .ok{color:var(--ok);font-weight:700}
#detail .bad{color:var(--bad);font-weight:700}
@media (min-width:601px){#detail{columns:2;column-gap:2em}#detail li{break-inside:avoid}}
</style>
</head>
<body>
<main>

<!-- ===== 設定 ===== -->
<section id="setup" aria-labelledby="setup-title">
  <h1 id="setup-title">珠算家長版</h1>
  <p class="lead">點老師說的級數，按「開始」。</p>
  <p class="code-row"><label for="code-in">老師給的練習代號（沒有就不用填）</label>
    <span class="code-ctl"><input type="text" id="code-in" autocomplete="off" spellcheck="false" autocapitalize="characters" placeholder="例：C0G8-NWN">
    <button type="button" class="secondary" id="code-apply">套用</button></span></p>
  <p class="hint" id="code-msg" role="status"></p>

  <div class="lv-pick" id="lv-grid" role="group" aria-label="級數（可以選好幾個）"></div>
  <p class="picked" id="picked" aria-live="polite"></p>

  <fieldset id="op-box">
    <legend>加減法的題目</legend>
    <label><input type="radio" name="op" value="+"> 加法</label>
    <label><input type="radio" name="op" value="-"> 減法</label>
    <label><input type="radio" name="op" value="both"> 加減都有</label>
  </fieldset>

  <p id="setup-error" class="feedback bad" role="alert"></p>
  <button type="button" id="start" class="big">開始</button>
  <p><button type="button" class="secondary" id="custom-open">自己出一題（看是第幾級、怎麼撥）</button></p>

  <details class="more">
    <summary>更多設定：名字、題數、題目大小、撥珠方向</summary>
    <label class="stack">孩子的名字（寫在練習紀錄上，可不填）<input type="text" id="student" autocomplete="off"></label>
    <label class="stack">一次練幾題<input type="number" id="count" min="1" max="30" value="10" inputmode="numeric"></label>
    <div id="forms"></div>
    <p class="stack" id="dir-switch"></p>
    <p class="hint">題目大小、撥珠方向請跟老師用的一樣。</p>
  </details>
</section>

<!-- ===== 自己出一題 ===== -->
<section id="custom" hidden aria-labelledby="custom-title">
  <h1 id="custom-title" tabindex="-1">自己出一題</h1>
  <p class="lead">輸入題目，看是第幾級、答案和怎麼撥。例如聯絡簿上的作業題。</p>
  <form id="cu-form" autocomplete="off" novalidate>
    <div class="cu-row">
      <input type="text" id="cu-x" inputmode="numeric" aria-label="第一個數" spellcheck="false">
      <fieldset class="cu-ops"><legend class="sr-only">運算</legend>
        <label><input type="radio" name="cu-op" value="+" checked><span aria-hidden="true">+</span><span class="sr-only">加</span></label>
        <label><input type="radio" name="cu-op" value="-"><span aria-hidden="true">−</span><span class="sr-only">減</span></label>
        <label><input type="radio" name="cu-op" value="×"><span aria-hidden="true">×</span><span class="sr-only">乘</span></label>
        <label><input type="radio" name="cu-op" value="÷"><span aria-hidden="true">÷</span><span class="sr-only">除以</span></label>
      </fieldset>
      <input type="text" id="cu-y" inputmode="numeric" aria-label="第二個數" spellcheck="false">
    </div>
    <button type="submit">看撥法</button>
    <button type="button" class="secondary" id="custom-back">回到設定</button>
  </form>
  <div class="cu-result" id="cu-result" aria-live="polite"></div>
  <div id="cu-demo"></div>
</section>

<!-- ===== 練習 ===== -->
<section id="practice" hidden aria-label="練習">
  <div class="q-row">
    <div id="problem" class="problem" tabindex="-1"></div>
    <div class="q-tools">
      <button type="button" class="secondary" id="show-ans" aria-expanded="false" aria-controls="answer">看答案</button>
      <button type="button" class="secondary" id="show-how" aria-expanded="false" aria-controls="how">看怎麼撥</button>
    </div>
  </div>
  <form class="ans-row" id="ans-form" autocomplete="off" novalidate>
    <label for="ans-q">孩子的答案（可以不填，直接用下面的「答對」「答錯」）</label>
    <span class="ans-ctl"><input type="text" id="ans-q" inputmode="numeric" spellcheck="false">
      <span id="rem-wrap">餘 <input type="text" id="ans-r" inputmode="numeric" spellcheck="false" aria-label="餘數（沒有餘數就空著）" style="width:4.5em"></span>
      <button type="submit">對答案</button></span>
    <p class="ans-msg" id="ans-msg" role="status"></p>
  </form>
  <p id="answer" class="answer" hidden></p>
  <div id="how" hidden>
    <p class="lv-note" id="lv-note"></p>
    <p class="hint" id="jin-tui">說明裡的「進」是珠子往中間的橫木（梁）靠，數就加上去；「退」是珠子離開梁，數就減掉。</p>
    <div id="demo-box"></div>
  </div>
  <p><button type="button" class="secondary" id="quit">結束練習</button></p>
  <div class="bar" role="group" aria-label="這一題的結果">
    <p class="bar-status" id="bar-status" aria-live="polite"></p>
    <div class="bar-btns" id="judge">
      <button type="button" class="ok-btn" id="mark-ok">✓ 答對</button>
      <button type="button" class="bad-btn" id="mark-bad">✗ 答錯</button>
    </div>
    <div class="bar-btns" id="after" hidden>
      <button type="button" class="secondary" id="flip"></button>
      <button type="button" id="next"></button>
    </div>
  </div>
</section>

<!-- ===== 紀錄 ===== -->
<section id="result" hidden aria-labelledby="result-title">
  <h1 id="result-title" tabindex="-1">珠算練習紀錄</h1>
  <p class="meta" id="meta"></p>
  <p class="summary" id="summary"></p>
  <ol id="detail"></ol>
  <p><button type="button" id="copy-rec">複製紀錄</button>
    <button type="button" class="secondary" id="share-rec" hidden>分享紀錄</button>
    <span id="copy-msg" role="status"></span></p>
  <p class="hint">複製後貼到 LINE 傳給老師；文字紀錄報讀軟體念得出來，截圖念不出來。</p>
  <p>
    <button type="button" id="retry-wrong">再練答錯的題目</button>
    <button type="button" class="secondary" id="again">同樣級數再練一次</button>
    <button type="button" class="secondary" id="back">回到設定</button>
  </p>
</section>

</main>
<div id="guide-ov" role="dialog" aria-modal="true" aria-labelledby="guide-ov-title" hidden>
  <div class="ov-bar"><h2 id="guide-ov-title">各級撥珠教法</h2><button type="button" id="guide-close">✕ 回到練習</button></div>
  <iframe id="guide-frame" title="各級撥珠教法"></iframe>
</div>
<script>
const $ = id => document.getElementById(id);
// 家長的手機通常只給一個孩子用：選過的級數、加減法、名字、題數、題目大小記下來，下次打開不用重選
const KEY = 'abacus-parent';
const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
// 舊版存的是 picks（例：['2|+', '3a|-']），換成級數和加減法
if (saved.picks && !saved.levels) {
  saved.levels = [...new Set(saved.picks.map(v => v.split('|')[0]))];
  const ops = new Set(saved.picks.map(v => v.split('|')[1]));
  saved.op = ops.has('+') && ops.has('-') ? 'both' : ops.has('-') ? '-' : '+';
}
// 2026-11-01 九九乘法獨立出來，第 6 級重新編號（舊 6a 九九、6b～6d 變成 6a～6c）
if (saved.levels && !saved.v) saved.levels = saved.levels.map(id => ({ '6a': '九九', '6b': '6a', '6c': '6b', '6d': '6c' })[id] || id);
const chosen = new Set(saved.levels || []);
// 題目大小（abacus-picker.js 的 sizeBox，跟出題練習一樣），放在「更多設定」；舊版存的 forms 不用了
const sizes = AbacusPicker.sizeBox($('forms'), saved.sizes);
function remember() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ v: 2, levels: [...chosen], op: opChoice(), sizes: sizes.get(), student: $('student').value.trim(), count: $('count').value }));
  } catch (e) { /* 存不了就算了 */ }
}

const LEVELS_ = AbacusLevels.LEVELS;
const lvOf = id => LEVELS_.find(l => l.id === id);
const shown = () => LEVELS_.filter(l => AbacusPicker.shownLevel(l.id));
function renderGrid() {
  $('lv-grid').innerHTML = AbacusLevels.GROUPS.map(gr => {
    const lvs = shown().filter(l => AbacusLevels.groupOf(l.id) === gr.key);
    return `<div class="lv-group" role="group" aria-labelledby="lvg-${gr.key}"><h2 id="lvg-${gr.key}">${gr.title}</h2><div class="lv-btns">` +
      lvs.map(l => `<button type="button" data-lv="${l.id}" aria-pressed="${chosen.has(l.id)}" aria-label="${AbacusLevels.lvTag(l.id)}，${l.name}">${l.id}</button>`).join('') +
      '</div></div>';
  }).join('');
  renderPicked();
}
// 選了哪幾級寫出名稱，家長可以跟老師說的對一下
function renderPicked() {
  const list = shown().filter(l => chosen.has(l.id));
  // 在目前的題目大小下出不了題的級數要說出來（例如只勾 20 以內時的 5b）
  const empty = list.filter(l => !levelPicks(l).some(v => { const [lv, op] = v.split('|'); return pool(op, lv).length; }));
  $('picked').textContent = (list.length ? '已選：' + list.map(l => `${l.id} ${l.name}`).join('、') : '還沒有選級數。') +
    (empty.length ? `（${empty.map(l => AbacusLevels.lvTag(l.id)).join('、')}在目前的題目大小沒有題目，請到「更多設定」改題目大小。）` : '');
  // 代號裡每一級的加減法不一樣時，照代號出題，不顯示「加減法的題目」
  $('op-box').hidden = !!codePicks || (list.length > 0 && !list.some(l => l.add || l.sub));
}
$('lv-grid').addEventListener('click', e => {
  const b = e.target.closest('button[data-lv]');
  if (!b) return;
  dropCode();
  const id = b.dataset.lv, on = !chosen.has(id);
  on ? chosen.add(id) : chosen.delete(id);
  b.setAttribute('aria-pressed', on);
  renderPicked();
});
const opChoice = () => (document.querySelector('input[name=op]:checked') || {}).value || '+';
document.querySelector(`input[name=op][value="${saved.op || '+'}"]`).checked = true;

$('forms').addEventListener('change', () => { dropCode(); renderPicked(); });
$('op-box').addEventListener('change', () => { dropCode(); renderPicked(); });
const pool = (op, lv) => AbacusPicker.pool(op, lv, sizes.get());
// 選的級數換成出題用的「級別|運算」：加減法照上面選的，乘法、除法固定
function levelPicks(l) {
  const ops = { '+': ['+'], '-': ['-'], both: ['+', '-'] }[opChoice()];
  return l.mul ? [l.id + '|×'] : l.div ? [l.id + '|÷'] : ops.filter(op => l[op === '+' ? 'add' : 'sub']).map(op => l.id + '|' + op);
}
const picks = () => codePicks || shown().filter(l => chosen.has(l.id)).flatMap(levelPicks);

// ---- 老師給的練習代號（abacus-code.js）----
// codePicks：代號裡每一級的加減法不一樣時，照代號出題（上面的「加減法的題目」用不到）；
// codeSeed：代號有「同一組題目」時，第一次開始用它出題，之後再練就出新的。家長自己改了級數或設定就不用了。
let codePicks = null, codeSeed = null;
function dropCode() {
  if (!codePicks && !codeSeed) return;
  codePicks = codeSeed = null;
  $('code-msg').textContent = '';
  renderPicked();
}
function applyCode(raw) {
  const d = AbacusCode.decode(raw);
  if (d.error) { $('code-msg').textContent = d.error; return; }
  AbacusDir.set(d.high ? 'high' : 'low');
  sizes.set(d.sizes);
  chosen.clear();
  d.picks.forEach(v => chosen.add(v.split('|')[0]));
  // 每一個加減法級數的運算都一樣，就用上面的「加減法的題目」；不一樣就照代號
  const opsOf = lv => d.picks.filter(v => v.startsWith(lv + '|') && /[+-]$/.test(v)).map(v => v.split('|')[1]).join('');
  const addsub = [...chosen].filter(lv => /^[1-5]/.test(lv)).map(opsOf);
  const same = addsub.every(o => o === addsub[0]);
  if (addsub.length && same) document.querySelector(`input[name=op][value="${{ '+': '+', '-': '-', '+-': 'both' }[addsub[0]]}"]`).checked = true;
  codePicks = addsub.length && !same ? d.picks : null;
  $('count').value = Math.min(30, d.count);
  codeSeed = d.seed != null ? d : null;
  renderGrid();
  let note = d.count > 30 ? '家長版一次最多 30 題。' : '';
  if (codeSeed && AbacusCode.fingerprint(d.picks, pool) !== d.fp) note += '網站在老師給代號後更新過，題目可能跟老師的不一樣。';
  $('code-msg').textContent = '已套用老師的設定：' + AbacusCode.describe(d) + '。' + note + '按「開始」就可以練習。';
  remember();
}
$('code-apply').onclick = () => applyCode($('code-in').value);
$('code-in').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); applyCode($('code-in').value); } });

AbacusDir.mount($('dir-switch'));
window.addEventListener('abacusdirchange', renderGrid);
renderGrid();
$('student').value = saved.student || '';
if (saved.count) $('count').value = saved.count;
// 從連結打開（parent.html#代號）：直接套用
if (AbacusCode.fromHash()) { $('code-in').value = AbacusCode.fromHash(); applyCode(AbacusCode.fromHash()); }

let session = null, demo = null;
// 念給孩子聽的算式；除法的答案寫成「商 餘 餘數」
const exprOf = p => `${p.x} ${sym(p.op)} ${p.y} =`;

function start(problems) {
  session = { student: $('student').value.trim(), dir: AbacusPicker.dirHigh() ? '從最高位開始' : '從個位開始', started: new Date(),
    problems: problems.map(p => ({ ...p, ok: null, how: false, tries: [] })), idx: 0 };
  $('setup').hidden = true; $('result').hidden = true; $('practice').hidden = false;
  show();
}
$('start').onclick = () => {
  const ps = picks();
  const count = Math.max(1, Math.min(30, parseInt($('count').value, 10) || 10));
  const problems = codeSeed ? AbacusCode.problemsOf(codeSeed, pool, count) : makeProblems(ps, count, pool);
  codeSeed = null;   // 同一組題目只用一次，再練就出新的
  if (!problems.length) {
    $('setup-error').textContent = ps.length ? '選的級數在目前的題目大小沒有題目，請到「更多設定」改題目大小，或多選幾級。' : '請先點老師說的級數。';
    return;
  }
  $('setup-error').textContent = '';
  remember();
  start(problems);
};

function show() {
  const p = session.problems[session.idx];
  $('problem').textContent = exprOf(p);
  $('answer').textContent = `答案：${ansText(p)}`;
  setOpen('show-ans', 'answer', false);
  setOpen('show-how', 'how', false);
  if (demo) demo.stop();
  $('ans-q').value = $('ans-r').value = '';
  $('ans-msg').textContent = ''; $('ans-msg').className = 'ans-msg';
  $('rem-wrap').hidden = p.op !== '÷';
  renderBar();
  window.scrollTo(0, 0);
  $('problem').focus();
}
// 操作列：還沒判斷時是「答對／答錯」；判斷完顯示結果、「改成答錯（答對）」和「下一題」
function renderBar() {
  const p = session.problems[session.idx], n = session.problems.length, no = `第 ${session.idx + 1} 題`;
  const judged = p.ok !== null;
  $('judge').hidden = judged; $('after').hidden = !judged;
  $('ans-form').hidden = judged;
  if (!judged) { $('bar-status').textContent = `${no}／共 ${n} 題`; return; }
  $('bar-status').innerHTML = p.ok ? `${no}：<span class="ok">答對 ✓</span>`
    : `${no}：<span class="bad">答錯 ✗</span>　正確答案 ${ansText(p)}`;
  $('flip').textContent = p.ok ? '改成答錯' : '改成答對';
  $('next').textContent = session.idx < n - 1 ? '下一題 →' : '看練習紀錄';
}
function setOpen(btnId, boxId, on) {
  $(btnId).setAttribute('aria-expanded', on);
  $(boxId).hidden = !on;
}
$('show-ans').onclick = () => setOpen('show-ans', 'answer', $('answer').hidden);
// 看怎麼撥：各級撥珠教法的同一個動畫和說明，上面加這一級的說明
$('show-how').onclick = () => {
  const open = $('how').hidden;
  setOpen('show-how', 'how', open);
  if (!open) { if (demo) demo.stop(); return; }
  const p = session.problems[session.idx], lv = lvOf(p.lv);
  p.how = true;
  $('lv-note').innerHTML = `${AbacusLevels.lvTag(p.lv)}：${lv.name}。${lv.desc}。` + guideBtn(p.lv);
  $('jin-tui').hidden = p.op === '+' || p.op === '-';
  // 1～4 級小補數分兩步撥，第 5 級以後上珠和下珠一起撥（跟各級撥珠教法一樣）
  const merge = p.lv[0] >= '5';
  if (!demo) demo = AbacusDemo.mount($('demo-box'), { x: p.x, y: p.y, op: p.op, merge, speak: true, autoSay: true, plain: true });
  else demo.show(p.x, p.y, p.op, AbacusDir.get(), merge);
  demo.focus();
  demo.sayIfAuto();
  $('how').scrollIntoView({ block: 'start', behavior: 'smooth' });
};

function next() {
  if (session.idx < session.problems.length - 1) { session.idx++; show(); }
  else showResult();
}
// 答對、答錯都只記下來，一律再按「下一題」才換題；換題前按錯了可以改。
// 答錯時操作列寫出正確答案，可以先看怎麼撥、帶孩子再撥一次
function judge(ok) {
  session.problems[session.idx].ok = ok;
  renderBar();
  $('next').focus();
}
// 對答案：孩子的答案記下來（紀錄裡寫出答過哪些數）。答對就算答對；答錯不說正確答案，可以再撥一次再填，
// 或按「答錯」放棄（這時操作列才寫出正確答案）
const digits = v => v.normalize('NFKC').replace(/\s/g, '');
$('ans-form').onsubmit = e => {
  e.preventDefault();
  const p = session.problems[session.idx], q = digits($('ans-q').value), r = digits($('ans-r').value);
  const msg = $('ans-msg');
  if (!/^\d+$/.test(q) || (r && !/^\d+$/.test(r))) { msg.className = 'ans-msg bad'; msg.textContent = '請輸入數字'; $('ans-q').focus(); return; }
  const said = p.op === '÷' && +r ? `${+q} 餘 ${+r}` : String(+q);
  p.tries.push(said);
  if (+q === calc(p) && (+r || 0) === remOf(p)) { judge(true); return; }
  msg.className = 'ans-msg bad';
  msg.textContent = `${said} 不對。可以請孩子再撥一次，再填一次；或按「看怎麼撥」。`;
  $('ans-q').select();
};
$('mark-ok').onclick = () => judge(true);
$('mark-bad').onclick = () => judge(false);
$('flip').onclick = () => judge(!session.problems[session.idx].ok);
$('next').onclick = next;
$('quit').onclick = () => showResult();

// ---- 紀錄：一個手機畫面截得下 ----
function showResult() {
  if (demo) demo.stop();
  const done = session.problems.filter(p => p.ok !== null);
  const right = done.filter(p => p.ok).length, how = done.filter(p => p.how).length;
  const lvs = [...new Set(done.map(p => `${p.lv} ${{ '+': '加法', '-': '減法', '×': '乘法', '÷': '除法' }[p.op]}`))];
  const d = session.started;
  $('meta').textContent = [session.student, d.toLocaleDateString('zh-TW') + ' ' + d.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }),
    '加減法' + session.dir].filter(Boolean).join('　');
  $('summary').textContent = done.length ? `做了 ${done.length} 題，答對 ${right} 題` + (how ? `，看了撥法 ${how} 題` : '') + `（${lvs.join('、')}）` : '還沒有做題目。';
  // 孩子答錯過的數字寫出來，老師看得出錯在哪一步（例如差 10 是進退位）
  const triedText = p => {
    const wrong = p.tries.filter(t => t !== ansText(p));
    return wrong.length ? (p.ok ? `（先答 ${wrong.join('、')}）` : `（答 ${wrong.join('、')}）`) : '';
  };
  $('detail').innerHTML = done.map(p => `<li>${p.x} ${sym(p.op)} ${p.y} = ${ansText(p)}　` +
    (p.ok ? '<span class="ok">✓ 對</span>' : '<span class="bad">✗ 錯</span>') + triedText(p) + (p.how ? '（看了撥法）' : '') +
    ` <span class="lv">${AbacusLevels.lvTag(p.lv)}</span></li>`).join('');
  $('detail').hidden = !done.length;
  // 文字紀錄（複製、分享用）：跟畫面一樣的內容，一題一行
  recordText = ['珠算練習紀錄', $('meta').textContent, $('summary').textContent,
    ...done.map((p, i) => `${i + 1}. ${p.x} ${sym(p.op)} ${p.y} = ${ansText(p)}　${p.ok ? '✓ 對' : '✗ 錯'}${triedText(p)}${p.how ? '（看了撥法）' : ''}　${AbacusLevels.lvTag(p.lv)}`)].join('\n');
  $('copy-msg').textContent = '';
  $('copy-rec').hidden = !done.length;
  $('share-rec').hidden = !done.length || !navigator.share;
  $('retry-wrong').hidden = !done.some(p => !p.ok);
  $('practice').hidden = true; $('result').hidden = false;
  window.scrollTo(0, 0);
  $('result-title').focus();
}
let recordText = '';
$('copy-rec').onclick = async () => {
  try { await navigator.clipboard.writeText(recordText); $('copy-msg').textContent = '已複製，可以貼到 LINE。'; }
  catch (e) { $('copy-msg').textContent = '沒辦法自動複製，可以按「分享紀錄」，或截圖。'; }
};
$('share-rec').onclick = () => navigator.share({ title: '珠算練習紀錄', text: recordText }).catch(() => {});
const strip = ps => ps.map(({ x, y, op, lv, form }) => ({ x, y, op, lv, form }));
$('retry-wrong').onclick = () => {
  const again = session.problems.filter(p => p.ok === false);
  if (again.length) start(strip(again));
};
$('again').onclick = () => $('start').click();

// ---- 看這一級怎麼教：各級撥珠教法蓋在上面（complement.html?embed=1，動畫預設家長版說法） ----
const guideAnchor = lv => lv === '九九' ? 'kuku' : /^[1-4]/.test(lv) ? 'lv' + lv : lv[0] === '5' ? 'lv' + lv.slice(0, 2) : 'lv' + lv[0];
const guideBtn = lv => `<button type="button" class="secondary guide-link" data-guide="${lv}">${lv === '九九' ? '看九九乘法怎麼教' : `看 ${AbacusLevels.lvTag(lv)}怎麼教`}</button>`;
let guideOpener = null;
function openGuide(lv, from) {
  guideOpener = from;
  if (demo) demo.stop();
  if (cuDemo) cuDemo.stop();
  $('guide-ov-title').textContent = `各級撥珠教法：${AbacusLevels.lvTag(lv)}`;
  $('guide-frame').src = 'complement.html?embed=1#' + guideAnchor(lv);
  $('guide-close').textContent = $('custom').hidden ? '✕ 回到練習' : '✕ 回到自己出一題';
  $('guide-ov').hidden = false;
  document.querySelector('main').inert = true;
  document.body.style.overflow = 'hidden';
  $('guide-close').focus();
}
function closeGuide() {
  if ($('guide-ov').hidden) return;
  $('guide-frame').src = 'about:blank';   // 停掉裡面的動畫和語音
  $('guide-ov').hidden = true;
  document.querySelector('main').inert = false;
  document.body.style.overflow = '';
  if (guideOpener && document.body.contains(guideOpener)) guideOpener.focus();
}
document.addEventListener('click', e => { const b = e.target.closest('[data-guide]'); if (b) openGuide(b.dataset.guide, b); });
$('guide-close').onclick = closeGuide;
$('guide-ov').addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); closeGuide(); } });
// 焦點在視窗裡的教法頁時按 Esc，教法頁會傳訊息過來
window.addEventListener('message', e => { if (e.origin === location.origin && e.data && e.data.type === 'abacus-guide-close') closeGuide(); });

// ---- 自己出一題：看是第幾級、答案和怎麼撥 ----
// 判斷照目前的撥珠方向；不屬於任何一級的題目說原因，動畫照樣可以看；算盤做不了的擋下來
function explain(x, y, op, high) {
  const r = { lv: null, notes: [] };
  const big = n => n > 9999;
  if (op === '-' && y > x) return { block: '答案是負數，算盤上做不了。' };
  if (op === '÷') {
    if (y === 0) return { block: '不能除以 0。' };
    if (x < y) return { block: '被除數比除數小，商是 0，餘數就是被除數，不用撥。' };
    if (y > 99) return { block: '除數三位數以上的撥法還沒整理。' };
  }
  if (op === '×' && !(Math.min(x, y) <= 9 && Math.max(x, y) <= 999 || x <= 999 && y <= 99)) return { block: '乘法目前做到三位數 × 兩位數。' };
  if (big(x) || big(y)) return { block: '數字最多四位數。' };
  if (op === '+' || op === '-') {
    if (y === 0) return { lv: null, notes: [op === '+' ? '加 0，算盤不用動。' : '減 0，算盤不用動。'], nodemo: true };
    r.lv = classify(x, y, op, high);
    if (!r.lv) r.notes.push('這一題的撥法組合不在分級裡，可以看下面的撥法。');
    if (op === '-' && x === y) r.notes.push('答案是 0，練習題裡不會出這種題目。');
    if (y % 10 === 0 && y >= 10) r.notes.push('個位不用撥，只撥十位以上。');
    const f = sizeOf(x, y, op);
    if (f) r.notes.push('題目大小：' + AbacusPicker.formName(f) + '。');
  } else if (op === '×') {
    r.lv = classifyMul(x, y);
    if (r.lv !== '九九' && x < 10 && y >= 10) r.notes.push(`換成 ${y} × ${x} 來撥，答案一樣。`);
    const [a, b] = x < 10 && y >= 10 ? [y, x] : [x, y];
    if (r.lv !== '九九' && !inRange(r.lv, a, b, '×')) r.notes.push(b === 1 ? '× 1 只有九九範圍會出。' : '練習題裡不會出這種大小。');
    else if (r.lv !== '九九') r.notes.push('題目大小：' + AbacusPicker.formName(sizeOf(x, y, op)) + '。');
  } else {
    r.lv = classifyDiv(x, y);
    if (!r.lv) r.notes.push(y === 10 ? '除以 10 不在分級裡，可以看下面的撥法。' : '這一題不在分級裡，可以看下面的撥法。');
    else if (y === 1) r.notes.push('除以 1 練習題裡不會出。');
    else r.notes.push('題目大小：' + AbacusPicker.formName(sizeOf(x, y, op)) + '。');
  }
  return r;
}
let cuDemo = null;
function showCustom() {
  $('setup').hidden = true; $('result').hidden = true; $('practice').hidden = true; $('custom').hidden = false;
  window.scrollTo(0, 0);
  $('custom-title').focus();
}
$('custom-open').onclick = showCustom;
$('custom-back').onclick = () => {
  if (cuDemo) cuDemo.stop();
  $('custom').hidden = true; $('setup').hidden = false; $('custom-open').focus();
};
$('cu-form').onsubmit = e => {
  e.preventDefault();
  const num = v => { const t = v.normalize('NFKC').replace(/\s/g, ''); return /^\d+$/.test(t) ? +t : null; };
  const x = num($('cu-x').value), y = num($('cu-y').value), op = document.querySelector('input[name=cu-op]:checked').value;
  const out = $('cu-result');
  if (cuDemo) cuDemo.stop();
  $('cu-demo').hidden = true;
  if (x === null || y === null) { out.innerHTML = '<p class="feedback bad">請輸入兩個數字。</p>'; return; }
  const high = AbacusPicker.dirHigh(), r = explain(x, y, op, high);
  const expr = `${x} ${sym(op)} ${y}`;
  if (r.block) { out.innerHTML = `<p class="cu-expr">${expr}</p><p class="feedback bad">${r.block}</p>`; return; }
  const p = { x, y, op };
  const lv = r.lv && lvOf(r.lv);
  out.innerHTML = `<p class="cu-expr">${expr} = ${ansText(p)}</p>` +
    (lv ? `<p class="lv-note"><strong>${AbacusLevels.lvTag(r.lv)}：${lv.name}</strong>。${lv.desc}。` +
      (op === '+' || op === '-' ? `（加減法${high ? '從最高位開始' : '從個位開始'}）` : '') + guideBtn(r.lv) + '</p>' : '') +
    r.notes.map(n => `<p class="hint">${n}</p>`).join('');
  if (r.nodemo) return;
  $('cu-demo').hidden = false;
  const merge = !!r.lv && (r.lv[0] >= '5') || op === '×' || op === '÷';
  if (!cuDemo) cuDemo = AbacusDemo.mount($('cu-demo'), { x, y, op, merge, speak: true, autoSay: true, plain: true });
  else cuDemo.show(x, y, op, AbacusDir.get(), merge);
  cuDemo.sayIfAuto();
};
$('back').onclick = () => { $('result').hidden = true; $('setup').hidden = false; $('start').focus(); };
</script>
</body>
</html>
