<style>

@media(prefers-color-scheme:dark){:root{--bg:#1c1c1a;--sf:#2a2a27;--sf2:#232320;--bd:#3a3935;--bd2:#4a4945;--tx:#f0ede6;--tx2:#b0ada6;--tx3:#706d65;--ac:#afa9ec;--ac-bg:#26215c;--ac-md:#7f77dd;--ac-lt:#7f77dd;--teal:#9fe1cb;--teal-bg:#04342c;--teal-md:#1d9e75;--amb:#fac775;--amb-bg:#412402;--amb-md:#ef9f27;--cor:#f0997b;--cor-bg:#4a1b0c;--cor-md:#d85a30;--grn:#c0dd97;--grn-bg:#173404;--grn-md:#639922;}}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding:2rem 1rem 4rem;}
.wrap{max-width:760px;margin:0 auto;}
h1{font-size:1.4rem;font-weight:500;margin-bottom:.2rem;}
.sub{font-size:.8rem;color:var(--tx3);margin-bottom:1.6rem;}
.tabs{display:flex;gap:4px;margin-bottom:1.1rem;}
.tab{padding:6px 22px;border-radius:20px;border:1px solid var(--bd2);background:var(--sf);color:var(--tx2);font-size:.85rem;cursor:pointer;transition:all .14s;font-family:inherit;}
.tab.active{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:500;}

.mlbl{font-size:.75rem;color:var(--tx3);}

.trow{display:flex;align-items:flex-start;gap:1rem;margin-bottom:1.2rem;flex-wrap:wrap;}

.srow2{display:flex;flex-wrap:wrap;gap:5px;align-items:flex-end;margin-bottom:1.1rem;}

.rtitle{font-size:.72rem;font-weight:500;color:var(--tx2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.55rem;}
.rlist{display:flex;flex-direction:column;gap:5px;}

<script>
// ════════════════════════════════════════════════════════════
//  liblouis 包裝層（僅 UEB G2 正向翻譯，供比對用）
// ════════════════════════════════════════════════════════════
const LOU = (() => {
    const M = (typeof liblouisBuild !== 'undefined') ? liblouisBuild : null;
    const loaded = new Set();
    const TABLE_DIR = 'table/';
    const DEPS = {
        'en-ueb-g2.ctb':      ['en-ueb-math.ctb','en-ueb-chardefs.uti','en-ueb-g1.ctb','spaces.uti'],
        'en-ueb-g1.ctb':      ['text_nabcc.dis','en-ueb-chardefs.uti','spaces.uti'],
        'en-ueb-chardefs.uti':['en-chardefs.cti','latinLetterDef6Dots.uti','litdigits6Dots.uti','loweredDigits6Dots.uti'],
    };
    const NABCC = {32:0x2800,97:0x2801,49:0x2802,98:0x2803,39:0x2804,107:0x2805,50:0x2806,108:0x2807,96:0x2808,99:0x2809,105:0x280a,102:0x280b,47:0x280c,109:0x280d,115:0x280e,112:0x280f,34:0x2810,101:0x2811,51:0x2812,104:0x2813,57:0x2814,111:0x2815,54:0x2816,114:0x2817,126:0x2818,100:0x2819,106:0x281a,103:0x281b,62:0x281c,110:0x281d,116:0x281e,113:0x281f,44:0x2820,42:0x2821,53:0x2822,60:0x2823,45:0x2824,117:0x2825,56:0x2826,118:0x2827,46:0x2828,37:0x2829,123:0x282a,36:0x282b,43:0x282c,120:0x282d,33:0x282e,38:0x282f,59:0x2830,58:0x2831,52:0x2832,124:0x2833,48:0x2834,122:0x2835,55:0x2836,40:0x2837,95:0x2838,63:0x2839,119:0x283a,125:0x283b,35:0x283c,121:0x283d,41:0x283e,61:0x283f};

    async function loadFile(name) {
        if (loaded.has(name)) return;
        loaded.add(name);
        try {
            const buf = await (await fetch(TABLE_DIR + name)).arrayBuffer();
            const bytes = new Uint8Array(buf);
            let s = ''; for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
            if (name.endsWith('.ctb') || name.endsWith('.uti')) {
                s = s.split('\n').map(l => {
                    const t = l.trim();
                    return (t.startsWith('seqdelimiter')||t.startsWith('seqbeforechars')||t.startsWith('seqafterchars')||t.startsWith('seqafterexpression')||t.startsWith('seqafterpattern')) ? '# '+l : l;
                }).join('\n');
            }
            try { M.FS.mkdir('/tables'); } catch(e) {}
            M.FS.writeFile('/tables/' + name, s);
        } catch(e) { console.warn('LOU: cannot load', name, e.message); }
        await Promise.all((DEPS[name]||[]).map(loadFile));
    }

    async function translateG2(text) {
        if (!M || !M.calledRun) return null;
        await loadFile('en-ueb-g2.ctb');
        try {
            const n = text.length;
            const inBuf = M._malloc((n+1)*4);
            for (let i = 0; i < n; i++) M.setValue(inBuf+i*4, text.codePointAt(i), 'i32');
            M.setValue(inBuf+n*4, 0, 'i32');
            const outMax = n*4, outBuf = M._malloc((outMax+1)*4);
            const inLp = M._malloc(4), outLp = M._malloc(4);
            M.setValue(inLp, n, 'i32'); M.setValue(outLp, outMax, 'i32');
            const tbl = M.allocate(M.intArrayFromString('/tables/en-ueb-g2.ctb'), 'i8', M.ALLOC_NORMAL);
            const ok = M._lou_translateString(tbl, inBuf, inLp, outBuf, outLp, 0, 0, 0);
            M._free(tbl);
            let result = null;
            if (ok > 0) {
                const len = M.getValue(outLp, 'i32');
                let out = '';
                for (let i = 0; i < len; i++) {
                    const v = M.getValue(outBuf+i*4, 'i32');
                    out += String.fromCharCode(NABCC[v] !== undefined ? NABCC[v] : 0x2800+v);
                }
                result = out;
            }
            M._free(inBuf); M._free(outBuf); M._free(inLp); M._free(outLp);
            return result;
        } catch(e) { console.error('LOU.translateG2:', e); return null; }
    }

    return { translateG2 };
})();

// ════════════════════════════════════════════════════════════
//  UEB G2 轉譯查詢（修補版）
//  E2B: 修正 con/dis/be 邊界、ation/ally final-letter、修正 'and' 編碼
//       補 GL 的 be/in lowword
//  B2E: 動態規劃多候選切分，整詞優先；尾隨標點剝離；大寫終止符
//       替代解讀展示
// ════════════════════════════════════════════════════════════

const UA={a:'\u2801',b:'\u2803',c:'\u2809',d:'\u2819',e:'\u2811',
    f:'\u280b',g:'\u281b',h:'\u2813',i:'\u280a',j:'\u281a',
    k:'\u2805',l:'\u2807',m:'\u280d',n:'\u281d',o:'\u2815',
    p:'\u280f',q:'\u281f',r:'\u2817',s:'\u280e',t:'\u281e',
    u:'\u2825',v:'\u2827',w:'\u283a',x:'\u282d',y:'\u283d',z:'\u2835'};
const UA_REV={};for(const[k,v]of Object.entries(UA))UA_REV[v]=k;
const VOWEL=new Set(['a','e','i','o','u']);
const VOWELY=new Set(['a','e','i','o','u','y']);

const CAP1    ='\u2820';
const CAP_WORD='\u2820\u2820';
const CAP_TERM='\u2820\u2820\u2820';
const END_CAPS='\u2820\u2804';
const G1SYM   ='\u2830';
const G1WORD  ='\u2830\u2830';
const APOS    ='\u2804';

// CTB Dictionary: 從 liblouis en-ueb-g2.ctb 抽取的特殊詞典項
// word: 完整詞匹配；sufword: 詞幹可加後綴；endword/midendword: 結尾匹配

// 判斷 begword (be/con/dis) 是否應該縮寫
// 回傳 true=縮，false=不縮，null=不適用（讓現有規則處理）
function llJudgeBegword(prefix, lwToken, isProper){
    if(!lwToken||!lwToken.startsWith(prefix))return null;
    // 整詞 wordsign（已由 GW_REV 處理）— 此處不重複判斷
    // word 規則命中：看編碼起始
    if(Object.prototype.hasOwnProperty.call(LL_WORD,lwToken)){
        const brl=LL_WORD[lwToken];
        if(prefix==='be')return brl.startsWith(LL_BE);
        if(prefix==='con')return brl.startsWith(LL_CON);
        if(prefix==='dis')return brl.startsWith(LL_DIS);
        return null;
    }
    // empmatchafter (stem 長度由長到短，longest match wins)
    for(const r of LL_EMP){
        if(!r.stem.toLowerCase().startsWith(prefix))continue;
        if(!r.re.test(lwToken))continue;
        if(r.brl==='=')return false;
        if(prefix==='be'&&r.brl.startsWith(LL_BE))return true;
        if(prefix==='con'&&r.brl.startsWith(LL_CON))return true;
        if(prefix==='dis'&&r.brl.startsWith(LL_DIS))return true;
        return false;
    }
    // 沒命中任何 ll 規則 → 回 null 讓 canBegword 啟發式處理
    return null;
}

function dots(br){
    return Array.from(br).map(ch=>{
        const cp=ch.charCodeAt(0)-0x2800;
        if(cp<=0)return'空格';
        const ds=[1,2,3,4,5,6,7,8].filter(d=>cp&(1<<(d-1)));
        return ds.length?'點'+ds.join(''):'空格';
    }).join('－');
}

function canBegword(prefix,rest,isProper){
    if(!rest||rest.length<1)return false;
    // 嘗試用 liblouis oracle 規則（word + empmatchafter）做高精度判斷
    // lwToken = prefix + rest（rest 已是 lowercase）
    const lwToken=prefix+rest;
    const llRes=llJudgeBegword(prefix,lwToken,isProper);
    if(llRes!==null)return llRes;
    // 沒命中 LL_EMP/LL_WORD 規則 → 採白名單策略
    // ctb 對 be/con/dis 三前綴：列入規則才縮，沒列的不縮
    // 我們的 LL_EMP 涵蓋大量 be/con/dis 後接字母組合，沒命中表示「未被 oracle 標為縮」
    if(prefix==='be'||prefix==='con'||prefix==='dis'){
        // 三大前綴一律走白名單（包括 proper noun）
        return false;
    }
    // 其他前綴用啟發式
    return /[aeiouy]/.test(rest);
}

function translateWord(lw,isProper,isAllUpper,isContinuation,suppressWordsign){
    const total=lw.length,segs=[];

    // CTB Match 規則：在 token 中尋找 stem + 後接 pattern 的匹配
    // 命中後，把 stem 段編碼用字典指定的 brl 替換，剩下部分遞迴正常翻譯
    // 例：aesthete = 含 esthe[STst][EIei] → esthe 段用 ⠑⠎⠮ (e+s+the)
    //     aero + F/W → aero 段不縮 (拼字母)
    for(const r of LL_MATCH){
        const m=lw.match(r.re);
        if(!m||m.index===undefined)continue;
        const matchStart=m.index;
        const stemLen=r.stem.length;
        const matchedStem=lw.slice(matchStart,matchStart+stemLen);
        if(matchedStem!==r.stem)continue;  // 確認 stem 一致
        // 前段 [0, matchStart) 用正常翻譯
        // stem 段 [matchStart, matchStart+stemLen) 用字典 brl 或字母
        // 後段 [matchStart+stemLen, ...] 用正常翻譯
        const prefix=lw.slice(0,matchStart);
        const suffix=lw.slice(matchStart+stemLen);
        const rPre=prefix?translateWord(prefix,isProper,isAllUpper,isContinuation):{br:'',segs:[]};
        let stemBr,stemSegs;
        if(r.isAlpha){
            // 字母拼字
            stemBr='';
            stemSegs=[];
            for(const ch of r.stem){
                const b=UA[ch]||ch;
                stemSegs.push({en:ch,br:b,cat:'alpha'});stemBr+=b;
            }
        }else{
            stemBr=r.brl;
            stemSegs=[{en:r.stem,br:r.brl,cat:'dict'}];
        }
        const rSuf=suffix?translateWord(suffix,false,isAllUpper,true):{br:'',segs:[]};
        return{br:rPre.br+stemBr+rSuf.br,segs:[...rPre.segs,...stemSegs,...rSuf.segs]};
    }

    // 0. CTB_SUFWORD 整詞匹配（cation/baronet/colonel 等字典項）
    // 這些在 ctb 中是 sufword 規則：token 開頭是 stem + 任意後綴
    // 必須在 LL_MATCH_SUF (tion/oner) 等規則之前處理
    if(!isContinuation){
        for(let sLen=Math.min(total,15);sLen>=4;sLen--){
            const stem=lw.slice(0,sLen);
            if(!Object.prototype.hasOwnProperty.call(CTB_SUFWORD,stem))continue;
            const rest=lw.slice(sLen);
            const val=CTB_SUFWORD[stem];
            if(val==='='){
                let br='';
                for(const ch of stem){
                    const b=UA[ch]||ch;
                    segs.push({en:ch,br:b,cat:'alpha'});br+=b;
                }
                // rest 走正常遞迴翻譯（允許 ic/cy/ter 等接後綴 contractions）
                if(rest){
                    const rSuf=translateWord(rest,false,isAllUpper,true);
                    return{br:br+rSuf.br,segs:[...segs,...rSuf.segs]};
                }
                return{br,segs};
            }else{
                segs.push({en:stem,br:val,cat:'dict'});
                if(rest){
                    const rSuf=translateWord(rest,false,isAllUpper,true);
                    return{br:val+rSuf.br,segs:[...segs,...rSuf.segs]};
                }
                return{br:val,segs};
            }
        }
    }

    // GA 整字匹配（question/through/cannot 等多字母 strong groupsign 整字）
    // 必須在 LL_MATCH_SUF 之前，否則 stion suffix 會把 question 拆開
    if(Object.prototype.hasOwnProperty.call(GA,lw)){
        const br=GA[lw];
        segs.push({en:lw,br,cat:'always'});
        return{br,segs};
    }

    // CTB Match Suffix 規則（match %a STEM -）
    // 處理字尾/中段 context-aware 規則：stion/oned/oner/ghead/thead 等
    // ctb 順序：這些 match 規則在 always th/st/gh/sh/wh/ed 之前
    // 規則語意：token 中含 STEM（前面至少一字母）→ stem 段用該 brl
    // CTB Match Suffix 規則（match %a STEM AFTER DOTS）
    // 處理字尾/中段 context-aware 規則：stion/oned/ghead/ghear[t]/oness 等
    // ctb 順序：這些 match 規則在 always th/st/gh/sh/wh/ed 之前
    // 規則語意：token 中含 STEM（前面至少一字母） + 後接 AFTER pattern → stem 段用該 brl
    // r.t: 'any' (after 無限制) | 'boundary' (必須 token 邊界) | 'pattern' (字母 regex)
    // 排除：與 GME 重複的單獨 final-letter 字母組（ness/ment 等，已由 GME 處理）
    // 但保留 tion/sion 等：它們需要在 one* 規則之前優先處理（auctioneer/bastion）
    // 排除：GM 規則 (bb/cc/ff/gg/ea) 已由 GM 處理
    const FINAL_LETTER_RULES=new Set(['ance','ence','ful','ity','less','ment','ness','ong','ound','ount']);
    // ong/ound/ount 只在字尾才有意義（congestion 裡的 ong 不應阻擋 stion）
    const FINAL_LETTER_TAILONLY=new Set(['ong','ound','ount']);
    const GM_RULES=new Set(['bb','cc','ff','gg','ea']);
    {
        // 先找出 token 中最早出現的 final-letter 位置（用於阻止 LL_MATCH_SUF 越過此位置應用）
        // 例：conditioner 中 'tion' 在位置 4，不能讓 'oner' (位置 7) 搶先處理
        let earliestFinal=Infinity;
        for(const flr of FINAL_LETTER_RULES){
            const idx=lw.indexOf(flr);
            if(idx<1)continue;
            // ong/ound/ount 只在字尾才構成縮寫屏障
            if(FINAL_LETTER_TAILONLY.has(flr)&&idx+flr.length!==total)continue;
            if(idx<earliestFinal)earliestFinal=idx;
        }
        
        let bestM=null,bestPos=Infinity;
        for(const r of LL_MATCH_SUF){
            if(FINAL_LETTER_RULES.has(r.s))continue;
            if(GM_RULES.has(r.s))continue;
            const idx=lw.indexOf(r.s);
            if(idx<1)continue;
            // g 開頭的 match 規則（ghous/ghorn/ghead 等）：
            // 若前一字是 n（構成 ong+h 結構），不應觸發（ong 不縮時 g 屬於 ong）
            if(r.s[0]==='g'&&lw[idx-1]==='n')continue;
            const stemEnd=idx+r.s.length;
            const after=lw.slice(stemEnd);
            // 依 after type 驗證
            if(r.t==='boundary'){
                // 必須 token 邊界，且後接內容須匹配 mandatoryRe（可為空）
                // 即 (mandatoryRe) + token end
                const mre=r.m||'';
                if(!mre){
                    // 純邊界 - 必須 token 結束
                    if(after!=='')continue;
                } else {
                    try{
                        // mre + end-of-string
                        const re=new RegExp('^'+mre+'$','i');
                        if(!re.test(after))continue;
                    }catch(e){continue;}
                }
            } else if(r.t==='pattern'){
                try{
                    const re=new RegExp('^'+r.r,'i');
                    if(!re.test(after))continue;
                }catch(e){continue;}
            }
            // 'any' 無限制
            if(idx<bestPos){
                bestM=r;bestPos=idx;
            }
        }
        if(bestM&&bestPos<earliestFinal){
            const stemStart=bestPos;
            const stemEnd=bestPos+bestM.s.length;
            const prefix=lw.slice(0,stemStart);
            const suffix=lw.slice(stemEnd);
            const rPre=prefix?translateWord(prefix,isProper,isAllUpper,false,true):{br:'',segs:[]};
            let stemBr,stemSegs;
            if(bestM.i){
                stemBr='';stemSegs=[];
                for(const ch of bestM.s){
                    const b=UA[ch]||ch;
                    stemSegs.push({en:ch,br:b,cat:'alpha'});stemBr+=b;
                }
            }else{
                stemBr=bestM.b;
                // LL_MATCH_SUF 規則（sion/tion/ance/ence 等後綴）→ midend
                // LL_MATCH 規則（stem pattern）→ dict
                const isFinalLetter=new Set(['tion','sion','ance','ence','ful','ity','less','ment','ness','ong','ound','ount']).has(bestM.s);
                stemSegs=[{en:bestM.s,br:bestM.b,cat:isFinalLetter?'midend':'dict'}];
            }
            const rSuf=suffix?translateWord(suffix,false,isAllUpper,true):{br:'',segs:[]};
            return{br:rPre.br+stemBr+rSuf.br,segs:[...rPre.segs,...stemSegs,...rSuf.segs]};
        }
    }

    // CTB Dictionary 優先查找（liblouis en-ueb-g2.ctb 中的特殊規則）

    // 1. endword: token 結尾匹配 → 該段強制用字母拼字
    // 例：Annamese (ends in 'namese') → 不縮 name
    //     Indonesian (ends in 'namesian') → 不縮 name
    // 處理方式：translate token 前段，然後字尾用字母拼
    for(const[end,val] of Object.entries(CTB_ENDWORD)){
        if(lw.length>end.length&&lw.endsWith(end)){
            const prefix=lw.slice(0,lw.length-end.length);
            // prefix 部分用正常翻譯（遞迴）
            const rPre=translateWord(prefix,isProper,isAllUpper,isContinuation);
            // 字尾用字母拼字（無論 val 是 '=' 或 brl，都當作字母）
            let endBr='';
            const endSegs=[];
            for(const ch of end){
                const b=UA[ch]||ch;
                endSegs.push({en:ch,br:b,cat:'alpha'});endBr+=b;
            }
            return{br:rPre.br+endBr,segs:[...rPre.segs,...endSegs]};
        }
    }

    // 2. word: 完整詞匹配（lowercase token === en）— 但不在 continuation 中（即非 token 中段）
    if(!isContinuation&&!suppressWordsign&&Object.prototype.hasOwnProperty.call(CTB_WORD,lw)){
        const val=CTB_WORD[lw];
        if(val==='='){
            // 字典指定此詞不縮，逐字拼字母
            let br='';
            for(const ch of lw){
                const b=UA[ch]||ch;
                segs.push({en:ch,br:b,cat:'alpha'});br+=b;
            }
            return{br,segs};
        }else{
            // 用字典指定的 brl，整詞當作一個 shortform-like 段
            segs.push({en:lw,br:val,cat:'dict'});
            return{br:val,segs};
        }
    }
    // 2. sufword: token 開頭是 stem，後接基本 suffix（e/s/es/ed/er/ers/ing/ings/ly/y）
    // 例：cofeature = cofeatur (sufword) + e
    //     cofeaturing = cofeatur + ing
    const SUFFIXES=['ings','ers','ed','es','er','ly','ing','s','e','y',''];
    for(let sLen=Math.min(total,15);sLen>=3;sLen--){
        const stem=lw.slice(0,sLen);
        if(!Object.prototype.hasOwnProperty.call(CTB_SUFWORD,stem))continue;
        const rest=lw.slice(sLen);
        // rest 必須是允許後綴之一
        if(!SUFFIXES.includes(rest))continue;
        const val=CTB_SUFWORD[stem];
        if(val==='='){
            // 字典指定不縮，stem 部分拼字母
            let br='';
            for(const ch of stem){
                const b=UA[ch]||ch;
                segs.push({en:ch,br:b,cat:'alpha'});br+=b;
            }
            // rest 用字母拼
            for(const ch of rest){
                const b=UA[ch]||ch;
                segs.push({en:ch,br:b,cat:'alpha'});br+=b;
            }
            return{br,segs};
        }else{
            // stem 用字典 brl + rest 用字母拼
            segs.push({en:stem,br:val,cat:'dict'});
            let br=val;
            for(const ch of rest){
                const b=UA[ch]||ch;
                segs.push({en:ch,br:b,cat:'alpha'});br+=b;
            }
            return{br,segs};
        }
    }

    // 常見複合/前綴邊界（單詞前 N 個字母為已知前綴）— 用於避免 strong groupsigns 跨界誤用
    // 按長度從長到短排序：避免 'un' 在 'underpaid' 中搶先匹配（應該整段是 'under'+ 'paid'）
    const PREFIXES=['under','over','non','off','out','mis','un','re','up'];
    let prefixEnd=-1;
    // 若整詞本身就是 GA shortword（如 'under'）→ 跳過 prefix 拆解
    const wholeIsGA=Object.keys(GA).some(k=>k===lw);
    if(!wholeIsGA){
        for(const p of PREFIXES){
            if(lw.startsWith(p)&&lw.length>p.length+1&&!VOWELY.has(lw[p.length])){
                prefixEnd=p.length;break;
            }
        }
    }

    if(!isContinuation&&!suppressWordsign){
        if(Object.prototype.hasOwnProperty.call(GL,lw)){segs.push({en:lw,br:GL[lw],cat:'lowword'});return{br:GL[lw],segs};}
        if(Object.prototype.hasOwnProperty.call(GW,lw)){
            const cat=lw.length<=3&&GW[lw].length===1?'word':'shortform';
            segs.push({en:lw,br:GW[lw],cat});return{br:GW[lw],segs};
        }
    }
    // shortform + s 規則：根字是 shortform 時可加 s（如 besides=beside+s, almosts=almost+s）
    // 例外：about, almost, him 不可加 s
    const SHORTFORM_NO_S=new Set(['about','almost','him']);
    if(lw.endsWith('s')&&lw.length>2){
        const root=lw.slice(0,-1);
        if(Object.prototype.hasOwnProperty.call(GW,root)&&!SHORTFORM_NO_S.has(root)&&GW[root].length>=2){
            const cat='shortform';
            segs.push({en:root,br:GW[root],cat});
            segs.push({en:'s',br:UA.s,cat:'alpha'});
            return{br:GW[root]+UA.s,segs};
        }
    }

    // 複合詞前綴：lw 開頭匹配 GW 多格 shortform，且後綴可獨立解析
    // UEB §10.9: after/above/before/below/between 等多格 GW shortform 可作字首複合詞
    // 例：afterbirth = after + birth → ⠁⠋⠃⠊⠗⠹
    //     aboveboard = above + board → ⠁⠃⠧⠃⠕⠜⠙
    //     belowdecks = below + decks → ⠆⠇⠙⠑⠉⠅⠎
    //     aforesaid = afore + said → ⠁⠿⠑⠎⠙ (afore = a+for+e，需特別處理)
    // 白名單：UEB 規定可作複合詞前綴的多格 GW shortform
    const GW_COMPOUND_PREFIXES=['after','above','before','behind','below','beneath','beside','between','beyond'];
    for(const pre of GW_COMPOUND_PREFIXES){
        if(pre.length>=lw.length)continue;
        if(!lw.startsWith(pre))continue;
        if(!GW[pre])continue;  // safety: 確保 GW 表中有此 prefix 的 brl
        const rest=lw.slice(pre.length);
        if(rest.length<2)continue;  // 後綴需 ≥2 字符（避免短詞誤觸發）
        // UEB 規則：複合詞前綴只在後綴**子音字頭**時使用
        // 例：after+birth (af+birth) → 縮，但 after+effect → 不縮（拼 aft+er+effect）
        // 因為後綴元音字頭會跨音節邊界
        if('aeiouy'.includes(rest[0]))continue;
        // 後綴解析（遞迴，但 isProper=false，因為是複合詞中段）
        const rRest=translateWord(rest,false);
        // 整體編碼
        const preBr=GW[pre];
        const cat='shortform';
        segs.push({en:pre,br:preBr,cat});
        segs.push(...rRest.segs);
        return{br:preBr+rRest.br,segs};
    }
    // afore 是特例：afore = a + for + e，雖然不是 GW 表中的 shortform，但 oracle 把它當複合詞前綴
    // 例：aforesaid = afore + said = ⠁⠿⠑⠎⠙, aforethought = afore + thought
    if(lw.startsWith('afore')&&lw.length>5){
        const rest=lw.slice(5);
        if(rest.length>=2){
            const rRest=translateWord(rest,false);
            // afore 編碼 = a + for + e = ⠁⠿⠑
            const aforeBr='\u2801\u283f\u2811';
            segs.push({en:'afore',br:aforeBr,cat:'shortform'});
            segs.push(...rRest.segs);
            return{br:aforeBr+rRest.br,segs};
        }
    }

    let result='',i=0;
    while(i<total){
        const isS=(i===0);

        // shortform 匹配（字首或字中皆可）
        // - 嚴格組 (first/letter/little)：只在字首位置且後接非母音/y
        // - 其他 (must/immediate/necessary/...)：寬鬆（後可接 y/ed 等）
        if(total>2){
            let used=false;
            for(const[sf,br]of SFXP){
                if(lw.startsWith(sf,i)){
                    const after=lw[i+sf.length];
                    const atStart=(i===0);
                    const atEnd=(i+sf.length===total);
                    if(SFXP_STRICT.has(sf)){
                        // 嚴格：字首位置或字尾位置（i+sf.length===total，整詞結束）
                        if(!atStart&&!atEnd)continue;
                        // 字首位置：後接母音/y 時，整詞必須在 extension whitelist 才允許
                        if(atStart&&after&&SFXP_VOWEL.has(after)){
                            const wl=SFXP_VOWEL_OK[sf];
                            if(!wl||!wl.has(lw))continue;
                        }
                        // 字尾位置：必須整詞在 SFXP_SUFFIX_OK whitelist 內
                        // 避免 purblind→p+u+r+blind, greatness→g+r+great+ness 等過度縮寫
                        if(!atStart&&atEnd){
                            const wl=SFXP_SUFFIX_OK[sf];
                            if(!wl||!wl.has(lw))continue;
                        }
                    }else if(SFXP_UNRESTRICTED.has(sf)){
                        // great/braille: wherever it occurs
                        // children: provided not followed by vowel/y
                        if(sf==='children'&&after&&SFXP_VOWEL.has(after))continue;
                    }else{
                        // 非嚴格 shortform：字首位置如果後接母音/y，
                        // 要求整詞在 whitelist 內才允許
                        if(atStart&&after&&SFXP_VOWEL.has(after)){
                            const wl=SFXP_VOWEL_OK[sf];
                            if(!wl||!wl.has(lw))continue;
                        }
                        // 字中位置 (非字首非字尾)：不可使用
                        if(!atStart&&!atEnd)continue;
                    }
                    // 通過條件，使用
                    segs.push({en:sf,br,cat:'shortform'});result+=br;i+=sf.length;used=true;break;
                }
            }
            if(used)continue;
        }

        const aAll=Object.keys(GA).filter(k=>lw.startsWith(k,i)).sort((a,b)=>b.length-a.length);
        let aBest=null;
        for(const k of aAll){
            const ac=lw[i+k.length]||'',bc=i>0?lw[i-1]:'';
            // 全大寫 + token 本身 = always strong groupsign (AR, CH, SH, TH, GH, ST, WH)
            // → 不縮（UEB §10.7.5）；保留為字母拼字
            // 但 wordsigns (THE, AND, FOR, OF, WITH) 在全大寫時仍縮
            const STRONG_2L=new Set(['ar','ch','sh','th','gh','st','wh']);
            if(isAllUpper&&i===0&&k===lw&&STRONG_2L.has(k))continue;
            if(k==='here'){
                const s=lw.slice(i+k.length);
                if(s[0]==='s'&&'iy'.includes(s[1]||''))continue;
                if(s.startsWith('tic'))continue;
                // here 在字中（非字頭非字尾）且前是子音 → 跨字根，不縮
                // 例：adherence (a-d-h-er-ence) here 不縮；但 adhere (字尾) 縮
                //     atmosphere (字尾) 縮；但 atmospheric? — 看下面
                if(i>0&&i+k.length<total&&bc&&!'aeiouy'.includes(bc))continue;
            }
            if(k==='ever'){
                if(bc==='e'||bc==='i')continue;
                // ever 後接 'e' 在普通字（非 proper noun）中不縮（severe, revere, reverberate, believer）
                // 但 proper noun 中 ever+e 仍縮（Devereux, Everett, Beverley）
                if(ac==='e'&&!isProper)continue;
            }
            if(k==='mother'&&bc==='e')continue;
            if(k==='gh'){
                if(bc==='n')continue; // ng+h：ong 不縮時 g 屬於 ong，gh 不應縮
                const ghAfter=lw.slice(i+2);
                if(ghAfter.startsWith('ood')||ghAfter.startsWith('ouse'))continue; // g+hood/g+house 複合詞邊界
            }
            if(k==='st'){
                // sth 模式：UEB 規則優先 s + th，而非 st + h（特定字根）
                // 希臘字根 aesth/anesth/asthm → 縮 th 而非 st
                // 例：aesthete, anesthesia, asthma, asthmatic
                // 但 asthenia/asthenosphere (希臘 ἀσθένεια 不同字根) 縮 st
                if(lw[i+2]==='h'){
                    // 檢查字頭是否為這三個希臘字根
                    if(lw.startsWith('aesth')&&i===1)continue;
                    if(lw.startsWith('anesth')&&i===2)continue;
                    if(lw.startsWith('asthm')&&i===1)continue;
                }
                // Proper noun + st 後接 town 系列 (Cookstown, Cooperstown) → 不縮（複合詞）
                if(isProper&&i>0&&lw.slice(i,i+5)==='stown')continue;
                if(isProper&&i>0&&lw.slice(i,i+5)==='stag')continue;  // Bundestag
            }
            if(k==='th'){
                // th 前是 s 時，正常情況優先 st + h（s 走 alpha + th 走縮寫）
                // 但希臘字根 aesth/anesth/asthm → th 縮，st 不縮（i.e. s+th 路徑）
                if(bc==='s'){
                    // 例外：aesth/anesth/asthm 系列允許 th 縮
                    const isGreek=(lw.startsWith('aesth')&&i===2)
                                ||(lw.startsWith('anesth')&&i===3)
                                ||(lw.startsWith('asthm')&&i===2);
                    if(!isGreek)continue;
                }
                // -thood/-thouse 等複合詞：t-h 跨字根邊界，不縮 th
                // 例：adulthood (adult+hood), boathouse (boat+house), boyhood, motherhood
                const after=lw.slice(i+k.length);
                if(after.startsWith('ood')||after.startsWith('ouse'))continue;
            }
            if(k==='one'){
                if(bc==='o')continue;
                if(ac==='d'||ac==='r')continue;
                // one+n 規則：要看後面是不是構成 oness 字尾(baroness 系列) 
                // 或 token 中含 oness 子串
                if(ac==='n'){
                    // 看 token 後續是否會形成 oness pattern (b-a-r-oness)
                    // 即 one + n + e + s + s 子序列
                    const after=lw.slice(i+k.length);  // 'one' 之後的部分
                    // 'one' + 'ness' 字串 → oness 模式（baroness）
                    // 但 'one' + 'nes' + 其他 → 不算 (aloneness 是 one+n+ess - 不對等等)
                    // aloneness 中 'one' at i=2, 之後是 'ness' — 也是 'ness' 結尾
                    // 但 oracle 對 aloneness 縮 one，對 baroness 不縮 one
                    // 差別：i+k.length 後接 'ness' 的位置 — baroness: i=3, 之後 'ness'；aloneness: i=2, 之後 'ness'
                    // 兩者都是 one+ness 結構... 但 oracle 行為不同。實際上：
                    // baroness 含 oness 子串 (從 i=3 開始：oness)
                    // aloneness 含 'one' 子串 (從 i=2)，但沒有 oness 子串(因為 i+3='n', i+4='e', i+5='s', i+6='s' — 等等)
                    // a-l-o-n-e-n-e-s-s: 從 i=2 取 5 字 = o-n-e-n-e ≠ oness
                    // 從 i=3 取 5 字 = n-e-n-e-s ≠ oness
                    // 所以 aloneness 不含 oness! 那為什麼前面 lookup 沒匹配？
                    // baroness 含 oness 子串: 從 i=3 取 = o-n-e-s-s = oness ✓
                    // 結論：要看 i+5 是否為 's'，也就是 lw[i+3]='n' lw[i+4]='e' lw[i+5]='s'
                    // 對 aloneness: i=2, lw[5]='n', lw[6]='e' — 不是 'e'+'s' 結構
                    // 對 baroness: i=3, lw[6]='s' (i+3=6=s)
                    // 改寫條件：one + n 且 token 中含 oness 子串才不縮
                    if(lw.includes('oness'))continue;
                    // 否則 one+n 通常仍縮 (aloneness, oneness, etc)
                }
                // 從 liblouis oracle 學到：one 後接元音 (a/e/i/o/u) 表示跨音節，不縮
                if(ac&&'aeiou'.includes(ac))continue;
                // one + s + 元音 → 跨音節 (Cantonese, Aragonese, Indonesian)
                const ac2=lw[i+k.length+1]||'';
                if(ac==='s'&&ac2&&'aeiou'.includes(ac2))continue;
                // one 後接 g/l/t/c + 元音/字尾 也常跨音節（Conestoga, Colonel）
                if(ac&&(ac==='g'||ac==='l'||ac==='t'||ac==='c')&&(!ac2||'aeiou'.includes(ac2)))continue;
                // Proper noun + one 字中且後接元音 → 跨音節，不縮（已有上面元音規則處理）
                // 但若後接子音(m/k/c/g/l/r/n/d/t) → 通常 one 是穩固音節，仍可縮 (Atonement, Ballymoney)
                // 故不在這加額外條件
                // Proper noun + one 字尾規則：
                // - 縮：one 前是普通子音（Capone, Malone, Corleone, Tyrone, Simone）
                // - 不縮：one 前是元音字母（Alcyone=y, Dione=i, Antigone=g 但前 i）
                //         或 one 前是 ph/sh/ch/th 雙字音（Persephone, Shoshone）
                if(isProper&&i>0&&!ac){
                    const bc2=i>=2?lw[i-2]:'';
                    // 前一字是元音字母 → 不縮（跨音節）
                    if(bc&&'aeiouy'.includes(bc))continue;
                    // 前一字是 h，且前兩字是 ph/sh/ch/th → 不縮（雙字音 ph-one）
                    if(bc==='h'&&['p','s','c','t'].includes(bc2))continue;
                    // 其他：one 前是穩固子音 → 縮（Capone, Malone）
                }
            }
            if(k==='under'){
                if(bc==='a'||bc==='o')continue;
                if(i===0&&lw.startsWith('un')&&total>5&&!lw.startsWith('under'))continue;
            }
            if(k==='had'&&i===0&&ac==='r')continue;
            // strong-shortform 'there'/'those' 在 token 內部（i>0）需前接非字母。
            // ctb: `nofor always there/those` 表示在 e2b 中間不適用 anywhere；
            // 改由 match 規則 `^|!%a there - ` 處理（前面非字母才縮）。
            // 防 ditherer/bothered/gatherer 等被誤縮 there。
            if((k==='there'||k==='those')&&i>0&&bc&&/[a-z]/i.test(bc))continue;
            // 跨前綴邊界禁用：strong groupsign 不可從前綴內跨入主幹
            // 例外：st/sh/th/wh/gh/ch/ar/er/ou/ow 等雙字母 always groupsign liblouis 允許跨界
            const ALLOW_CROSS_PREFIX=new Set(['st','sh','th','wh','gh','ch','ar','er','ed']);
            if(prefixEnd>0&&i<prefixEnd&&i+k.length>prefixEnd&&!ALLOW_CROSS_PREFIX.has(k))continue;
            // ou 跨前綴邊界：若 o 是前綴最後一字（pro-union: pro 以 o 結尾）→ 不縮
            // 但 re-outfit: e 結尾，ou 整個在詞根 → 縮
            if(k==='ou'&&prefixEnd>0&&i===prefixEnd-1&&lw[prefixEnd-1]==='o')continue;
            if(k==='ou'&&!isS){
                const lm=Object.keys(GME).find(m=>lw.startsWith(m,i)&&m.startsWith('ou')&&m.length>2);
                if(lm)continue;
            }
            aBest=k;break;
        }
        if(aBest){segs.push({en:aBest,br:GA[aBest],cat:'always'});result+=GA[aBest];i+=aBest.length;continue;}

        let best=null,bLen=0,bBr='',bCat='';
        for(const k of Object.keys(GN)){
            if(lw.startsWith(k,i)&&k.length>bLen){
                // lookahead：若從 i 起 GME 縮寫（如 ing）更長更好，讓位
                // 例：bobbing 應走 b+o+bb+ing (GME)，不走 b+o+bb+in+g (GN)
                let yieldToGME=false;
                for(const mk of Object.keys(GME)){
                    if(lw.startsWith(mk,i)&&mk.length>k.length){
                        // GME 只在字尾才強制讓位（ing/tion 等後綴）
                        // 字中出現（如 ingest 的 ing）不讓位，讓 in 正常縮
                        if(i+mk.length===total){yieldToGME=true;break;}
                    }
                }
                if(yieldToGME)continue;
                // lookahead：若保留 lw[i] 為字母、從 i+1 起能形成 GA 縮寫，則讓位
                let yieldToAlways=false;
                for(const ak of Object.keys(GA)){
                    if(lw.startsWith(ak,i+1)&&GA[ak].length>=2){
                        // 只對 strong groupsigns (2 格以上) 讓位，避免被 ar/er 等單格小縮寫亂搶
                        yieldToAlways=true;break;
                    }
                }
                if(yieldToAlways)continue;
                // lookahead：若保留 lw[i] 為字母、從 i+1 起能形成 GME 字尾縮寫，則讓位
                // 例：abrasiveness → 不縮 en，保留 e 後接 ness
                // 例：station → 不縮 anywhere `at`，保留 a 後接 tion
                // ctb 規則：ness/ment/tion 等 final-letter contractions 即使中段也適用
                // 例：businessman → bu+s+i+ness+man (i 後接 ness 即使後面還有 man 也縮 ness)
                // 但 GA 縮寫 (>=2 cells) 仍只在字尾 yield
                let yieldToFinal=false;
                const FINAL_MIDEND=new Set(['ness','ment','tion','sion','ence','ance','ound','ount','less','ful','ity','ong']);
                for(const mk of Object.keys(GME)){
                    if(lw.startsWith(mk,i+1)){
                        // 'ness' 等 final-letter 允許中段
                        if(FINAL_MIDEND.has(mk)){yieldToFinal=true;break;}
                        // 其他 GME (ing) 仍只在字尾
                        if(i+1+mk.length===total){yieldToFinal=true;break;}
                    }
                }
                if(yieldToFinal)continue;
                bCat='anywhere';bLen=k.length;bBr=GN[k];best=k;
            }
        }

        if(isS&&!isContinuation){
            for(const k of Object.keys(GB)){
                if(lw.startsWith(k,i)&&i+k.length<total&&k.length>bLen){
                    const rest=lw.slice(i+k.length);
                    if(!canBegword(k,rest,isProper))continue;
                    bCat='begword';bLen=k.length;bBr=GB[k];best=k;
                }
            }
        }

        if(!isS||isContinuation){
            for(const k of Object.keys(GM)){
                if(lw.startsWith(k,i)&&i+k.length<total&&k.length>bLen){
                    // ea 特殊規則：在 ear 字串中，ar 永遠優先（bear, bearing, tear, tearing...）
                    // 不縮 ea，走 e + ar 路線
                    if(k==='ea'&&lw[i+2]==='r'){
                        continue;
                    }
                    // 其他 lower groupsigns: lookahead 若下一格能形成 always 縮寫則放棄
                    if(k!=='ea'){
                        let yieldToAlways=false;
                        for(const ak of Object.keys(GA)){
                            if(lw.startsWith(ak,i+1)){yieldToAlways=true;break;}
                        }
                        if(yieldToAlways)continue;
                    }
                    bCat='midword';bLen=k.length;bBr=GM[k];best=k;
                }
            }
            for(const k of Object.keys(GME)){
                if(lw.startsWith(k,i)&&k.length>bLen){
                    bCat='midend';bLen=k.length;bBr=GME[k];best=k;
                }
            }
        }

        if(best){segs.push({en:best,br:bBr,cat:bCat});result+=bBr;i+=bLen;continue;}

        // 內嵌標點映射：hyphen 等
        const PUNCT_MAP={'-':'\u2824','/':'\u2820\u2812'};
        const ch=lw[i];
        const br=UA[ch]||PUNCT_MAP[ch]||ch;
        segs.push({en:ch,br,cat:'alpha'});result+=br;i++;
    }
    return{br:result,segs};
}

function capWrap(orig,innerBr){
    const isAll=orig===orig.toUpperCase()&&/[A-Z]/.test(orig)&&orig.length>1;
    if(isAll)return CAP_WORD+innerBr;
    if(/^[A-Z]/.test(orig))return CAP1+innerBr;
    return innerBr;
}

function translateWithApos(token){
    const apostRe=/['\u2019]/;
    const ai=token.search(apostRe);
    if(ai<=0){
        const lw=token.toLowerCase();
        // 偵測 proper noun：首字母大寫且其餘小寫（例：Bede, Bedouin, Aidoneus）
        // 全大寫詞（IBM, FBI）不算 proper noun，因有自己的全大寫規則
        const isProper=/^[A-Z][a-z]/.test(token);

        // CamelCase / mixed case 偵測：字中（非首位）有大寫字母
        // 例：BigQuery, BitTorrent, BlackBerry, AstroTurf
        // UEB §8.4：字中大寫字母需 ⠠ 指示符
        // 全大寫 token（IBM, ABC）不算（會走 CAP_WORD 整詞大寫）
        // 純字母（無撇號/標點）且非首字也非全大寫 → 用 CamelCase 分段處理
        const isAllUpper=token===token.toUpperCase()&&/[A-Z]/.test(token)&&token.length>1;
        const hasMidCaps=/^[A-Za-z]+$/.test(token)&&!isAllUpper&&/[A-Z]/.test(token.slice(1));
        if(hasMidCaps){
            // 分段策略（UEB §8.4 & §8.5）：
            //   1. 連續 2+ 大寫字母 → capsword 段 (⠠⠠)
            //   2. 單一大寫字母 + 後接小寫 → caps letter 段 (⠠)
            //   3. 連續小寫 → 普通段
            // 例：CosmosDB → "Cosmos" (caps+小寫) + "DB" (capsword)
            //     KKtP → "KK" (capsword) + "t" (小寫) + "P" (caps)
            //     NeWS → "Ne" (caps+小寫) + "WS" (capsword)
            //     iPhone → "i" (小寫) + "Phone" (caps+小寫)
            const segments=[];  // 每段 {type:'caps'|'capsword'|'lower', text}
            let i2=0;
            while(i2<token.length){
                if(/[A-Z]/.test(token[i2])){
                    // 看是不是連續 2+ 大寫
                    let j=i2+1;
                    while(j<token.length&&/[A-Z]/.test(token[j]))j++;
                    if(j-i2>=2){
                        // 規則（liblouis 模式）：
                        //   連續大寫 ≥ 2，若後接小寫，最後一個大寫屬於下一段（這樣下一段
                        //   也是 caps-letter 形式：Cap+lower）
                        //   例：CosmosDB → Cosmos (cap+lower) + DB (capsword)
                        //   例：MariaDB → Maria (cap+lower) + DB (capsword)
                        // 但若 連續大寫 ≥ 2 且後接小寫，且這段大寫加最後一字後也大於等於 1
                        //   liblouis 採用：把 J 後的大寫向後讓出一個給 cap-letter
                        // KKtP 案例特殊：KK 全當 capsword（不讓出），後接 t（小寫），再 P（caps）
                        // 通用規則：j-i2-1 個字進 capsword，第 j-1 個字進下一段
                        //   但若 j-i2==2（剛好 2 個），是否讓出？oracle: KK → KK 全當 capsword
                        //   原因：KK 後接 t 但 t 不是純小寫詞（Kt 不是普通字）
                        // 簡化：只要 j-i2 >= 2 都當 capsword 整段，下一字（小寫起頭）獨立
                        segments.push({type:'capsword',text:token.slice(i2,j)});
                        i2=j;
                    }else{
                        // 單一大寫 + 接 0+ 小寫
                        let k=j;
                        while(k<token.length&&/[a-z]/.test(token[k]))k++;
                        segments.push({type:'caps',text:token.slice(i2,k)});
                        i2=k;
                    }
                }else{
                    // 小寫起頭
                    let k=i2+1;
                    while(k<token.length&&/[a-z]/.test(token[k]))k++;
                    segments.push({type:'lower',text:token.slice(i2,k)});
                    i2=k;
                }
            }
            // 翻譯各段
            const allSegs=[];
            let allBr='';
            for(let si=0;si<segments.length;si++){
                const seg=segments[si];
                const plw=seg.text.toLowerCase();
                const isContin=si>=1; // 非首段視為 continuation：不可用 con/be/dis begword
                if(seg.type==='capsword'){
                    // 全大寫段：⠠⠠ + 字母拼字（不縮 strong groupsigns 若為 2 字母）
                    const isAU=seg.text.length>=2;
                    const rP=translateWord(plw,false,isAU,isContin);
                    allSegs.push({en:'⠠⠠',br:CAP_WORD,cat:'caps'});
                    allBr+=CAP_WORD;
                    allSegs.push(...rP.segs);
                    allBr+=rP.br;
                    // 若下一段是 lower（小寫），需加 capsword 終止符 ⠠⠄ (dots 6+3)
                    // 例：BBSes = BBS(capsword) + es → ⠠⠠⠃⠃⠎⠠⠄⠑⠎
                    if(si+1<segments.length&&segments[si+1].type==='lower'){
                        allSegs.push({en:'⠠⠄',br:'\u2820\u2804',cat:'caps'});
                        allBr+='\u2820\u2804';
                    }
                }else if(seg.type==='caps'){
                    // 首字大寫 + 小寫（CamelCase 段不是真正 proper noun，不觸發 proper noun 例外）
                    const rP=translateWord(plw,false,false,isContin);
                    allSegs.push({en:'⠠',br:CAP1,cat:'caps'});
                    allBr+=CAP1;
                    allSegs.push(...rP.segs);
                    allBr+=rP.br;
                }else{
                    // 全小寫段
                    const rP=translateWord(plw,false,false,isContin);
                    allSegs.push(...rP.segs);
                    allBr+=rP.br;
                }
            }
            return{br:allBr,segs:allSegs};
        }

        const r=translateWord(lw,isProper,isAllUpper);
        let br=r.br;
        const segs=[];
        const isAll=token===token.toUpperCase()&&/[A-Z]/.test(token)&&token.length>1;
        // Standing-alone shortform 偵測：
        // 若整 token 是純字母（無數字/標點），且字母逐字翻譯結果（letterOnly）
        // 恰巧等於某個 wordsign/shortform 的整體編碼（GW value），則需加 grade1 indicator (⠰)
        // 防止讀者誤解。例：token "ab" 拼字結果 ⠁⠃ 同 "about" 縮寫 → 需寫成 ⠰⠁⠃
        let needGrade1=false;
        if(/^[a-zA-Z]+$/.test(token)&&token.length>=1){
            let letterOnly='';
            for(const ch of lw)letterOnly+=(UA[ch]||ch);
            if(letterOnly!==r.br){
                // r.br 是縮寫過的，已經和字母版本不同 → 沒衝突
            }else{
                // 字母版本 = 翻譯結果，但這結果可能 = GW 整詞
                if(GW_REV.has(letterOnly)){
                    const sf=GW_REV.get(letterOnly);
                    if(sf!==lw){
                        // 字母拼成的編碼 = 另一個 shortform → 加 grade1
                        needGrade1=true;
                    }
                }
                // 或是該詞編碼 = GL（lowword）整詞
                if(GL_REV.has(letterOnly)){
                    const sf=GL_REV.get(letterOnly);
                    if(sf!==lw)needGrade1=true;
                }
                // liblouis 內建特定縮寫詞名單 — 這些詞會被誤縮為 shortform 延伸，需加 grade-1
                // 從 liblouis en-ueb-g2.ctb "contraction" 規則抽取
                // 不限全大寫，Blvd / Llc / Bldg 等也適用
                const CONTRACTION_LIST=new Set(['blc','blcup','bldg','blt','blvd','llb','llc','lld','llp']);
                if(CONTRACTION_LIST.has(lw)){
                    needGrade1=true;
                }
                // 全大寫詞：拼字結果開頭若 = SFXP shortform 編碼 且
                // 後續字母可能形成「shortform + 字母」的常見複合詞 → 加 grade-1
                // 例：BLT 開頭 ⠃⠇ = blind，SFXP_EXTENSIONS['blind'] 有 blinder/blindly/blindfish (以 bl+? 開頭)
                //     → 讀者可能誤讀為 blind + t → 加 grade-1
                // 反例：GDP 開頭 ⠛⠙ = good，SFXP_EXTENSIONS['good'] 中沒有以 good+p 開頭的字
                //     → 讀者不會誤讀為 good+? → 不加
                if(isAll&&token.length>=2){
                    // SFXP brl → shortform name 對照
                    if(!translateWithApos._SFXP_BRL2EN){
                        translateWithApos._SFXP_BRL2EN=new Map();
                        for(const[en,br] of SFXP)translateWithApos._SFXP_BRL2EN.set(br,en);
                    }
                    const SFXP_BRL2EN=translateWithApos._SFXP_BRL2EN;
                    for(let pLen=Math.min(letterOnly.length-1,5);pLen>=2;pLen--){
                        const pref=letterOnly.slice(0,pLen);
                        if(!SFXP_BRL2EN.has(pref))continue;
                        const sfEn=SFXP_BRL2EN.get(pref);
                        const ext=SFXP_EXTENSIONS[sfEn];
                        if(!ext)continue;
                        // 看 SFXP_EXTENSIONS[sfEn] 中是否有以 sfEn + token[pLen 對應字母] 開頭的詞
                        // token 的字母 pLen 起 (在 sfEn 後)
                        // 由於 SFXP 的 brl 長度可能 ≠ shortform 的字母長度（如 blind=5字母, ⠃⠇=2 格）
                        // 但 SFXP brl 是 shortform 的縮寫形式，sfEn 字母長度 ≠ pLen
                        // 簡化：直接看 ext 中有沒有任何字以 sfEn + 某字母 開頭
                        // 更精確需做：以 sfEn+nextLetter 開頭的字 nextLetter = token[pLen]
                        const lwToken=lw;
                        const nextLetter=lwToken[pLen]||'';
                        let canConfuse=false;
                        for(const w of ext){
                            if(w.toLowerCase().startsWith(sfEn+nextLetter)){canConfuse=true;break;}
                        }
                        if(canConfuse){needGrade1=true;break;}
                    }
                }
            }
        }
        // UEB §10.10: grade-1 indicator 寫在 caps indicator 之前
        // 例：AB → ⠰⠠⠠⠁⠃ (grade1 + capsword + 字母)
        // 順序：caps + br，然後 grade1 整個包外面
        br=capWrap(token,br);
        if(needGrade1)br='\u2830'+br;  // grade1 包在最外
        if(needGrade1)segs.unshift({en:'⠰',br:'\u2830',cat:'grade1'});
        if(isAll)segs.splice(needGrade1?1:0,0,{en:'⠠⠠',br:CAP_WORD,cat:'caps'});
        else if(/^[A-Z]/.test(token))segs.splice(needGrade1?1:0,0,{en:'⠠',br:CAP1,cat:'caps'});
        segs.push(...r.segs);
        return{br,segs};
    }
    // 特殊處理：n't 後綴（按 UEB Shortform Extension List 規則）
    // 白名單：couldn't/wouldn't/shouldn't/mustn't/hadn't 等多格 shortform + n't 形式
    //   couldn't = ⠉⠙⠝⠄⠞ (cd + n + ' + t)；prefix（不含 n）= "could"
    // 特例：can't = ⠉⠄⠞ (can wordsign 後直接接 't)；prefix（含 n）= "can"
    // 其他（don't/won't/isn't/wasn't/aren't/didn't 等）：拼字母 + n't (保留 n)
    //   don't = ⠙⠕⠝⠄⠞，wasn't = ⠺⠁⠎⠝⠄⠞
    const lwToken=token.toLowerCase();
    if(lwToken.endsWith("n't")||lwToken.endsWith("n\u2019t")){
        const preNoN=token.slice(0,token.length-3);    // 不含 n，例 "could"
        const preWithN=token.slice(0,token.length-2);  // 含 n，例 "couldn"/"can"
        const lwPreNoN=preNoN.toLowerCase();
        const lwPreWithN=preWithN.toLowerCase();
        // 白名單：Extension List 中含 n't 的多格 shortform（用不含 n 的 prefix 比對）
        const NT_LIST=new Set(['could','would','should','must','had']);
        if(NT_LIST.has(lwPreNoN)){
            const rPre=translateWithApos(preNoN);
            const ntBr='\u281d\u2804\u281e';  // n+'+t
            const ntSeg={en:"n't",br:ntBr,cat:'neg'};
            return{br:rPre.br+ntBr,segs:[...rPre.segs,ntSeg]};
        }
        // can't 特例：用含 n 的 prefix 比對 = "can"
        if(lwPreWithN==='can'){
            const rPre=translateWithApos(preWithN);  // can wordsign
            const tBr='\u2804\u281e';  // '+t
            const tSeg={en:"'t",br:tBr,cat:'apos'};
            return{br:rPre.br+tBr,segs:[...rPre.segs,tSeg]};
        }
        // 其他（don't/won't/isn't/wasn't/aren't/didn't/weren't 等）：prefix(含 n) + 't
        // prefix 走正常 translateWord（允許 groupsigns 如 er/ar/en）
        // 但**不**走整詞 GW 比對（避免 do→⠙ 整詞縮寫；UEB 規則 don't 不縮 do）
        if(preWithN.length>0){
            const lwPre=preWithN.toLowerCase();
            // 強制不用整詞 GW（ wordsign 必須整 token 為 wordsign + 't 形式才合）
            // 用 translateWord 但傳遞 flag 略過整詞快捷
            // 簡化：直接呼叫 translateWord，但若回傳是 GW 整詞縮寫（單格），改走字母拼
            let rPre;
            // 暫時把 GW[lwPre] 屏蔽 — 太複雜；改用「translateWord 結果若為單格整詞縮寫，回退字母」
            const tryRes=translateWord(lwPre);
            if(tryRes.segs.length===1&&tryRes.segs[0].cat==='word'){
                // 是整詞 wordsign，但 don't 等不該縮 — 回退字母
                const segs=[];
                let preBr='';
                for(const ch of lwPre){
                    const b=UA[ch]||ch;
                    segs.push({en:ch,br:b,cat:'alpha'});
                    preBr+=b;
                }
                rPre={br:preBr,segs};
            }else{
                rPre=tryRes;
            }
            // 套大寫
            const isAll=preWithN===preWithN.toUpperCase()&&/[A-Z]/.test(preWithN)&&preWithN.length>1;
            const firstUpper=/^[A-Z]/.test(preWithN);
            const capSegs=[];
            let capBr='';
            if(isAll){capSegs.push({en:'⠠⠠',br:CAP_WORD,cat:'caps'});capBr=CAP_WORD;}
            else if(firstUpper){capSegs.push({en:'⠠',br:CAP1,cat:'caps'});capBr=CAP1;}
            const tBr='\u2804\u281e';  // '+t
            const tSeg={en:"'t",br:tBr,cat:'apos'};
            return{br:capBr+rPre.br+tBr,segs:[...capSegs,...rPre.segs,tSeg]};
        }
    }
    const pre=token.slice(0,ai);
    const suf=token.slice(ai+1).toLowerCase();
    const rPre=translateWithApos(pre);
    let aposBr=APOS,aposSeg={en:"'",br:APOS,cat:'apos'};
    let sufBr='',sufSegs=[];
    if(suf){const rSuf=translateWord(suf);sufBr=rSuf.br;sufSegs=rSuf.segs;}
    return{br:rPre.br+aposBr+sufBr,segs:[...rPre.segs,aposSeg,...sufSegs]};
}

function translateHyphenated(token){
    // 把 token 用 hyphen 切成多段，各段都當作獨立的詞處理（這樣 wordsign/begword/endword 規則才正確）
    if(!token.includes('-'))return translateWithApos(token);
    const parts=token.split('-');
    const allSegs=[];
    let allBr='';
    for(let pi=0;pi<parts.length;pi++){
        if(pi>0){
            allSegs.push({en:'-',br:'\u2824',cat:'alpha'});
            allBr+='\u2824';
        }
        if(parts[pi]===''){continue;}
        const r=translateWithApos(parts[pi]);
        allSegs.push(...r.segs);
        allBr+=r.br;
    }
    return{br:allBr,segs:allSegs};
}

function traceE2B(raw){
    const tokens=raw.trim().split(/\s+/);
    const allSegs=[],brParts=[];
    for(let ti=0;ti<tokens.length;ti++){
        const tok=tokens[ti];if(!tok)continue;
        if(ti>0){allSegs.push({en:' ',br:'\u2800',cat:'space'});brParts.push('\u2800');}
        const r=translateHyphenated(tok);
        allSegs.push(...r.segs);brParts.push(r.br);
    }
    return{br:brParts.join(''),segs:allSegs};
}

// ════════════════════════════════════════════════════════════
//  B2E - 動態規劃多候選
// ════════════════════════════════════════════════════════════
const CAT_COST={always:1,anywhere:1,begword:2,midword:3,midend:3,alpha:5,word:0,shortform:0,lowword:0};

function isStartPaths(paths){
    if(!paths||paths.length===0)return true;
    return paths.every(p=>p.segs.every(s=>s.cat==='caps'||s.cat==='g1'));
}

function pushTop(arr,item,K){
    arr.push(item);
    if(arr.length>K){
        arr.sort((a,b)=>a.score-b.score);
        arr.length=K;
    }
}

function enumerateTokenParses(brStr){
    const chs=Array.from(brStr);
    const N=chs.length;

    const directs=[];
    if(GW_REV.has(brStr)){
        const en=GW_REV.get(brStr);
        const cat=brStr.length===1?'word':'shortform';
        directs.push({segs:[{br:brStr,en,cat}],score:0});
    }
    if(GL_REV.has(brStr)){
        const en=GL_REV.get(brStr);
        directs.push({segs:[{br:brStr,en,cat:'lowword'}],score:0});
    }
    // 整 token = GW shortform + 's' (⠎)：例如 besides=⠆⠎⠎ = beside(⠆⠎) + s
    if(N>=2&&chs[N-1]==='\u280e'){
        const stem=chs.slice(0,-1).join('');
        if(GW_REV.has(stem)){
            const en=GW_REV.get(stem);
            // 排除特殊不能加 s 的詞（about/almost/him）
            if(!['about','almost','him'].includes(en)){
                const cat=stem.length===1?'word':'shortform';
                directs.push({segs:[{br:stem,en,cat},{br:'\u280e',en:'s',cat:'alpha'}],score:0});
            }
        }
    }


    // 整 token = GW shortform + n't (⠝⠄⠞)：couldn't=⠉⠙⠝⠄⠞ = could(⠉⠙) + n't
    // 也要處理 wouldn't/shouldn't/mustn't/hadn't 等
    if(N>=4&&chs[N-3]==='\u281d'&&chs[N-2]===APOS&&chs[N-1]==='\u281e'){
        const stem=chs.slice(0,-3).join('');
        if(GW_REV.has(stem)){
            const en=GW_REV.get(stem);
            const cat=stem.length===1?'word':'shortform';
            const ntBr='\u281d'+APOS+'\u281e';
            directs.push({segs:[{br:stem,en,cat},{br:ntBr,en:"n't",cat:'neg'}],score:0});
        }
    }
    // 多格 shortform + 撇號 + 字母後綴 ('ve, 's, 'd, 'll, 're)
    // 例：could've = ⠉⠙⠄⠧⠑ = could(⠉⠙) + ⠄ + ve
    //     should've = ⠩⠙⠄⠧⠑ = should(⠩⠙) + ⠄ + ve
    //     would've = ⠺⠙⠄⠧⠑ = would(⠺⠙) + ⠄ + ve
    // 找出撇號位置 j；若 j>=2 且前 j 格構成已知 shortform，且後 N-j-1 格都是字母
    for(let j=2;j<N-1;j++){
        if(chs[j]!==APOS)continue;
        const stem=chs.slice(0,j).join('');
        if(!GW_REV.has(stem))continue;
        const en=GW_REV.get(stem);
        const cat=stem.length===1?'word':'shortform';
        // 後綴：N-j-1 格都需是字母
        const suffix=chs.slice(j+1);
        let suffixEn='';
        let ok=true;
        for(const c of suffix){
            if(UA_REV[c])suffixEn+=UA_REV[c];
            else{ok=false;break;}
        }
        if(!ok||!suffixEn)continue;
        directs.push({
            segs:[
                {br:stem,en,cat},
                {br:APOS,en:"'",cat:'apos'},
                ...suffix.map((c,idx)=>({br:c,en:suffixEn[idx],cat:'alpha'}))
            ],
            score:0
        });
        break; // 只處理第一個撇號
    }

    // 複合詞前綴：整 token 開頭 = 多格 GW shortform（白名單）+ 字母後綴
    // 後綴白名單 = hunspell 字典實際存在的 prefix+stem 組合
    // 例：afterbirth=⠁⠋⠃⠊⠗⠹ → after+birth；afield=⠁⠋⠊⠑⠇⠙ ≠ after+ield (字典無此組合)
    if(N>=4){
        // 從 hunspell 抽出的 compound stems（小寫 stem）— 後綴必須在這
        // 注意：oracle 對 after-/above- 等複合詞會用 prefix 縮寫，所以 stem 不含縮寫
        const COMPOUND_STEMS={
            'after':new Set(['birth','births','body','brain','burner','burning','care','clap','damp','deck','effect','glow','growth','guard','heat','image','life','lives','market','math','maths','most','noon','piece','school','sensation','shaft','shave','shock','taste','thought','time','ward','word','world','years','wards']),
            'above':new Set(['board','ground']),
            'before':new Set(['hand','time']),
            'below':new Set(['decks']),
            'behind':new Set(['hand']),
            'between':new Set(['times','whiles']),
        };
        const COMPOUND_BRL={
            'after':'\u2801\u280b',
            'above':'\u2801\u2803\u2827',
            'before':'\u2806\u280b',
            'below':'\u2806\u2807',
            'behind':'\u2806\u2813',
            'between':'\u2806\u281e',
        };
        for(const stemEn of Object.keys(COMPOUND_BRL)){
            const stemBr=COMPOUND_BRL[stemEn];
            if(N-stemBr.length<2)continue;
            let match=true;
            for(let k=0;k<stemBr.length;k++)if(chs[k]!==stemBr[k]){match=false;break;}
            if(!match)continue;
            // 解析後綴（用字母拼字）
            const tail=chs.slice(stemBr.length);
            const tailSegs=[];
            let tailOk=true,tailEn='';
            for(const c of tail){
                if(UA_REV[c]){
                    const letter=UA_REV[c];
                    tailSegs.push({br:c,en:letter,cat:'alpha'});
                    tailEn+=letter;
                }else{tailOk=false;break;}
            }
            if(!tailOk)continue;
            // 必須在白名單
            if(!COMPOUND_STEMS[stemEn].has(tailEn.toLowerCase()))continue;
            directs.push({
                segs:[{br:stemBr,en:stemEn,cat:'shortform'},...tailSegs],
                score:0
            });
            break;
        }
    }

    // wordsign + 撇號 + 後綴 (it'll, can't, won't 等)
    if(N>=3&&chs[1]===APOS&&GW_REV.has(chs[0])){
        const wsEn=GW_REV.get(chs[0]);
        // 後綴：n't 特例（⠄⠞）或一般撇號 + 字母
        // 把首格設為 wordsign 段，其餘留給 dp 自動處理
        const wsSeg={br:chs[0],en:wsEn,cat:'word'};
        // 用 directs 加一個「強制 wordsign 開頭」的種子 path
        // 處理方式：給 dp[1] 一個來自 wordsign 段的初始 path
        // 但這需要在 dp 初始化後加入；改用後處理：在迴圈外特別建構
        // 較簡單做法：加一個完整的 directs 路徑（如果整 token 都能解析）
        // 試 wordsign + apos + 剩下用簡單字母對應
        const tail=chs.slice(2);
        // 移除：n't 路徑只有當前一格是 ⠝（即 chs[0]）時才合理；
        // 對 wordsign + ⠄⠞ 應該解讀為 wordsign + 't (撇號+t)，不是 n't
        // 嘗試 'll, 're, 've, 's, 't 等：撇號 + 字母組
        const aposEn={br:APOS,en:"'",cat:'apos'};
        const tailSegs=[];
        let ok=true;
        for(const t of tail){
            if(UA_REV[t])tailSegs.push({br:t,en:UA_REV[t],cat:'alpha'});
            else{ok=false;break;}
        }
        if(ok&&tailSegs.length>0){
            directs.push({segs:[wsSeg,aposEn,...tailSegs],score:0});
        }
    }
    // 教學示意：整 token 是單一 final-letter contraction（如 ⠨⠝=sion, ⠰⠝=tion）
    // 嚴格 UEB 規則中這些不能在字首，但單獨成 token 時是「規則示意」
    // 為使用者方便查詢這些縮寫代表什麼，加進 directs（標 cat='midend' 帶連字符 -X 顯示）
    if(N>=2&&N<=2){
        const matches=CELL_REV.get(brStr);
        if(matches){
            for(const mm of matches){
                if(mm.cat==='midend'){
                    directs.push({segs:[{br:brStr,en:'-'+mm.en,cat:'midend'}],score:0});
                    break;
                }
            }
        }
    }

    // Letter sign ⠰（dot 56）開頭：整 token 強制當字母組（不縮寫）
    // UEB 規則：letter sign 用來標示「以下字母組要逐字母讀，不是 contraction」
    // 例如 ⠰⠇⠇ = "ll"（不是 little），⠰⠋⠗ = "fr"（不是 friend），⠰⠛⠙ = "gd"
    // 也支援 ⠰⠠⠠X = letter sign + capsword + 字母組（例 LL → ⠰⠠⠠⠇⠇，PD → ⠰⠠⠠⠏⠙）
    if(N>=2&&chs[0]===G1SYM){
        const lsSeg={br:G1SYM,en:'⠰ letter sign',cat:'g1'};
        const tailSegs=[];
        let ok=true;
        let startJ=1;
        // 偵測 ⠰⠠⠠ capsword 前綴
        if(N>=4&&chs[1]===CAP1&&chs[2]===CAP1){
            tailSegs.push({br:CAP_WORD,en:'⠠⠠ 全詞大寫',cat:'caps'});
            startJ=3;
        }
        for(let j=startJ;j<N;j++){
            const c=chs[j];
            if(UA_REV[c])tailSegs.push({br:c,en:UA_REV[c].toUpperCase(),cat:'alpha'});
            else if(c===CAP1){
                // 大寫指示符後跟字母
                if(j+1<N&&UA_REV[chs[j+1]]){
                    tailSegs.push({br:CAP1,en:'⠠ caps',cat:'caps'});
                    tailSegs.push({br:chs[j+1],en:UA_REV[chs[j+1]].toUpperCase(),cat:'alpha'});
                    j++;
                }else{ok=false;break;}
            }
            else{ok=false;break;}
        }
        if(ok&&tailSegs.length>0){
            directs.push({segs:[lsSeg,...tailSegs],score:0});
        }
    }

    // 剝掉前置大寫符後，再嘗試整詞 wordsign / shortform / lowword 比對
    if(chs[0]===CAP1){
        let capLen=1, capSeg;
        if(chs[1]===CAP1){capLen=2; capSeg={br:CAP_WORD,en:'⠠⠠ 全詞大寫',cat:'caps'};}
        else{capSeg={br:CAP1,en:'⠠ 大寫',cat:'caps'};}
        const core=chs.slice(capLen).join('');
        if(core.length>0){
            if(GW_REV.has(core)){
                const en=GW_REV.get(core);
                const cat=core.length===1?'word':'shortform';
                directs.push({segs:[capSeg,{br:core,en,cat}],score:0});
            }
            if(GL_REV.has(core)){
                const en=GL_REV.get(core);
                directs.push({segs:[capSeg,{br:core,en,cat:'lowword'}],score:0});
            }
        }
    }

    const K=12;
    const dp=Array(N+1).fill(null).map(()=>[]);
    dp[0]=[{segs:[],score:0}];

    for(let i=0;i<N;i++){
        if(dp[i].length===0)continue;
        const cell=chs[i];

        if(cell===CAP1&&i+2<N+1&&i+2<=N){
            if(i+2<N&&chs[i+1]===CAP1&&chs[i+2]===CAP1){
                for(const path of dp[i]){
                    pushTop(dp[i+3],{segs:[...path.segs,{br:CAP_TERM,en:'⠠⠠⠠ 終止全詞大寫',cat:'caps'}],score:path.score},K);
                }
            }
        }
        if(cell===CAP1&&i+1<N&&chs[i+1]===CAP1){
            for(const path of dp[i]){
                pushTop(dp[i+2],{segs:[...path.segs,{br:CAP_WORD,en:'⠠⠠ 全詞大寫',cat:'caps'}],score:path.score},K);
            }
        }
        if(cell===CAP1&&i+1<N&&chs[i+1]===APOS){
            for(const path of dp[i]){
                pushTop(dp[i+2],{segs:[...path.segs,{br:END_CAPS,en:'⠠⠄ 結束全詞大寫',cat:'caps'}],score:path.score},K);
            }
        }
        if(cell===CAP1){
            for(const path of dp[i]){
                pushTop(dp[i+1],{segs:[...path.segs,{br:CAP1,en:'⠠ 大寫',cat:'caps'}],score:path.score},K);
            }
            continue;
        }

        if(cell===G1SYM&&i+1<N&&chs[i+1]===G1SYM){
            for(const path of dp[i]){
                pushTop(dp[i+2],{segs:[...path.segs,{br:G1WORD,en:'⠰⠰ G1 word',cat:'g1'}],score:path.score},K);
            }
        }
        if(cell===G1SYM){
            // G1 symbol 路徑（cost = 0），但不 continue，讓多格搜尋也能匹配 ⠰X
            // （final-letter contractions ⠰⠑/⠰⠝/⠰⠎ 等 = ence/tion/ness 等）
            // 給 G1 路徑一個小代價，讓 final-letter 兩格組合在中後段優先勝出
            for(const path of dp[i]){
                pushTop(dp[i+1],{segs:[...path.segs,{br:G1SYM,en:'⠰ G1 symbol',cat:'g1'}],score:path.score+5},K);
            }
            // 不 continue — 讓下面的多格搜尋接管 ⠰⠑/⠰⠝/⠰⠎ 等
        }

        if(cell===APOS){
            for(const path of dp[i]){
                pushTop(dp[i+1],{segs:[...path.segs,{br:APOS,en:"'",cat:'apos'}],score:path.score},K);
            }
            continue;
        }

        for(let len=1;len<=Math.min(8,N-i);len++){
            const c=chs.slice(i,i+len).join('');
            if(!CELL_REV.has(c))continue;
            const matches=CELL_REV.get(c);
            for(const m of matches){
                const isStart=isStartPaths(dp[i]);
                if(m.cat==='begword'&&!isStart)continue;
                if(m.cat==='midend'&&isStart)continue;
                if(m.cat==='midword'){
                    if(isStart)continue;
                    if(i+len===N)continue;
                }
                if(m.cat==='shortform_pos'){
                    // 嚴格 shortform：必須在 token 開頭或結尾
                    const atEnd=(i+len===N);
                    if(!isStart&&!atEnd)continue;
                    // 撇號後不可用 shortform（'ll/'re/'ve 是縮約後綴，不是 little/...）
                    if(i>0&&chs[i-1]===APOS)continue;
                    const isStrict=SFXP_STRICT.has(m.en);
                    const firstLetterOf=(brCell)=>{
                        if(!brCell)return'';
                        if(UA_REV[brCell])return UA_REV[brCell];
                        const cands=CELL_REV.get(brCell);
                        if(cands){
                            for(const c of cands){
                                if(c.cat!=='alpha')return(c.en||'')[0]||'';
                            }
                        }
                        return'';
                    };
                    if(isStrict){
                        if(isStart&&!atEnd){
                            let nf=firstLetterOf(chs[i+len]);
                            if(!nf&&i+len+1<=N){
                                const twoCells=chs[i+len]+(chs[i+len+1]||'');
                                nf=firstLetterOf(twoCells);
                            }
                            if(nf&&'aeiouy'.includes(nf)){
                                // 字首後接母音：須整詞在 extension list
                                const wl=SFXP_VOWEL_OK[m.en];
                                if(!wl)continue;
                                let coreStart=0;
                                if(chs[0]===CAP1)coreStart=(chs[1]===CAP1)?2:1;
                                let matched=false;
                                for(const cand of wl){
                                    if(!cand.startsWith(m.en))continue;
                                    try{
                                        const reBr=traceE2B(cand).br;
                                        if(reBr===brStr.slice(coreStart)){matched=true;break;}
                                    }catch(e){}
                                }
                                if(!matched)continue;
                            }
                        }
                        if(!isStart&&atEnd){
                            // 字尾位置：嚴格組必須整詞落在 SFXP_SUFFIX_OK whitelist
                            const wl=SFXP_SUFFIX_OK[m.en];
                            if(!wl)continue;
                            // 計算當前 dp 路徑可能的 reading prefix（取最佳路徑）
                            // 若多條 path，取最便宜的 reading 作為「最可能的前綴」
                            const sortedPaths=[...dp[i]].sort((a,b)=>a.score-b.score);
                            let matchedAny=false;
                            for(const path of sortedPaths){
                                const prefixReading=pathReading(path.segs).toLowerCase();
                                if(!prefixReading)continue;
                                const fullLower=prefixReading+m.en;
                                if(wl.has(fullLower)){
                                    matchedAny=true;
                                    break;
                                }
                            }
                            if(!matchedAny)continue;
                            // Consistency check: e2b(full) === current token
                            // 避免 bell→belittle 這類「整詞偶然落在 whitelist 但編碼不一致」
                            try{
                                let coreStart=0;
                                if(chs[0]===CAP1)coreStart=(chs[1]===CAP1)?2:1;
                                for(const path of sortedPaths){
                                    const prefixReading=pathReading(path.segs).toLowerCase();
                                    const fullLower=prefixReading+m.en;
                                    if(!wl.has(fullLower))continue;
                                    const reBr=traceE2B(fullLower).br;
                                    if(reBr===brStr.slice(coreStart)){matchedAny=true;break;}
                                    matchedAny=false;
                                }
                                if(!matchedAny)continue;
                            }catch(e){continue;}
                        }
                    }else{
                        // 非嚴格 shortform
                        const isUnrestricted=SFXP_UNRESTRICTED.has(m.en);
                        if(!isUnrestricted){
                            // 字尾位置：必須整詞落在 SFXP_VOWEL_OK
                            if(!isStart&&atEnd){
                                const wl=SFXP_VOWEL_OK[m.en];
                                if(!wl)continue;
                                const sortedPaths=[...dp[i]].sort((a,b)=>a.score-b.score);
                                let matchedAny=false;
                                try{
                                    let coreStart=0;
                                    if(chs[0]===CAP1)coreStart=(chs[1]===CAP1)?2:1;
                                    for(const path of sortedPaths){
                                        const prefixReading=pathReading(path.segs).toLowerCase();
                                        const fullLower=prefixReading+m.en;
                                        if(!wl.has(fullLower))continue;
                                        const reBr=traceE2B(fullLower).br;
                                        if(reBr===brStr.slice(coreStart)){matchedAny=true;break;}
                                    }
                                }catch(e){continue;}
                                if(!matchedAny)continue;
                            }
                            // 字首位置：用 whitelist 過濾
                            if(isStart&&!atEnd){
                                const wl=SFXP_VOWEL_OK[m.en];
                                if(!wl){continue;}
                                let matched=false;
                                let coreStart=0;
                                if(chs[0]===CAP1)coreStart=(chs[1]===CAP1)?2:1;
                                for(const cand of wl){
                                    if(!cand.startsWith(m.en))continue;
                                    try{
                                        const reBr=traceE2B(cand).br;
                                        if(reBr===brStr.slice(coreStart)){matched=true;break;}
                                    }catch(e){}
                                }
                                if(!matched)continue;
                            }
                        }else{
                            // UNRESTRICTED (great/braille): 完全無限制
                            // children: provided not followed by vowel/y
                            if(m.en==='children'&&!atEnd){
                                const firstLetterOf=(brCell)=>{
                                    if(!brCell)return'';
                                    if(UA_REV[brCell])return UA_REV[brCell];
                                    const cands=CELL_REV.get(brCell);
                                    if(cands){
                                        for(const c of cands){
                                            if(c.cat!=='alpha')return(c.en||'')[0]||'';
                                        }
                                    }
                                    return'';
                                };
                                const nf=firstLetterOf(chs[i+len]);
                                if(nf&&'aeiouy'.includes(nf))continue;
                            }
                        }
                    }
                }
                let cost=CAT_COST[m.cat]??5;
                if(m.cat==='shortform_pos')cost=0;
                for(const path of dp[i]){
                    pushTop(dp[i+len],{segs:[...path.segs,{br:c,en:m.en,cat:m.cat==='shortform_pos'?'shortform':m.cat}],score:path.score+cost},K);
                }
            }
        }
    }

    const all=[...directs,...dp[N]];
    all.sort((a,b)=>a.score-b.score||a.segs.length-b.segs.length);
    return all;
}

function pathReading(segs){
    let out='',capNext=false,capsWord=false;
    for(const s of segs){
        if(s.cat==='caps'){
            if(s.br===CAP_WORD)capsWord=true;
            else if(s.br===CAP_TERM||s.br===END_CAPS)capsWord=false;
            else capNext=true;
            continue;
        }
        if(s.cat==='g1')continue;
        // 撇號是「非字母符號」，UEB 規則：capsword 模式遇到非字母符號即結束
        if(s.cat==='apos'){out+="'";capsWord=false;continue;}
        if(s.cat==='neg'){out+="n't";capsWord=false;continue;}
        let en=s.en;
        if(capsWord)en=en.toUpperCase();
        else if(capNext){en=en.charAt(0).toUpperCase()+en.slice(1);capNext=false;}
        out+=en;
    }
    return out;
}

function stripTailPunct(brStr){
    const m=brStr.match(TAIL_PUNCT_RE);
    if(!m)return{core:brStr,tail:''};
    return{core:brStr.slice(0,brStr.length-m[0].length),tail:m[0]};
}

function punctChar(brCh){
    const m={
        '\u2802':',','\u2832':'.','\u2826':'?','\u2816':'!',
        '\u2806':';','\u2812':':','\u2824':'-'
    };
    return m[brCh]||brCh;
}

function parseToken(brStr){
    let parses=enumerateTokenParses(brStr);

    let tail='',core=brStr;
    const stripped=stripTailPunct(brStr);
    if(stripped.tail&&stripped.core.length>0){
        const altParses=enumerateTokenParses(stripped.core);
        const bestFull=parses.length?parses[0].score:Infinity;
        const bestStripped=altParses.length?altParses[0].score:Infinity;
        if(bestStripped<bestFull-1||(parses.length===0&&altParses.length>0)){
            parses=altParses;
            tail=stripped.tail;
            core=stripped.core;
        }
    }

    if(parses.length===0){
        const segs=Array.from(brStr).map(c=>({br:c,en:UA_REV[c]||c,cat:'alpha'}));
        return{best:segs,alts:[],segs,bestReading:segs.map(s=>s.en).join(''),allReadings:[]};
    }

    const tailSegs=tail?Array.from(tail).map(c=>({br:c,en:c,cat:'punct'})):[];
    const tailReadingSuffix=tail?Array.from(tail).map(c=>punctChar(c)).join(''):'';
    const decorate=p=>({
        segs:[...p.segs,...tailSegs],
        score:p.score,
        reading:pathReading(p.segs)+tailReadingSuffix
    });

    const decorated=parses.map(decorate);
    const seen=new Set();
    const uniq=[];
    for(const d of decorated){
        if(seen.has(d.reading))continue;
        seen.add(d.reading);uniq.push(d);
    }
    const best=uniq[0];
    const alts=uniq.slice(1,4);
    return{best:best.segs,alts,segs:best.segs,bestReading:best.reading,allReadings:uniq};
}

function traceB2E(brStr){
    const allSegs=[];
    const tokenInfos=[];
    const rawTokens=[];
    let cur='';
    for(const ch of Array.from(brStr)){
        if(ch==='\u2800'){if(cur){rawTokens.push({s:cur,sp:false});cur='';}rawTokens.push({s:ch,sp:true});}
        else cur+=ch;
    }
    if(cur)rawTokens.push({s:cur,sp:false});
    for(const tok of rawTokens){
        if(tok.sp){
            allSegs.push({br:'\u2800',en:' ',cat:'space',isSpace:true});
            tokenInfos.push({isSpace:true});
            continue;
        }
        // 處理 token 內的 hyphen ⠤ — 把 token 切成多段，各段獨立 parseToken
        // 然後把 hyphen 段插回
        if(tok.s.includes('\u2824')){
            const parts=tok.s.split('\u2824');
            const subInfos=[];
            const combinedSegs=[];
            let combinedReading='';
            for(let pi=0;pi<parts.length;pi++){
                if(pi>0){
                    const hyphSeg={br:'\u2824',en:'-',cat:'alpha'};
                    combinedSegs.push(hyphSeg);
                    combinedReading+='-';
                    allSegs.push(hyphSeg);
                }
                if(parts[pi]===''){continue;}
                const subInfo=parseToken(parts[pi]);
                subInfos.push(subInfo);
                for(const seg of subInfo.segs){
                    combinedSegs.push(seg);
                    allSegs.push(seg);
                }
                combinedReading+=subInfo.bestReading||'';
            }
            tokenInfos.push({
                isSpace:false,
                segs:combinedSegs,
                bestReading:combinedReading,
                subInfos,
                allReadings:[{reading:combinedReading,score:0,segs:combinedSegs}]
            });
            continue;
        }
        const info=parseToken(tok.s);
        for(const seg of info.segs){
            allSegs.push(seg);
        }
        tokenInfos.push(info);
    }
    return{segs:allSegs,tokenInfos};
}

function buildReading(tokenInfos){
    const parts=[];
    for(const t of tokenInfos){
        if(t.isSpace){parts.push(' ');continue;}
        parts.push(t.bestReading||'');
    }
    return parts.join('').replace(/\s+/g,' ').trim();
}

//  Render
// ════════════════════════════════════════════════════════════
function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function riHTML(en,br,cat){
    const ci=CLABEL[cat]||CLABEL.alpha;
    return`<div class="ri ${cat}"><div class="ribr">${br}</div><div class="ribody"><div class="rien">${escapeHtml(en)}</div><div class="ridts">${dots(br)}</div><span class="ritag">${ci.l}　${ci.d}</span></div></div>`;
}

function renderE2B(raw, llBr){
    if(!raw.trim())return'';
    const{br,segs}=traceE2B(raw);
    const uniq=new Set(),rules=[];
    for(const s of segs){
        if(['space','caps','apos','neg'].includes(s.cat))continue;
        const k=s.cat==='alpha'?null:s.en+'|'+s.cat;
        if(k===null||!uniq.has(k)){if(k)uniq.add(k);rules.push(s);}
    }
    const realSegs=segs.filter(s=>s.cat!=='caps');
    const showSeg=realSegs.filter(s=>s.cat!=='space').length>1;

    let llBadge='';
    if(llBr===null){

function renderB2E(brStr){
    if(!Array.from(brStr).some(c=>c!=='\u2800'))return'';
    const{segs,tokenInfos}=traceB2E(brStr);
    const reading=buildReading(tokenInfos);

    const uniq=new Set(),rules=[];
    for(const s of segs){
        if(s.isSpace||['caps','g1','apos','neg','punct','space'].includes(s.cat))continue;
        const k=s.en+'|'+s.cat+'|'+s.br;
        if(!uniq.has(k)){uniq.add(k);rules.push(s);}
    }

    const altReadings=[];
    for(const t of tokenInfos){
        if(t.isSpace||!t.allReadings||t.allReadings.length<=1)continue;
        const alts=t.allReadings.slice(1,4).map(a=>a.reading).filter(r=>r!==t.bestReading);
        if(alts.length){
            altReadings.push({best:t.bestReading,alts});
        }
    }

    const hasSpace=segs.some(s=>s.isSpace);
    return`<div class="rbox">
<div class="trow">
  <div class="tcol"><div class="tlbl">點字輸入</div><div class="tbr">${brStr.trim()}</div></div>
  <div class="tarr">→</div>
  <div class="tcol"><div class="tlbl">對應英文</div><div style="font-size:1.6rem;font-weight:500;margin-top:3px">${escapeHtml(reading||'—')}</div></div>
</div>
<div class="stitle">逐格解析${hasSpace?' （⠀=空格斷字）':''}</div>
<div class="srow2">${segs.map((s,idx)=>{
    if(s.isSpace)return`<div class="seg"><div class="sbr" style="font-size:.85rem;color:var(--tx3)">⠀</div><div class="sen" style="font-size:.7rem;color:var(--tx3)">空格</div></div>`;
    if(s.cat==='caps'||s.cat==='g1')return`<div class="seg"><div class="sbr" style="font-size:.95rem">${s.br}</div><div class="sen" style="font-size:.65rem;color:var(--tx3)">${escapeHtml(s.en)}</div></div>`;
    if(s.cat==='punct')return`<div class="seg"><div class="sbr">${s.br}</div><div class="sen" style="color:var(--tx3)">標點</div></div>`;
    const prev=segs[idx-1];
    const plus=(idx>0&&prev&&!prev.isSpace&&prev.cat!=='caps'&&prev.cat!=='g1')?'<div class="splus">+</div>':'';
    return plus+`<div class="seg"><div class="sbr">${s.br}</div><div class="sen">${escapeHtml(s.en)}</div></div>`;
}).join('')}</div>
${altReadings.length?`<div class="stitle">替代解讀</div>${altReadings.map(a=>`<div class="altreading">最佳：<b>${escapeHtml(a.best)}</b>　其他可能：${a.alts.map(x=>escapeHtml(x)).join('、')}</div>`).join('')}`:''}
<div class="rtitle">相關縮寫規則</div>
<div class="rlist">${rules.map(r=>riHTML(r.en,r.br,r.cat)).join('')}</div>
</div>`;
}

// North American Braille ASCII 對照表（6-dot 標準）
// 大小寫一致對應同一 dot pattern
const ASCII_BRL={
    ' ':0,
    'a':1,'b':3,'c':9,'d':25,'e':17,'f':11,'g':27,'h':19,'i':10,'j':26,
    'k':5,'l':7,'m':13,'n':29,'o':21,'p':15,'q':31,'r':23,'s':14,'t':30,
    'u':37,'v':39,'w':58,'x':45,'y':61,'z':53,
    '1':2,'2':6,'3':18,'4':50,'5':34,'6':22,'7':54,'8':38,'9':20,'0':52,
    ',':32,           // ⠠ dots 6 (caps indicator)
    ';':6,            // ⠆ dots 23
    ':':18,           // ⠒ dots 25
    '.':50,           // ⠲ dots 256
    '!':46,           // ⠖ dots 235
    '?':38,           // ⠦ dots 236
    "'":4,            // ⠄ dot 3 (apostrophe)
    '-':36,           // ⠤ dots 36 (hyphen)
    '/':12,           // ⠌ dots 34 (st groupsign)
    '#':60,           // ⠼ dots 3456 (number indicator)
    '@':8,            // ⠈ dot 4
    '^':24,           // ⠘ dots 45
    '"':16,           // ⠐ dot 5
    '_':56,           // ⠸ dots 456
    '%':40,           // ⠨ dots 46
    '*':48,           // ⠰ dots 56
    '<':35,
    '>':45,
    '[':47,
    ']':61,
    '&':47,
    '+':22,
    '$':28
};

// 逐字符轉換：Unicode 點字保留、ASCII Braille 字符轉成 Unicode 點字、其他保留
function autoConvertToBraille(s){
    let out='';
    for(const ch of s){
        // 已是 Unicode 點字
        if(ch>='\u2800'&&ch<='\u28FF'){out+=ch;continue;}
        // 是 ASCII Braille 對照表中的字元
        const low=ch.toLowerCase();
        const bits=ASCII_BRL[low];
        if(bits!==undefined){out+=String.fromCharCode(0x2800+bits);continue;}
        // 其他字元保留原樣（如換行、tab）
        out+=ch;
    }
    return out;
}

// 輸入模式：'chord' = 六鍵點字（預設，老師習慣），'ascii' = ASCII 鍵盤（直接打字母）

function onB2E(){
    const ta=document.getElementById('b2e-in');
    const raw=ta.value;
    let val=raw;
    // ASCII 模式：自動把 ASCII 字符轉成 Unicode 點字
    if(inputMode==='ascii'){
        // 偵測是否需轉換
        let needConvert=false;
        for(const ch of raw){
            if(ch>='\u2800'&&ch<='\u28FF')continue;
            if(ch==='\n'||ch==='\r'||ch==='\t')continue;
            if(ASCII_BRL[ch.toLowerCase()]!==undefined){needConvert=true;break;}
        }
        if(needConvert){
            const converted=autoConvertToBraille(raw);
            if(converted!==raw){
                const caret=ta.selectionStart;
                ta.value=converted;
                try{ta.setSelectionRange(caret,caret);}catch(e){}
                val=converted;
            }
        }
    }
    document.getElementById('result-area').innerHTML=renderB2E(val);
}

let cbits=0,cfired=false;
const DMAP={83:4,68:2,70:1,74:8,75:16,76:32};
function handleBKD(e){
    const ta=document.getElementById('b2e-in'),c=e.keyCode;
    if(c===27){e.preventDefault();clearB2E();return;}
    // ASCII 模式：完全放行，讓使用者自由打字（除了 Esc）
    if(inputMode==='ascii')return;
    // 六鍵模式：
    if([8,46,37,38,39,40,9,13].includes(c)){cbits=0;cfired=false;return;}
    if(c===32){
        e.preventDefault();
        const p=ta.selectionStart;
        ta.value=ta.value.slice(0,p)+'\u2800'+ta.value.slice(ta.selectionEnd);
        ta.setSelectionRange(p+1,p+1);
        cbits=0;cfired=false;onB2E();return;
    }
    const bit=DMAP[c];
    if(bit!==undefined){e.preventDefault();cbits|=bit;return;}
    e.preventDefault();
}
function handleBKU(e){
    if(inputMode==='ascii')return;
    const ta=document.getElementById('b2e-in'),bit=DMAP[e.keyCode];
    if(bit===undefined)return;
    if(!cfired&&cbits>0){
        const ch=String.fromCharCode(0x2800+cbits);
        const p=ta.selectionStart;
        ta.value=ta.value.slice(0,p)+ch+ta.value.slice(ta.selectionEnd);
        ta.setSelectionRange(p+1,p+1);
        cfired=true;onB2E();
    }
    cbits&=~bit;
    if(cbits===0)cfired=false;
}

function reportDiscrepancy(word, ourBr, llBr){
    const title=`G2 轉譯歧異：${word}`;
    const body=[
        `**查詢詞**：${word}`,
        ``,
        `**本工具結果**：${ourBr}`,
        ``,
        `**liblouis 結果**：${llBr}`,
        ``,
        `**補充說明**（可選填）：`,
    ].join('\n');
    window.open(
        `https://github.com/hurthuang/vi-tools/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`,
        '_blank'
    );
}

function runRegression(){
    const out=document.getElementById('reg-result');
    const st=document.getElementById('reg-status');
    out.innerHTML='<div style="color:var(--tx3);font-size:.85rem">執行中…</div>';
    setTimeout(()=>{
        let ok=0,fail=0;
        const fails=[];
        for(const[w,exp] of Object.entries(REGRESSION_CASES)){
            try{
                const got=traceE2B(w).br;
                if(got===exp){ok++;}
                else{fail++;fails.push({w,exp,got});}
            }catch(e){
                fail++;fails.push({w,exp,got:'ERR:'+e.message});
            }
        }
        const total=ok+fail;
        const pct=Math.round(ok/total*100);
        const color=fail===0?'var(--grn)':fail<5?'var(--amb)':'var(--cor)';
        st.textContent=`共 ${total} 筆`;
        let html=`<div style="margin-bottom:.8rem;padding:.8rem 1rem;border-radius:8px;background:var(--sf);border:1px solid var(--bd)">
<div style="font-size:1.1rem;font-weight:600;color:${color}">
  ${fail===0?'✓ 全部通過':'❌ 有差異'} — ${ok}/${total} (${pct}%)
</div>`;
        if(fail>0)html+=`<div style="font-size:.8rem;color:var(--tx3);margin-top:4px">發現 ${fail} 筆與 liblouis ground truth 不符</div>`;
        html+='</div>';
        if(fails.length){
            html+='<div style="font-size:.8rem;font-weight:600;color:var(--tx2);margin-bottom:.4rem">差異明細</div>';
            html+='<div style="display:flex;flex-direction:column;gap:6px">';
            for(const{w,exp,got} of fails){
                html+=`<div style="padding:.6rem .9rem;border-radius:6px;background:var(--cor-bg);border:1px solid var(--cor-md);font-size:.82rem">
<div style="font-weight:600;color:var(--cor)">${escapeHtml(w)}</div>
<div style="display:flex;gap:1rem;margin-top:3px">
  <span><span style="color:var(--tx3)">LL：</span><span style="font-family:monospace">${exp}</span></span>
  <span><span style="color:var(--tx3)">工具：</span><span style="font-family:monospace">${got}</span></span>
</div></div>`;
            }
            html+='</div>';
        }
        out.innerHTML=html;
    },10);
}
