<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nemeth 數學點字轉換工具</title>
<script>
// MathJax config: register our custom \ratio and \proportion commands so
// the live preview renders them as the actual ratio (∶ U+2236) and
// proportion (∷ U+2237) signs instead of falling back to a red
// "Undefined control sequence" error.
window.MathJax={
  tex:{
    inlineMath:[['\\(','\\)']],
    displayMath:[['$$','$$']],
    macros:{
      ratio: ['\\mathrel{\\unicode{x2236}}', 0],
      proportion: ['\\mathrel{\\unicode{x2237}}', 0]
    }
  },
  options:{skipHtmlTags:['script','noscript','style','textarea','pre']}
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>
<style>
:root{
  --bg:#0b0d14;--surf:#13161f;--surf2:#1b1f2d;--bd:#262b3e;--bd2:#343b56;
  --blue:#5a99ff;--purple:#b39aff;--green:#4ee3a8;--red:#ff8b8b;
  --text:#eef2f9;--dim:#a9b3c9;
  --mono:"Noto Sans Mono","Courier New",monospace;
  --focus-ring:0 0 0 3px rgba(90,153,255,.55);
}
/* Light theme override — white background, dark text. WCAG AA throughout.
   Applied via <html data-theme="light">. */
html[data-theme="light"]{
  --bg:#ffffff;--surf:#f6f7fb;--surf2:#eef1f8;--bd:#c9cfdd;--bd2:#9aa5bc;
  --blue:#1557d6;--purple:#6b3dd6;--green:#0a7a4a;--red:#c0392b;
  --text:#101320;--dim:#4a526b;
  --focus-ring:0 0 0 3px rgba(21,87,214,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;font-size:14px;line-height:1.5}
/* Skip nav for screen readers */
.skip-nav{position:absolute;left:-9999px;top:0;background:var(--blue);color:#fff;
  padding:8px 16px;z-index:9999;border-radius:0 0 4px 0;font-size:.9rem}
.skip-nav:focus{left:0}
header{background:var(--surf);border-bottom:1px solid var(--bd);padding:9px 18px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:.95rem;font-weight:800;color:var(--blue);letter-spacing:.04em}
.logo span{color:var(--purple)}
/* Tab bar with ARIA roles */
.tabs{display:flex;gap:3px;background:var(--bg);border-radius:7px;padding:3px;
  role:tablist}
.tab{padding:5px 13px;border:none;border-radius:5px;background:transparent;
  color:var(--dim);font-size:.77rem;font-weight:700;cursor:pointer;
  transition:all .15s;letter-spacing:.05em;}
.tab:focus-visible{outline:none;box-shadow:var(--focus-ring);}
.tab.on{background:var(--blue);color:#fff}
.tab[aria-selected="true"]{background:var(--blue);color:#fff}
.topbar{background:var(--surf);border-bottom:1px solid var(--bd);padding:6px 18px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ctrl{display:flex;align-items:center;gap:6px;font-size:.77rem;color:var(--dim)}
.ctrl input[type=range]{accent-color:var(--blue);width:88px}
.ctrl label{cursor:pointer}
.badge{padding:2px 8px;border-radius:4px;font-size:.7rem;font-weight:700;
  letter-spacing:.06em;background:var(--surf2);border:1px solid var(--bd);color:var(--dim)}
.badge.on{background:rgba(77,142,248,.15);border-color:var(--blue);color:var(--blue)}
main{flex:1;padding:13px 18px;display:flex;flex-direction:column;gap:9px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.pane{display:flex;flex-direction:column;gap:5px}
.ph{font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);display:flex;align-items:center;gap:5px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--blue);aria-hidden:true}
.dot.g{background:var(--green)}.dot.p{background:var(--purple)}
textarea{width:100%;background:var(--surf);border:1px solid var(--bd);border-radius:7px;
  color:var(--text);font-family:var(--mono);font-size:15px;padding:10px;
  resize:vertical;height:200px;min-height:130px;transition:border-color .15s;line-height:1.65;
  overflow-y:auto;}
textarea:focus{outline:none;border-color:var(--blue);box-shadow:var(--focus-ring);}
.box{background:var(--surf);border:1px solid var(--bd);border-radius:7px;
  padding:10px;min-height:130px;font-size:15px;line-height:1.65}
.box.mono{font-family:var(--mono);color:var(--green);white-space:pre-wrap;word-break:break-all;
  overflow-y:auto;resize:vertical;height:200px;}
.box.err{color:var(--red)}
/* Sync-scroll checkbox in panel headers */
.sync-chk{font-size:.65rem;font-weight:normal;text-transform:none;color:var(--dim);
  margin-left:auto;display:inline-flex;align-items:center;gap:3px;cursor:pointer;}
.sync-chk input{cursor:pointer;accent-color:var(--blue);}
/* Preview box: same fixed height as textarea and output box */
.box.prev{overflow-y:auto;resize:vertical;height:200px;}
.info{font-size:.71rem;color:var(--dim);padding:5px 8px;background:var(--surf2);
  border-left:3px solid var(--purple);border-radius:0 5px 5px 0}
.info code{font-family:var(--mono);background:rgba(157,126,247,.15);
  color:var(--purple);padding:1px 4px;border-radius:3px}
.acts{display:flex;gap:7px;flex-wrap:wrap}
.btn{padding:6px 13px;border-radius:5px;border:1px solid var(--bd2);
  background:var(--surf2);color:var(--text);font-size:.76rem;font-weight:600;
  cursor:pointer;transition:all .15s}
.btn:focus-visible{outline:none;box-shadow:var(--focus-ring);}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:#3d7ee0}
.st{font-size:.71rem;color:var(--dim);min-height:18px;padding:2px 0}
.st.ok{color:var(--green)}.st.err{color:var(--red)}
.keyhint{font-size:.7rem;color:var(--dim);background:var(--surf2);
  border:1px solid var(--bd);border-radius:5px;padding:5px 9px;
  display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.keyhint kbd{display:inline-block;background:var(--bd2);border-radius:3px;
  padding:1px 5px;font-size:.68rem;font-family:var(--mono);color:var(--text)}
hr{border:none;border-top:1px solid var(--bd);margin:4px 0}
/* Symbol reference */
.symref{background:var(--surf2);border:1px solid var(--bd);border-radius:7px;padding:8px 10px}
.symref h3{font-size:.74rem;font-weight:700;color:var(--purple);margin-bottom:6px;letter-spacing:.05em}
.grade-section{margin-bottom:4px}
.grade-title{font-size:.72rem;font-weight:700;color:var(--dim);letter-spacing:.06em;
  margin:2px 0;padding:3px 6px;border-left:2px solid var(--purple);
  background:rgba(179,154,255,.08);border-radius:0 3px 3px 0}
/* Compact tight-packed layout:
   - sym-grid is a flex container that wraps rows as needed
   - each sym-row is a single focusable pill spanning three sized columns
   - on wide screens we get multiple pills per line; on mobile one per line */
.sym-grid{display:flex;flex-wrap:wrap;gap:2px 10px;padding:2px 0}
.sym-row{display:flex;align-items:baseline;gap:6px;padding:2px 6px;
  border-radius:3px;cursor:pointer;transition:background .1s;font-size:.74rem;
  flex:0 1 auto;min-width:0}
.sym-row:hover{background:var(--bd)}
.sym-row:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.sym-latex{font-family:var(--mono);color:var(--blue);white-space:nowrap;flex:0 0 auto}
.sym-nemeth{font-family:var(--mono);color:var(--green);white-space:nowrap;flex:0 0 auto}
.sym-name{color:var(--dim);font-size:.7rem;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;flex:0 1 auto;min-width:0}
/* Collapsible grade sections */
.grade-title{
  cursor:pointer;display:flex;align-items:center;justify-content:space-between;
  user-select:none;
}
.grade-title:focus-visible{outline:none;box-shadow:var(--focus-ring);border-radius:3px;}
.grade-arrow{font-size:.6rem;transition:transform .2s;display:inline-block;}
.grade-title.open .grade-arrow{transform:rotate(90deg);}
.grade-body{overflow:hidden;transition:max-height .25s ease;}
.grade-body.collapsed{max-height:0!important;}
/* Outer collapsible shell for the entire 108 curriculum table */
.symref-outer{
  font-size:.82rem;color:var(--purple);font-weight:700;letter-spacing:.04em;
  padding:4px 0;margin-bottom:4px;
}
.symref-body{overflow:hidden;transition:max-height .3s ease;}
.symref-body.collapsed{max-height:0!important;}
/* Math Editor Modal */
.me-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);
  z-index:10000;display:none;align-items:center;justify-content:center;padding:10px}
.me-modal.open{display:flex}
.me-modal-inner{background:#ffffff;color:#222;width:96%;max-width:1400px;
  max-height:96vh;border-radius:8px;
  /* overflow:visible (not hidden) so tooltip bubbles from buttons near
     the edges of the modal can escape. The trade-off: if inner content
     somehow overflowed the rounded corners it would no longer be clipped,
     but .me-body already handles its own overflow via overflow-y:auto. */
  overflow:visible;
  display:flex;flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.5)}
.me-header{background:#f4f5f7;border-bottom:1px solid #ddd;padding:10px 15px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.me-header-title{font-weight:800;color:var(--blue);font-size:1.05rem;flex:1}
.me-apply-btn{background:#2b8a3e;color:#fff;border:none;padding:8px 18px;
  border-radius:4px;cursor:pointer;font-weight:700;font-size:.85rem}
.me-apply-btn:hover{background:#228838}
.me-cancel-btn{background:#ddd;color:#333;border:none;padding:8px 18px;
  border-radius:4px;cursor:pointer;font-size:.85rem}
.me-cancel-btn:hover{background:#bbb}
.me-body{flex:1;overflow-y:auto;padding:15px;color:#222}
/* Make embedded math-editor contents look right on white */
.me-body h1{font-size:1.25rem;margin:0 0 10px;color:#222}
.me-body a[role="navigation"]{display:inline-block;margin:5px 8px 5px 0;font-weight:700;color:#555;font-size:.85rem}
.me-body button{margin:2px;padding:5px 10px;background:#eef2f7;border:1px solid #bfc8d3;
  color:#222;border-radius:4px;font-size:.85rem;cursor:pointer;position:relative}
.me-body button:hover{background:#d8e2ee}
.me-body select{margin:2px;padding:5px;background:#fff;border:1px solid #bfc8d3;
  color:#222;border-radius:4px;font-size:.85rem}
.me-body input[type=file]{color:#222}
.me-body .container{display:flex;width:100%;flex-wrap:wrap;gap:8px}
.me-body textarea,.me-body #preview{flex:1 1 45%;min-width:300px;height:280px;
  margin:5px 0;border:1px solid #ccc;padding:10px;font-family:"Noto Sans Mono",monospace;
  background:#fff;color:#222;overflow-y:auto}
.me-body #preview{background:#fafafa}
.me-body #mathmlOutput{width:100%;height:150px;white-space:pre-wrap;margin-top:10px;
  font-family:"Noto Sans Mono",monospace;border:1px solid #ccc;padding:10px;background:#fff;color:#222}
.me-open-btn{background:var(--purple);color:#fff;border:1px solid var(--purple);
  padding:6px 13px;border-radius:5px;font-size:.78rem;font-weight:700;cursor:pointer}
.me-open-btn:hover{background:#8b68e0}

/* Tooltip bubbles. Reads the existing `data-text="..."` attribute used
   throughout the math editor buttons (e.g. <button data-text="乘號">),
   so tooltips light up on those controls with zero markup changes.
   Keyboard users get the same bubble on :focus / :focus-visible.
   Accessible fallback: elements with data-text should also carry
   aria-label so the bubble text is exposed to assistive tech.          */
[data-text]{position:relative}
[data-text]:hover::after,
[data-text]:focus::after,
[data-text]:focus-visible::after{
  content:attr(data-text);
  position:absolute;
  left:50%;
  bottom:calc(100% + 8px);
  transform:translateX(-50%);
  background:#222;
  color:#fff;
  padding:5px 9px;
  border-radius:4px;
  font-size:.78rem;
  font-weight:400;
  line-height:1.35;
  white-space:nowrap;
  max-width:280px;
  z-index:9999;
  pointer-events:none;
  box-shadow:0 2px 6px rgba(0,0,0,.25);
}
[data-text]:hover::before,
[data-text]:focus::before,
[data-text]:focus-visible::before{
  content:"";
  position:absolute;
  left:50%;
  bottom:calc(100% + 2px);
  transform:translateX(-50%);
  border:5px solid transparent;
  border-top-color:#222;
  z-index:9999;
  pointer-events:none;
}
/* When there isn't room above, authors can add data-tip-pos="below" */
[data-text][data-tip-pos="below"]:hover::after,
[data-text][data-tip-pos="below"]:focus::after,
[data-text][data-tip-pos="below"]:focus-visible::after{
  bottom:auto;
  top:calc(100% + 8px);
}
[data-text][data-tip-pos="below"]:hover::before,
[data-text][data-tip-pos="below"]:focus::before,
[data-text][data-tip-pos="below"]:focus-visible::before{
  bottom:auto;
  top:calc(100% + 2px);
  border-top-color:transparent;
  border-bottom-color:#222;
}
/* Empty data-text (used as a feature flag by some scripts) should NOT
   produce an empty bubble. */
[data-text=""]:hover::after,
[data-text=""]:focus::after,
[data-text=""]:focus-visible::after,
[data-text=""]:hover::before,
[data-text=""]:focus::before,
[data-text=""]:focus-visible::before{
  content:none;
}
/* High-contrast mode: use system colors so the bubble remains readable. */
@media (forced-colors: active){
  [data-text]:hover::after,
  [data-text]:focus::after,
  [data-text]:focus-visible::after{
    background:Canvas;color:CanvasText;border:1px solid CanvasText;
  }
  [data-text]:hover::before,
  [data-text]:focus::before,
  [data-text]:focus-visible::before{
    border-top-color:CanvasText;
  }
}
</style>
</head>

<!-- LaTeX → Nemeth panel -->

  <div class="grid">
    <div class="pane">
      <div class="ph" id="l2n-in-label">

      <textarea id="l2n-in"

      <span style="font-size:.6rem;text-transform:none;opacity:.7;margin-left:4px">
        
      </span>

  <div class="acts" role="group" aria-label="&#x64CD;&#x4F5C;&#x6309;&#x9215;">

    <button class="btn" onclick="l2nClear()" aria-label="&#x6E05;&#x9664;&#x8F38;&#x5165;&#x5167;&#x5BB9;">&#x6E05;&#x9664;</button>
    <button class="btn" onclick="wrapStandaloneNumbers()" title="將文件中所有獨立數字（非題號）加上數學區塊標示">標示數字</button>

  <div class="st" id="l2n-st" role="status" aria-live="polite"></div>

<!-- Nemeth → LaTeX panel -->
<main id="p-n2l" style="display:none" role="tabpanel" aria-labelledby="t-n2l">

    aria-label="&#x516D;&#x9EDE;&#x9375;&#x76E4;&#x8AAA;&#x660E;">
    <span>&#x516D;&#x9EDE;&#x9375;&#xFF08;Perkins&#xFF09;&#xFF1A;
      <kbd>F</kbd>&#x9EDE;3 <kbd>D</kbd>&#x9EDE;2 <kbd>S</kbd>&#x9EDE;1

    <span><kbd>Space</kbd>&#x7A7A;&#x767D;&#x683C; &#xFF5C; &#x5176;&#x9918;&#x6309;&#x9215;&#x6B63;&#x5E38;&#x904B;&#x4F5C;</span>
    <span><kbd>Ctrl+B</kbd>&#x5207;&#x63DB;</span>

  <div class="grid">
    <div class="pane">
      <div class="ph" id="n2l-in-label">
        <span class="dot" aria-hidden="true"></span>Nemeth &#x9EDE;&#x5B57;&#x8F38;&#x5165;
      </div>
      <textarea id="n2l-in"

// LaTeX structural patterns (handled recursively)
// Processed innermost-first via nested brace parsing

// Extract content of balanced braces starting at position pos in s
function extractBraces(s, pos){
  if(s[pos]!=='{')return {content:s[pos]||'',end:pos+1};
  var depth=0,i=pos;
  while(i<s.length){
    if(s[i]==='{')depth++;
    else if(s[i]==='}'){depth--;if(depth===0)return{content:s.slice(pos+1,i),end:i+1};}
    i++;
  }
  return{content:s.slice(pos+1),end:s.length};
}

// Extract optional bracket [...]
function extractBracket(s, pos){
  if(pos>=s.length||s[pos]!=='[')return{content:null,end:pos};
  var i=pos+1;
  while(i<s.length&&s[i]!==']')i++;
  return{content:s.slice(pos+1,i),end:i+1};
}

// 吃掉矩陣/行列式結尾的 \right]/\right|/\right\vert（含前後空白）
// 用全域變數傳出新 index，JS 沒 out-parameter
var eatRightDelimIndex=0;
function eatRightDelim(s,i){
  while(i<s.length&&s[i]===' ')i++;
  if(s.slice(i,i+6)==='\\right'){
    var j=i+6;
    while(j<s.length&&s[j]===' ')j++;
    if(s[j]==='|'||s[j]===']'){j++;}
    else if(s.slice(j,j+5)==='\\vert'){j+=5;}
    else if(s.slice(j,j+2)==='\\}'){j+=2;}  // two-sided cases close
    i=j;
  }
  eatRightDelimIndex=i;
}

// Convert a LaTeX string to Nemeth ASCII
function latexToNemethAsc(expr){
  if(!expr||!expr.trim())return '';
  var s=expr.trim(), result='', i=0;

  while(i<s.length){
    var c=s[i];

    // ── Backslash commands ─────────────────────────────────
    if(c==='\\'){
      var cmdEnd=i+1;
      // Read command name (letters) or single char
      if(cmdEnd<s.length&&/[a-zA-Z]/.test(s[cmdEnd])){
        while(cmdEnd<s.length&&/[a-zA-Z]/.test(s[cmdEnd]))cmdEnd++;
      }else{cmdEnd++;}
      var cmd=s.slice(i,cmdEnd);
      i=cmdEnd;
      // Skip trailing space after command
      if(i<s.length&&s[i]===' ')i++;

      // ── Structural commands ──────────────────────────────
      if(cmd==='\\frac'||cmd==='\\dfrac'||cmd==='\\tfrac'){
        var num=extractBraces(s,i);i=num.end;
        var den=extractBraces(s,i);i=den.end;
        // Inside fraction: no numeric indicator needed (Rule 3.4.1)
        var numNem=latexToNemethAsc(num.content).replace(/^#/,'');
        var denNem=latexToNemethAsc(den.content).replace(/^#/,'');
        // 檢測是否為繁分數（內層含簡單分數 ?…/…# 或 _?…/…_#）
        // Nemeth 2022 §13.6: 繁分數用 ,? ,/ ,# 標記
        var innerHasFrac=/[_]?\?[^?#]*\/[^?#]*#/.test(numNem)||/[_]?\?[^?#]*\/[^?#]*#/.test(denNem);
        var innerHasComplex=/,\?[^]*,\//.test(numNem)||/,\?[^]*,\//.test(denNem);
        // Mixed number: if result ends with a digit, use _? _# (Rule 13.4)
        var prevR=result.slice(-1);
        if(innerHasComplex){
          // Hypercomplex: ,,? … ,,/ … ,,#  (Nemeth 2022 §13.7, 超繁分數)
          result+=',,?'+numNem+',,/'+denNem+',,#';
        }else if(innerHasFrac){
          // Complex: ,? … ,/ … ,#  (Nemeth 2022 §13.6, 繁分數)
          result+=',?'+numNem+',/'+denNem+',#';
        }else if(/[0-9]/.test(prevR)){
          result+='_?'+numNem+'/'+denNem+'_#';
        }else{
          result+='?'+numNem+'/'+denNem+'#';
        }
        continue;
      }
      if(cmd==='\\sqrt'){
        var opt=extractBracket(s,i);i=opt.end;
        var rad=extractBraces(s,i);i=rad.end;
        // Inside radical: no numeric indicator (Rule 3.4.1)
        // Strip leading # from both index and radicand — the radical
        // sign > already acts as the "indicator" that suppresses #.
        var radNem=latexToNemethAsc(rad.content).replace(/^#/,'');
        if(opt.content!==null){
          var idxNem=latexToNemethAsc(opt.content).replace(/^#/,'');
          result+='<'+idxNem+'>'+radNem+']';
        }else{
          result+='>'+radNem+']';
        }
        continue;
      }
      if(cmd==='\\overline'){
        var inner=extractBraces(s,i);i=inner.end;
        var content=inner.content.trim();
        // capL equivalent
        var caps=content.split('').map(function(c){
          if(/[A-Z]/.test(c))return','+c;
          if(/[a-z0-9]/.test(c))return c;
          return '';
        }).join('');
        if(caps.length===1||(caps.length===2&&caps[0]===',')){
          result+=caps+':';
        }else{
          result+='"'+caps+'<:]';
        }
        continue;
      }
      if(cmd==='\\overrightarrow'){
        var inner=extractBraces(s,i);i=inner.end;
        var caps=inner.content.trim().split('').map(function(c){return /[A-Z]/.test(c)?','+c:/[a-z]/.test(c)?c:'';}).join('');
        result+='"'+caps+'<$O]';continue;
      }
      if(cmd==='\\overleftrightarrow'){
        var inner=extractBraces(s,i);i=inner.end;
        var caps=inner.content.trim().split('').map(function(c){return /[A-Z]/.test(c)?','+c:/[a-z]/.test(c)?c:'';}).join('');
        result+='"'+caps+'<$[33O]';continue;
      }
      if(cmd==='\\vec'){
        var inner=extractBraces(s,i);i=inner.end;
        var caps=inner.content.trim().split('').map(function(c){return /[A-Z]/.test(c)?','+c:/[a-z]/.test(c)?c:'';}).join('');
        result+='"'+caps+'<$33O]';continue;
      }
      if(cmd==='\\overset'){
        // \overset{\frown}{XY} -> arc
        var mod=extractBraces(s,i);i=mod.end;
        var base=extractBraces(s,i);i=base.end;
        if(mod.content.trim()==='\\frown'||mod.content.trim()==='\frown'){
          var caps=base.content.trim().split('').map(function(c){return /[A-Z]/.test(c)?','+c:/[a-z]/.test(c)?c:'';}).join('');
          result+='"'+caps+'<$A]';
        }else{
          result+='"'+latexToNemethAsc(base.content)+'<'+latexToNemethAsc(mod.content)+']';
        }
        continue;
      }
      if(cmd==='\\begin'){
        var env=extractBraces(s,i);i=env.end;
        var envName=env.content.trim();
        // 聯立方程式 cases → .,( … (Nemeth 2022 §19.6 大括號)
        // PDF §17.4(a): "If only the left or right grouping sign is shown
        // in print, only that symbol is shown in braille." LaTeX's cases
        // environment renders with only a left brace in print (Example
        // 17-5), so we emit only .,( on each row — no right .,) symbol.
        // (For the two-sided variant of Example 17-6, the input should
        // use \left\{ ... \right\} + array, handled separately.)
        // 17.4(d): "The numeric indicator is not required before the
        // first numeric character following a left grouping symbol."
        // We implement this conservatively: only strip a leading #
        // that is literally the first character of the Nemeth output
        // (i.e. a plain digit start like "5X-Y"). We do NOT strip a #
        // that appears after a sign (e.g. "-#1"), since the "first
        // numeric *character*" in that case is after the minus.
        if(envName==='cases'){
          var endIdx=s.indexOf('\\end{cases}',i);
          if(endIdx<0)endIdx=s.indexOf('\\end',i);
          var body=endIdx>=0?s.slice(i,endIdx):s.slice(i);
          i=endIdx>=0?endIdx+('\\end{cases}'.length):s.length;
          var lines=body.split(/\\\\/);
          var validLines=[];
          for(var li=0;li<lines.length;li++){
            var ln=lines[li].replace(/^\s+|\s+$/g,'');
            if(ln)validLines.push(ln);
          }
          var caseRows=[];
          for(var li=0;li<validLines.length;li++){
            // 處理行內的 & (對齊符號)：取第一個 & 之前的部分
            var mainCell=validLines[li].split('&')[0].replace(/\s+$/,'');
            // 脫掉外層 {...} 如 "{x+y=15}" -> "x+y=15"
            mainCell=mainCell.replace(/^\{([\s\S]*)\}$/,'$1').replace(/^\s+|\s+$/g,'');
            if(!mainCell)continue;
            var lineNem=latexToNemethAsc(mainCell);
            // PDF 17.4(d): strip leading # when the row starts with a
            // digit in direct contact with the left enlarged brace.
            lineNem=lineNem.replace(/^#/,'');
            // Only left brace — no trailing .,) (§17.4(a))
            caseRows.push('.,('+lineNem);
          }
          result+=caseRows.join('\n');
          continue;
        }
        // 矩陣 matrix / pmatrix / bmatrix → `,( … `,) (Nemeth 2022 §25.8, 放大括號)
        // pmatrix = 圓括號, bmatrix = 方括號, 無裝飾 matrix 也用方括號形式
        if(envName==='matrix'||envName==='pmatrix'||envName==='bmatrix'||envName==='Bmatrix'){
          var endTag='\\end{'+envName+'}';
          var endIdx=s.indexOf(endTag,i);
          if(endIdx<0)endIdx=s.indexOf('\\end',i);
          var body=endIdx>=0?s.slice(i,endIdx):s.slice(i);
          i=endIdx>=0?endIdx+endTag.length:s.length;
          var lines=body.split(/\\\\/);
          var matResult='';
          var validLines=[];
          for(var li=0;li<lines.length;li++){
            var ln=lines[li].replace(/^\s+|\s+$/g,'');
            if(ln)validLines.push(ln);
          }
          // 清除前文的 \left[ sentinel (editor 產生 \left [ \begin{matrix}...\right ])
          result=result.replace(/\\left\[\s*$/,'').replace(/\\left\|\s*$/,'');
          // Bmatrix 用大括號，其他用方括號
          var open=(envName==='Bmatrix')?'.,(':'`,(';
          var close=(envName==='Bmatrix')?'.,)':'`,)';
          for(var li=0;li<validLines.length;li++){
            var cellParts=validLines[li].split(/&/).map(function(c){return latexToNemethAsc(c.trim());});
            matResult+=open+cellParts.join(' ')+close+(li<validLines.length-1?'\n':'');
          }
          result+=matResult;
          // 吃掉後續的 \right] / \right| (含空白)
          eatRightDelim(s,i);
          // 把 eatRightDelim 的結果反映回 i
          i=eatRightDelimIndex;
          continue;
        }
        // 行列式 vmatrix / Vmatrix → ,\ ... ,\ (Nemeth 2022 §25.8 垂直線)
        // 對照 PDF Example 25-63: row 兩端都是 ,\ (Nemeth ASCII) = ⠠⠳
        if(envName==='vmatrix'||envName==='Vmatrix'){
          var endTag='\\end{'+envName+'}';
          var endIdx=s.indexOf(endTag,i);
          if(endIdx<0)endIdx=s.indexOf('\\end',i);
          var body=endIdx>=0?s.slice(i,endIdx):s.slice(i);
          i=endIdx>=0?endIdx+endTag.length:s.length;
          var lines=body.split(/\\\\/);
          var detResult='';
          var validLines=[];
          for(var li=0;li<lines.length;li++){
            var ln=lines[li].replace(/^\s+|\s+$/g,'');
            if(ln)validLines.push(ln);
          }
          for(var li=0;li<validLines.length;li++){
            var cellParts=validLines[li].split(/&/).map(function(c){return latexToNemethAsc(c.trim());});
            detResult+=',\\'+cellParts.join(' ')+',\\'+(li<validLines.length-1?'\n':'');
          }
          result+=detResult;continue;
        }
        // array 環境 (可能配合 \left|…\right| 成為行列式，或 \left[…\right] 成為矩陣)
        if(envName==='array'){
          // 跳過 column spec，例如 {cc} {c|c}
          if(i<s.length&&s[i]==='{'){
            var spec=extractBraces(s,i);i=spec.end;
          }
          var endIdx=s.indexOf('\\end{array}',i);
          if(endIdx<0)endIdx=s.indexOf('\\end',i);
          var body=endIdx>=0?s.slice(i,endIdx):s.slice(i);
          i=endIdx>=0?endIdx+('\\end{array}'.length):s.length;
          var lines=body.split(/\\\\/);
          var arrResult='';
          var validLines=[];
          for(var li=0;li<lines.length;li++){
            var ln=lines[li].replace(/^\s+|\s+$/g,'');
            if(ln)validLines.push(ln);
          }
          // 檢查前文 sentinel 來決定類型：
          //   \left|    → 行列式 (enlarged vertical bar ,\)
          //   \left\{   → 雙邊聯立方程式 (enlarged brace .,( ... .,)，Example 17-6)
          //   \left[    → 矩陣 (enlarged bracket @,(, Nemeth ASCII)
          //   (沒有)    → 退回矩陣預設
          var isDet=/\\left\s*\|\s*$/.test(result)||/\\left\s*\\vert\s*$/.test(result);
          var isTwoSidedCases=/\\left\\\{\s*$/.test(result);
          // 清除 sentinel
          result=result.replace(/\\left\s*\|\s*$/,'')
                       .replace(/\\left\s*\\vert\s*$/,'')
                       .replace(/\\left\\\{\s*$/,'')
                       .replace(/\\left\[\s*$/,'');
          var open, close;
          if(isDet){ open='@,('; close='@,)'; }
          else if(isTwoSidedCases){ open='.,('; close='.,)'; }
          else { open='`,('; close='`,)'; }
          for(var li=0;li<validLines.length;li++){
            var cellParts=validLines[li].split(/&/).map(function(c){return latexToNemethAsc(c.trim());});
            // §17.4(d) for two-sided cases: strip leading # on first
            // numeric in contact with the left enlarged brace.
            if(isTwoSidedCases && cellParts.length>0){
              cellParts[0]=cellParts[0].replace(/^#/,'');
            }
            arrResult+=open+cellParts.join(' ')+close+(li<validLines.length-1?'\n':'');
          }
          result+=arrResult;
          eatRightDelim(s,i);
          i=eatRightDelimIndex;
          continue;
        }
        continue;
      }
      if(cmd==='\\end'){extractBraces(s,i);i+=0;continue;} // skip \end{...}
      if(cmd==='\\binom'){
        var top=extractBraces(s,i);i=top.end;
        var bot=extractBraces(s,i);i=bot.end;
        result+='('+latexToNemethAsc(top.content)+'%'+latexToNemethAsc(bot.content)+')';
        continue;
      }
      // ── Geometry shapes (Rule 17) ─────────────────────
      if(cmd==='\\angle'){result+='$[ ';continue;}
      if(cmd==='\\triangle'){result+='$T ';continue;}
      if(cmd==='\\square'){result+='$4';continue;}
      if(cmd==='\\perp'){result+=' $P ';continue;}
      if(cmd==='\\parallel'){result+=' $L ';continue;}
      if(cmd==='\\cong'){result+=' @:.K ';continue;}
      if(cmd==='\\sim'){result+=' @: ';continue;}
      if(cmd==='\\log'){
        var sub=extractBracket(s,i);i=sub.end;
        if(sub.content!==null){result+='log;'+latexToNemethAsc(sub.content);
          if(i<s.length&&s[i]==='{'){var a=extractBraces(s,i);i=a.end;result+=' '+latexToNemethAsc(a.content);}
        }else result+='log ';continue;
      }
      if(cmd==='\\lim'){
        var sub=extractBraces(s,i);
        if(i<s.length&&s[i]==='_'){i++;sub=extractBraces(s,i);i=sub.end;result+='"lim%'+latexToNemethAsc(sub.content);}
        else result+='lim ';
        continue;
      }
      if(cmd==='\\sum'){result+='".,S';continue;}
      if(cmd==='\\prod'){result+='".,P';continue;}
      if(cmd==='\\int'){result+='!';continue;}
      if(cmd==='\\iint'){result+='!!';continue;}
      if(cmd==='\\iiint'){result+='!!!';continue;}
      if(cmd==='\\left'||cmd==='\\right'){
        // 多數情況只需丟掉；但 \left| \left[ \left\{ 要看後面是否是 \begin{array}
        // 決定是行列式/矩陣/雙邊聯立方程式
        // 抓下一個非空字元
        var j=i;
        while(j<s.length&&s[j]===' ')j++;
        var nextCh=s[j]||'';
        // 判斷分隔符類型 (準備與 \begin{array} 結合)
        var isLeftVert=(cmd==='\\left'&&(nextCh==='|'||s.slice(j,j+5)==='\\vert'));
        var isLeftBrack=(cmd==='\\left'&&nextCh==='[');
        // \left\{ → 代表雙邊聯立方程式 (Example 17-6: 左右都有 enlarged brace)
        var isLeftBrace=(cmd==='\\left'&&s.slice(j,j+2)==='\\{');
        if(isLeftVert||isLeftBrack||isLeftBrace){
          // 跳過分隔符並前瞻看是否緊跟 \begin{array} 或 \begin{matrix}
          var k=j;
          if(nextCh==='|')k=j+1;
          else if(s.slice(j,j+5)==='\\vert')k=j+5;
          else if(nextCh==='[')k=j+1;
          else if(isLeftBrace)k=j+2; // skip \{
          while(k<s.length&&s[k]===' ')k++;
          if(s.slice(k,k+6)==='\\begin'){
            // 留下 sentinel (反引號不會出現在 LaTeX 裡，當作 sentinel 安全)
            result+=isLeftVert?'\\left|':(isLeftBrack?'\\left[':'\\left\\{');
            i=k;
            continue;
          }
        }
        // 一般情況：直接丟掉
        continue;
      }
      if(cmd==='\\mathbb'){
        var arg=extractBraces(s,i);i=arg.end;
        result+=',_'+arg.content.trim();continue;
      }
      if(cmd==='\\mathrm'||cmd==='\\text'||cmd==='\\operatorname'){
        var arg=extractBraces(s,i);i=arg.end;
        result+=arg.content;continue;
      }
      // ── Simple command lookup ────────────────────────────
      var found=false;
      for(var si=0;si<LATEX_SIMPLE.length;si++){
        if(cmd===LATEX_SIMPLE[si][0]){result+=LATEX_SIMPLE[si][1];found=true;break;}
      }
      if(!found)result+=cmd.slice(1).toUpperCase()+' '; // unknown -> uppercase
      continue;
    }

    // ── Superscript ^ ─────────────────────────────────────────────────────
    if(c==='^'){
      i++;
      // Bare ^\circ (no braces): degree symbol
      if(s.slice(i,i+5)==='\\circ'&&(i+5>=s.length||!/[a-zA-Z]/.test(s[i+5]))){
        i+=5; result+='^.*'; continue;
      }
      var exp=extractBraces(s,i);
      var expTrim=exp.content.trim();
      if(expTrim==='\\circ'||expTrim==='\circ'){
        i=exp.end; result+='^.*'; continue;
      }
      i=exp.end;
      // Inside superscript: no numeric indicator (Rule 3.4.1)
      // The baseline indicator " is appended only when there are more
      // math objects following at the baseline (handled in cleanup below).
      result+='^'+latexToNemethAsc(expTrim).replace(/^#/,'')+'"\x01';
      continue;
    }

    // ── Subscript _ ───────────────────────────────────────
    if(c==='_'){
      i++;
      var sub=extractBraces(s,i);i=sub.end;
      // Inside subscript: no numeric indicator (Rule 3.4.1)
      result+=';'+latexToNemethAsc(sub.content.trim()).replace(/^#/,'')+'"\x01';
      continue;
    }

    // ── Braces {} as grouping ─────────────────────────────
    if(c==='{'){
      var grp=extractBraces(s,i);i=grp.end;
      var grpNem=latexToNemethAsc(grp.content);
      // If the preceding output ends with `\` (abs-value bar), the first
      // digit inside the group does not need a numeric indicator —
      // analogous to Nemeth §17.4(d) for grouping signs in general.
      var lastOut=result.slice(-1);
      if(lastOut==='\\'&&grpNem.charAt(0)==='#')grpNem=grpNem.slice(1);
      result+=grpNem;
      continue;
    }
    if(c==='}'){i++;continue;}

    // ── Digits ───────────────────────────────────────────
    if(/[0-9]/.test(c)){
      var numStart=i;
      while(i<s.length&&(/[0-9]/.test(s[i])||s[i]==='.'))i++;
      var num=s.slice(numStart,i);
      // Numeric indicator # rules (Nemeth Rule 3.3 / 3.4.1):
      //   Required:  at expression start, or after a space (incl. after .K etc.)
      //   NOT needed: after ^ ; ? / > ( [ < ! , and similar grouping/operator chars
      //   Special:   after a NEGATIVE SIGN `-` (not subtraction), # IS needed.
      //              A `-` is a negative sign when it follows a space, `(`, or is
      //              at position 0 of result. A `-` is subtraction when it follows
      //              a digit or letter.
      var prev=result.length?result.slice(-1):'';
      var noHashChars='^;?/>(![<@*=,';  // comma added: inside (a, b) no # needed
      var needHash=!result||prev===' ';
      if(prev&&noHashChars.indexOf(prev)>=0)needHash=false;
      // Space after comma (coordinate separator) must NOT trigger #.
      // e.g. "(0, 6)" — the space is from ", " in symMap, but 6 needs no #.
      if(prev===' '&&result.length>=2&&result.charAt(result.length-2)===',')needHash=false;
      // `-` as NEGATIVE SIGN → digit still needs #.
      // Negative sign context: result is empty (expression-leading -)
      // OR the minus follows a space (after = or similar operator padding).
      // Inside brackets `(`, the - is also a negative sign but Nemeth
      // §3.4.1 suppresses # after `(`, so we don't force # there.
      if(prev==='-'){
        var prevprev=result.length>=2?result.charAt(result.length-2):'';
        if(!prevprev||prevprev===' ')needHash=true;
        // prevprev==='(' → still suppressed (bracket context, handled by noHashChars above)
      }
      // After letters: no # (Rule 3.4.1)
      if(prev&&/[A-Z]/.test(prev))needHash=false;
      result+=(needHash?'#':'')+num;
      continue;
    }

    // ── Uppercase letters -> cap indicator + letter ──────
    if(/[A-Z]/.test(c)){
      result+=','+c;i++;continue;
    }

    // ── Lowercase letters -> as-is ────────────────────────
    if(/[a-z]/.test(c)){
      result+=c.toUpperCase();i++;continue;
    }

    // ── Common symbols ────────────────────────────────────
    var symMap={'=':' .K ','<':' "K ','>':" .1 ",'+':"+",
      '-':'-','*':'*','/':'_/',',':', ','.':'.',
      '(':'(',')':')','[':'`(',']':'`)',
      '|':'\\','!':'&','%':'`0',
    };
    if(symMap[c]!==undefined){result+=symMap[c];i++;continue;}

    // Degree symbol direct
    if(c==='°'){result+='^.*';i++;continue;}

    // LaTeX spaces: single spaces are typographic (e.g. "3 + 5") and
    // invisible in rendered math — skip them. Two or more consecutive
    // spaces signal an intentional separator (e.g. "x=3  y=2") and map
    // to a single Nemeth blank cell. \  (backslash-space) also means
    // an explicit space.
    if(c===' '){
      var spCount=0;
      while(i<s.length&&s[i]===' '){spCount++;i++;}
      if(spCount>=2)result+=' '; // intentional separator → one space
      // single space → skip (typographic only)
      continue;
    }

    result+=c;i++;
  }
  // Clean up baseline indicators (⠐ / "):
  // A baseline indicator is needed ONLY when there are still base-level
  // math objects following the super/subscript. Strip the marker `"\x01`
  // when nothing follows it (end of expression or only whitespace/space),
  // and remove the sentinel \x01 everywhere else (keeping the actual ").
  result = result.replace(/"\x01(\s*)$/,'$1');   // trailing " → remove
  result = result.replace(/"\x01/g,'"');          // mid-expression " → keep
  return result;
}


// =====================================================================
// NEMETH ASCII -> LATEX  (self-contained, no Abraham dependency)
// =====================================================================
var GREEK_MAP={
  '.A':'\\alpha','.B':'\\beta','.G':'\\gamma','.D':'\\delta',
  '.E':'\\epsilon','.Z':'\\zeta','.?':'\\theta','.I':'\\iota',
  '.K':'\\kappa','.L':'\\lambda','.M':'\\mu','.N':'\\nu',
  '.O':'\\omicron','.P':'\\pi','.R':'\\rho','.S':'\\sigma',
  '.T':'\\tau','.U':'\\upsilon','.F':'\\phi','.X':'\\xi',
  '.W':'\\omega','.Y':'\\psi','.:':'\\eta',
  '.*':'\\circ',
  '.,A':'\\mathrm{A}','.,B':'\\Beta','.,G':'\\Gamma','.,D':'\\Delta',
  '.,E':'\\mathrm{E}','.,Z':'\\mathrm{Z}','.,?':'\\Theta',
  '.,I':'\\mathrm{I}','.,K':'\\mathrm{K}','.,L':'\\Lambda',
  '.,M':'\\mathrm{M}','.,N':'\\mathrm{N}','.,O':'\\mathrm{O}',
  '.,P':'\\Pi','.,R':'\\mathrm{R}','.,S':'\\Sigma',
  '.,T':'\\mathrm{T}','.,U':'\\Upsilon','.,F':'\\Phi',
  '.,W':'\\Omega','.,Y':'\\Psi','.,X':'\\Xi',
};

// Ordered token replacements (longer first to avoid partial matches)
// brl2asc 產出的是大寫字母、用 @ 表達 dot-4，這裡要與之一致
var NEM_TOKENS=[
  // 近似值 ≑ (dot over + dot under) - must be before \\approx pattern
  [' ".K%*<*] ',' \\fallingdotseq '],
  // 全等 ≅
  [' @:.K ',' \\cong '],
  // Geometry
  [' $P ',' \\perp '],[' $L ',' \\parallel '],[' /$L ',' \\nparallel '],
  [' @: ',' \\sim '],
  [' $[33O ',' \\iff '],[' $33O ',' \\implies '],
  // Comparison (longer patterns first)
  [' /.K ',' \\ne '],[' "K: ',' \\le '],[' .1: ',' \\ge '],
  // Ratio (比) and proportion (比例) per PDF 21.2 Example 21-34.
  // Tokens have leading/trailing spaces per the spec layout.
  [' "1 ',' \\ratio '],
  [' ;2 ',' \\proportion '],
  [' .K ',' = '],['.K','='],['"K ',' < '],['.1 ',' > '],
  // Arithmetic
  ['+-','\\pm '],
  ['-+','\\mp '],
  ['@*','\\times '],
  ['./','\\div '],
  ['.+','\\cup '],
  ['.%','\\cap '],
  [',=','\\infty '],
  // approximately equal (≈) — must be after fallingdotseq match
  ['@:@:','\\approx '],
  // Set/Logic (大寫 E 代表字母 e，@ 代表 dot-4)
  ['/@E','\\notin '],['@E','\\in '],
  ['@&','\\forall '],['@"6','\\exists '],['@: ','\\neg '],
  ['_"K:','\\subseteq '],['_"K','\\subset '],
  ['_.1:','\\supseteq '],['_.1','\\supset '],
  ['_0','\\emptyset '],
  // Misc
  [',*','\\therefore '],
  ['@/','\\because '],
  [',_N','\\mathbb{N}'],
  [',_Z','\\mathbb{Z}'],
  [',_Q','\\mathbb{Q}'],
  [',_R','\\mathbb{R}'],
  [',_C','\\mathbb{C}'],
  // Trig/functions
  ['SIN ','\\sin '],['COS ','\\cos '],['TAN ','\\tan '],
  ['COT ','\\cot '],['SEC ','\\sec '],['CSC ','\\csc '],
  ['LOG','\\log'],['LIM','\\lim'],
  // Dots
  ["'''","\\cdots "],
  // (Absolute value bars handled generically in parseNemStr, not here —
  // the old '\\X\\':'|x|' hack only covered one hard-coded case.)
];

function applyNemTokens(s){
  for(var i=0;i<NEM_TOKENS.length;i++){
    s=s.split(NEM_TOKENS[i][0]).join(NEM_TOKENS[i][1]);
  }
  return s;
}

// Convert lone Nemeth absolute-value bars (the ASCII backslash `\`,
// corresponding to Unicode braille ⠳ U+2833) into LaTeX `|...|`.
// Nemeth uses the same bar character for both the opening and closing
// of an absolute value, so there's no per-bar open/close distinction.
// We pair them in order: the 1st and 2nd lone bar form a pair, 3rd and
// 4th form another, etc.
//
// Runs AFTER applyNemTokens/parseNemRadical, so the string already
// contains LaTeX commands like `\pm`, `\sqrt`, `\sin`, `\left`, `\frac`,
// `\begin{...}`. Those backslashes are NOT abs bars and must be skipped.
//
// Edge cases:
//   - `\` followed by a LOWERCASE letter is a LaTeX command start. Skip
//     the entire command name (LaTeX commands use lowercase; uppercase
//     after `\` is a Nemeth-ASCII variable name, e.g. `\X\` = |x|).
//   - `_\` is the double-bar (`\Vert`) prefix — leave alone.
//   - Odd count of lone bars → typo. Leave the last one raw.
//
// Known limitation: nested bars like `||x|-|y||` are mis-paired by the
// "every two consecutive bars form a pair" rule. Use \lvert/\rvert for
// those (not handled here).
function pairNemAbsBars(s){
  // Process each line independently (abs values don't span lines).
  return s.split('\n').map(function(line){
    // Single pass: collect bar positions, skipping over LaTeX commands
    // and `_\` double-bar prefixes.
    var barPositions = [];
    var i = 0, n = line.length;
    while(i < n){
      var c = line.charAt(i);
      // LaTeX command: `\` followed by lowercase letter. Skip the whole
      // command name (which may contain mixed-case letters after the
      // first — rare but possible, e.g. someone's custom `\myCmd`).
      if(c === '\\' && i+1 < n && /[a-z]/.test(line.charAt(i+1))){
        i++; // the \
        while(i < n && /[a-zA-Z]/.test(line.charAt(i))) i++;
        continue;
      }
      // `_\` double-bar prefix — skip both characters verbatim, don't
      // treat the `\` as a candidate abs bar.
      if(c === '_' && line.charAt(i+1) === '\\'){
        i += 2;
        continue;
      }
      // Any other `\` at this point is an abs bar candidate.
      if(c === '\\'){
        barPositions.push(i);
      }
      i++;
    }
    // Pair them: 1st+2nd → |...|, 3rd+4th → |...|, etc.
    // If odd count: leave the last one as `\`.
    var barSet = {};
    var pairableCount = barPositions.length - (barPositions.length % 2);
    for(var p = 0; p < pairableCount; p++){
      barSet[barPositions[p]] = true;
    }
    // Build output.
    var result = '';
    for(var k = 0; k < n; k++){
      if(barSet[k]){
        result += '|';
      } else {
        result += line.charAt(k);
      }
    }
    return result;
  }).join('\n');
}

function applyGreek(s){
  // Match .X  .,X  patterns (Greek letters)
  return s.replace(/\.,[A-Z?]/g,function(m){return GREEK_MAP[m]?GREEK_MAP[m]+' ':m;})
          .replace(/\.[A-Z?&.:*]/g,function(m){return GREEK_MAP[m]?GREEK_MAP[m]+' ':m;});
}

function parseNemFrac(s){
  // Hypercomplex fraction ,,?…,,/…,,#  (Nemeth 2022 §13.7, 超繁分數)
  var max=10;
  while(max-->0){
    var prev=s;
    s=s.replace(/,,\?([^]+?),,\/([^]+?),,#/,function(m,num,den){
      return '\\frac{'+parseNemStr(num)+'}{'+parseNemStr(den)+'}';
    });
    if(s===prev)break;
  }
  // Complex fraction ,?…,/…,#  (Nemeth 2022 §13.6, 繁分數)
  // 繁分數裡可能含簡單分數，需遞迴用 parseNemStr 處理
  max=10;
  while(max-->0){
    var prev=s;
    s=s.replace(/,\?([^]+?),\/([^]+?),#/,function(m,num,den){
      return '\\frac{'+parseNemStr(num)+'}{'+parseNemStr(den)+'}';
    });
    if(s===prev)break;
  }
  // Mixed number fraction: INTEGER_?num/den_#  (Rule 13.4)
  max=10;
  while(max-->0){
    var prev=s;
    s=s.replace(/([0-9]+)_\?([^_]+)\/([^_]+)_#/,function(m,intPart,num,den){
      return intPart+'\\frac{'+parseNemStr(num)+'}{'+parseNemStr(den)+'}';
    });
    if(s===prev)break;
  }
  // Simple fraction: ?num/den#
  max=10;
  while(max-->0){
    var prev=s;
    s=s.replace(/\?([^?#\/]+)\/([^#]+)#/,function(m,num,den){
      return '\\frac{'+parseNemStr(num)+'}{'+parseNemStr(den)+'}';
    });
    if(s===prev)break;
  }
  return s;
}

function parseNemRadical(s){
  // Indexed radical: <idx>radicand]
  s=s.replace(/<([^>]+)>([^\]]+)\]/g,function(m,idx,rad){
    return '\\sqrt['+parseNemStr(idx)+']{'+parseNemStr(rad)+'}';
  });
  // Simple radical: >radicand]
  s=s.replace(/>([^\]]+)\]/g,function(m,rad){
    return '\\sqrt{'+parseNemStr(rad)+'}';
  });
  return s;
}

function parseNemLevel(s){
  // Superscript ^expr"
  s=s.replace(/\^([^"^;]+)"/g,function(m,e){return '^{'+parseNemStr(e)+'}';});
  // Subscript ;expr"
  s=s.replace(/;([^";^]+)"/g,function(m,e){return '_{'+parseNemStr(e)+'}';});
  return s;
}

function parseNemStr(s){
  s=s.trim();
  s=parseNemFrac(s);
  s=parseNemRadical(s);
  s=parseNemLevel(s);
  s=applyNemTokens(s);
  s=pairNemAbsBars(s);
  s=applyGreek(s);
  // Cap indicators: ,A -> A (uppercase), bare A -> a (lowercase)
  // Rule 5: comma = cap indicator, so ,A = uppercase A; bare A = lowercase a.
  // Use a two-pass approach to avoid regex-in-marker issues:
  var capOut='', capSrc=s, capI=0, capBrace=0;
  while(capI<capSrc.length){
    var capCh=capSrc[capI];
    if(capCh==='{')capBrace++;
    else if(capCh==='}')capBrace--;
    else if(capCh==='\\'){ // inside LaTeX command - skip command name
      capOut+=capCh; capI++;
      while(capI<capSrc.length&&/[a-zA-Z]/.test(capSrc[capI])){capOut+=capSrc[capI];capI++;}
      continue;
    }
    if(capBrace>0){
      // Inside {}: keep as-is (already formatted by GEO patterns)
      capOut+=capCh; capI++; continue;
    }
    if(capCh===','&&capI+1<capSrc.length&&/[A-Z]/.test(capSrc[capI+1])){
      capOut+=capSrc[capI+1]; // cap indicator + letter = uppercase
      capI+=2;
    }else if(/[A-Z]/.test(capCh)){
      capOut+=capCh.toLowerCase(); // bare uppercase = lowercase
      capI++;
    }else{
      capOut+=capCh; capI++;
    }
  }
  s=capOut;
    // Strip numeric indicator #
  s=s.replace(/#/g,'');
  // Strip lone baseline return "
  s=s.replace(/(?<![\\])"(?![{])/g,'');
  return s.trim();
}

function nemBrlToLatex(brl){
  var asc=brl2asc(brl);
  // Apply GEO table nemRe patterns first (geometry)
  for(var gi=0;gi<GEO.length;gi++){
    var g=GEO[gi];
    if(!g.nemRe)continue;
    g.nemRe.lastIndex=0;
    asc=asc.replace(g.nemRe,function(){
      var args=Array.prototype.slice.call(arguments,0,-2);
      return g.n2l(args);
    });
  }
  return parseNemStr(asc);
}

function nemAscClean(s){
  s=s.replace(/,([A-Z])/g,'$1');
  s=s.replace(/\.K/g,' = ');
  s=s.replace(/#(\d+)/g,'$1');
  s=s.replace(/^"/,'');
  return s.trim();
}

// =====================================================================
// LaTeX -> Nemeth  full text  (Rule 4.2 / 4.8 switch indicators)
// Handles \n in input -> newline in output + preview sync
// =====================================================================
// Match either \(...\) or $...$ inline math.
// $...$ uses [^$\n] to avoid spanning empty $$ and to stay on one line.
var MATH_RE=/\\\(([\s\S]*?)\\\)|\$([^$\n]+?)\$/g;

// =====================================================================
// Scroll synchronisation for the three main panels
//
// Design: Input is always the MASTER. When the user scrolls the input
// textarea, any follower whose checkbox is checked scrolls proportionally.
// Preview and Output are FOLLOWERS only — scrolling them does NOT drive
// any other panel. The checkboxes are on Preview and Output only.
//
//   L2N:  l2n-in (master) → l2n-prev (chk: sync-l2n-prev)
//                         → l2n-out  (chk: sync-l2n-out)
//   N2L:  n2l-in (master) → n2l-prev (chk: sync-n2l-prev)
//                         → n2l-out  (chk: sync-n2l-out)
// =====================================================================
var SYNC_MASTERS = [
  { masterId: 'l2n-in',
    followers: [
      { elId: 'l2n-prev', chkId: 'sync-l2n-prev' },
      { elId: 'l2n-out',  chkId: 'sync-l2n-out'  },
    ]
  },
  { masterId: 'n2l-in',
    followers: [
      { elId: 'n2l-prev', chkId: 'sync-n2l-prev' },
      { elId: 'n2l-out',  chkId: 'sync-n2l-out'  },
    ]
  },
];
var _syncLock = false;

function updateSyncPanels() {
  for (var i = 0; i < SYNC_MASTERS.length; i++) {
    var grp = SYNC_MASTERS[i];
    var master = document.getElementById(grp.masterId);
    if (!master || master._syncBound) continue;
    (function(masterEl, followers) {
      masterEl.addEventListener('scroll', function () {
        if (_syncLock) return;
        var srcH = masterEl.scrollHeight - masterEl.clientHeight;
        if (srcH <= 0) return;
        var ratio = masterEl.scrollTop / srcH;
        _syncLock = true;
        for (var j = 0; j < followers.length; j++) {
          var f = followers[j];
          var chk = document.getElementById(f.chkId);
          if (!chk || !chk.checked) continue;
          var el = document.getElementById(f.elId);
          if (!el) continue;
          var h = el.scrollHeight - el.clientHeight;
          if (h > 0) el.scrollTop = ratio * h;
        }
        _syncLock = false;
      });
    })(master, grp.followers);
    master._syncBound = true;
  }
}

function l2nConvert(){
  var input=document.getElementById('l2n-in').value;
  var outEl=document.getElementById('l2n-out');
  var prevEl=document.getElementById('l2n-prev');
  var stEl=document.getElementById('l2n-st');

  if(!input.trim()){
    outEl.textContent='';outEl.className='box mono';
    prevEl.innerHTML='';stEl.textContent='';stEl.className='st';
    return;
  }

  // Process line by line so newlines stay in sync with preview
  var lines=input.split('\n');
  var outLines=[], prevLines=[], mathCount=0, errMsg='';

  for(var li=0;li<lines.length;li++){
    var line=lines[li];
    // Unicode math symbols → LaTeX (inside or outside math delimiters)
    line=line.replace(/×/g,'\\times ').replace(/÷/g,'\\div ');
    var outLine='', prevLine='';
    MATH_RE.lastIndex=0;
    var m, last=0;
    while((m=MATH_RE.exec(line))!==null){
      var prose=line.slice(last,m.index);
      // If outLine already ends with a space and this prose starts with
      // a space, deduplicate to avoid double-space between math and prose.
      if(outLine.slice(-1)===' ' && prose.charAt(0)===' ') prose=prose.slice(1);
      var proseNem=prose.replace(/×/g,'⠈⠡').replace(/÷/g,'⠨⠌');
      outLine+=proseNem; prevLine+=esc(prose);
      var latex=m[1]!==undefined?m[1]:m[2];
      try{
        var nemAsc=latexToNemethAsc(latex);
        var nemBrl=asc2brl(nemAsc);
        if(nemBrl.indexOf('\n')>=0){
          // Multi-line braille (matrix / spatial fraction): the braille
          // object must own its own lines so N2L's block scanner can
          // recognize the contiguous run. Prose before/after the math
          // span is pushed as its own line so nothing gets stuck to the
          // first or last braille row.
          var brlParts=nemBrl.split('\n');
          // Flush any accumulated prose prefix as its own line (if any)
          if(outLine.length>0 || prevLine.length>0){
            outLines.push(outLine);
            prevLines.push(prevLine);
          }
          // Each braille line becomes its own output line
          for(var bi=0;bi<brlParts.length;bi++){
            outLines.push(brlParts[bi]);
            // Attach the MathJax preview span to the first row only
            if(bi===0){
              prevLines.push('<span aria-label="math">\\('+esc(latex)+'\\)</span>');
            }else{
              prevLines.push('');
            }
          }
          outLine='';
          prevLine='';
        }else{
          // Add a single space before and after inline braille so it
          // doesn't run into adjacent prose. But only if the prose
          // doesn't already end/start with a space — avoid doubles.
          var pre = (outLine.length>0 && outLine.slice(-1)!==' ') ? ' ' : '';
          outLine+=pre+nemBrl+' ';
          // The trailing space will be trimmed if the next prose starts
          // with a space, via the final cleanup below.
          prevLine+='<span aria-label="math">\\('+esc(latex)+'\\)</span>';
        }
        mathCount++;
      }catch(e){
        errMsg=e.message;
        outLine+='[ERR:'+e.message+']';
        prevLine+='<span style="color:var(--red)" role="alert">[&#x932F;&#x8AA4;]</span>';
      }
      last=MATH_RE.lastIndex;
    }
    var tail=line.slice(last);
    if(outLine.slice(-1)===' ' && tail.charAt(0)===' ') tail=tail.slice(1);
    var tailNem=tail.replace(/×/g,'⠈⠡').replace(/÷/g,'⠨⠌');
    outLine+=tailNem; prevLine+=esc(tail);
    outLines.push(outLine);
    prevLines.push(prevLine);
  }

  outEl.textContent=outLines.join('\n');
  outEl.className='box mono'+(errMsg?' err':'');
  // Preview: join lines with <br> to preserve visual newlines
  prevEl.innerHTML=prevLines.join('<br>');
  if(window.MathJax&&mathCount>0){
    MathJax.typesetPromise([prevEl]).catch(function(){});
  }
  var status=errMsg
    ?'\u2717 \u932f\u8aa4\uff1a'+errMsg
    :mathCount
      ?'\u2713 \u5df2\u8f49\u63db '+mathCount+' \u500b\u6578\u5b78\u5340\u584a'
      :'\uff08\u672a\u627e\u5230 \\(...\\) \u6578\u5b78\u5340\u584a\uff09';
  stEl.textContent=status;
  stEl.className='st'+(errMsg?' err':' ok');
  // Announce to screen readers
  stEl.setAttribute('aria-live','polite');
}

// Detect and reconstruct multi-line Nemeth environments.
// Input: a block of one or more lines containing braille (and possibly
// spaces). Output: a LaTeX string (without surrounding \(...\)) that best
// represents the spatial structure.
//
// Spec references (Nemeth 2022, BANA):
//   - Section 13.10, Example 13-37/38/39: simple spatial fraction bar is
//     "?<run of 3s>#" in Nemeth ASCII, i.e. U+283A + N×U+2812 + U+283D
//     in Unicode braille. Numerator line above, denominator line below.
//   - Section 13.8, Example 13-32/33: hypercomplex spatial fraction bar
//     is ",,?333...,,#" — the ,, (U+2820 U+2820) wrap indicates
//     hypercomplex opening/closing. Rare; we still reconstruct to \frac.
//   - Section 25.3.4: horizontal separation line in addition/subtraction
//     is a bare run of 3s with no ?/# wrapper. Not a fraction — we emit
//     an array environment for those.
function parseNemEnv(block){
  var blockLines=block.split('\n');
  // Strip trailing all-whitespace lines but keep interior blanks
  while(blockLines.length>1 && !/\S/.test(blockLines[blockLines.length-1])){
    blockLines.pop();
  }
  // Single-line: just delegate.
  if(blockLines.length===1){
    return nemBrlToLatex(blockLines[0]);
  }
  // A spatial fraction bar line, per 13.10: trimmed content is
  //   ?333...#       (simple spatial fraction)   or
  //   ,,?333...,,#   (hypercomplex spatial fraction)
  // Codepoints below are for this implementation's Pr table:
  //   ? -> U+2839 (idx 57),   # -> U+283C (idx 60),
  //   3 -> U+2812 (idx 18),   , -> U+2820 (idx 32)
  function isSimpleFracBar(s){
    var t=s.trim();
    return /^\u2839\u2812+\u283C$/.test(t);
  }
  function isHyperFracBar(s){
    var t=s.trim();
    return /^\u2820\u2820\u2839\u2812+\u2820\u2820\u283C$/.test(t);
  }
  function isFracBar(s){ return isSimpleFracBar(s) || isHyperFracBar(s); }
  // 3-line spatial fraction with a genuine ?...# bar
  if(blockLines.length===3 && isFracBar(blockLines[1])){
    var num=nemBrlToLatex(blockLines[0].trim());
    var den=nemBrlToLatex(blockLines[2].trim());
    return '\\frac{'+num+'}{'+den+'}';
  }
  // Generic multi-line (addition/subtraction separation lines per 25.3.4,
  // matrices, systems of equations, etc.): emit an array environment,
  // one row per line. Bar-only lines (bare run of U+2812, no ?/# wrapper)
  // render as \hline.
  function isBareSeparationLine(s){
    var t=s.trim();
    return /^\u2812+$/.test(t);
  }
  // Grouped-rows environments: each row is wrapped in a specific pair of
  // braille grouping symbols. Three variants per Nemeth 2022:
  //
  //   a) Enlarged grouping `,( ... `,) → bmatrix (bracketed matrix)
  //      (Example 25-60; U+2808 U+2820 U+2837 / U+2808 U+2820 U+283E)
  //   b) Brace grouping   .,( ... .,) → cases (system of equations)
  //      (Example 25-76; U+2828 U+2820 U+2837 / U+2828 U+2820 U+283E)
  //   c) Vertical-bar grouping ,\ ... ,\ → vmatrix (determinant)
  //      (Example 25-63; U+2820 U+2833 on both ends)
  //
  // We try each variant in turn; first one where every row matches wins.
  // Boundary condition notes (still apply):
  //   - Systems of equations WITHOUT braces (25-72..25-75) have none of
  //     these markers, fall through to generic array env.
  //   - Matrix with runover cells (25-62) uses REGULAR grouping ,( on
  //     continuation rows (no leading `), so it would fail variant (a)'s
  //     strict "every row" check. Intentional — we don't attempt to
  //     reconstruct runover matrices.
  //   - Adjacent-matrix products like `,(...`,)`*`,(...`,) on a single
  //     line are handled by the single-line nemBrlToLatex path, not here.
  var GROUPED_VARIANTS = [
    { name: 'bmatrix', env: 'bmatrix',
      open: '\u2808\u2820\u2837', close: '\u2808\u2820\u283E' },
    { name: 'cases',   env: 'cases',
      open: '\u2828\u2820\u2837', close: '\u2828\u2820\u283E' },
    { name: 'vmatrix', env: 'vmatrix',
      open: '\u2820\u2833',       close: '\u2820\u2833' },
  ];
  function rowCellsFor(variant, s){
    var t=s.trim();
    if(t.indexOf(variant.open)!==0) return null;
    // §17.4(a) — "if only the left or right grouping sign is shown in
    // print, only that symbol is shown in braille." For cases this means
    // the right enlarged brace `.,)` is optional (it's absent in the
    // standard LaTeX cases layout, Example 17-5; present in the two-
    // sided Example 17-6). Other variants (bmatrix, vmatrix) still
    // require matched close.
    var hasClose = (t.length >= variant.open.length + variant.close.length)
                   && (t.lastIndexOf(variant.close) === t.length - variant.close.length);
    if(variant.name !== 'cases' && !hasClose) return null;
    // Length guards differ per closing-brace status:
    //   with close: t must have room for open+close AND non-empty inner,
    //               so length > open+close (strict).
    //               This is also what prevents vmatrix (open==close) from
    //               self-matching a bare ",\,\" as empty cases.
    //   without close (cases only): just need open+at-least-one-inner-cell.
    if(hasClose){
      if(t.length <= variant.open.length + variant.close.length) return null;
    }else{
      // cases with no .,)  — require at least one cell of real content
      if(t.length <= variant.open.length) return null;
    }
    var inner = hasClose
      ? t.slice(variant.open.length, t.length - variant.close.length)
      : t.slice(variant.open.length);
    // cases rows are single equations, not multi-cell. Don't split on
    // spaces — the spaces around .K (=), .1 (>), etc. are Nemeth
    // syntax, not column separators. Treat the whole inner as one cell.
    if(variant.name === 'cases'){
      var whole = inner.replace(/^[\u2800 ]+|[\u2800 ]+$/g,'');
      return {cells: whole.length ? [whole] : [], hasClose: hasClose};
    }
    // matrix/vmatrix rows ARE multi-cell — split on blank braille cells
    // (U+2800) or ASCII spaces.
    return {
      cells: inner.split(/[\u2800 ]+/).filter(function(x){return x.length>0;}),
      hasClose: hasClose
    };
  }
  for(var vi=0; vi<GROUPED_VARIANTS.length; vi++){
    var variant = GROUPED_VARIANTS[vi];
    var allRows = true;
    var rowsForVariant = [];
    var closeFlags = [];
    for(var mi=0; mi<blockLines.length; mi++){
      var rowInfo = rowCellsFor(variant, blockLines[mi]);
      if(rowInfo === null){ allRows = false; break; }
      rowsForVariant.push(rowInfo.cells);
      closeFlags.push(rowInfo.hasClose);
    }
    if(allRows && rowsForVariant.length >= 1){
      // For cases: decide single-sided vs two-sided.
      //   all rows have .,)  → Example 17-6 form, emit \left\{…\right\}
      //                         with array (two-sided)
      //   no rows have .,)   → Example 17-5 form, emit \begin{cases}
      //   mixed              → fall back to \begin{cases} (conservative;
      //                         a mixed braille input is likely user typo
      //                         rather than an intentional layout)
      var twoSided = false;
      if(variant.name === 'cases'){
        var allClose = closeFlags.every(function(x){return x;});
        var noneClose = closeFlags.every(function(x){return !x;});
        twoSided = allClose;
        // (noneClose → single-sided; mixed → single-sided fallback)
      }
      var latexRows = [];
      for(var mr=0; mr<rowsForVariant.length; mr++){
        var rowCells = rowsForVariant[mr];
        var latexCells = [];
        for(var mc=0; mc<rowCells.length; mc++){
          var cell = rowCells[mc];
          // PDF 17.4(d): inside cases, the first numeric character
          // following the left enlarged brace has its numeric indicator
          // suppressed. When round-tripping N→L we must restore that #
          // so the downstream parser sees a properly-indicated number.
          // Only applies to the FIRST cell of each row (the one that
          // was in direct contact with the brace).
          if(variant.name === 'cases' && mc === 0){
            // Nemeth digits are the "lowered" (downshifted) a..j cells:
            // each letter's dots shift down one row. So '1' = ⠂ (U+2802,
            // dot 2 only), NOT ⠁ (U+2801, dot 1, which is 'a'/NABCC 1).
            // The numeric indicator ⠼ (U+283C) prefixes these cells.
            var NUM_IND = '\u283C';
            var DIGIT_CELLS =
              '\u2802\u2806\u2812\u2832\u2822\u2816\u2836\u2826\u2814\u2834';
              // 1=⠂ 2=⠆ 3=⠒ 4=⠲ 5=⠢ 6=⠖ 7=⠶ 8=⠦ 9=⠔ 0=⠴
            if(cell.length > 0 && cell.charAt(0) !== NUM_IND
               && DIGIT_CELLS.indexOf(cell.charAt(0)) >= 0){
              cell = NUM_IND + cell;
            }
          }
          latexCells.push(nemBrlToLatex(cell));
        }
        latexRows.push(latexCells.join(' & '));
      }
      if(twoSided){
        // Example 17-6: \left\{ <rows> \right\} wrapping an array{l}
        return '\\left\\{\\begin{array}{l}\n'+
               latexRows.join(' \\\\\n')+
               '\n\\end{array}\\right\\}';
      }
      return '\\begin{'+variant.env+'}\n'+
             latexRows.join(' \\\\\n')+
             '\n\\end{'+variant.env+'}';
    }
  }
  var rows=[];
  var hasSepLine=false;
  for(var li=0;li<blockLines.length;li++){
    var bl=blockLines[li];
    if(!/\S/.test(bl)){ rows.push(''); continue; }
    if(isBareSeparationLine(bl)){ rows.push('\\hline'); hasSepLine=true; continue; }
    rows.push(nemBrlToLatex(bl.trim()));
  }
  // If there are separation lines (vertical addition/subtraction), keep
  // the array format for spatial layout.
  if(hasSepLine){
    return '\\begin{array}{l}\n'+rows.join(' \\\\\n')+'\n\\end{array}';
  }
  // Otherwise these are independent equations on consecutive lines —
  // not a single spatial arrangement. Return them as separate \(...\)
  // expressions joined by newlines rather than collapsing into an array.
  return rows.map(function(r){
    return r==='' ? '' : '\\('+r+'\\)';
  }).join('\n');
}

// =====================================================================
// Nemeth -> LaTeX
// Cross-line scan: collect contiguous runs of braille-bearing lines into
// blocks, then pass each block through parseNemEnv so multi-line spatial
// layouts (stacked fractions, matrices) are reconstructed instead of
// being converted line-by-line and losing their structure.
// =====================================================================
function n2lConvert(){
  var input=document.getElementById('n2l-in').value;
  var outEl=document.getElementById('n2l-out');
  var prevEl=document.getElementById('n2l-prev');
  var stEl=document.getElementById('n2l-st');

  // Classify each line: does it contain any braille char?
  var lines=input.split('\n');
  function lineHasBrl(s){
    for(var i=0;i<s.length;i++){ if(isBrl(s[i])) return true; }
    return false;
  }
  // "Pure braille line" means every non-whitespace character is a braille
  // cell. These are what a multi-line math object looks like — rows of a
  // matrix, a stacked fraction, a system of equations. A line with prose
  // text mixed in is NOT part of a multi-line math object, even if it
  // contains braille runs: it's a mixed-content line that should be
  // converted inline on its own.
  function isPureBrlLine(s){
    var sawBrl=false;
    for(var i=0;i<s.length;i++){
      var c=s[i];
      if(c===' ' || c==='\t') continue;
      if(isBrl(c)){ sawBrl=true; continue; }
      return false; // any non-whitespace non-braille char disqualifies
    }
    return sawBrl;
  }

  var outLines=[], prevLines=[], mathCount=0, hasErr=false;
  var li=0;
  while(li<lines.length){
    var line=lines[li];
    if(!lineHasBrl(line)){
      // Pure prose line — pass through unchanged
      outLines.push(line);
      prevLines.push(esc(line));
      li++;
      continue;
    }
    // Line has braille. Three sub-cases:
    //   (a) Mixed prose + braille on a single line: convert each braille
    //       run inline, keep prose as-is.
    //   (b) This line is pure braille AND the next line(s) are also pure
    //       braille — this is a multi-line math object (matrix, cases,
    //       stacked fraction). Collect the run and feed parseNemEnv.
    //   (c) This line is pure braille but the next isn't — treat it as
    //       a single-line math object. parseNemEnv will delegate to
    //       nemBrlToLatex.
    if(!isPureBrlLine(line)){
      // Case (a): mixed line — convert inline, run by run.
      var outLatex='', prevHtml='', curBrl='';
      var flush=function(){
        if(!curBrl) return;
        try{
          var latex=nemBrlToLatex(curBrl);
          outLatex+='\\('+latex+'\\)';
          prevHtml+='<span aria-label="math">\\('+esc(latex)+'\\)</span>';
          mathCount++;
        }catch(e){
          hasErr=true;
          outLatex+='[ERR:'+e.message+']';
          prevHtml+='<span style="color:var(--red)" role="alert">[&#x932F;&#x8AA4;]</span>';
        }
        curBrl='';
      };
      for(var ci=0;ci<line.length;ci++){
        var c=line[ci];
        if(isBrl(c)){curBrl+=c;}
        else{flush();outLatex+=c;prevHtml+=esc(c);}
      }
      flush();
      outLines.push(outLatex);
      prevLines.push(prevHtml);
      li++;
      continue;
    }
    // Pure braille line — look ahead for more pure braille lines
    var blockStart=li;
    var blockEnd=li;
    while(blockEnd+1<lines.length && isPureBrlLine(lines[blockEnd+1])){
      blockEnd++;
    }
    if(blockStart===blockEnd){
      // Case (c): single pure-braille line. Convert directly.
      try{
        var latex=nemBrlToLatex(line.trim());
        outLines.push('\\('+latex+'\\)');
        prevLines.push('<span aria-label="math">\\('+esc(latex)+'\\)</span>');
        mathCount++;
      }catch(e){
        hasErr=true;
        outLines.push('[ERR:'+e.message+']');
        prevLines.push('<span style="color:var(--red)" role="alert">[&#x932F;&#x8AA4;]</span>');
      }
      li++;
    }else{
      // Case (b): Multi-line pure-braille block — feed parseNemEnv.
      var block=lines.slice(blockStart, blockEnd+1).join('\n');
      try{
        var blockLatex=parseNemEnv(block);
        // parseNemEnv may return either:
        //   (i)  a raw LaTeX fragment (matrix, cases, fraction, etc.)
        //        → wrap in a single \(...\)
        //   (ii) a sequence of already-wrapped \(...\) lines
        //        (the independent-equations fallthrough path)
        //        → emit as-is, each line is already a complete expression
        if(blockLatex.indexOf('\\(')===0){
          outLines.push(blockLatex);
          prevLines.push(blockLatex.split('\n').map(function(ln){
            return ln ? '<span aria-label="math">'+esc(ln)+'</span>' : '';
          }).join('<br>'));
          mathCount++;
        }else{
          outLines.push('\\('+blockLatex+'\\)');
          prevLines.push('<span aria-label="math">\\('+esc(blockLatex)+'\\)</span>');
          mathCount++;
        }
      }catch(e){
        hasErr=true;
        outLines.push('[ERR:'+e.message+']');
        prevLines.push('<span style="color:var(--red)" role="alert">[&#x932F;&#x8AA4;]</span>');
      }
      li=blockEnd+1;
    }
  }

  outEl.textContent=outLines.join('\n');
  outEl.className='box mono'+(hasErr?' err':'');
  prevEl.innerHTML=prevLines.join('<br>');
  if(window.MathJax&&mathCount>0){
    MathJax.typesetPromise([prevEl]).catch(function(){});
  }
  var status=hasErr
    ?'\u2717 \u90e8\u5206\u5931\u6557'
    :mathCount
      ?'\u2713 \u8f49\u63db '+mathCount+' \u500b\u9ede\u5b57\u5340\u584a'
      :'\uff08\u672a\u5075\u6e2c\u5230\u9ede\u5b57\uff09';
  stEl.textContent=status;
  stEl.className='st'+(hasErr?' err':' ok');
  stEl.setAttribute('aria-live','polite');
}

// Insert a LaTeX snippet into the L2N input textarea, auto-wrapping
// with \( ... \) when the cursor is not already inside a math env.
// Used by the 108 curriculum symbol table rows.
function insertLatexIntoL2N(latex){
  var ta=document.getElementById('l2n-in');
  if(!ta) return;
  var start=ta.selectionStart||0, end=ta.selectionEnd||0;
  var value=ta.value||'';
  // Detect whether the insertion point is inside an existing \( ... \)
  // or $ ... $ math environment. If so, don't re-wrap.
  function inMathEnv(pos){
    var before=value.slice(0,pos);
    var dollars=(before.match(/\$/g)||[]).length;
    var opens=(before.match(/\\\(/g)||[]).length;
    var closes=(before.match(/\\\)/g)||[]).length;
    return (dollars%2!==0) || (opens>closes);
  }
  var snippet, caretOffset;
  if(inMathEnv(start)){
    snippet=latex;
    caretOffset=latex.length;
  }else{
    snippet='\\('+latex+'\\)';
    caretOffset=snippet.length;
  }
  ta.value=value.slice(0,start)+snippet+value.slice(end);
  var caret=start+caretOffset;
  ta.selectionStart=ta.selectionEnd=caret;
  ta.focus();
  l2nConvert();
}

function buildSymRef(){
  var ref=document.getElementById('symRef');
  ref.innerHTML='';
  // Outer collapsible shell — the whole 108-curriculum table starts collapsed.
  var outerTitle=document.createElement('div');
  outerTitle.className='grade-title symref-outer';
  outerTitle.setAttribute('tabindex','0');
  outerTitle.setAttribute('role','button');
  outerTitle.setAttribute('aria-expanded','false');
  outerTitle.setAttribute('aria-controls','symRefBody');
  outerTitle.innerHTML='\u283F 108 \u8ab2\u7db1\u7b26\u865f\u5c0d\u7167\u8868\uff08\u9ede\u64ca\u63d2\u5165\uff09 <span class="grade-arrow" aria-hidden="true">&#x25B6;</span>';
  ref.appendChild(outerTitle);
  var outerBody=document.createElement('div');
  outerBody.id='symRefBody';
  outerBody.className='symref-body collapsed';
  ref.appendChild(outerBody);
  (function(titleEl,bodyEl){
    function toggle(){
      var open=titleEl.classList.contains('open');
      if(open){
        bodyEl.style.maxHeight='0';
        bodyEl.classList.add('collapsed');
        titleEl.classList.remove('open');
        titleEl.setAttribute('aria-expanded','false');
      }else{
        bodyEl.classList.remove('collapsed');
        bodyEl.style.maxHeight=bodyEl.scrollHeight+'px';
        titleEl.classList.add('open');
        titleEl.setAttribute('aria-expanded','true');
      }
    }
    titleEl.addEventListener('click',toggle);
    titleEl.addEventListener('keydown',function(e){
      if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}
    });
  })(outerTitle,outerBody);

  for(var gi=0;gi<GRADES.length;gi++){
    var grade=GRADES[gi];
    var sec=document.createElement('div');
    sec.className='grade-section';
    var titleEl=document.createElement('div');
    titleEl.className='grade-title';
    titleEl.setAttribute('tabindex','0');
    titleEl.setAttribute('role','button');
    titleEl.setAttribute('aria-expanded','false');
    var bodyId='grade-body-'+gi;
    titleEl.setAttribute('aria-controls',bodyId);
    titleEl.innerHTML=grade.title+' <span class="grade-arrow" aria-hidden="true">&#x25B6;</span>';
    sec.appendChild(titleEl);
    var grid=document.createElement('div');
    grid.id=bodyId;
    grid.className='sym-grid grade-body collapsed';
    grid.setAttribute('role','list');
    // Toggle handler (per-grade section, inside the outer shell)
    (function(titleEl,grid,outerBody){
      function toggle(){
        var open=titleEl.classList.contains('open');
        if(open){
          grid.style.maxHeight='0';
          grid.classList.add('collapsed');
          titleEl.classList.remove('open');
          titleEl.setAttribute('aria-expanded','false');
        }else{
          grid.classList.remove('collapsed');
          grid.style.maxHeight=grid.scrollHeight+'px';
          titleEl.classList.add('open');
          titleEl.setAttribute('aria-expanded','true');
        }
        // Outer body needs to re-measure so its maxHeight accommodates
        // the newly-opened inner section.
        if(outerBody.classList.contains('collapsed')===false){
          outerBody.style.maxHeight=outerBody.scrollHeight+'px';
        }
      }
      titleEl.addEventListener('click',toggle);
      titleEl.addEventListener('keydown',function(e){
        if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}
      });
    })(titleEl,grid,outerBody);
    for(var si=0;si<grade.items.length;si++){
      var item=grade.items[si];
      var row=document.createElement('div');
      row.className='sym-row';
      row.setAttribute('role','listitem');
      row.setAttribute('tabindex','0');
      row.setAttribute('aria-label',item.name+' LaTeX: '+item.l+' Nemeth: '+item.n);
      row.title='\u9ede\u64ca\u63d2\u5165\u5230\u8f38\u5165\u6846';
      var lx=document.createElement('span');
      lx.className='sym-latex'; lx.textContent=item.l; lx.setAttribute('aria-hidden','true');
      var nm=document.createElement('span');
      nm.className='sym-nemeth'; nm.textContent=item.n; nm.setAttribute('aria-hidden','true');
      var na=document.createElement('span');
      na.className='sym-name'; na.textContent=item.name; na.setAttribute('aria-hidden','true');
      row.appendChild(lx); row.appendChild(nm); row.appendChild(na);
      (function(latex,name){
        function doInsert(){
          insertLatexIntoL2N(latex);
          setStatus('l2n-st','\u2713 \u5df2\u63d2\u5165 '+latex,'ok');
        }
        row.onclick=doInsert;
        row.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();doInsert();}};
      })(item.l,item.name);
      grid.appendChild(row);
    }
    sec.appendChild(grid);
    outerBody.appendChild(sec);
  }
}

// Wrap standalone numbers in the L2N input with \(...\) math delimiters.
// Skips:
//   - Numbers that are already inside \(...\) or $...$
//   - Item numbers: "1." "2." at start of line, or "(1)" "(2)" anywhere
//   - Numbers already adjacent to a math delimiter
function wrapStandaloneNumbers(){
  var ta=document.getElementById('l2n-in');
  if(!ta)return;
  var text=ta.value;
  var open=useParentheses?'\\(':'$';
  var close=useParentheses?'\\)':'$';
  // Process line by line to handle item-number detection easily
  var lines=text.split('\n');
  var result=[];
  for(var li=0;li<lines.length;li++){
    var line=lines[li];
    // Tokenise: find segments already in math mode and leave them alone.
    // Regex matches \(...\), $...$, or a "standalone number" candidate.
    // Standalone number: optional leading - or +, digits, optional decimal.
    // Excluded patterns (checked after match):
    //   - item number at line start: /^\s*\d+\.\s/ or /^\s*\(\d+\)\s/
    var out='';
    var pos=0;
    // We'll scan character by character tracking math mode
    var inMath=false;
    var mathOpen='', mathClose='';
    while(pos<line.length){
      // Check for math open
      if(!inMath){
        if(line.slice(pos,pos+2)==='\\('){
          inMath=true; mathOpen='\\('; mathClose='\\)';
          out+='\\('; pos+=2; continue;
        }
        if(line[pos]==='$'){
          inMath=true; mathOpen='$'; mathClose='$';
          out+='$'; pos+=1; continue;
        }
        // Try to match a standalone number (including optional sign at word boundary)
        // Pattern: optional -, digits, optional decimal point and more digits
        var numMatch=line.slice(pos).match(/^(-?\d+\.?\d*|\d*\.\d+)/);
        if(numMatch){
          var num=numMatch[0];
          // If num ends with '.' and what follows is a space or end-of-line,
          // the dot is punctuation (item label "1. "), not a decimal point.
          // Give the dot back to the stream so isItemDot can see it in `after`.
          if(num.slice(-1)==='.'&&(pos+num.length>=line.length||/\s/.test(line[pos+num.length]))){
            num=num.slice(0,-1);
          }
          var before=line.slice(0,pos);
          var after=line.slice(pos+num.length);
          // Skip item numbers:
          //   "N." at start of line (possibly with leading whitespace)
          var isItemDot=/^\s*$/.test(before)&&/^\.\s*$|^\.\s/.test(after);
          //   "(N)" pattern anywhere
          var isItemParen=before.endsWith('(')&&after.startsWith(')');
          // Skip if immediately adjacent to a math delimiter already
          var adjMath=/[\\$]$/.test(before)||/^[\\$]/.test(after);
          // Skip if char before is a letter or digit (mid-word, mid-number)
          var prevCh=before.slice(-1);
          var midWord=prevCh&&/[\w.]/.test(prevCh);
          if(isItemDot||isItemParen||adjMath||midWord){
            out+=num; pos+=num.length;
          }else{
            out+=open+num+close; pos+=num.length;
          }
          continue;
        }
        out+=line[pos]; pos++;
      }else{
        // Inside math: look for close
        if(line.slice(pos,pos+mathClose.length)===mathClose){
          inMath=false;
          out+=mathClose; pos+=mathClose.length; continue;
        }
        out+=line[pos]; pos++;
      }
    }
    result.push(out);
  }
  ta.value=result.join('\n');
  l2nConvert();
  setStatus('l2n-st','\u2713 \u5df2\u6a19\u793a\u6578\u5b57','ok');
}

// Theme toggle: dark (default) <-> light. Persisted in localStorage.
// Applied to <html> so CSS vars cascade before layout; avoids flash.
function applyTheme(t){
  var root=document.documentElement;
  if(t==='light'){
    root.setAttribute('data-theme','light');
  }else{
    root.removeAttribute('data-theme');
  }
  var btn=document.getElementById('themeBtn');
  var icon=document.getElementById('themeIcon');
  var label=document.getElementById('themeLabel');
  if(t==='light'){
    if(icon)icon.textContent='\u2600'; // ☀
    if(label)label.textContent='\u767D\u5E95'; // 白底
    if(btn)btn.setAttribute('aria-label','\u5207\u63DB\u70BA\u9ED1\u5E95\u767D\u5B57');
  }else{
    if(icon)icon.textContent='\u263D'; // ☽
    if(label)label.textContent='\u9ED1\u5E95'; // 黑底
    if(btn)btn.setAttribute('aria-label','\u5207\u63DB\u70BA\u767D\u5E95\u9ED1\u5B57');
  }
}
function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme')==='light'?'light':'dark';
  var next=cur==='light'?'dark':'light';
  applyTheme(next);
  try{localStorage.setItem('nemeth-theme',next);}catch(e){}
}
// Initial theme: check saved preference, else system preference, else dark.
(function initTheme(){
  // Check site-wide theme from index.html first
  var siteTheme=null;
  try{siteTheme=localStorage.getItem('site-theme');}catch(e){}
  if(siteTheme==='light'||siteTheme==='dark'){
    applyTheme(siteTheme); return;
  }
  var saved=null;
  try{saved=localStorage.getItem('nemeth-theme');}catch(e){}
  if(saved==='light'||saved==='dark'){
    applyTheme(saved);
    return;
  }
  // No saved pref — respect system if available
  if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches){
    applyTheme('dark');
  }else{
    applyTheme('light');
  }
})();

// ── 框架主題控制 ──
window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'setTheme') {
        applyTheme(e.data.theme);
        try { localStorage.setItem('nemeth-theme', e.data.theme); } catch(ex) {}
    }
});
