<script>
// ======================================================================
// 數學編輯器 modal 開關與套用
// ======================================================================
function openMathEditor() {
  initMathEditor();
  var ta = document.getElementById('latexInput');
  // 把 L2N 輸入框目前內容帶過去，方便繼續編輯
  var l2nIn = document.getElementById('l2n-in');
  if (ta && l2nIn) {
    ta.value = l2nIn.value;
    if (typeof updatePreview === 'function') updatePreview();
  }
  document.getElementById('me-modal').classList.add('open');
  // 把焦點移到 textarea
  setTimeout(function(){ if (ta) ta.focus(); }, 100);
}
function closeMathEditor() {
  document.getElementById('me-modal').classList.remove('open');
}
function applyMathEditor() {
  var ta = document.getElementById('latexInput');
  var l2nIn = document.getElementById('l2n-in');
  if (ta && l2nIn) {
    l2nIn.value = ta.value;
    l2nConvert();
  }
  closeMathEditor();
}
// ESC 關閉 modal
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && document.getElementById('me-modal').classList.contains('open')) {
    closeMathEditor();
  }
});

// ======================================================================
// Math Editor (整合自 math-editor3q.htm)
// 所有函式放全域讓 HTML onclick 能找到；
// 需要 DOM 的事件綁定延遲到 initMathEditor() 首次呼叫
// ======================================================================
var _mathEditorInited = false;
function initMathEditor() {
  if (_mathEditorInited) return;
  _mathEditorInited = true;
  // 綁定 latexInput / preview 事件（modal 開啟後 DOM 已就緒）
  var _li = document.getElementById('latexInput');
  var _pv = document.getElementById('preview');
  if (_li) {
    _li.addEventListener('input', updatePreview);
    _li.addEventListener('scroll', syncScroll);
    _li.addEventListener('keydown', handleKeyDown);
    _li.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.key === 'm') { e.preventDefault(); wrapMathExpression(this, false); }
    });
    _li.addEventListener('keydown', function(e) {
      if (e.altKey && e.key === 'm') { e.preventDefault(); wrapMathExpression(this, true); }
    });
  }
  if (_pv) _pv.addEventListener('scroll', syncScroll);
  var _cadb = document.getElementById('convertAllDelimitersButton');
  if (_cadb) _cadb.textContent = "全部轉換為 \\( \\)";
  // Set initial textContent on the toggle button via JS rather than
  // leaving \( \) in the raw HTML — otherwise MathJax scans the DOM,
  // sees the delimiters, and renders the empty pair away, leaving only
  // "使用 " visible until the user clicks the button once.
  var _tdb = document.getElementById('toggleDelimiterButton');
  if (_tdb) _tdb.textContent = "使用 \\( \\)";
  var _spb = document.querySelector('#savePreviewButton');
  if (_spb) _spb.addEventListener('click', savePreviewAsHTML);
}

// —— 以下為 math-editor 原始腳本（去掉無用的 DOMContentLoaded 綁定，改由 initMathEditor 統一處理）——

	       let isSyncEnabled = true;
	   
	           function syncScroll(event) {
	               if (!isSyncEnabled) return;
	               
	               const latexInput = document.getElementById('latexInput');
	               const preview = document.getElementById('preview');
	               if (event.target.id === 'latexInput') {
	                   preview.scrollTop = latexInput.scrollTop;
	               } else {
	                   latexInput.scrollTop = preview.scrollTop;
	               }
	           }
	   
	           function toggleSync() {
	               isSyncEnabled = !isSyncEnabled;
	               const button = document.getElementById('toggleSyncButton');
	               if (isSyncEnabled) {
	                   button.textContent = '同步捲動：開';
	                   button.style.backgroundColor = '#ccffcc';
	               } else {
	                   button.textContent = '同步捲動：關';
	                   button.style.backgroundColor = '#ffcccc';
	               }
	           }
	       function handleKeyDown(event) {
	           if (event.key === 'Enter') {
	               event.preventDefault();
	               const textarea = document.getElementById('latexInput');
	               const start = textarea.selectionStart;
	               const end = textarea.selectionEnd;
	               const before = textarea.value.substring(0, start);
	               const after = textarea.value.substring(end, textarea.value.length);
	               textarea.value = before + '\n' + after;
	               textarea.selectionStart = textarea.selectionEnd = start + 1;
	               insertNewLineInMathML();
	               updatePreview();
	           }
	       }

	       function insertMathBrackets(type) {
	           const text = type === '$' ? '$$' : '\\(\\)';
	           insertText(text, type === '$' ? 1 : 2);
	           document.getElementById('latexInput').focus();
	       }
		   
	       function formatOptions() {
	           const textarea = document.getElementById('latexInput');
	           let text = textarea.value;
	           
	           // 將制表符（Tab）和全形空格轉換為半形空格，並將多個連續空格轉換為單個空格
	           text = text.replace(/\t/g, " ").replace(/　/g, " ").replace(/ {2,}/g, " ").replace(/（/g, '(').replace(/）/g, ')');
	           // 在數字與中文間添加空格
				text = text.replace(/(\d)([^\s\d\(\)\{\}\[\]\.,:;\-\+\*\/\\<>!?='"$&%#@`^~｜|a-zA-Z])/g, '$1 $2');
				text = text.replace(/([^\s\d\(\)\{\}\[\]\.,:;\-\+\*\/\\<>!?='"$&%#@`^~｜|a-zA-Z])(\d)/g, '$1 $2');
	           // 分割文本為段落
	           let paragraphs = text.split(/\n\s*/);
	           
	           // 處理每個段落
	           paragraphs = paragraphs.map((paragraph, index) => {
	               // 檢查這個段落是否包含選項
	               if (/\([A-Z]\)/.test(paragraph)) {
	                   // 分割並格式化選項
	                   let options = paragraph.split(/(?=\([A-D]\))/);
	                   options = options.map(option => option.trim().replace(/^\(([A-D])\)\s*/, "($1) "));
	                   // 在選項段落後添加一個換行符
	                   return options.join('\n') + '\n';
	               }
	               // 對於非選項段落，在它前面添加一個換行符
	               return paragraph;
	           });
	           
	           // 重新組合文本，並在每個段落之間添加一個空行
	           text = paragraphs.join('\n');
	           
	           // 移除選項間的空行，但保留最後一個選項與下一段之間的空行
	           text = text.replace(/(\([A-D]\)\s[^\n]*)(\n\s*\n(?=\([A-D]\)))/g, '$1\n');
	           
	           textarea.value = text.trim();
	           updatePreview();
	       }

	       function replaceText() {
			   const textarea = document.getElementById('latexInput');
			   
			   // 使用 prompt 獲取要查找的文本
			   const findText = prompt("請輸入要查找的文本：");
			   if (findText === null || findText === '') {
				   alert('請輸入要查找的文本');
				   return;
			   }
			   
			   // 使用 prompt 獲取要替換的文本
			   const replaceText = prompt("請輸入要替換的文本：");
			   if (replaceText === null) {
				   return; // 用戶取消了操作
			   }
			   
			   const text = textarea.value;
			   const newText = text.replace(new RegExp(escapeRegExp(findText), 'g'), replaceText);
			   
			   textarea.value = newText;
			   updatePreview();
			   }
			   
			   // 用於轉義正則表達式中的特殊字符

			   function escapeRegExp(string) {
				   return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
			   }

			let useParentheses = true;

			function toggleDelimiter() {
				useParentheses = !useParentheses;
				const toggleButton = document.getElementById('toggleDelimiterButton');
				const convertButton = document.getElementById('convertAllDelimitersButton');
				if (useParentheses) {
					if (toggleButton) { toggleButton.textContent = "使用 \\( \\)"; toggleButton.style.backgroundColor = "#ccffcc"; }
					if (convertButton) convertButton.textContent = "全部轉換為 \\( \\)";
				} else {
					if (toggleButton) { toggleButton.textContent = "使用 $ $"; toggleButton.style.backgroundColor = "#ffcccc"; }
					if (convertButton) convertButton.textContent = "全部轉換為 $ $";
				}
				updateAllButtons();
			}

			function updateAllButtons() {
				// No-op: previous implementation called .match(...)[1] on every
				// button[onclick^="insertMath"] without null-checking, throwing
				// TypeError when any button's onclick didn't match the pattern.
				// The body merely round-tripped onclick to itself, so removing
				// it is behavior-preserving for the success path.
			}

			function convertAllDelimiters() {
				const textarea = document.getElementById('latexInput');
				let text = textarea.value;
				
				const targetDelimiters = useParentheses ? ['\\(', '\\)'] : ['$', '$'];

				// 定義轉換函數
				function convertDelimiters(text, fromStart, fromEnd, toStart, toEnd) {
					let result = '';
					let insideMath = false;
					let depth = 0;
					let mathContent = '';

					for (let i = 0; i < text.length; i++) {
						if (text.startsWith(fromStart, i) && (!insideMath || depth > 0)) {
							if (insideMath) {
								mathContent += fromStart;
								depth++;
							} else {
								result += toStart;
								insideMath = true;
							}
							i += fromStart.length - 1;
						} else if (text.startsWith(fromEnd, i) && insideMath) {
							if (depth > 0) {
								mathContent += fromEnd;
								depth--;
							} else {
								result += mathContent + toEnd;
								mathContent = '';
								insideMath = false;
							}
							i += fromEnd.length - 1;
						} else if (insideMath) {
							mathContent += text[i];
						} else {
							result += text[i];
						}
					}

					// 處理未閉合的數學環境
					if (insideMath) {
						result += fromStart + mathContent;
					}

					return result;
				}

				// 轉換所有分隔符
				text = convertDelimiters(text, '$', '$', targetDelimiters[0], targetDelimiters[1]);
				text = convertDelimiters(text, '\\(', '\\)', targetDelimiters[0], targetDelimiters[1]);
				text = convertDelimiters(text, '\\[', '\\]', targetDelimiters[0], targetDelimiters[1]);

				textarea.value = text;
				updatePreview();
			}
		
			function insertMathDelimiters() {
				const delimiters = useParentheses ? ['\\(', '\\)'] : ['$', '$'];
				const textarea = document.getElementById('latexInput');
				const start = textarea.selectionStart;
				const end = textarea.selectionEnd;
				if (start !== end) {
					// Wrap the selected text with the delimiters
					const selected = textarea.value.slice(start, end);
					const wrapped = delimiters[0] + selected + delimiters[1];
					textarea.value = textarea.value.slice(0, start) + wrapped + textarea.value.slice(end);
					textarea.selectionStart = textarea.selectionEnd = start + wrapped.length;
				} else {
					// No selection: insert empty delimiters with cursor inside
					insertText(delimiters[0] + delimiters[1], delimiters[0].length);
				}
				textarea.focus();
				updatePreview();
			}

			function insertMath(math) {
				const textarea = document.getElementById('latexInput');
				const start = textarea.selectionStart;
				const end = textarea.selectionEnd;
				const value = textarea.value;
				
				function isInMathEnvironment(pos) {
					const beforeCursor = value.slice(0, pos);
					const dollarPairs = (beforeCursor.match(/\$/g) || []).length;
					const bracketPairs = (beforeCursor.match(/\\\(/g) || []).length - (beforeCursor.match(/\\\)/g) || []).length;
					return (dollarPairs % 2 !== 0) || (bracketPairs > 0);
				}

				let newText, cursorPosition;
				const delimiters = useParentheses ? ['\\(', '\\)'] : ['$', '$'];

				if (isInMathEnvironment(start)) {
					newText = value.slice(0, start) + math + value.slice(end);
					cursorPosition = start + math.length;
				} else {
					newText = value.slice(0, start) + delimiters[0] + math + delimiters[1] + value.slice(end);
					cursorPosition = start + delimiters[0].length + math.length;
				}

				const braceIndex = math.indexOf('{}');
				if (braceIndex !== -1) {
					cursorPosition = (isInMathEnvironment(start) ? start : start + delimiters[0].length) + braceIndex + 1;
				}

				textarea.value = newText;
				textarea.selectionStart = textarea.selectionEnd = cursorPosition;
				textarea.focus();
				updatePreview();
			}

			function updatePreview() {
				const latex = document.getElementById('latexInput').value.replace(/\n/g, '<br>');
				const preview = document.getElementById('preview');
				const mathmlOutput = document.getElementById('mathmlOutput');
				
				// 將所有數學式轉換為 \(...\) 格式
				let wrappedLatex = latex
					.replace(/(\$)(?!\$)(.+?)(?<!\$)(\$)/g, '\\($2\\)')
					.replace(/\\\[(.*?)\\\]/g, '\\($1\\)');
				
				// 確保所有 \(...\) 格式的數學式都被正確識別
				wrappedLatex = wrappedLatex.replace(/\\\((.+?)\\\)/g, '\\($1\\)');
				
				preview.innerHTML = wrappedLatex;
				MathJax.typesetPromise([preview]).then(() => {
					const previewHTML = preview.innerHTML;
					mathmlOutput.value = formatXML(previewHTML);
				}).catch((err) => {
					mathmlOutput.value = `錯誤: ${err.message}`;
				});
			}

	       function formatXML(xml) {
	           // 格式化 XML 以便更好地顯示
	           const PADDING = '  ';
	           const reg = /(>)(<)(\/*)/g;
	           let pad = 0;
	           let formatted = '';
	           xml = xml.replace(reg, '$1\r\n$2$3');
	           xml.split('\r\n').forEach((node, index) => {
	               let indent = 0;
	               if (node.match(/.+<\/\w[^>]*>$/)) {
	                   indent = 0;
	               } else if (node.match(/^<\/\w/)) {
	                   if (pad != 0) {
	                       pad -= 1;
	                   }
	               } else if (node.match(/^<\w([^>]*[^\/])?>.*$/)) {
	                   indent = 1;
	               } else {
	                   indent = 0;
	               }

	               let padding = '';
	               for (let i = 0; i < pad; i++) {
	                   padding += PADDING;
	               }

	               formatted += padding + node + '\r\n';
	               pad += indent;
	           });

	           return formatted;
	       }

		function jumpToNextBraceOrLatex(forward = true) {
			const textarea = document.getElementById('latexInput');
			const text = textarea.value;
			const cursorPosition = textarea.selectionStart;

			// 正則表達式匹配 {} 和 LaTeX 分隔符
			const regex = /\{|\}|\\\(|\\\)|\$\$/g;
			let match;
			let nextPosition = cursorPosition;

			if (forward) {
				// 向前搜索
				regex.lastIndex = cursorPosition;
				while ((match = regex.exec(text)) !== null) {
					if (match.index > cursorPosition) {
						nextPosition = match.index + match[0].length;
						break;
					}
				}
			} else {
				// 向後搜索
				const reverseText = text.split('').reverse().join('');
				const reverseRegex = /\}|\{|\)\\\(|\\\|\$\$/g;
				const reverseCursorPosition = text.length - cursorPosition;
				reverseRegex.lastIndex = reverseCursorPosition;
				while ((match = reverseRegex.exec(reverseText)) !== null) {
					if (match.index > reverseCursorPosition) {
						nextPosition = text.length - (match.index + match[0].length);
						break;
					}
				}
			}

			// 設置新的光標位置
			textarea.setSelectionRange(nextPosition, nextPosition);
			textarea.focus();
		}
		
    // ctrl+m / alt+m 綁定已搬到 initMathEditor() 統一處理
    
    function wrapMathExpression(textarea, moveCursorInside) {
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const value = textarea.value;
        // 找到當前行的開始和結束
        const lineStart = value.lastIndexOf('\n', start - 1) + 1;
        const lineEnd = value.indexOf('\n', end);
        const currentLine = value.substring(lineStart, lineEnd === -1 ? value.length : lineEnd);
        // 在當前行內找到包裹結束的位置
        const cursorPosInLine = start - lineStart;
        let wrapEndIndex = cursorPosInLine;
        const chineseRegex = /[\u4e00-\u9fa5]/; // 匹配中文字符
        const fullWidthPuncRegex = /[\uFF00-\uFFEF]/; // 匹配全形標點
        while (wrapEndIndex < currentLine.length) {
            const char = currentLine[wrapEndIndex];
            if (char === ' ' || chineseRegex.test(char) || fullWidthPuncRegex.test(char)) {
                break;
            }
            wrapEndIndex++;
        }
        // 獲取要包裹的文本
        const textToWrap = currentLine.substring(cursorPosInLine, wrapEndIndex);
        // 根據當前設置選擇分隔符
        const delimiters = useParentheses ? ['\\(', '\\)'] : ['$', '$'];
        // 創建新的行文本
        const newLineText = currentLine.substring(0, cursorPosInLine) + 
                            delimiters[0] + textToWrap + delimiters[1] + 
                            currentLine.substring(wrapEndIndex);
        // 更新整個文本區域的值
        textarea.value = value.substring(0, lineStart) + newLineText + value.substring(lineEnd === -1 ? value.length : lineEnd);
        
        let newCursorPos;
        if (moveCursorInside) {
            // 如果是 alt + M，將游標移動到分隔符內部
            newCursorPos = lineStart + cursorPosInLine + delimiters[0].length;
        } else {
            // 如果是 ctrl + M，保持原有邏輯
            const validStartRegex = /[a-zA-Z0-9\\]/;
            newCursorPos = lineStart + cursorPosInLine + delimiters[0].length + textToWrap.length + delimiters[1].length;
            let foundValid = false;
            while (newCursorPos < value.length) {
                if (value[newCursorPos] === '\n') {
                    // 如果遇到換行符，停在下一行開頭
                    newCursorPos++;
                    break;
                }
                if (validStartRegex.test(value[newCursorPos])) {
                    foundValid = true;
                    break;
                }
                newCursorPos++;
            }
            // 如果沒找到有效字符，則保持在包裹符號後
            if (!foundValid) {
                newCursorPos = lineStart + cursorPosInLine + delimiters[0].length + textToWrap.length + delimiters[1].length;
            }
        }
        
        // 更新光標位置
        textarea.setSelectionRange(newCursorPos, newCursorPos);
        // 更新預覽
        updatePreview();
    }


		
		function convertLatexTableToHTML(latexTable) {
			// 移除 tabular 环境的开始和结束标记
			latexTable = latexTable.replace(/\\begin{tabular}.*?\n/, '')
								   .replace(/\\end{tabular}/, '');

			let html = '<table border="1">';
			let rows = latexTable.split('\\\\').filter(row => row.trim() !== '');
			let inHeader = false;
			let isFirstRow = true;

			rows.forEach((row, index) => {
				row = row.trim();

				if (row.includes('\\hline')) {
					if (!isFirstRow) {
						html += inHeader ? '</th></tr>' : '</td></tr>';
					}
					inHeader = false;
					isFirstRow = false;
					row = row.replace('\\hline', '');
				}

				if (row !== '') {
					if (row.includes('\\multicolumn')) {
						html += '<tr><th colspan="2">';
						inHeader = true;
						row = row.replace(/\\multicolumn{\d+}{[^}]+}{([^}]+)}/, '$1');
					} else if (!inHeader && !isFirstRow) {
						html += '<tr>';
					}

					let cells = row.split('&');
					cells.forEach((cell, cellIndex) => {
						cell = cell.trim()
							.replace(/\\\w+{([^}]+)}/, '$1') // 处理 \textbf 等命令
							.replace(/(\$[^\$]+\$|\\\([^\)]+\\\))/g, match => {
								// 将数学式包裹在 \(...\) 中
								return '\\(' + match.replace(/^\$|\$$|\\\(|\\\)$/g, '') + '\\)';
							})
							.replace(/\\%/g, '%') // 处理百分号
							.replace(/\\\s/g, ' '); // 处理 LaTeX 空格
						
						if (inHeader) {
							html += (cellIndex === 0 && !isFirstRow ? '<th>' : '') + cell;
						} else {
							html += `<td>${cell}</td>`;
						}
					});

					isFirstRow = false;
				}
			});

			// 确保最后一行正确闭合
			if (!isFirstRow) {
				html += inHeader ? '</th></tr>' : '</td></tr>';
			}

			html += '</table>';
			return html;
		}

		function convertMarkdownToHTML() {
			const textarea = document.getElementById('latexInput');
			let text = textarea.value;

			// 首先替換 \(\qquad\)
			text = text.replace(/\\qquad/g, "----");

			// 轉換 LaTeX 表格
			text = text.replace(/\\begin{tabular}[\s\S]*?\\end{tabular}/g, match => {
				return convertLatexTableToHTML(match);
			});

			// 轉換圖片
			text = text.replace(/!\[([^\]]*)\]\(([^\)]+)\)/g, '<img src="$2" alt="Mathpix Image">');

			// 轉換 Markdown 表格
			text = text.replace(/(\|.+\|)\r?\n(\|[\s:]*[-]+[\s:]*\|[\s:]*[-]+[\s:]*\|.*)\r?\n((?:\|.+\|\r?\n?)+)/g, function(match, headerRow, separatorRow, bodyRows) {
				// 將表格分成頭部、分隔行和內容部分
				const headers = headerRow.trim().split('|').filter(cell => cell.trim() !== '');
				const body = bodyRows.trim().split('\n').map(row => 
					row.trim().split('|').filter(cell => cell.trim() !== '')
				);
				
				// 構建 HTML 表格 - 移除換行符
				let tableHTML = '<table border="1"><thead><tr>';
				
				// 添加表頭
				headers.forEach(header => {
					tableHTML += `<th>${header.trim()}</th>`;
				});
				
				tableHTML += '</tr></thead><tbody>';
				
				// 添加表格內容
				body.forEach(row => {
					tableHTML += '<tr>';
					row.forEach(cell => {
						tableHTML += `<td>${cell.trim()}</td>`;
					});
					tableHTML += '</tr>';
				});
				
				tableHTML += '</tbody></table>';
				return tableHTML;
			});

			// 處理沒有分隔符行的簡單表格格式 (如果上面的匹配沒有成功)
			text = text.replace(/(\|.+\|[\r\n]*)+/g, function(match) {
				if (match.includes('<table')) return match; // 已經轉換過的不再處理
				
				const rows = match.trim().split(/[\r\n]+/);
				if (rows.length <= 1) return match; // 只有一行則不處理
				
				// 檢查是否有分隔行 (|---|---|)
				const hasSeparator = rows.some(row => /^\|[\s:]*[-]+[\s:]*\|/.test(row));
				if (hasSeparator) return match; // 有分隔行的表格由上面的規則處理
				
				let tableHTML = '<table border="1">';
				let isFirstRow = true;
				
				for (let row of rows) {
					// 跳過分隔行
					if (/^\|[\s:]*[-]+[\s:]*\|/.test(row)) continue;
					
					const cells = row.split('|').filter(cell => cell.trim() !== '');
					if (cells.length === 0) continue;
					
					tableHTML += '<tr>';
					
					cells.forEach(cell => {
						const tag = isFirstRow ? 'th' : 'td';
						tableHTML += `<${tag}>${cell.trim()}</${tag}>`;
					});
					
					tableHTML += '</tr>';
					isFirstRow = false;
				}
				
				tableHTML += '</table>';
				return tableHTML;
			});

			// 轉換粗體
			text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

			// 轉換斜體
			text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');

			// 轉換標題
			text = text.replace(/^# (.*$)/gm, '<h1>$1</h1>');
			text = text.replace(/^## (.*$)/gm, '<h2>$1</h2>');
			text = text.replace(/^### (.*$)/gm, '<h3>$1</h3>');

			// 轉換列表
			text = text.replace(/^\s*\*\s(.*)$/gm, '<li>$1</li>');
			text = text.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');

			// 轉換連結
			text = text.replace(/\[([^\]]+)\]\(([^\)]+)\)/g, '<a href="$2">$1</a>');

			// 使用正則表達式替換 \section*{ } 和 \title{ }
			text = text.replace(/\\section\*\{(.*?)\}/g, '$1');
			text = text.replace(/\\title\s*\{([\s\S]*?)\}/g, '$1').trim();

			// 使用正則表達式替換 / /
			text = text.replace(/(\w+)\s*\/\s*\/\s*(\w+)/g, '$1 \\parallel $2');

			textarea.value = text;
			updatePreview();
		}

		function delspace() {
			const input = document.getElementById('latexInput');
			let text = input.value;
			
			// 移除 加減號前後空格
			text = text.replace(/\s([+\-])\s/g, '$1');
			
			// 1. 移除 \right 和 \left
			text = text.replace(/\\(right|left)(?![a-zA-Z])/g, '');
			
			// 2. 把 \mathrm{x} 變成 x (對任何單個字符)
			text = text.replace(/\\mathrm\{([a-zA-Z0-9])\}/g, '$1');
			
			// 3. 移除數字後面接 x 或 y 的空格
			text = text.replace(/(\d)\s+([xy])/g, '$1$2');
			
			// 原本的大寫字母間空格處理
			text = text.replace(/\\\((.*?)\\\)/g, function(match, content) {
				// 處理大寫字母之間的空格
				const processed = content.replace(/([A-Z])\s+(?=[A-Z])/g, '$1');
				return '\\(' + processed + '\\)';
			});
			
			input.value = text;
			// 觸發 change 事件
			input.dispatchEvent(new Event('change'));
		}
