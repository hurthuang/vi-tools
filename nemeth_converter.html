<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>數學點字</title>
<script>
// MathJax config: register our custom \ratio and \proportion commands so
// the live preview renders them as the actual ratio (∶ U+2236) and
// proportion (∷ U+2237) signs instead of falling back to a red
// "Undefined control sequence" error.
window.MathJax={
  tex:{
    inlineMath:[['\\(','\\)']],
    displayMath:[['$$','$$']],
    macros:{
      ratio: ['\\mathrel{\\unicode{x2236}}', 0],
      proportion: ['\\mathrel{\\unicode{x2237}}', 0]
    }
  },
  options:{skipHtmlTags:['script','noscript','style','textarea','pre']}
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>
<style>
@font-face { font-family: 'SimBraille'; src: url('SIMBRL.TTF') format('truetype'); }
:root{
  --bg:#0b0d14;--surf:#13161f;--surf2:#1b1f2d;--bd:#262b3e;--bd2:#343b56;
  --blue:#5a99ff;--purple:#b39aff;--green:#4ee3a8;--red:#ff8b8b;
  --text:#eef2f9;--dim:#a9b3c9;
  --mono:"Noto Sans Mono","Courier New",monospace;
  --focus-ring:0 0 0 3px rgba(90,153,255,.55);
}
/* Light theme override — white background, dark text. WCAG AA throughout.
   Applied via <html data-theme="light">. */
html[data-theme="light"]{
  --bg:#ffffff;--surf:#f6f7fb;--surf2:#eef1f8;--bd:#c9cfdd;--bd2:#9aa5bc;
  --blue:#1557d6;--purple:#6b3dd6;--green:#0a7a4a;--red:#c0392b;
  --text:#101320;--dim:#4a526b;
  --focus-ring:0 0 0 3px rgba(21,87,214,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;font-size:14px;line-height:1.5}
/* Skip nav for screen readers */
.skip-nav{position:absolute;left:-9999px;top:0;background:var(--blue);color:#fff;
  padding:8px 16px;z-index:9999;border-radius:0 0 4px 0;font-size:.9rem}
.skip-nav:focus{left:0}
header{background:var(--surf);border-bottom:1px solid var(--bd);padding:9px 18px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:.95rem;font-weight:800;color:var(--blue);letter-spacing:.04em}
.logo span{color:var(--purple)}
/* Tab bar with ARIA roles */
.tabs{display:flex;gap:3px;background:var(--bg);border-radius:7px;padding:3px;
  role:tablist}
.tab{padding:5px 13px;border:none;border-radius:5px;background:transparent;
  color:var(--dim);font-size:.77rem;font-weight:700;cursor:pointer;
  transition:all .15s;letter-spacing:.05em;}
.tab:focus-visible{outline:none;box-shadow:var(--focus-ring);}
.tab.on{background:var(--blue);color:#fff}
.tab[aria-selected="true"]{background:var(--blue);color:#fff}
.badge{padding:2px 8px;border-radius:4px;font-size:.7rem;font-weight:700;
  letter-spacing:.06em;background:var(--surf2);border:1px solid var(--bd);color:var(--dim)}
.badge.on{background:rgba(77,142,248,.15);border-color:var(--blue);color:var(--blue)}
main{flex:1;padding:13px 18px;display:flex;flex-direction:column;gap:9px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.pane{display:flex;flex-direction:column;gap:5px}
.ph{font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);display:flex;align-items:center;gap:5px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--blue);aria-hidden:true}
.dot.g{background:var(--green)}.dot.p{background:var(--purple)}
textarea{width:100%;background:var(--surf);border:1px solid var(--bd);border-radius:7px;
  color:var(--text);font-family:var(--mono);font-size:15px;padding:10px;
  resize:vertical;height:200px;min-height:130px;transition:border-color .15s;line-height:1.65;
  overflow-y:auto;}
textarea:focus{outline:none;border-color:var(--blue);box-shadow:var(--focus-ring);}
.box{background:var(--surf);border:1px solid var(--bd);border-radius:7px;
  padding:10px;min-height:130px;font-size:15px;line-height:1.65}
.box.mono{font-family:var(--mono);color:var(--green);white-space:pre-wrap;word-break:break-all;
  overflow-y:auto;resize:vertical;height:200px;}
.box.mono.font-ascii{font-family:'SimBraille',var(--mono);letter-spacing:0}
.box.mono.font-unicode{font-family:"Apple Braille","Segoe UI Symbol",var(--mono);letter-spacing:1px}
.box.err{color:var(--red)}
/* Sync-scroll checkbox in panel headers */
.sync-chk{font-size:.65rem;font-weight:normal;text-transform:none;color:var(--dim);
  margin-left:auto;display:inline-flex;align-items:center;gap:3px;cursor:pointer;}
.sync-chk input{cursor:pointer;accent-color:var(--blue);}
/* Preview box: same fixed height as textarea and output box */
.box.prev{overflow-y:auto;resize:vertical;height:200px;}
/* n2l panels taller when LaTeX output is collapsed */
#p-n2l.out-collapsed #n2l-in,
#p-n2l.out-collapsed #n2l-prev{height:300px;}
/* each data-line div gets at least one line height so empty lines show */
[data-line]{min-height:1.65em;}
.info{font-size:.71rem;color:var(--dim);padding:5px 8px;background:var(--surf2);
  border-left:3px solid var(--purple);border-radius:0 5px 5px 0}
.info code{font-family:var(--mono);background:rgba(157,126,247,.15);
  color:var(--purple);padding:1px 4px;border-radius:3px}
.acts{display:flex;gap:7px;flex-wrap:wrap}
.btn{padding:6px 13px;border-radius:5px;border:1px solid var(--bd2);
  background:var(--surf2);color:var(--text);font-size:.76rem;font-weight:600;
  cursor:pointer;transition:all .15s}
.btn:focus-visible{outline:none;box-shadow:var(--focus-ring);}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:#3d7ee0}
.st{font-size:.71rem;color:var(--dim);min-height:18px;padding:2px 0}
.st.ok{color:var(--green)}.st.err{color:var(--red)}
.keyhint{font-size:.7rem;color:var(--dim);background:var(--surf2);
  border:1px solid var(--bd);border-radius:5px;padding:5px 9px;
  display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.keyhint kbd{display:inline-block;background:var(--bd2);border-radius:3px;
  padding:1px 5px;font-size:.68rem;font-family:var(--mono);color:var(--text)}
hr{border:none;border-top:1px solid var(--bd);margin:4px 0}
/* Symbol reference */
.symref{background:var(--surf2);border:1px solid var(--bd);border-radius:7px;padding:8px 10px}
.symref h3{font-size:.74rem;font-weight:700;color:var(--purple);margin-bottom:6px;letter-spacing:.05em}
.grade-section{margin-bottom:4px}
.grade-title{font-size:.72rem;font-weight:700;color:var(--dim);letter-spacing:.06em;
  margin:2px 0;padding:3px 6px;border-left:2px solid var(--purple);
  background:rgba(179,154,255,.08);border-radius:0 3px 3px 0}
/* Compact tight-packed layout:
   - sym-grid is a flex container that wraps rows as needed
   - each sym-row is a single focusable pill spanning three sized columns
   - on wide screens we get multiple pills per line; on mobile one per line */
.sym-grid{display:flex;flex-wrap:wrap;gap:2px 10px;padding:2px 0}
.sym-row{display:flex;align-items:baseline;gap:6px;padding:2px 6px;
  border-radius:3px;cursor:pointer;transition:background .1s;font-size:.74rem;
  flex:0 1 auto;min-width:0}
.sym-row:hover{background:var(--bd)}
.sym-row:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.sym-latex{font-family:var(--mono);color:var(--blue);white-space:nowrap;flex:0 0 auto}
.sym-nemeth{font-family:var(--mono);color:var(--green);white-space:nowrap;flex:0 0 auto}
.sym-name{color:var(--dim);font-size:.7rem;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;flex:0 1 auto;min-width:0}
/* Collapsible grade sections */
.grade-title{
  cursor:pointer;display:flex;align-items:center;justify-content:space-between;
  user-select:none;
}
.grade-title:focus-visible{outline:none;box-shadow:var(--focus-ring);border-radius:3px;}
.grade-arrow{font-size:.6rem;transition:transform .2s;display:inline-block;}
.grade-title.open .grade-arrow{transform:rotate(90deg);}
.grade-body{overflow:hidden;transition:max-height .25s ease;}
.grade-body.collapsed{max-height:0!important;}
/* Outer collapsible shell for the entire 108 curriculum table */
.symref-outer{
  font-size:.82rem;color:var(--purple);font-weight:700;letter-spacing:.04em;
  padding:4px 0;margin-bottom:4px;
}
.symref-body{overflow:hidden;transition:max-height .3s ease;}
.symref-body.collapsed{max-height:0!important;}
/* Math Editor Modal */
.me-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);
  z-index:10000;display:none;align-items:center;justify-content:center;padding:10px}
.me-modal.open{display:flex}
.me-modal-inner{background:#ffffff;color:#222;width:96%;max-width:1400px;
  max-height:96vh;border-radius:8px;
  /* overflow:visible (not hidden) so tooltip bubbles from buttons near
     the edges of the modal can escape. The trade-off: if inner content
     somehow overflowed the rounded corners it would no longer be clipped,
     but .me-body already handles its own overflow via overflow-y:auto. */
  overflow:visible;
  display:flex;flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.5)}
.me-header{background:#f4f5f7;border-bottom:1px solid #ddd;padding:10px 15px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.me-header-title{font-weight:800;color:var(--blue);font-size:1.05rem;flex:1}
.me-apply-btn{background:#2b8a3e;color:#fff;border:none;padding:8px 18px;
  border-radius:4px;cursor:pointer;font-weight:700;font-size:.85rem}
.me-apply-btn:hover{background:#228838}
.me-cancel-btn{background:#ddd;color:#333;border:none;padding:8px 18px;
  border-radius:4px;cursor:pointer;font-size:.85rem}
.me-cancel-btn:hover{background:#bbb}
.me-body{flex:1;overflow-y:auto;padding:15px;color:#222}
/* Make embedded math-editor contents look right on white */
.me-body h1{font-size:1.25rem;margin:0 0 10px;color:#222}
.me-body a[role="navigation"]{display:inline-block;margin:5px 8px 5px 0;font-weight:700;color:#555;font-size:.85rem}
.me-body button{margin:2px;padding:5px 10px;background:#eef2f7;border:1px solid #bfc8d3;
  color:#222;border-radius:4px;font-size:.85rem;cursor:pointer;position:relative}
.me-body button:hover{background:#d8e2ee}
.me-body select{margin:2px;padding:5px;background:#fff;border:1px solid #bfc8d3;
  color:#222;border-radius:4px;font-size:.85rem}
.me-body input[type=file]{color:#222}
.me-body .container{display:flex;width:100%;flex-wrap:wrap;gap:8px}
.me-body textarea,.me-body #preview{flex:1 1 45%;min-width:300px;height:280px;
  margin:5px 0;border:1px solid #ccc;padding:10px;font-family:"Noto Sans Mono",monospace;
  background:#fff;color:#222;overflow-y:auto}
.me-body #preview{background:#fafafa}
.me-body #mathmlOutput{width:100%;height:150px;white-space:pre-wrap;margin-top:10px;
  font-family:"Noto Sans Mono",monospace;border:1px solid #ccc;padding:10px;background:#fff;color:#222}
.me-open-btn{background:var(--purple);color:#fff;border:1px solid var(--purple);
  padding:6px 13px;border-radius:5px;font-size:.78rem;font-weight:700;cursor:pointer}
.me-open-btn:hover{background:#8b68e0}

/* Tooltip bubbles. Reads the existing `data-text="..."` attribute used
   throughout the math editor buttons (e.g. <button data-text="乘號">),
   so tooltips light up on those controls with zero markup changes.
   Keyboard users get the same bubble on :focus / :focus-visible.
   Accessible fallback: elements with data-text should also carry
   aria-label so the bubble text is exposed to assistive tech.          */
[data-text]{position:relative}
[data-text]:hover::after,
[data-text]:focus::after,
[data-text]:focus-visible::after{
  content:attr(data-text);
  position:absolute;
  left:50%;
  bottom:calc(100% + 8px);
  transform:translateX(-50%);
  background:#222;
  color:#fff;
  padding:5px 9px;
  border-radius:4px;
  font-size:.78rem;
  font-weight:400;
  line-height:1.35;
  white-space:nowrap;
  max-width:280px;
  z-index:9999;
  pointer-events:none;
  box-shadow:0 2px 6px rgba(0,0,0,.25);
}
[data-text]:hover::before,
[data-text]:focus::before,
[data-text]:focus-visible::before{
  content:"";
  position:absolute;
  left:50%;
  bottom:calc(100% + 2px);
  transform:translateX(-50%);
  border:5px solid transparent;
  border-top-color:#222;
  z-index:9999;
  pointer-events:none;
}
/* When there isn't room above, authors can add data-tip-pos="below" */
[data-text][data-tip-pos="below"]:hover::after,
[data-text][data-tip-pos="below"]:focus::after,
[data-text][data-tip-pos="below"]:focus-visible::after{
  bottom:auto;
  top:calc(100% + 8px);
}
[data-text][data-tip-pos="below"]:hover::before,
[data-text][data-tip-pos="below"]:focus::before,
[data-text][data-tip-pos="below"]:focus-visible::before{
  bottom:auto;
  top:calc(100% + 2px);
  border-top-color:transparent;
  border-bottom-color:#222;
}
/* Empty data-text (used as a feature flag by some scripts) should NOT
   produce an empty bubble. */
[data-text=""]:hover::after,
[data-text=""]:focus::after,
[data-text=""]:focus-visible::after,
[data-text=""]:hover::before,
[data-text=""]:focus::before,
[data-text=""]:focus-visible::before{
  content:none;
}
/* High-contrast mode: use system colors so the bubble remains readable. */
@media (forced-colors: active){
  [data-text]:hover::after,
  [data-text]:focus::after,
  [data-text]:focus-visible::after{
    background:Canvas;color:CanvasText;border:1px solid CanvasText;
  }
  [data-text]:hover::before,
  [data-text]:focus::before,
  [data-text]:focus-visible::before{
    border-top-color:CanvasText;
  }
}
</style>
</head>
<body>
<a href="#main-content" class="skip-nav">&#x8DF3;&#x5230;&#x4E3B;&#x8981;&#x5167;&#x5BB9;</a>

<header role="banner">
  <div class="logo" aria-label="數學點字">π 數學<span>點字</span></div>
  <div class="tabs" role="tablist" aria-label="&#x8F49;&#x63DB;&#x65B9;&#x5411;">
    <button class="tab on" id="t-l2n" role="tab" aria-selected="true"
      aria-controls="p-l2n" onclick="setMode('l2n')">
      LaTeX &#x2192; Nemeth
    </button>
    <button class="tab" id="t-n2l" role="tab" aria-selected="false"
      aria-controls="p-n2l" onclick="setMode('n2l')">
      Nemeth &#x2192; LaTeX
    </button>
  </div>
</header>


<!-- LaTeX → Nemeth panel -->
<main id="p-l2n" id="main-content" role="tabpanel" aria-labelledby="t-l2n">
  <div class="grid">
    <div class="pane">
      <div class="ph" id="l2n-in-label">
        <span class="dot" aria-hidden="true"></span>LaTeX &#x8F38;&#x5165;
        <button class="btn" onclick="openFormatModal('l2n-in', l2nConvert)" style="margin-left:auto;text-transform:none;font-size:.75rem">📋 格式</button>
        <button class="me-open-btn" onclick="openMathEditor()" aria-label="&#x958B;&#x555F;&#x6578;&#x5B78;&#x7DE8;&#x8F2F;&#x5668;" style="text-transform:none;font-size:.75rem">📝 數學編輯器</button>
      </div>
      <textarea id="l2n-in"
        aria-labelledby="l2n-in-label"
        placeholder="&#x6578;&#x5B78;&#x5F0F;&#x4EE5; \( \) &#x5305;&#x4F4F;&#10;&#x4F8B;&#xFF1A;&#x8A2D; \(\overline{AB}\perp\overline{CD}\)&#xFF0C;&#x5247; \(\angle ABC=90^\circ\)&#x3002;"
        oninput="l2nConvert()"></textarea>
    </div>
    <div class="pane">
      <div class="ph" id="l2n-prev-label">
        <span class="dot p" aria-hidden="true"></span>MathJax &#x9810;&#x89BD;
        <label class="sync-chk" title="同步捲動"><input type="checkbox" id="sync-l2n-prev" checked> 同步</label>
      </div>
      <div class="box prev" id="l2n-prev"
        role="region" aria-labelledby="l2n-prev-label"
        aria-live="polite" aria-atomic="false"></div>
    </div>
  </div>
  <div class="pane">
    <div class="ph" id="l2n-out-label">
      <span class="dot g" aria-hidden="true"></span>Nemeth &#x8F38;&#x51FA;
      <span style="margin-left:auto;display:inline-flex;gap:8px;font-size:.65rem;font-weight:normal;text-transform:none;color:var(--dim);">
        <label style="cursor:pointer;display:inline-flex;align-items:center;gap:2px;"><input type="radio" name="l2n-output-format" value="unicode" checked onchange="l2nConvert()" style="accent-color:var(--blue);cursor:pointer;"> Unicode</label>
        <label style="cursor:pointer;display:inline-flex;align-items:center;gap:2px;"><input type="radio" name="l2n-output-format" value="ascii" onchange="l2nConvert()" style="accent-color:var(--blue);cursor:pointer;"> ASCII+SimBraille</label>
      </span>
    </div>
    <div class="box mono" id="l2n-out"
      role="region" aria-labelledby="l2n-out-label"
      aria-live="polite"></div>
  </div>
  <div class="acts" role="group" aria-label="&#x64CD;&#x4F5C;&#x6309;&#x9215;">
    <input type="file" id="nc-l2n-file" accept=".txt,.docx,.odt,.rtf,.pdf" style="display:none" onchange="handleOpenFile(event,'l2n-in',l2nConvert)">
    <button class="btn" onclick="document.getElementById('nc-l2n-file').click()">📂 開啟</button>
    <button class="btn pri" onclick="l2nCopy()" aria-label="&#x8907;&#x88FD; Nemeth &#x8F38;&#x51FA;&#x5230;&#x526A;&#x8CBC;&#x7C3F;">&#x8907;&#x88FD;</button>
    <button class="btn" onclick="l2nSave()">存 Nemeth</button>
    <button class="btn" onclick="l2nSaveInput()">存 LaTeX</button>
    <button class="btn" onclick="l2nSavePrev()">存預覽</button>
    <button class="btn" onclick="l2nClear()" aria-label="&#x6E05;&#x9664;&#x8F38;&#x5165;&#x5167;&#x5BB9;">&#x6E05;&#x9664;</button>
    <button class="btn" onclick="wrapStandaloneNumbers()" title="將文件中所有獨立數字（非題號）加上數學區塊標示">標示數字</button>
    <button class="btn" onclick="l2nCopyForBt()" title="送出 Unicode 點字輸出（不受目前顯示切換影響）給「文字轉點字」，轉換整份含中文的文件；包在 index.html 分頁架構裡會直接切到 bt 分頁並填入輸入框，單獨開啟 nc 則退回複製到剪貼簿+開新分頁">送到 bt →</button>
  </div>
  <div class="st" id="l2n-st" role="status" aria-live="polite"></div>
  <hr>
  <div class="symref" id="symRef" role="complementary" aria-label="108 &#x8AB2;&#x7DB1;&#x7B26;&#x865F;&#x5C0D;&#x7167;&#x8868;"></div>
</main>

<!-- Nemeth → LaTeX panel -->
<main id="p-n2l" class="out-collapsed" style="display:none" role="tabpanel" aria-labelledby="t-n2l">
  <div class="grid">
    <div class="pane">
      <div class="ph" id="n2l-in-label">
        <span class="dot" aria-hidden="true"></span>Nemeth &#x9EDE;&#x5B57;&#x8F38;&#x5165;
        <button class="btn brlp-trigger" id="n2l-dot-btn" style="margin-left:auto;" aria-label="點字輸入" aria-expanded="false" title="點字輸入（點擊開啟面板）&#10;Ctrl+B：開關六點鍵盤（F=1 D=2 S=3 | J=4 K=5 L=6）&#10;點陣：點選點位後按「插入」">⠿ 點字輸入</button>
      </div>
      <textarea id="n2l-in"
        aria-labelledby="n2l-in-label"
        placeholder="&#x8CBC;&#x5165; Unicode &#x9EDE;&#x5B57;&#xFF08;&#x283F;&#x2832;&#x2026;&#xFF09;&#10;&#x6216; Ctrl+B &#x555F;&#x7528;&#x516D;&#x9EDE;&#x9375;&#x76E4;&#10;Home/End/&#x65B9;&#x5411;&#x9375;&#x5728;&#x9EDE;&#x5B57;&#x6A21;&#x5F0F;&#x4E0B;&#x4ECD;&#x6B63;&#x5E38;&#x904B;&#x4F5C;"
        oninput="n2lConvert()"></textarea>
    </div>
    <div class="pane">
      <div class="ph" id="n2l-prev-label">
        <span class="dot p" aria-hidden="true"></span>MathJax &#x9810;&#x89BD;
        <label class="sync-chk" title="同步捲動"><input type="checkbox" id="sync-n2l-prev" checked> 同步</label>
      </div>
      <div class="box prev" id="n2l-prev"
        role="region" aria-labelledby="n2l-prev-label"
        aria-live="polite" aria-atomic="false"></div>
    </div>
  </div>
  <div class="pane">
    <div class="ph" id="n2l-out-label">
      <span class="dot g" aria-hidden="true"></span>LaTeX &#x8F38;&#x51FA;
      <button id="n2l-out-toggle" onclick="toggleN2lOut()"
        aria-expanded="false" aria-controls="n2l-out"
        style="margin-left:auto;background:none;border:none;color:var(--dim);cursor:pointer;font-size:.65rem;font-weight:700;letter-spacing:.05em;padding:0">&#x25B6; &#x5C55;&#x958B;</button>
    </div>
    <div class="box mono" id="n2l-out" style="display:none"
      role="region" aria-labelledby="n2l-out-label"

  ['\\mathbb{Q}',',_;,Q'],['\\mathbb{R}',',_;,R'],['\\mathbb{C}',',_;,C'],
  // Greek letters (Rule 6) - lowercase
  ['\\alpha','.A'],['\\beta','.B'],['\\gamma','.G'],['\\delta','.D'],
  ['\\epsilon','.E'],['\\zeta','.Z'],['\\eta','.:'],['\\theta','.?'],
  ['\\iota','.I'],['\\kappa','.K'],['\\lambda','.L'],['\\mu','.M'],
  ['\\nu','.N'],['\\xi','.X'],['\\omicron','.O'],['\\pi','.P'],
  ['\\rho','.R'],['\\sigma','.S'],['\\tau','.T'],['\\upsilon','.U'],
  ['\\phi','.F'],['\\chi','.&'],['\\psi','.Y'],['\\omega','.W'],
  // 108課綱表列的變體字形 \varepsilon(ε)/\varphi(φ) 跟 \epsilon(ϵ)/\phi(ϕ) 是同一個
  // 希臘字母的不同印刷字形，不是不同字母。Nemeth 的「另一種寫法」指示符（Rule 6/Lesson 4
  // 4.11.3）只有在同一份文件裡兩種寫法都出現時才需要用；這份教材只會固定用一種寫法，所以
  // 直接對應到跟標準寫法一樣的點字，不用另外處理指示符。
  ['\\varepsilon','.E'],['\\varphi','.F'],
  // Greek uppercase
  ['\\Delta','.,D'],['\\Gamma','.,G'],['\\Theta','.,?'],
  ['\\Lambda','.,L'],['\\Xi','.,X'],['\\Pi','.,P'],
  ['\\Sigma','.,S'],['\\Upsilon','.,U'],['\\Phi','.,F'],
  ['\\Psi','.,Y'],['\\Omega','.,W'],
  // Trig/function names (Rule 18)
  ['\\arcsin','arcsin '],['\\arccos','arccos '],['\\arctan','arctan '],
  ['\\sin','sin '],['\\cos','cos '],['\\tan','tan '],
  ['\\cot','cot '],['\\sec','sec '],['\\csc','csc '],
  ['\\ln','ln '],
  // Misc operators
  ['\\approx',' @:@: '],['\\cdots'," ''' "],['\\ldots'," ''' "],
  // Degree
  ['^{\\circ}','^.*'],['^\\circ','^.*'],
  // Absolute value shorthand
  ['\\lvert','\\'],['\\rvert','\\'],
  ['\\left|','\\'],['\\right|','\\'],

  // （Example 19-2/19-3 {Wed., Thurs., Fri} → .(,wed41 ,thurs41 ,fri4.)）
  // 純 LaTeX 分組用的無跳脫 { } 不受影響（另有專門邏輯處理，直接丟掉不印出符號）；
  // \left\{ / \right\} 沒接 \begin{array} 時也會落到這裡（\left/\right 本身先被丟掉，
  // 剩下的 \{ \} 才進到這個表），所以順便修正非矩陣情境的 \left\{ ... \right\}。
  ['\\{','.('],['\\}','.)'],

// LaTeX structural patterns (handled recursively)
// Processed innermost-first via nested brace parsing

// Extract content of balanced braces starting at position pos in s
function extractBraces(s, pos){
  if(s[pos]!=='{')return {content:s[pos]||'',end:pos+1};
  var depth=0,i=pos;
  while(i<s.length){
    if(s[i]==='{')depth++;
    else if(s[i]==='}'){depth--;if(depth===0)return{content:s.slice(pos+1,i),end:i+1};}
    i++;
  }
  return{content:s.slice(pos+1),end:s.length};
}

// Extract optional bracket [...]
function extractBracket(s, pos){
  if(pos>=s.length||s[pos]!=='[')return{content:null,end:pos};
  var i=pos+1;
  while(i<s.length&&s[i]!==']')i++;
  return{content:s.slice(pos+1,i),end:i+1};
}

// 吃掉矩陣/行列式結尾的 \right]/\right|/\right\vert（含前後空白）
// 用全域變數傳出新 index，JS 沒 out-parameter
var eatRightDelimIndex=0;
function eatRightDelim(s,i){
  while(i<s.length&&s[i]===' ')i++;
  if(s.slice(i,i+6)==='\\right'){
    var j=i+6;
    while(j<s.length&&s[j]===' ')j++;
    if(s[j]==='|'||s[j]===']'){j++;}
    else if(s.slice(j,j+5)==='\\vert'){j+=5;}
    else if(s.slice(j,j+2)==='\\}'){j+=2;}  // two-sided cases close
    i=j;
  }
  eatRightDelimIndex=i;
}

// Rule 15：常見「單一符號正上方/正下方加修飾符號」（overline/vec/箭頭/hat/dot/arc 等）
// 共用的內容轉換邏輯——遞迴轉換內容，並補回內部 sentinel 清理邏輯會誤刪的回基線符號：
// latexToNemethAsc 遞迴呼叫時，如果內容結尾剛好是上標/下標（如 x^2），那次獨立呼叫的
// sentinel 清理邏輯會判斷「這次呼叫裡後面沒東西了」而把回基線符號 " 整個吃掉；但外層還
// 要接上 modifierSuffix（如 <:] <$O] <_<]），所以還是需要這個 "（Example 15-4 已驗證：
// "x with bar" 且 x 帶平方 → x~2"<:]，閉合前有 "）。用內容原始 LaTeX 結尾是否為
// 上標/下標判斷，手動補回。
function wrapModifier(content,modifierSuffix){
  // Rule 3.4.1-style: content directly under a modifier's multipurpose
  // indicator doesn't get its own digit indicator (same principle \frac
  // already applies to its numerator/denominator) — confirmed against
  // Nemeth 2022 Rule 15.13 Examples 15-68/15-69 (decimal repeating-digit
  // bar): neither has a second digit indicator after the multipurpose
  // indicator introducing the barred digits.
  var nem=latexToNemethAsc(content).replace(/^#/,'');
  if(/[\^_](\{[^{}]*\}|[^{}\s])$/.test(content)) nem+='"';
  return '"'+nem+modifierSuffix;
}

// Real two-letter periodic-table element symbols — used by the numeral-
// subscript-omission check (Rule 14.6) below to recognize chemical formulas
// with multi-letter element symbols (Cl, Na, Ca, Mg, Fe, ...), not just
// single-letter ones (H, O, C, N, S, P, K...) which already worked via the
// plain single-letter check. An explicit symbol list (rather than a generic
// "any capital+lowercase pair" pattern) specifically avoids misfiring on
// ordinary two-adjacent-variable math notation (e.g. "Xy_2" meaning "X
// times y-sub-2" — rare in practice, but a generic pattern could not tell
// that apart from a genuine 2-letter element symbol; matching against the
// real periodic table eliminates the ambiguity).
var CHEM_2LETTER_SYMBOLS=new Set(['HE','LI','BE','NE','NA','MG','AL','SI','CL','AR',
  'CA','SC','TI','CR','MN','FE','CO','NI','CU','ZN','GA','GE','AS','SE','BR','KR',
  'RB','SR','ZR','NB','MO','TC','RU','RH','PD','AG','CD','IN','SN','SB','TE','XE',
  'CS','BA','LA','CE','PR','ND','PM','SM','EU','GD','TB','DY','HO','ER','TM','YB',
  'LU','HF','TA','RE','OS','IR','PT','AU','HG','TL','PB','BI','PO','AT','RN',
  'FR','RA','AC','TH','PA','NP','PU','AM','CM','BK','CF','ES','FM','MD','NO','LR',
  'RF','DB','SG','BH','HS','MT','DS','RG','CN','NH','FL','MC','LV','TS','OG']);

// Module-level flag (not a function parameter — see \ce dispatch below for
// why): true while processing the content of a \ce{...} chemistry-formula
// block. Rule 14.6's numeral-subscript-omission exception for chemical
// formulas can't be reliably detected from the accumulated output string
// alone — "HN" (chained single-letter elements, e.g. inside "HNO3") and
// "AB" (two ordinary adjacent math variables) produce the IDENTICAL comma
// pattern (",H,N" vs ",A,B"), so there is no way to tell them apart after
// the fact. \ce{...} (mhchem's standard LaTeX chemistry-formula command)
// gives an explicit, unambiguous signal instead: while this flag is set,
// every numeral subscript omits the indicator unconditionally, matching
// this document's own established rule text ("變數、函數、化學式後面接
// 下標數字時...不需加上下標記號") without needing any letter-pattern
// heuristics at all. A plain module-level var (rather than threading a
// parameter through latexToNemethAsc's every recursive call site) because
// \ce{} content never nests inside itself in practice and everything
// inside one \ce{} block — subscripts, superscripts, parenthesized groups
// — is uniformly chemistry, so there is nothing to "turn back off" until
// the whole block's content finishes processing.
var _chemMode=false;

// Convert a LaTeX string to Nemeth ASCII
function latexToNemethAsc(expr,insideScript,embedded,radicalDepth,scriptDepth){
  radicalDepth=radicalDepth||0;
  scriptDepth=scriptDepth||0;
  if(!expr||!expr.trim())return '';
  var s=expr.trim(), result='', i=0;
  // Tracks nesting depth of literal ( )  [ ] — used to scope the Rule 3.5.1
  // Enclosed List exception (comma+space before a digit doesn't need a
  // fresh numeric indicator) to content that's actually inside grouping
  // symbols, e.g. "(-3, 2)" or "[36, 48]". Without this, "1, 2, 3, 4" as a
  // bare top-level list (not inside any bracket) incorrectly lost the
  // indicator on every number after the first one.
  var bracketDepth=0;

  while(i<s.length){
    var c=s[i];

    // ── Backslash commands ─────────────────────────────────
    if(c==='\\'){
      var cmdEnd=i+1;
      // Read command name (letters) or single char
      if(cmdEnd<s.length&&/[a-zA-Z]/.test(s[cmdEnd])){
        while(cmdEnd<s.length&&/[a-zA-Z]/.test(s[cmdEnd]))cmdEnd++;
      }else{cmdEnd++;}
      var cmd=s.slice(i,cmdEnd);
      i=cmdEnd;
      // Skip trailing space after command
      if(i<s.length&&s[i]===' ')i++;

      // ── Structural commands ──────────────────────────────
      if(cmd==='\\frac'||cmd==='\\dfrac'||cmd==='\\tfrac'){
        var num=extractBraces(s,i);i=num.end;
        var den=extractBraces(s,i);i=den.end;
        // Inside fraction: no numeric indicator needed (Rule 3.4.1)
        var numNem=latexToNemethAsc(num.content,false,true).replace(/^#/,'');
        var denNem=latexToNemethAsc(den.content,false,true).replace(/^#/,'');
        // 檢測是否為繁分數（內層含簡單分數 ?…/…# 或 _?…/…_#）
        // Nemeth 2022 §13.6: 繁分數用 ,? ,/ ,# 標記
        var innerHasFrac=/[_]?\?[^?#]*\/[^?#]*#/.test(numNem)||/[_]?\?[^?#]*\/[^?#]*#/.test(denNem);
        var innerHasComplex=/,\?[^]*,\//.test(numNem)||/,\?[^]*,\//.test(denNem);
        // Mixed number: if result ends with a digit, use _? _# (Rule 13.4)
        var prevR=result.slice(-1);
        if(innerHasComplex){
          // Hypercomplex: ,,? … ,,/ … ,,#  (Nemeth 2022 §13.7, 超繁分數)
          result+=',,?'+numNem+',,/'+denNem+',,#';
        }else if(innerHasFrac){
          // Complex: ,? … ,/ … ,#  (Nemeth 2022 §13.6, 繁分數)
          result+=',?'+numNem+',/'+denNem+',#';
        }else if(/[0-9]/.test(prevR)){
          result+='_?'+numNem+'/'+denNem+'_#';
        }else{
          result+='?'+numNem+'/'+denNem+'#';
        }
        continue;
      }
      if(cmd==='\\sqrt'){
        var opt=extractBracket(s,i);i=opt.end;
        var rad=extractBraces(s,i);i=rad.end;
        // Inside radical: no numeric indicator (Rule 3.4.1)
        // Strip leading # from both index and radicand — the radical
        // sign > already acts as the "indicator" that suppresses #.
        // Rule 16.3 Nested Radicals: when a radical sits inside another
        // radical's own content, the order-of-radical indicator (dots 4-6,
        // ASCII ".") is repeated before BOTH the opening symbol (or the
        // index-of-radical indicator < if there's an index, per the rule's
        // own wording — not before the radical sign itself in that case)
        // and the termination indicator ] — once per nesting depth (the
        // outermost radical, depth 0, gets none at all). Verified against
        // Nemeth 2022 Example 16-14/16-15/16-16/16-17 (all four nested-
        // radical examples), including the index-present case (16-15).
        // radicalDepth is THIS radical's own depth (0 = not nested inside
        // another radical); radicalDepth+1 is passed to its own content so
        // a radical nested inside THIS one is marked one level deeper.
        var orderMark=Array(radicalDepth+1).join('.');
        var radNem=latexToNemethAsc(rad.content,false,true,radicalDepth+1).replace(/^#/,'');
        if(opt.content!==null){
          var idxNem=latexToNemethAsc(opt.content,false,true,radicalDepth+1).replace(/^#/,'');
          result+=orderMark+'<'+idxNem+'>'+radNem+orderMark+']';
        }else{
          result+=orderMark+'>'+radNem+orderMark+']';
        }
        continue;
      }
      if(cmd==='\\overline'||cmd==='\\bar'){
        var inner=extractBraces(s,i);i=inner.end;
        var content=inner.content.trim();
        // Rule 15.2.2：內容剛好是「單一數字或字母（可帶 prime）」才用縮寫形式（後面直接加 :）；
        // 只要有上標/下標或其他符號（+ - 等），一律照 15.2.1 五步驟用完整形式，
        // 必須遞迴呼叫 latexToNemethAsc 才能正確處理，不能逐字元濾掉非英數字元
        // （原本的寫法會把 + ^ 等符號直接丟掉，"x+y" 縮成 "xy"、"x^2" 縮成 "x2"，是誤譯）。
        // \bar 跟 \overline 在 Nemeth 是同一種記法（macron/overline 沒有分開的點字符號），
        // 共用同一套邏輯；n2l 還原統一還原成 \overline{...}（見 GEO 表，這是記法本身的
        // 固有歧義，不是 bug——兩個 LaTeX 指令、同一種點字，還原時只能選一個）。
        if(/^[A-Za-z0-9]'*$/.test(content)){
          var one=/[A-Z]/.test(content[0])?','+content:content;
          result+=one+':';
        }else{
          result+=wrapModifier(content,'<:]');
        }
        continue;
      }
      if(cmd==='\\overrightarrow'){
        var inner=extractBraces(s,i);i=inner.end;
        result+=wrapModifier(inner.content.trim(),'<$O]');continue;
      }
      if(cmd==='\\overleftrightarrow'){
        var inner=extractBraces(s,i);i=inner.end;
        result+=wrapModifier(inner.content.trim(),'<$[33O]');continue;
      }
      if(cmd==='\\vec'){
        // NFB Lesson 12 Postscript (Vector Notation Notes): a non-bold letter
        // with a superscribed right-pointing arrow keeps the arrow, in its
        // ordinary contracted form ($O) per 12.3.1 — same symbol as
        // \overrightarrow. (The bold case, where the arrow is omitted, isn't
        // representable in plain LaTeX \vec{} since it doesn't bold the
        // letter.) Confirmed against Lesson 15 Example 15-34: "x<$O]".
        var inner=extractBraces(s,i);i=inner.end;
        result+=wrapModifier(inner.content.trim(),'<$O]');continue;
      }
      if(cmd==='\\hat'||cmd==='\\widehat'){
        // Rule 15.15 Caret (circumflex)，Example 15-70："x^" → "x<_<]"
        var inner=extractBraces(s,i);i=inner.end;
        result+=wrapModifier(inner.content.trim(),'<_<]');continue;
      }
      if(cmd==='\\tilde'||cmd==='\\widetilde'){
        // Tilde 當一般字母修飾符號（不是加在比較符號上面那個特例，21.6/21.7 是另一回事）：
        // Example 8-39 "x with superscribed tilde" → "x<@:]"、Example 15-45 同款
        // "x with superscribed tilde" 用在下標對象裡 → "x<`:]"（PDF 原始擷取這兩處
        // 前綴字元不一致，`` ` ``／``@`` 對照 nc 自己的 Pr 表都是 dot-4，判斷是同一個
        // 符號、只是 PDF 來源排版時字元選用不一致，兩個範例互相驗證，可信度高）。
        var inner=extractBraces(s,i);i=inner.end;
        result+=wrapModifier(inner.content.trim(),'<@:]');continue;
      }
      if(cmd==='\\dot'){
        // Rule 15.16 Dot，Example 15-75："上面一個點" → "x<*]"
        var inner=extractBraces(s,i);i=inner.end;
        result+=wrapModifier(inner.content.trim(),'<*]');continue;
      }
      if(cmd==='\\ddot'){
        // Rule 15.16.2，Example 15-79：兩個點 → "x<**]"
        var inner=extractBraces(s,i);i=inner.end;
        result+=wrapModifier(inner.content.trim(),'<**]');continue;
      }
      if(cmd==='\\overset'){
        // \overset{\frown}{XY} -> arc
        var mod=extractBraces(s,i);i=mod.end;
        var base=extractBraces(s,i);i=base.end;
        if(mod.content.trim()==='\\frown'||mod.content.trim()==='\frown'){
          result+=wrapModifier(base.content.trim(),'<$A]');
        }else{
          result+='"'+latexToNemethAsc(base.content)+'<'+latexToNemethAsc(mod.content)+']';
        }
        continue;
      }
      if(cmd==='\\roman'){
        // Rule 3.11.1(a)：有意義代表數字的大寫羅馬數字，用「單一/雙重大寫指示符 +
        // 小寫字母」一起表示（Example 3-96 VII→,,vii），跟一般大寫字母「每個字母各自
        // 加大寫指示符」（,V,I,I）不同。羅馬數字語意無法從純字母自動判斷（規則書自己
        // 也說「有疑慮就不當羅馬數字」，Example 3-108 CL 不當羅馬數字），所以用專屬
        // 指令讓使用者明確標記：\roman{VII} 而不是直接打 VII。
        // 小寫羅馬數字（Rule 3.11.1(b)）當一般英文字母處理即可，不需要這個指令
        // （nc 本來就會把小寫字母原樣輸出，例：vi+iv .k x）。
        var inner=extractBraces(s,i);i=inner.end;
        var content=inner.content.trim();
        var capPfx=content.length===1?',':',,';
        result+=capPfx+content.toLowerCase();
        continue;
      }
      if(cmd==='\\begin'){
        var env=extractBraces(s,i);i=env.end;
        var envName=env.content.trim();
        // 聯立方程式 cases → .,( … (Nemeth 2022 §19.6 大括號)
        // PDF §17.4(a): "If only the left or right grouping sign is shown
        // in print, only that symbol is shown in braille." LaTeX's cases
        // environment renders with only a left brace in print (Example
        // 17-5), so we emit only .,( on each row — no right .,) symbol.
        // (For the two-sided variant of Example 17-6, the input should
        // use \left\{ ... \right\} + array, handled separately.)
        // 17.4(d): "The numeric indicator is not required before the
        // first numeric character following a left grouping symbol."
        // We implement this conservatively: only strip a leading #
        // that is literally the first character of the Nemeth output
        // (i.e. a plain digit start like "5X-Y"). We do NOT strip a #
        // that appears after a sign (e.g. "-#1"), since the "first
        // numeric *character*" in that case is after the minus.
        if(envName==='cases'){
          var endIdx=s.indexOf('\\end{cases}',i);
          if(endIdx<0)endIdx=s.indexOf('\\end',i);
          var body=endIdx>=0?s.slice(i,endIdx):s.slice(i);
          i=endIdx>=0?endIdx+('\\end{cases}'.length):s.length;
          var lines=body.split(/\\\\/);
          var validLines=[];
          for(var li=0;li<lines.length;li++){
            var ln=lines[li].replace(/^\s+|\s+$/g,'');
            if(ln)validLines.push(ln);
          }
          var caseRows=[];
          for(var li=0;li<validLines.length;li++){
            // 處理行內的 &（分段函式最常見的寫法就是「數值 & 條件」兩欄，如
            // "x, & \text{if } x \geq 0"）：原本只取第一個 & 之前的部分，
            // & 後面的條件文字整個被丟掉——這是嚴重的資訊遺失，Example 19-33
            // 官方分段函式範例明訂條件要保留在同一行（"@,(x, if x "k.k #0"，
            // 逗號後面的條件文字沒有省略）。改成每個 & 分隔的欄位都個別轉換、
            // 用空格串起來，跟下面矩陣分支處理多欄的方式一致。
            var cells=validLines[li].split('&').map(function(c){
              return c.replace(/^\{([\s\S]*)\}$/,'$1').replace(/^\s+|\s+$/g,'');
            }).filter(function(c){return c;});
            if(!cells.length)continue;
            var lineNem=cells.map(function(c){return latexToNemethAsc(c);}).join(' ');
            // PDF 17.4(d): strip leading # when the row starts with a
            // digit in direct contact with the left enlarged brace.
            lineNem=lineNem.replace(/^#/,'');
            // Only left brace — no trailing .,) (§17.4(a))
            caseRows.push('.,('+lineNem);
          }
          result+=caseRows.join('\n');
          continue;
        }
        // 矩陣 matrix / pmatrix / bmatrix → `,( … `,) (Nemeth 2022 §25.8, 放大括號)
        // pmatrix = 圓括號, bmatrix = 方括號, 無裝飾 matrix 也用方括號形式
        if(envName==='matrix'||envName==='pmatrix'||envName==='bmatrix'||envName==='Bmatrix'){
          var endTag='\\end{'+envName+'}';
          var endIdx=s.indexOf(endTag,i);
          if(endIdx<0)endIdx=s.indexOf('\\end',i);
          var body=endIdx>=0?s.slice(i,endIdx):s.slice(i);
          i=endIdx>=0?endIdx+endTag.length:s.length;
          var lines=body.split(/\\\\/);
          var matResult='';
          var validLines=[];
          for(var li=0;li<lines.length;li++){
            var ln=lines[li].replace(/^\s+|\s+$/g,'');
            if(ln)validLines.push(ln);
          }
          // 清除前文的 \left[ sentinel (editor 產生 \left [ \begin{matrix}...\right ])
          result=result.replace(/\\left\[\s*$/,'').replace(/\\left\|\s*$/,'');
          // Bmatrix 用大括號，其他用方括號
          var open=(envName==='Bmatrix')?'.,(':'`,(';
          var close=(envName==='Bmatrix')?'.,)':'`,)';
          for(var li=0;li<validLines.length;li++){
            var cellParts=validLines[li].split(/&/).map(function(c){return latexToNemethAsc(c.trim());});
            matResult+=open+cellParts.join(' ')+close+(li<validLines.length-1?'\n':'');
          }
          result+=matResult;
          // 吃掉後續的 \right] / \right| (含空白)
          eatRightDelim(s,i);
          // 把 eatRightDelim 的結果反映回 i
          i=eatRightDelimIndex;
          continue;
        }
        // 行列式 vmatrix / Vmatrix → ,\ ... ,\ (Nemeth 2022 §25.8 垂直線)
        // 對照 PDF Example 25-63: row 兩端都是 ,\ (Nemeth ASCII) = ⠠⠳
        if(envName==='vmatrix'||envName==='Vmatrix'){
          var endTag='\\end{'+envName+'}';
          var endIdx=s.indexOf(endTag,i);
          if(endIdx<0)endIdx=s.indexOf('\\end',i);
          var body=endIdx>=0?s.slice(i,endIdx):s.slice(i);
          i=endIdx>=0?endIdx+endTag.length:s.length;
          var lines=body.split(/\\\\/);
          var detResult='';
          var validLines=[];
          for(var li=0;li<lines.length;li++){
            var ln=lines[li].replace(/^\s+|\s+$/g,'');
            if(ln)validLines.push(ln);
          }
          for(var li=0;li<validLines.length;li++){
            var cellParts=validLines[li].split(/&/).map(function(c){return latexToNemethAsc(c.trim());});
            detResult+=',\\'+cellParts.join(' ')+',\\'+(li<validLines.length-1?'\n':'');
          }
          result+=detResult;continue;
        }
        // array 環境 (可能配合 \left|…\right| 成為行列式，或 \left[…\right] 成為矩陣)
        if(envName==='array'){
          // 跳過 column spec，例如 {cc} {c|c}
          if(i<s.length&&s[i]==='{'){
            var spec=extractBraces(s,i);i=spec.end;
          }
          var endIdx=s.indexOf('\\end{array}',i);
          if(endIdx<0)endIdx=s.indexOf('\\end',i);
          var body=endIdx>=0?s.slice(i,endIdx):s.slice(i);
          i=endIdx>=0?endIdx+('\\end{array}'.length):s.length;
          var lines=body.split(/\\\\/);
          var arrResult='';
          var validLines=[];
          for(var li=0;li<lines.length;li++){
            var ln=lines[li].replace(/^\s+|\s+$/g,'');
            if(ln)validLines.push(ln);
          }
          // 檢查前文 sentinel 來決定類型：
          //   \left|    → 行列式 (enlarged vertical bar ,\)
          //   \left\{   → 雙邊聯立方程式 (enlarged brace .,( ... .,)，Example 17-6)
          //   \left[    → 矩陣 (enlarged bracket @,(, Nemeth ASCII)
          //   (沒有)    → 退回矩陣預設
          var isDet=/\\left\s*\|\s*$/.test(result)||/\\left\s*\\vert\s*$/.test(result);
          var isTwoSidedCases=/\\left\\\{\s*$/.test(result);
          // 清除 sentinel
          result=result.replace(/\\left\s*\|\s*$/,'')
                       .replace(/\\left\s*\\vert\s*$/,'')
                       .replace(/\\left\\\{\s*$/,'')
                       .replace(/\\left\[\s*$/,'');
          var open, close;
          if(isDet){ open='@,('; close='@,)'; }
          else if(isTwoSidedCases){ open='.,('; close='.,)'; }
          else { open='`,('; close='`,)'; }
          for(var li=0;li<validLines.length;li++){
            var cellParts=validLines[li].split(/&/).map(function(c){return latexToNemethAsc(c.trim());});
            // §17.4(d) for two-sided cases: strip leading # on first
            // numeric in contact with the left enlarged brace.
            if(isTwoSidedCases && cellParts.length>0){
              cellParts[0]=cellParts[0].replace(/^#/,'');
            }
            arrResult+=open+cellParts.join(' ')+close+(li<validLines.length-1?'\n':'');
          }
          result+=arrResult;
          eatRightDelim(s,i);
          i=eatRightDelimIndex;
          continue;
        }
        continue;
      }
      if(cmd==='\\end'){extractBraces(s,i);i+=0;continue;} // skip \end{...}
      if(cmd==='\\binom'){
        var top=extractBraces(s,i);i=top.end;
        var bot=extractBraces(s,i);i=bot.end;
        result+='('+latexToNemethAsc(top.content)+'%'+latexToNemethAsc(bot.content)+')';
        continue;
      }
      // \ce{...} (mhchem chemistry-formula notation) — explicit signal that
      // everything inside is a chemical formula, so Rule 14.6's numeral-
      // subscript-omission exception applies unconditionally (see _chemMode
      // above for why this can't just be inferred from letter patterns).
      // Two mhchem shorthand conventions get rewritten into plain LaTeX
      // before falling through to the normal recursive parser, which then
      // handles everything else (+ signs, parens, ^ charges — including
      // Rule 14.11's simultaneous subscript-then-superscript ordering for
      // e.g. SO4^{2-}) via its existing machinery, no new handling needed:
      //   - "->" (bare reaction arrow) -> \rightarrow, already a working
      //     command (produces the same ⠫⠕ used elsewhere for rays/→).
      //     Equilibrium arrows (<=>, <=>>, <<=>) are NOT handled — no
      //     example in this document has needed them yet.
      //   - a bare digit run right after a letter or closing grouping
      //     symbol (mhchem's implicit-subscript shorthand, e.g. "H2O",
      //     "Ca(OH)2") -> explicit "_{...}" so it flows through the normal
      //     subscript branch (with _chemMode forcing the omission).
      // A third rewrite handles physical-state annotations — (g)/(l)/(s)/
      // (aq) — per BANA §5.2.1: "If print shows the physical state in the
      // subscript position, such placement is disregarded in braille" —
      // i.e. (g) etc. is ALWAYS baseline text, never really a subscript,
      // even when the source LaTeX groups it together with a genuine
      // subscript count (e.g. "Cl_{2(g)}", mirroring how print visually
      // stacks "2(g)" as one subscripted unit). Split BEFORE the implicit-
      // digit-wrap pass below runs, so "_{2(g)}" becomes "_{2}(g)" (real
      // subscript "2", state left on the baseline) and a bare "_{(g)}"
      // (no count) becomes just "(g)" with no subscript at all. Caught via
      // cross-checking electrolysis examples (Cl2(g), H2(g)) against
      // class.kh.edu.tw/19061/bulletin/msg_view/434's reference table:
      // grouping the state into the subscript also broke the numeral-only
      // omission test ($/^[0-9]+$/), so it produced a spurious ⠰ that
      // shouldn't be there at all, not just a misplaced (g).
      if(cmd==='\\ce'){
        var ceEx=extractBraces(s,i);i=ceEx.end;
        var ceContent=ceEx.content
          .replace(/->/g,'\\rightarrow')
          .replace(/_\{(\d*)\((g|l|s|aq)\)\}/g,function(m,digits,state){
            return (digits?'_{'+digits+'}':'')+'('+state+')';
          })
          .replace(/([A-Za-z)\]])(\d+)/g,'$1_{$2}');
        var _prevChemMode=_chemMode;
        _chemMode=true;
        try{
          result+=latexToNemethAsc(ceContent,insideScript,embedded);
        }finally{
          _chemMode=_prevChemMode;
        }
        continue;
      }
      // Vaporization/precipitation arrows (BANA "Chemical Notation Using
      // the Nemeth Braille Code" 2023 ed. §3.2.4): "The arrow is unspaced
      // from the element SYMBOL to which it applies... If the arrow is
      // interior to the expression, a space follows the arrow." — i.e. no
      // leading space ever, but a trailing space ONLY when something else
      // still follows in this same expression (not when it's the last
      // thing, e.g. a lone "...+CO2\uparrow" ending a reaction). Handled
      // here as its own dispatch (rather than a static LATEX_SIMPLE
      // string) specifically because that trailing-space decision needs
      // to peek at what comes next — plain string substitution has no way
      // to know that. Verified against class.kh.edu.tw/19061/bulletin/
      // msg_view/434's existing table: both the trailing-space case
      // (interior, e.g. "SO2↑ + H2O") and the no-trailing-space case
      // (expression-final, e.g. "...+CO2↑") match exactly once this
      // lookahead was added — a fixed suffix without it reproduced the
      // second case fine but dropped the space in the first.
      if(cmd==='\\uparrow'||cmd==='\\downarrow'){
        result+=(cmd==='\\uparrow'?'$<':'$%');
        var _arrowRest=s.slice(i).replace(/^\s+/,'');
        if(_arrowRest.length>0&&_arrowRest[0]!=='}')result+=' ';
        continue;
      }
      // ── Geometry shapes (Rule 17) ─────────────────────
      if(cmd==='\\angle'){result+='$[ ';continue;}
      if(cmd==='\\triangle'){result+='$T ';continue;}
      if(cmd==='\\square'){result+='$4';continue;}
      if(cmd==='\\perp'){result+=' $P ';continue;}
      if(cmd==='\\parallel'){result+=' $L ';continue;}
      if(cmd==='\\cong'){result+=' @:.K ';continue;}
      if(cmd==='\\sim'){result+=' @: ';continue;}
      if(cmd==='\\pmod'||cmd==='\\bmod'){
        // Rule 21 Example 21-12: "2≡5(mod 3)" -> "#2 _l #5(mod #3)" — the
        // modulus keeps its own numeric indicator (it's preceded by the
        // literal word "mod" + space, not touching the prior numeral), and
        // "(mod ...)" as a whole is unspaced from whatever precedes it
        // (matches \pmod's own LaTeX rendering convention).
        var m=extractBraces(s,i);i=m.end;
        result+='(mod '+latexToNemethAsc(m.content.trim())+')';
        continue;
      }
      if(cmd==='\\log'){
        // Base written as \log[b]{x} (bracket) or the more common \log_{b}{x}
        // (LaTeX subscript, matching the 108 課綱 table's own convention) —
        // both glue the base directly onto "log" with no space (pathstoliteracy
        // .org "Logarithm Examples with SimBraille" #4: log_e x -> "log;e x").
        // A numeric base additionally omits the subscript indicator per Rule
        // 14.6 (#3 there / Example 14-41 "log2 x") — previously only the
        // bracket form was handled; \log_{b}{x} fell through to "log " (with
        // a now-stray trailing space) plus the generic subscript branch.
        var sub=extractBracket(s,i);i=sub.end;
        if(sub.content===null&&s[i]==='_'){
          var us=extractBraces(s,i+1);sub={content:us.content,end:us.end};i=sub.end;
        }
        if(sub.content!==null){
          var baseTrim=sub.content.trim();
          var baseNem=latexToNemethAsc(baseTrim,true).replace(/^#/,'');
          result+=/^[0-9]+$/.test(baseTrim)?('log'+baseNem):('log;'+baseNem);
          // Rule 18.4/14.3.b: the space after "log" (plus its base) before the
          // argument is mandatory regardless of source spacing — previously
          // only handled when the argument was braced or already had a
          // literal space before it; a bare argument immediately following
          // (e.g. \log_{2}8, no braces/space) fell through with no space at
          // all, merging into an ambiguous run ("log28" instead of "log2
          // #8", indistinguishable from log base 28).
          if(i<s.length&&s[i]==='{'){var a=extractBraces(s,i);i=a.end;result+=' '+latexToNemethAsc(a.content);}
          else if(i<s.length&&s[i]===' '){result+=' ';i++;}
          else if(i<s.length){result+=' ';}
        }else result+='log ';continue;
      }
      if(cmd==='\\lim'){
        var sub=extractBraces(s,i);
        if(i<s.length&&s[i]==='_'){
          // Rule 15: the under-modifier needs a termination indicator (]),
          // and lim is a function name so Rule 18.4 mandates a following
          // space regardless of source spacing — both were previously
          // missing (already-published msg_view/1041 example has both:
          // "...⠼⠴⠻⠀⠋⠷⠭⠾" for \lim_{x\to0}f(x), this handler produced
          // neither).
          i++;sub=extractBraces(s,i);i=sub.end;
          result+='"lim%'+latexToNemethAsc(sub.content.trim())+'] ';
        }
        else result+='lim ';
        continue;
      }
      if(cmd==='\\sum'||cmd==='\\prod'){
        // Rule 15: a large operator's limits, when stacked directly above/below
        // it (display style — the norm for a standalone equation in this tool),
        // use the under (%) / over (<) modifier construction, under written
        // first regardless of source order, terminated by ']'. Previously this
        // fell through to ordinary corner subscript/superscript, which is only
        // correct for inline-style limits (see Example 15-37 vs Example 14-57
        // in Nemeth 2022 — confirmed independently against MathCAT's Nemeth
        // rules, which branch the same way on MathML munderover vs msubsup).
        var bigOpBase=(cmd==='\\sum')?'".,S':'".,P';
        var bigOpJ=i;
        while(bigOpJ<s.length&&s[bigOpJ]===' ')bigOpJ++;
        if(s.slice(bigOpJ,bigOpJ+7)==='\\limits')bigOpJ+=7;
        var bigOpUnder=null,bigOpOver=null;
        for(var bigOpPass=0;bigOpPass<2;bigOpPass++){
          while(bigOpJ<s.length&&s[bigOpJ]===' ')bigOpJ++;
          if(s[bigOpJ]==='_'&&bigOpUnder===null){
            bigOpJ++;var bigOpSub=extractBraces(s,bigOpJ);bigOpUnder=bigOpSub.content;bigOpJ=bigOpSub.end;
          }else if(s[bigOpJ]==='^'&&bigOpOver===null){
            bigOpJ++;var bigOpSup=extractBraces(s,bigOpJ);bigOpOver=bigOpSup.content;bigOpJ=bigOpSup.end;
          }else break;
        }
        i=bigOpJ;
        result+=bigOpBase;
        if(bigOpUnder!==null||bigOpOver!==null){
          if(bigOpUnder!==null)result+='%'+latexToNemethAsc(bigOpUnder);
          if(bigOpOver!==null)result+='<'+latexToNemethAsc(bigOpOver);
          result+=']';
        }
        continue;
      }
      if(cmd==='\\int'){result+='!';continue;}
      if(cmd==='\\iint'){result+='!!';continue;}
      if(cmd==='\\iiint'){result+='!!!';continue;}
      if(cmd==='\\left'||cmd==='\\right'){
        // 多數情況只需丟掉；但 \left| \left[ \left\{ 要看後面是否是 \begin{array}
        // 決定是行列式/矩陣/雙邊聯立方程式
        // 抓下一個非空字元
        var j=i;
        while(j<s.length&&s[j]===' ')j++;
        var nextCh=s[j]||'';
        // 判斷分隔符類型 (準備與 \begin{array} 結合)
        var isLeftVert=(cmd==='\\left'&&(nextCh==='|'||s.slice(j,j+5)==='\\vert'));
        var isLeftBrack=(cmd==='\\left'&&nextCh==='[');
        // \left\{ → 代表雙邊聯立方程式 (Example 17-6: 左右都有 enlarged brace)
        var isLeftBrace=(cmd==='\\left'&&s.slice(j,j+2)==='\\{');
        if(isLeftVert||isLeftBrack||isLeftBrace){
          // 跳過分隔符並前瞻看是否緊跟 \begin{array} 或 \begin{matrix}
          var k=j;
          if(nextCh==='|')k=j+1;
          else if(s.slice(j,j+5)==='\\vert')k=j+5;
          else if(nextCh==='[')k=j+1;
          else if(isLeftBrace)k=j+2; // skip \{
          while(k<s.length&&s[k]===' ')k++;
          if(s.slice(k,k+6)==='\\begin'){
            // 留下 sentinel (反引號不會出現在 LaTeX 裡，當作 sentinel 安全)
            result+=isLeftVert?'\\left|':(isLeftBrack?'\\left[':'\\left\\{');
            i=k;
            continue;
          }
        }
        // 一般情況：直接丟掉
        continue;
      }
      if(cmd==='\\mathbb'){
        var arg=extractBraces(s,i);i=arg.end;
        // Rule 7: typeform indicator needs alphabetic indicator (;) then
        // the letter's own capital sign (,) — see LATEX_SIMPLE \mathbb{N} comment.
        result+=',_;,'+arg.content.trim();continue;
      }
      if(cmd==='\\mathrm'||cmd==='\\text'||cmd==='\\operatorname'){
        var arg=extractBraces(s,i);i=arg.end;
        // \text{}/\mathrm{}/\operatorname{} mark content as an ordinary
        // printed word (as opposed to bare math-mode letters, which are
        // math objects like point labels — "$ABCDE$" for a pentagon's
        // vertices needs a capital indicator on EACH letter, Rule per
        // CH1 "不同端點或不同元素需分開使用大寫記號"). A continuous
        // all-caps WORD like "USA" instead uses a single double capital
        // indicator covering the whole run (CH1 "連續兩個大寫記號代表
        // 接下來的英文字母都是大寫"). Bare "$USA$" can't be told apart
        // from "$ABCDE$" from the LaTeX alone — both are just consecutive
        // capital letters — so \text{} is the deliberate signal a document
        // author uses to say "this is one word", matching how \text is
        // ordinarily used for print English inside a math expression.
        if(/^[A-Z]{2,}$/.test(arg.content)){
          result+=',,'+arg.content;
        }else if(/^[A-Za-z]$/.test(arg.content)){
          // Rule 10.3: the English-letter indicator (;) is required before
          // a ONE-LETTER abbreviation (10 g -> ;G, 1 km = 1000 m -> the
          // multi-letter "km" stays bare but the one-letter "m" needs ;M),
          // regardless of an attached superscript/subscript/period/grouping
          // symbol (Example 10-22/10-21). Multi-letter abbreviations (cm,
          // km, sec...) do NOT take this indicator (Example 10-23/10-24),
          // which is why this branch only fires for exactly one letter.
          result+=';'+(/[A-Z]/.test(arg.content)?','+arg.content:arg.content.toUpperCase());
        }else{
          result+=arg.content;
        }
        continue;
      }
      // ── Simple command lookup ────────────────────────────
      var found=false;
      for(var si=0;si<LATEX_SIMPLE.length;si++){
        if(cmd===LATEX_SIMPLE[si][0]){result+=LATEX_SIMPLE[si][1];found=true;break;}
      }
      // \{ and \} are grouping symbols too (Rule 3.5.1 Enclosed List scope) —
      // track them the same as literal ( ) [ ] above.
      if(cmd==='\\{')bracketDepth++;
      else if(cmd==='\\}')bracketDepth=Math.max(0,bracketDepth-1);
      if(!found)result+=cmd.slice(1).toUpperCase()+' '; // unknown -> uppercase
      continue;
    }

    // ── Simultaneous subscript+superscript (Rule 14.11) ────────────────────
    // When a base carries both at once (e.g. P^{m}_{n} or P_{n}^{m}), Nemeth
    // requires the subscript first regardless of source order, with no
    // baseline-return between them (they're one unit, not two separate
    // script excursions). Detected by peeking past the first script marker
    // for an immediately-adjacent second one; falls through to the ordinary
    // single-script branches below when there's no such pair.
    if(c==='^'||c==='_'){
      var simFirstIsSup=(c==='^');
      var simFirstEx=extractBraces(s,i+1);
      var simOtherCh=s[simFirstEx.end];
      if((simFirstIsSup&&simOtherCh==='_')||(!simFirstIsSup&&simOtherCh==='^')){
        var simSecondEx=extractBraces(s,simFirstEx.end+1);
        var simSupContent=(simFirstIsSup?simFirstEx.content:simSecondEx.content).trim();
        var simSubContent=(simFirstIsSup?simSecondEx.content:simFirstEx.content).trim();
        i=simSecondEx.end;
        var simSubNem=latexToNemethAsc(simSubContent,true).replace(/^(-?)#/,'$1');
        var simSupNem=latexToNemethAsc(simSupContent,true).replace(/^(-?)#/,'$1');
        // Same Rule 14.6 numeric-subscript-omission test as the standalone
        // subscript branch below (kept in sync with it).
        var _simFuncBases=['arcsin ','arccos ','arctan ','sin ','cos ','tan ','cot ','sec ','csc ','ln ','log ','lim '];
        var _simIsFuncBase=_simFuncBases.some(function(fn){return result.slice(-fn.length)===fn;});
        var _simLetterEnd=result.match(/(,?[A-Za-z]'*)$/);
        var _simIsLetterBase=false;
        if(_simLetterEnd){
          if(_chemMode){
            // See the standalone subscript branch below for the full
            // explanation (kept in sync with it).
            _simIsLetterBase=true;
          }else{
            var _simCharBefore=result[result.length-_simLetterEnd[0].length-1]||'';
            _simIsLetterBase=!/[A-Za-z]/.test(_simCharBefore);
          }
        }
        // Two-letter chemical element symbol — see the standalone subscript
        // branch below for the full explanation (kept in sync with it,
        // including NOT checking the character before the match — chained
        // element symbols like "CaCl2" would otherwise block every element
        // after the first).
        if(!_simIsLetterBase){
          var _simChemEnd=result.match(/,([A-Za-z][A-Za-z])'*$/);
          if(_simChemEnd&&CHEM_2LETTER_SYMBOLS.has(_simChemEnd[1].toUpperCase())){
            _simIsLetterBase=true;
          }
        }
        var _simOmitSubInd=!insideScript&&/^[0-9]+$/.test(simSubContent)&&(_simIsFuncBase||_simIsLetterBase);
        if(_simOmitSubInd){
          if(_simIsFuncBase)result=result.replace(/ $/,'');
          result+=simSubNem;
        }else{
          result+=';'+simSubNem;
        }
        result+='^'+simSupNem+'"\x01';
        continue;
      }
    }

    // ── Superscript ^ ─────────────────────────────────────────────────────
    if(c==='^'){
      i++;
      // Bare ^\circ (no braces): degree symbol. Same sentinel as the general
      // superscript case below (Rule 10.6.3 Example 10-58: "20°C", unspaced,
      // needs the baseline-return indicator before C; "20° C", spaced, does
      // not — the cleanup pass below strips the sentinel when whitespace
      // follows and keeps it as "\"" otherwise, exactly matching that rule).
      if(s.slice(i,i+5)==='\\circ'&&(i+5>=s.length||!/[a-zA-Z]/.test(s[i+5]))){
        i+=5; result+='^.*"\x01'; continue;
      }
      var exp=extractBraces(s,i);
      var expTrim=exp.content.trim();
      if(expTrim==='\\circ'||expTrim==='\circ'){
        i=exp.end; result+='^.*"\x01'; continue;
      }
      i=exp.end;
      // Rule 14.3.2 + 14.3.b/14.7: a function name's mandatory trailing
      // space (baked into "sin "/"tan "/etc. by the LATEX_SIMPLE table)
      // must NOT precede an indicator that applies to it — the indicator
      // attaches directly (Example 14-6/14-13: TAN^-1, not TAN ^-1) — and
      // the mandatory space is deferred to AFTER the superscript closes
      // (Example 14-17/14-18: SIN^2 .?, not SIN^2".?). That trailing space
      // is a real space, not a baseline-indicator sentinel, since the space
      // itself already returns the reader to the baseline.
      var _supFuncBases=['arcsin ','arccos ','arctan ','sin ','cos ','tan ','cot ','sec ','csc ','ln ','log ','lim '];
      var _supIsFuncBase=_supFuncBases.some(function(fn){return result.slice(-fn.length)===fn;});
      if(_supIsFuncBase){
        result=result.replace(/ $/,'');
        result+='^'+latexToNemethAsc(expTrim,true).replace(/^(-?)#/,'$1')+' \x01';
        continue;
      }
      // Inside superscript: no numeric indicator (Rule 3.4.1), even when the
      // numeral is preceded by an unspaced negative sign that starts the
      // superscript content — Rule 3.4.1's "no indicator after superscript
      // indicator" example (x2 -> x^2) is confirmed to override the general
      // negative-number exception in this position by Lesson 14 Example
      // 14-13 (tan^-1, not tan^-#1); (-?)# strips an optional leading minus
      // together with the # so the minus is put back but the # is not.
      // The baseline indicator " is appended only when there are more
      // math objects following at the baseline (handled in cleanup below).
      // insideScript=true：內容裡如果又有下標，屬於 Rule 14.6 講的「higher order」，
      // 不能再套用數字下標指示符省略規則（見下面 subscript 分支）。
      // Rule 14.4.3 + Example 14-9（Superscript Letter with Superscript
      // Letter，n^(x^y) 印刷體點字為 n~x~~y）：上標的上標（同方向巢狀）要疊加上標
      // 指示符，疊加次數等於目前巢狀深度＋1——跟既有 \sqrt 巢狀用 radicalDepth
      // 疊加多重根號指示符是同一個原理，這裡用 scriptDepth 對應。只在「上標裡面
      // 還是上標」這個同方向巢狀情形疊加；範圍刻意收斂到這一種（跟 radicalDepth
      // 一樣，因為只有這個情形有官方範例可核對，「上標裡面是下標」之類的混合巢狀
      // 沒有動，維持原來每層各自一個指示符的行為，不強行套用同一套疊加邏輯）。
      var _upMarks=Array(scriptDepth+2).join('^');
      result+=_upMarks+latexToNemethAsc(expTrim,true,embedded,radicalDepth,scriptDepth+1).replace(/^(-?)#/,'$1')+'"\x01';
      continue;
    }

    // ── Subscript _ ───────────────────────────────────────
    if(c==='_'){
      i++;
      var sub=extractBraces(s,i);i=sub.end;
      var subContent=sub.content.trim();
      // Inside subscript: no numeric indicator (Rule 3.4.1), including when
      // preceded by an unspaced negative sign starting the subscript content
      // (see the parallel note on the superscript branch above).
      var subNem=latexToNemethAsc(subContent,true).replace(/^(-?)#/,'$1');
      // Rule 14.6 Numeric Subscripts：右下標若同時符合：
      //   a. 是右下標（LaTeX _ 本來就只有右下標，恆成立）
      //   b. 只有一層，不含自己的上下標（不是巢狀在別的上下標「裡面」，也不能自己
      //      再帶上下標——用 insideScript 擋住巢狀情形，subContent 只能是純數字擋住
      //      「自己還帶上下標」的情形）
      //   c. 下標的對象是字母（任何字母系統）或縮寫函式名
      //   d. 下標本身只有數字
      // 下標指示符 ; 連同回基線符號都要省略（不是只省略 ;）——x_1 → x1（不是 x;1、
      // 也不是 x1"）、log_2 x → log2 x（不是 log;2 x、也不是 log2"x，注意函式名原本
      // 帶的空白這裡也要拿掉：Example 14-41 官方是 "log2 x" 不是 "log 2 x"）。
      // 用 result 目前結尾判斷對象：單一字母（含 Greek 的 .字母 / .,字母、大寫的 ,字母，
      // 且前面不是另一個英數字元，避免 "AB" 這種多字母序列把 B 誤判成單一字母)，
      // 或是已知縮寫函式名（trig/log/ln/lim，這些指令都以「詞+空白」結尾）。
      var _funcNameBases=['arcsin ','arccos ','arctan ','sin ','cos ','tan ','cot ','sec ','csc ','ln ','log ','lim '];
      var _isFuncBase=_funcNameBases.some(function(fn){return result.slice(-fn.length)===fn;});
      // Rule 14.6 條件 c 明訂「字母可以帶一個以上的質數記號」不影響省略資格
      // （Example 14-39 "x'1" 沒有 ;），質數記號 ' 本身在 nc 是原樣直接輸出的字元
      // （Rule 23.16，撇號本來就是質數記號，見 Example 23-34~23-39），所以判斷結尾
      // 字母時允許後面接零個以上的 '。
      var _letterEnd=result.match(/(,?[A-Za-z]'*)$/);
      var _isLetterBase=false;
      if(_letterEnd){
        if(_chemMode){
          // Inside \ce{...}: skip the "avoid AB ambiguity" char-before
          // check entirely. Chained single-letter element symbols (e.g.
          // the H-N-O run in "HNO3") produce the exact same comma pattern
          // as two ordinary adjacent math variables ("AB") — see _chemMode
          // above — so this can only be resolved by the explicit \ce{}
          // signal, not by inspecting the pattern itself.
          _isLetterBase=true;
        }else{
          var _charBefore=result[result.length-_letterEnd[0].length-1]||'';
          // 只有「前面緊接另一個字母」才不算獨立字母（避免 "AB" 誤判成單一字母 B）；
          // 前面是數字不影響判斷——Example 14-117 "x1y1"，y 前面緊接 x 的下標數字 1，
          // y 本身還是算獨立字母，一樣要省略指示符（"x1y1" 兩個下標都不加 ;）。
          _isLetterBase=!/[A-Za-z]/.test(_charBefore);
        }
      }
      // 化學式的雙字母元素符號（Cl、Na、Ca、Mg、Fe...）同樣適用 Rule 14.6 省略規則
      // （單字母元素 H/O/C 已經被上面的邏輯正確處理，這裡補的是雙字母的情況）——
      // 對照 class.kh.edu.tw/19061/bulletin/msg_view/434 既有的化學反應式點字核對
      // 才抓到：CaCl2/NaOH/H2SO4 這類雙字母元素式子被誤插了下標指示符（"Cl;2"
      // 而非 "Cl2"），因為上面的單字母判斷刻意排除「前面緊接另一個字母」的情況
      // （為了不誤判 "AB" 這種多字母序列），連帶也擋住了雙字母元素符號本身第二個
      // 字母。用實際週期表符號表比對，不是泛用的「大寫+小寫」樣式，避免跟一般數學
      // 「兩個相鄰單字母變數」的寫法（如 $Xy_2$ 理論上可能是「X 乘 y 下標 2」）混淆
      // ——真的週期表符號表本身就已經排除了這種巧合誤判的機率。
      // 不檢查「前面是不是字母」：跟單字母判斷不同，這裡故意省略這一步，因為化學式
      // 常常是好幾個元素符號連在一起（CaCl2 = Ca + Cl2），前一個元素符號的最後一個
      // 字母本來就是字母，如果沿用單字母判斷的排除邏輯，會連鎖擋住整條化學式裡除了
      // 第一個元素以外的所有元素——用逗號本身已經標記了「這是獨立的新字母」這件事
      // （nc 的大寫指示符规则本來就是每個需要大寫的新字母各自補一個逗號），不需要
      // 再額外檢查前一個字元。
      if(!_isLetterBase){
        var _chemEnd=result.match(/,([A-Za-z][A-Za-z])'*$/);
        if(_chemEnd&&CHEM_2LETTER_SYMBOLS.has(_chemEnd[1].toUpperCase())){
          _isLetterBase=true;
        }
      }
      var _omitSubInd=!insideScript&&/^[0-9]+$/.test(subContent)&&(_isFuncBase||_isLetterBase);
      if(_omitSubInd){
        if(_isFuncBase) result=result.replace(/ $/,'');
        result+=subNem; // 省略下標指示符時，回基線 sentinel 也一併不加（不算真正切換層級）
        // Rule 18.4：函式名（連同它的下標）後面一定要留一格再接引數，這格空白原本
        // 就存在（"log " 的空白），但上面為了避免變成 "log 2" 已經先拿掉，這裡在
        // 下標處理完之後補回來——只有函式名底才需要，一般字母底（x_1+y 這種）維持
        // 原本「單一空白＝排版用途、略過」的行為，不要多插空白（Example 14-41：
        // "log2 x"，2 跟 x 之間才要有空白；一般字母底沒有類似的強制留白規則）。
        if(_isFuncBase&&s[i]===' '&&s[i+1]!==' '){ result+=' '; i++; }
      }else{
        result+=';'+subNem+'"\x01';
      }
      continue;
    }

    // ── Braces {} as grouping ─────────────────────────────
    if(c==='{'){
      var grp=extractBraces(s,i);i=grp.end;
      var grpNem=latexToNemethAsc(grp.content);
      // If the preceding output ends with `\` (abs-value bar), the first
      // digit inside the group does not need a numeric indicator —
      // analogous to Nemeth §17.4(d) for grouping signs in general.
      var lastOut=result.slice(-1);
      if(lastOut==='\\'&&grpNem.charAt(0)==='#')grpNem=grpNem.slice(1);
      result+=grpNem;
      continue;
    }
    if(c==='}'){i++;continue;}

    // ── Digits ───────────────────────────────────────────
    // 含開頭無整數部分的小數（如 .3、-.3）：Rule 3.2「decimal point is a numeric
    // symbol only when followed by a number」，須一併進入本分支才會補數字指示符 #
    // （Example 3-5 ".35"→"#.35"；否則開頭的 "." 會被當成一般標點單獨吃掉，
    //  後面的數字因為 prev==='.' 判斷不到「數字開頭」而漏掉 #）
    // ( ) pass straight through unconverted further down (see symMap),
    // so tracking depth here is safe. [ ] get converted to a different
    // ASCII code by symMap below — depth for those is tracked at that
    // point instead, so as not to short-circuit past their conversion.
    if(c==='('){ bracketDepth++; result+=c; i++; continue; }
    if(c===')'){ bracketDepth=Math.max(0,bracketDepth-1); result+=c; i++; continue; }

    if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(s[i+1]||''))){
      var numStart=i;
      while(i<s.length&&(/[0-9]/.test(s[i])||s[i]==='.'||
        // Rule 3.2「numeric comma」：逗號後面剛好接 3 個數字（千分位分組），且第 4 個
        // 字元不是數字，視為數字內部符號，不切斷、不加空格（Example 3-4 "1,478.00"→
        // "#1,478.00"）；跟一般當清單/座標分隔用的逗號（如 "(-3,2)"→"(-3, 2)"，
        // 逗號後面不是剛好 3 個數字）用同一個判斷式分開，不用另外處理後者。
        (s[i]===','&&/^[0-9]{3}(?!\d)/.test(s.slice(i+1)))
      ))i++;
      var num=s.slice(numStart,i);
      // Numeric indicator # rules (Nemeth Rule 3.3 / 3.4.1):
      //   Required:  at expression start, or after a space (incl. after .K etc.)
      //   NOT needed: after ^ ; ? / > ( [ < ! , and similar grouping/operator chars
      //   Special:   after a NEGATIVE SIGN `-` (not subtraction), # IS needed.
      //              A `-` is a negative sign when it follows a space, `(`, or is
      //              at position 0 of result. A `-` is subtraction when it follows
      //              a digit or letter.
      var prev=result.length?result.slice(-1):'';
      var noHashChars='^;?/>(![<@*=,';  // comma added: inside (a, b) no # needed
      var needHash=!result||prev===' ';
      if(prev&&noHashChars.indexOf(prev)>=0)needHash=false;
      // Space after comma (coordinate separator) must NOT trigger # —
      // but ONLY when inside grouping symbols (Rule 3.5.1 Enclosed List
      // scope). "(0, 6)" → 6 needs no #, but a bare top-level list like
      // "1, 2, 3, 4" (no enclosing brackets) does need # on every number.
      if(bracketDepth>0&&prev===' '&&result.length>=2&&result.charAt(result.length-2)===',')needHash=false;
      // `-` as NEGATIVE SIGN → digit still needs #.
      // Negative sign context: result is empty (expression-leading -)
      // OR the minus follows a space (after = or similar operator padding).
      // Inside brackets `(`, the - is also a negative sign but Nemeth
      // §3.4.1 suppresses # after `(`, so we don't force # there.
      if(prev==='-'){
        var prevprev=result.length>=2?result.charAt(result.length-2):'';
        if(!prevprev||prevprev===' ')needHash=true;
        // prevprev==='(' → still suppressed (bracket context, handled by noHashChars above)
        // Rule 3.5.1/3.5.2 Enclosed List exception: if that space itself
        // follows a comma (e.g. "(2, -3)"), this is a list item, not a
        // fresh negative number after an operator — no digit indicator
        // regardless (Example 3-66: "(-1, -2, -3)" -> "(-1, -2, -3)",
        // no # anywhere, confirmed via nc's own asc2brl against the rule).
        // Scoped to bracketDepth>0 for the same reason as the digit case above.
        if(bracketDepth>0&&prevprev===' '&&result.length>=3&&result.charAt(result.length-3)===',')needHash=false;
      }
      // After letters: no # (Rule 3.4.1)
      if(prev&&/[A-Z]/.test(prev))needHash=false;
      result+=(needHash?'#':'')+num;
      continue;
    }

    // ── Uppercase letters -> cap indicator + letter ──────
    if(/[A-Z]/.test(c)){
      result+=','+c;i++;continue;
    }

    // ── Lowercase letters -> as-is ────────────────────────
    if(/[a-z]/.test(c)){
      result+=c.toUpperCase();i++;continue;
    }

    // Rule 19.5.2 Example 19-27: two adjacent absolute-value bars (the
    // closing bar of one and the opening bar of the next, with nothing
    // between them) need a multipurpose indicator inserted so the pair
    // isn't misread as a single double vertical bar (Rule 19.5.1's
    // boldface-norm symbol, also two bars unspaced). Detected here since
    // every bare `|` maps to the same ASCII `\` regardless of open/close
    // role (nc doesn't track abs-bar pairing at parse time).
    if(c==='|'){
      result+=(result.slice(-1)==='\\'?'"\\':'\\');i++;continue;
    }

    // ── Common symbols ────────────────────────────────────
    var symMap={'=':' .K ','<':' "K ','>':" .1 ",'+':"+",
      '-':'-','*':'*','/':'_/',',':', ','.':'.',
      '(':'(',')':')','[':'`(',']':'`)',
      '!':'&','%':'`0',
      // Prime (Rule 23.16): the plain ASCII apostrophe ' is itself the
      // Nemeth ASCII braille symbol for prime, so it needs no lookup —
      // it just falls through untouched elsewhere in this function. But
      // authors don't always type that exact character: equation editors,
      // PDF copy-paste, and autocorrect commonly produce the Unicode
      // prime ′ (U+2032) or the "curly" right single quote ’ (U+2019)
      // instead. Both silently passed through as literal (non-braille)
      // characters before this fix — same category of bug as bt/b2t's
      // past straight-vs-curly-quote mixups. Normalizing them to plain
      // ' here (not filtering them out elsewhere) lets every existing
      // prime-aware rule (e.g. the Rule 14.6 letter-ending check below,
      // which matches "'" ) keep working unchanged.
      '′':"'",'’':"'",
      // Double/triple prime have their own dedicated Unicode characters
      // (″ U+2033, ‴ U+2034) — map straight to two/three plain primes so
      // they go through the exact same already-correct multi-prime path
      // as literally typing '' / '''. Plain ASCII " (U+0022) is included
      // too: nc's OWN internal ASCII-braille representation separately
      // overloads " to mean the baseline-return indicator (⠐) at a later
      // pipeline stage (see e.g. the "^.*\",F" style seen throughout
      // braille_map.json), so a literal " typed by an author — most
      // often produced by an editor auto-merging two typed '' into one
      // "smart" double-quote — collided with that internal sentinel and
      // silently became a baseline-return marker instead of a double
      // prime (confirmed: $x"$ produced ⠭⠐, not the correct ⠭⠄⠄). There
      // is no legitimate use for a bare quote character in Nemeth math
      // input, so treating it unconditionally as double-prime is safe.
      // ” (U+201D, curly close-double-quote) is the double-prime
      // equivalent of ’ above, same rationale.
      '"':"''",'”':"''",'″':"''",'‴':"'''",
    };
    if(symMap[c]!==undefined){
      if(c==='[')bracketDepth++;
      else if(c===']')bracketDepth=Math.max(0,bracketDepth-1);
      result+=symMap[c];i++;continue;
    }

    // Degree symbol direct
    if(c==='°'){result+='^.*';i++;continue;}

    // LaTeX spaces: single spaces are typographic (e.g. "3 + 5") and
    // invisible in rendered math — skip them. Two or more consecutive
    // spaces signal an intentional separator (e.g. "x=3  y=2") and map
    // to a single Nemeth blank cell. \  (backslash-space) also means
    // an explicit space.
    if(c===' '){
      var spCount=0;
      while(i<s.length&&s[i]===' '){spCount++;i++;}
      if(spCount>=2)result+=' '; // intentional separator → one space
      // single space → skip (typographic only)
      continue;
    }

    result+=c;i++;
  }
  // Clean up baseline indicators (⠐ / "):
  // A baseline indicator is needed ONLY when there are still base-level
  // math objects following the super/subscript. Strip the marker `"\x01`
  // when nothing follows it (end of expression or only whitespace/space),
  // and remove the sentinel \x01 everywhere else (keeping the actual ").
  // `embedded` means this call's result will be spliced into a larger
  // structure (fraction numerator/denominator before the / or #, radical
  // content before the closing ]) — from the caller's perspective this is
  // NOT the true end of the overall expression, even though it looks like
  // "end of string" from inside this recursive call alone. Closing
  // structural delimiters need the same baseline indicator that a plain
  // `)` already gets (confirmed: (a^2) keeps the indicator before `)`,
  // so \frac{1}{a^n} must keep it before the fraction closes too) — skip
  // the trailing-strip step and always keep the indicator in that case.
  // A blank cell (space) right after the sentinel already returns the
  // reader to the baseline by itself — the rule is "接空方...不需加上
  // 還原記號" (followed by a space needs no indicator), regardless of
  // what comes after that space (comparison sign or anything else) and
  // regardless of `embedded`. This is a different criterion from the
  // structural-delimiter case above (fraction/radical closes abut the
  // sentinel directly, no space, so this rule doesn't touch those).
  result = result.replace(/"\x01(?=\s)/g,'');
  if(!embedded){
    result = result.replace(/"\x01(\s*)$/,'$1');   // trailing " → remove
  }
  result = result.replace(/"\x01/g,'"');          // mid-expression " → keep
  // Same trailing/mid-expression logic for the mandatory-space-after-
  // function-name-superscript sentinel (Rule 14.3.b): drop the space
  // entirely at the true end of the expression, keep it as a real single
  // space wherever more content follows.
  if(!embedded){
    result = result.replace(/ \x01(\s*)$/,'$1');
  }
  result = result.replace(/ \x01/g,' ');
  return result;
}

var GREEK_MAP={
  '.A':'\\alpha','.B':'\\beta','.G':'\\gamma','.D':'\\delta',
  '.E':'\\epsilon','.Z':'\\zeta','.?':'\\theta','.I':'\\iota',
  '.K':'\\kappa','.L':'\\lambda','.M':'\\mu','.N':'\\nu',
  '.O':'\\omicron','.P':'\\pi','.R':'\\rho','.S':'\\sigma',
  '.T':'\\tau','.U':'\\upsilon','.F':'\\phi','.X':'\\xi',
  '.W':'\\omega','.Y':'\\psi','.:':'\\eta',
  '.*':'\\circ',
  '.,A':'\\mathrm{A}','.,B':'\\Beta','.,G':'\\Gamma','.,D':'\\Delta',
  '.,E':'\\mathrm{E}','.,Z':'\\mathrm{Z}','.,?':'\\Theta',
  '.,I':'\\mathrm{I}','.,K':'\\mathrm{K}','.,L':'\\Lambda',
  '.,M':'\\mathrm{M}','.,N':'\\mathrm{N}','.,O':'\\mathrm{O}',
  '.,P':'\\Pi','.,R':'\\mathrm{R}','.,S':'\\Sigma',
  '.,T':'\\mathrm{T}','.,U':'\\Upsilon','.,F':'\\Phi',

  [' ".K%*<*] ',' \\fallingdotseq '],
  // 全等 ≅
  [' `:.K ',' \\cong '],
  // Geometry
  [' $P ',' \\perp '],[' $L ',' \\parallel '],[' /$L ',' \\nparallel '],
  [' `: ',' \\sim '],
  [' ${33O ',' \\iff '],[' $33O ',' \\implies '],
  // 一般箭頭（Rule 21.2），排在 $33O/$[33O 後面（"長樣式優先"，避免提前吃掉那兩個較長
  // 符號的一部分）；右指用大寫 O——字母經過真點字往返會被歸一化成大寫，這裡跟 l2n
  // 端輸出的大小寫要一致才配對得到（見上面 LATEX_SIMPLE 的說明）。左指 $[33 沒有字母
  // 結尾，不受大小寫影響，但要確認前後空格邊界不會誤吃到 $[33O（iff）——" $[33 "
  // 結尾要求緊接空格，"$[33O" 那個位置是 O 不是空格，兩者不會互相誤判。
  [' $O ',' \\to '],[' ${33 ',' \\leftarrow '],
  // Comparison (longer patterns first)
  [' /.K ',' \\ne '],[' "K: ',' \\le '],[' .1: ',' \\ge '],
  [' _L ',' \\equiv '],
  // Ratio (比) and proportion (比例) per PDF 21.2 Example 21-34.
  // Tokens have leading/trailing spaces per the spec layout.
  [' "1 ',' \\ratio '],
  [' ;2 ',' \\proportion '],
  [' .K ',' = '],['.K','='],['"K ',' < '],['.1 ',' > '],
  // Arithmetic
  ['+-','\\pm '],
  ['-+','\\mp '],
  ['`*','\\times '],
  ['./','\\div '],
  ['.+','\\cup '],
  ['.%','\\cap '],
  [',=','\\infty '],
  // approximately equal (≈) — must be after fallingdotseq match
  ['`:`:','\\approx '],
  // Set/Logic (大寫 E 代表字母 e，` 代表 dot-4)
  ['/`E','\\notin '],['`E','\\in '],
  ['`&','\\forall '],['`=','\\exists '],['/','\\neg '],
  ['_"K:','\\subseteq '],['_"K','\\subset '],
  ['_.1:','\\supseteq '],['_.1','\\supset '],
  ['_0','\\emptyset '],
  // Misc
  [',*','\\therefore '],
  ['`/','\\because '],
  [',_;,N','\\mathbb{N}'],
  [',_;,Z','\\mathbb{Z}'],
  [',_;,Q','\\mathbb{Q}'],
  [',_;,R','\\mathbb{R}'],
  [',_;,C','\\mathbb{C}'],
  // Trig/functions
  ['SIN ','\\sin '],['COS ','\\cos '],['TAN ','\\tan '],
  ['COT ','\\cot '],['SEC ','\\sec '],['CSC ','\\csc '],
  ['LOG','\\log'],['LIM','\\lim'],
  // Dots
  ["'''","\\cdots "],
