  // the old '\\X\\':'|x|' hack only covered one hard-coded case.)
];

function applyNemTokens(s){
  for(var i=0;i<NEM_TOKENS.length;i++){
    s=s.split(NEM_TOKENS[i][0]).join(NEM_TOKENS[i][1]);
  }
  return s;
}

// Nemeth 絕對值直線（dot1256, ⠳ U+2833，asc2brl/brl2asc 用 | 表示，舊字元 \
// 仍當輸入別名）在解碼出來的字串裡本來就已經是最終 LaTeX 要的 | 字元，不需要
// 再轉換——這個函式現在只做「配對驗證」：Nemeth 用同一個符號表示絕對值的左右
// 兩條線，沒有開合區分，這裡假設第 1、2 條配對、第 3、4 條配對……以此類推。
// 換字元前這裡還要另外排除 LaTeX 指令（\pm、\sqrt…）跟跳脫大括號（\{、\}）
// 開頭的反斜線，因為那時候掃的是 \ 字元、跟真正的 LaTeX command 前綴撞在一起；
// 換成 | 之後這個問題不存在了（| 不會出現在任何 LaTeX 指令語法裡），不需要再排除。
//
// Known limitation: nested bars like `||x|-|y||` are mis-paired by the
// "every two consecutive bars form a pair" rule. Use \lvert/\rvert for
// those (not handled here). 落單的一條（奇數個）目前直接保留原樣——剛好也是
// \mid（條件機率）在 nc 裡的真實編碼（跟絕對值共用同一個點位，無法從點字本身
// 區分，見 symRef 的 \mid 條目），保留原樣不轉換反而是正確結果。
function pairNemAbsBars(s){
  return s;
}

function applyGreek(s){
  // Match .X  .,X  patterns (Greek letters)
  return s.replace(/\.,[A-Z?]/g,function(m){return GREEK_MAP[m]?GREEK_MAP[m]+' ':m;})
          .replace(/\.[A-Z?&.:*]/g,function(m){return GREEK_MAP[m]?GREEK_MAP[m]+' ':m;});
}

// nemBrlToLatex 在真正呼叫 parseNemStr（進而呼叫 parseNemFrac）之前，會先跑一輪
// GEO 表的 nemRe（見該函式），其中 \neg 的規則會把裸 "/" 轉成 "\neg "——但分數
// 的分數線 ?num/den# 用的也是同一個 "/" 字元，兩者純粹靠上下文（是否落在分數的
// ?…# 範圍內）區分。GEO pass 這時候還沒切開分數結構，"/" 對它來說只是普通字元，
// 於是任何分數都會被 \neg 規則搶先把分數線吃成 "\neg "，等真正的 parseNemFrac
// 要切分子分母時 "/" 早就不見了，整個分數轉錯（含巢狀的繁分數/超繁分數，因為要
// 判斷「這個 / 是不是落在分數範圍內」需要平衡對應的 ?…# 括號，簡單的
// regex lookahead/lookbehind 做不到）。
// 解法：nemBrlToLatex 在跑 GEO pass 之前，先用這裡的 4 條規則（跟 parseNemFrac
// 自己的規則逐一對應、順序也相同）把「真正的分數線」暫時換成不會被任何其他規則
// 誤判的私有字元 \x02，跑完 GEO pass 之後再換回來——之後 parseNemFrac 看到的就是
// 完全原封不動的 "/"，其餘規則也不會誤觸 \x02。
function _maskFracSlashes(s){
  function maskOne(re){
    var max=10;
    while(max-->0){
      var prev=s;
      s=s.replace(re,function(m,pre,num,sep,den,post){
        return pre+num+sep+'\x02'+den+post;
      });
      if(s===prev)break;
    }
  }
  maskOne(/(,,\?)([^]+?)(,,)\/([^]+?)(,,#)/);
  maskOne(/(,\?)([^]+?)(,)\/([^]+?)(,#)/);
  maskOne(/([0-9]+_\?)([^_]+)()\/([^_]+)(_#)/);
  maskOne(/(\?)([^?#\/]+)()\/([^#]+)(#)/);
  return s;
}
function _unmaskFracSlashes(s){
  return s.replace(/\x02/g,'/');
}

function parseNemFrac(s){
  // Hypercomplex fraction ,,?…,,/…,,#  (Nemeth 2022 §13.7, 超繁分數)
  var max=10;
  while(max-->0){
    var prev=s;
    s=s.replace(/,,\?([^]+?),,\/([^]+?),,#/,function(m,num,den){
      return '\\frac{'+parseNemStr(num)+'}{'+parseNemStr(den)+'}';
    });
    if(s===prev)break;
  }
  // Complex fraction ,?…,/…,#  (Nemeth 2022 §13.6, 繁分數)
  // 繁分數裡可能含簡單分數，需遞迴用 parseNemStr 處理
  max=10;
  while(max-->0){
    var prev=s;
    s=s.replace(/,\?([^]+?),\/([^]+?),#/,function(m,num,den){
      return '\\frac{'+parseNemStr(num)+'}{'+parseNemStr(den)+'}';
    });
    if(s===prev)break;
  }
  // Mixed number fraction: INTEGER_?num/den_#  (Rule 13.4)
  max=10;
  while(max-->0){
    var prev=s;
    s=s.replace(/([0-9]+)_\?([^_]+)\/([^_]+)_#/,function(m,intPart,num,den){
      return intPart+'\\frac{'+parseNemStr(num)+'}{'+parseNemStr(den)+'}';
    });
    if(s===prev)break;
  }
  // Simple fraction: ?num/den#
  max=10;
  while(max-->0){
    var prev=s;
    s=s.replace(/\?([^?#\/]+)\/([^#]+)#/,function(m,num,den){
      return '\\frac{'+parseNemStr(num)+'}{'+parseNemStr(den)+'}';
    });
    if(s===prev)break;
  }
  return s;
}

function parseNemRadical(s){
  // Indexed radical: <idx>radicand]
  s=s.replace(/<([^>]+)>([^\}]+)\}/g,function(m,idx,rad){
    return '\\sqrt['+parseNemStr(idx)+']{'+parseNemStr(rad)+'}';
  });
  // Simple radical: >radicand]
  s=s.replace(/>([^\}]+)\}/g,function(m,rad){
    return '\\sqrt{'+parseNemStr(rad)+'}';
  });
  return s;
}

// Rule 14.4.3（Example 14-9）反向：上標裡面還是上標時，l2n 端指示符會疊加成
// 連續多個 ~（例如 n^{x^y} 編碼成 N~X~~Y——內層 x^y 的指示符多疊一個 ~，見
// latexToNemethAsc 的 _upMarks/scriptDepth；l2n 內部字串構造仍用歷史上的 ^，
// 這裡看到的 ~ 是 brl2asc 解碼真點字後、依 asc2brl 的別名對照轉換出來的新
// 輸出字元，見 Pr 表旁的說明）。疊加次數只是拿來跟其他深度的指示符做視覺區分，
// 不代表反向時要多包一層大括號——不論疊了幾個 ~，遇到時都只是「找到這段內容
// 的終點、包一層 ^{...}」（這裡輸出的 ^{...} 是真正的 LaTeX 上標語法，跟輸入
// 端的 Nemeth-ASCII 標記字元 ~ 是兩回事，剛好都用「上標」這個概念，字元選擇
// 無關），途中如果遇到更深一層的 ~ 連續段，那段本身就是這層內容的一部分
// （不是終點），交給 parseNemStr 遞迴再展開一次就能疊出正確的巢狀大括號。
// 單一 regex 的排除字元類沒辦法表達「跳過任意長度的內層 ~ 連續段」，所以這裡
// 改用小型手寫掃描（後者只認得單一層級，遇到疊加的 ~~ 會被切斷，兩層各自獨立
// 包一次大括號，變成 X^{^{Y}} 這種多包一層的錯誤結構，也就是使用者回報的
// MathJax "Double exponent: use braces to clarify" 錯誤的成因）。
function _wrapNemSup(s){
  var out='', i=0, n=s.length;
  while(i<n){
    var c=s[i];
    if(c==='~'){
      var j=i; while(j<n && s[j]==='~') j++; // 整段連續 ~（不論疊了幾個）算一個指示符
      // parseNemFrac/parseNemRadical（跑在 parseNemLevel 之前，見 parseNemStr
      // 開頭的呼叫順序）遞迴呼叫 parseNemStr 處理分子分母/根號內容時，裡面原始
      // 的 ~ 標記可能已經被轉成正式 LaTeX 的 ^{...} 了。這個判斷假設「單一個
      // ~ 後面緊接 {」只可能是已經轉換完的 LaTeX——理論上不是絕對安全，因為
      // 换用 { 表示 dot-4-6（角/箭頭符號 "${…" 的前綴字元，見 Pr 表旁的說明）
      // 之後，原始 Nemeth ASCII 也可能真的出現 {，但目前唯一用到它的符號一定
      // 是先接 $ 再接 {（"${33O" 等），不會直接接在 ~ 後面，所以這裡的假設在
      // 現有符號表下仍然成立；如果未來新增「~ 後面直接是 { 開頭符號」的情況，
      // 這個判斷要跟著重新檢查。找到這裡直接照抄到對應的 } 為止，不再呼叫
      // parseNemStr，避免已經轉好的內容被再包一層大括號（例如 \frac{1}{a^n}
      // 的分母 a^{n} 被再包成 a^{{n}}）。
      if(j===i+1 && s[j]==='{'){
        var depth=0, m=j;
        do{
          if(s[m]==='{')depth++;
          else if(s[m]==='}')depth--;
          m++;
        }while(m<n && depth>0);
        out+=s.slice(i,m);
        i=m;
        continue;
      }
      var k=j;
      // 終點除了 " / ; / 字串結尾，還要停在空格：l2n 端的清理邏輯（見
      // latexToNemethAsc 尾端的 baseline indicator 清理）遇到「上標後面直接
      // 接空格」時，會整個省略回基線的 " 記號——因為一個空方本身就已經讓讀者
      // 回到基線，不需要額外指示符。所以反向這裡如果不把空格也當終點，會把
      // 空格後面「跟這個上標完全無關」的內容也吃進來當成上標內容的一部分
      // （例如 "2^10 =a" 這種上標後面接等號的算式，不停在空格會把 "=a" 也
      // 吃進 "10" 的指數裡）。
      while(k<n && s[k]!=='"' && s[k]!==';' && s[k]!==' '){
        if(s[k]==='~'){ while(k<n && s[k]==='~') k++; continue; } // 更深一層的 ~ 段落，屬於這層內容，不是終點
        k++;
      }
      var content=s.slice(j,k);
      var consumed=k;
      if(consumed<n && s[consumed]==='"') consumed++;
      out+='^{'+parseNemStr(content)+'}';
      i=consumed;
      continue;
    }
    out+=c; i++;
  }
  return out;
}

function parseNemLevel(s){
  // Superscript ^expr"（回基線 " 用 "? 設成可有可無——上標/下標如果是整段表達式
  // 最後一個東西，l2n 端不會補回基線符號，這裡也要能認得沒有 " 收尾的情況）
  s=_wrapNemSup(s);
  // Subscript ;expr"
  s=s.replace(/;([^";^]+)"?/g,function(m,e){return '_{'+parseNemStr(e)+'}';});
  // Rule 14.6 反向：純數字下標接在字母/縮寫函式名後面時，下標指示符 ; 跟回基線 "
  // 在 l2n 端會整個省略（見 latexToNemethAsc 的 subscript 分支），這裡要能認得
  // 「字母/函式名直接接數字，沒有 ; 也沒有 "」代表被省略指示符的下標，補回 _{...}。
  // 縮寫函式名（多字母）要先判斷，不然 "LOG2" 會被誤判成 "LO" + "G 下標 2"。
  // 這個規則本身沒有歧義（Nemeth 慣例裡「字母緊接數字、無其他符號」只會是下標），
  // 但要排在上面兩個明確帶指示符的規則之後，避免影響已經處理過的內容。
  s=s.replace(/\b(ARCSIN|ARCCOS|ARCTAN|SIN|COS|TAN|COT|SEC|CSC|LN|LOG|LIM)([0-9]+)(?![0-9])/g,
    function(m,fn,digits){return fn+'_{'+digits+'}';});
  s=s.replace(/(,?[A-Za-z])([0-9]+)(?![A-Za-z0-9])/g,
    function(m,base,digits){return base+'_{'+digits+'}';});
  return s;
}

function parseNemStr(s){
  s=s.trim();
  s=parseNemFrac(s);
  s=parseNemRadical(s);
  s=parseNemLevel(s);
  s=applyNemTokens(s);
  s=pairNemAbsBars(s);
  s=applyGreek(s);
  // Rule 3.11.1(a) 反向：大寫羅馬數字用「雙重大寫指示符 + 小寫字母」一起表示
  // （Example 3-96 VII→,,vii），跟一般大寫字母「每個字母各自加大寫指示符」（,V,I,I）
  // 不一樣，下面的逐字元大小寫轉換 pass 不認得連續逗號，要在那之前先轉成 \roman{...}
  // （單一大寫羅馬數字如 ,v 跟一般單一大寫變數 ,V 點字完全相同，天生無法區分，
  // 還原只能當一般大寫字母，不強猜，只處理雙重指示符這種明確、無歧義的多字母情形）。
  // 字母大小寫過真點字轉換（asc2brl→brl2asc）會被歸一化成大寫，這裡要接受大寫輸入
  // （沒有真的過點字、直接測 parseNemStr 才會看到小寫，跟 l2n 端自己寫的一致；
  // 實際使用者操作一定會過點字，字母必為大寫，兩種都要接受才不會漏判）。
  s=s.replace(/,,([A-Za-z]+)/g,function(m,letters){return '\\roman{'+letters.toUpperCase()+'}';});
  // Cap indicators: ,A -> A (uppercase), bare A -> a (lowercase)
  // Rule 5: comma = cap indicator, so ,A = uppercase A; bare A = lowercase a.
  // Use a two-pass approach to avoid regex-in-marker issues:
  var capOut='', capSrc=s, capI=0, capBrace=0;
  while(capI<capSrc.length){
    var capCh=capSrc[capI];
    if(capCh==='{')capBrace++;
    else if(capCh==='}')capBrace--;
    else if(capCh==='\\'){ // inside LaTeX command - skip command name
      capOut+=capCh; capI++;
      while(capI<capSrc.length&&/[a-zA-Z]/.test(capSrc[capI])){capOut+=capSrc[capI];capI++;}
      continue;
    }
    if(capBrace>0){
      // Inside {}: keep as-is (already formatted by GEO patterns)
      capOut+=capCh; capI++; continue;
    }
    if(capCh===','&&capI+1<capSrc.length&&/[A-Z]/.test(capSrc[capI+1])){
      capOut+=capSrc[capI+1]; // cap indicator + letter = uppercase
      capI+=2;
    }else if(/[A-Z]/.test(capCh)){
      capOut+=capCh.toLowerCase(); // bare uppercase = lowercase
      capI++;
    }else{
      capOut+=capCh; capI++;
    }
  }
  s=capOut;
    // Strip numeric indicator #
  s=s.replace(/#/g,'');
  // Strip lone baseline return "
  s=s.replace(/(?<![\\])"(?![{])/g,'');
  return s.trim();
}

function nemBrlToLatex(brl){
  var asc=brl2asc(brl);
  // 分數的分數線跟 \neg（見 GEO 表旁的說明）共用同一個 "/" 字元，GEO pass
  // 這時候還沒切開分數結構，先暫時保護真正的分數線，跑完 GEO pass 後再還原。
  asc=_maskFracSlashes(asc);
  // Apply GEO table nemRe patterns first (geometry)
  for(var gi=0;gi<GEO.length;gi++){
    var g=GEO[gi];
    if(!g.nemRe)continue;
    g.nemRe.lastIndex=0;
    asc=asc.replace(g.nemRe,function(){
      var args=Array.prototype.slice.call(arguments,0,-2);
      return g.n2l(args);
    });
  }
  asc=_unmaskFracSlashes(asc);
  return parseNemStr(asc);
}

function nemAscClean(s){
  s=s.replace(/,([A-Z])/g,'$1');
  s=s.replace(/\.K/g,' = ');
  s=s.replace(/#(\d+)/g,'$1');
  s=s.replace(/^"/,'');
  return s.trim();
}

// =====================================================================
// LaTeX -> Nemeth  full text  (Rule 4.2 / 4.8 switch indicators)
// Handles \n in input -> newline in output + preview sync
// =====================================================================
// Match either \(...\) or $...$ inline math.
// $...$ uses [^$\n] to avoid spanning empty $$ and to stay on one line.
var MATH_RE=/\\\(([\s\S]*?)\\\)|\$([^$\n]+?)\$/g;

// =====================================================================
// Scroll synchronisation for the three main panels
//
// Line-number-based preview sync.
// Both l2n and n2l build a lineMap[] during convert():
//   lineMap[inputLineIdx] = previewDivIdx (data-line attribute)
// On textarea scroll or after convert(), preview is scrolled to
// the div corresponding to the cursor / top-visible line.
// =====================================================================
var _syncLineMap = {};  // { 'l2n': [...], 'n2l': [...] }
var _l2nOutLines = [];  // last rendered l2n-out lines, in current display format (unicode/ascii) — used by copy/save so newlines survive
var _l2nOutLinesUnicode = [];  // same lines but always Unicode braille regardless of display toggle — 「複製並開啟 bt」只有 Unicode 點字能被 bt 正確穿透（ASCII+SimBraille 模式的一般 ASCII 字元會被 bt 誤譯），所以固定存一份不受顯示切換影響的版本

function _syncScrollPreview(prevEl, lineMap, inputLine) {
  if (!lineMap || !lineMap.length) return;
  var idx = lineMap[Math.min(Math.max(inputLine, 0), lineMap.length - 1)];
  if (idx === undefined) return;
  var el = prevEl.querySelector('[data-line="' + idx + '"]');
  if (!el) return;
  var diff = el.getBoundingClientRect().top - prevEl.getBoundingClientRect().top;
  prevEl.scrollTop = Math.max(0, prevEl.scrollTop + diff);
}

function _syncToCursor(mode) {
  var chk = document.getElementById('sync-' + mode + '-prev');
  if (!chk || !chk.checked) return;
  var ta = document.getElementById(mode + '-in');
  var lineMap = _syncLineMap[mode];
  if (!ta || !lineMap || !lineMap.length) return;
  var cursorLine = ta.value.substr(0, ta.selectionStart).split('\n').length - 1;
  var prevEl = document.getElementById(mode + '-prev');
  if (prevEl) _syncScrollPreview(prevEl, lineMap, cursorLine);
  var outEl = document.getElementById(mode + '-out');
  if (outEl) _syncScrollPreview(outEl, lineMap, cursorLine);
}

function updateSyncPanels() {}  // kept for onchange compatibility

function _attachSyncScrollListeners() {
  ['l2n', 'n2l'].forEach(function(mode) {
    var ta = document.getElementById(mode + '-in');
    if (!ta || ta._lineSyncBound) return;
    ta._lineSyncBound = true;
    ta.addEventListener('scroll', function() {
      var chk = document.getElementById('sync-' + mode + '-prev');
      if (!chk || !chk.checked) return;
      var lineMap = _syncLineMap[mode];
      if (!lineMap || !lineMap.length) return;
      var n = ta.value.split('\n').length;
      var topLine = n > 1 ? Math.floor(ta.scrollTop * n / ta.scrollHeight) : 0;
      var prevEl = document.getElementById(mode + '-prev');
      if (prevEl) _syncScrollPreview(prevEl, lineMap, topLine);
      var outEl = document.getElementById(mode + '-out');
      if (outEl) _syncScrollPreview(outEl, lineMap, topLine);
    });
  });
}

function l2nConvert(){
  var input=document.getElementById('l2n-in').value;
  var outEl=document.getElementById('l2n-out');
  var prevEl=document.getElementById('l2n-prev');
  var stEl=document.getElementById('l2n-st');

  if(!input.trim()){
    outEl.innerHTML='';outEl.className='box mono';
    prevEl.innerHTML='';stEl.textContent='';stEl.className='st';
    _l2nOutLines=[];
    _l2nOutLinesUnicode=[];
    return;
  }

  // Process line by line so newlines stay in sync with preview
  var lines=input.split('\n');
  var outLines=[], prevLines=[], lineMap=[], mathCount=0, errMsg='';

  for(var li=0;li<lines.length;li++){
    lineMap.push(prevLines.length);
    var line=lines[li];
    // Unicode math symbols → LaTeX (inside or outside math delimiters)
    line=line.replace(/×/g,'\\times ').replace(/÷/g,'\\div ');
    var outLine='', prevLine='';
    var last=0;
    // 題號偵測：行首「數字 + . + 空白/行尾」（可有前導縮排），跟 wrapStandaloneNumbers
    // 排除數學包裹的規則同一套判斷條件，限制在行首是為了避免跟句尾數字（如
    // 「x = 5.」）混淆。句點本身維持原樣文字、不轉換——跟這一行其餘標點符號
    // （，？）的處理方式一致，只有數字本體轉成 UEB 上位點字（見 ueQNumBraille
    // 旁的說明）。「(N)」括號題號格式風險較高（可能跟函式引數 f(3) 或公式標號
    // 引用混淆，且不像「N.」有天然的行首邊界），這裡先不處理。
    var qNumM=line.match(/^(\s*)(\d+)\.(?=\s|$)/);
    if(qNumM){
      outLine+=qNumM[1]+ueQNumBraille(qNumM[2])+'.';
      prevLine+=esc(qNumM[0]);
      last=qNumM[0].length;
    }
    MATH_RE.lastIndex=last;
    var m;
    while((m=MATH_RE.exec(line))!==null){
      var prose=line.slice(last,m.index);
      // If outLine already ends with a space and this prose starts with
      // a space, deduplicate to avoid double-space between math and prose.
      if(outLine.slice(-1)===' ' && prose.charAt(0)===' ') prose=prose.slice(1);
      var proseNem=prose.replace(/×/g,'⠈⠡').replace(/÷/g,'⠨⠌');
      outLine+=proseNem; prevLine+=esc(prose);
      var latex=m[1]!==undefined?m[1]:m[2];
      try{
        var nemAsc=latexToNemethAsc(latex);
        var nemBrl=asc2brl(nemAsc);
        if(nemBrl.indexOf('\n')>=0){
          // Multi-line braille (matrix / spatial fraction): the braille
          // object must own its own lines so N2L's block scanner can
          // recognize the contiguous run. Prose before/after the math
          // span is pushed as its own line so nothing gets stuck to the
          // first or last braille row.
          var brlParts=nemBrl.split('\n');
          // Flush any accumulated prose prefix as its own line (if any)
          if(outLine.length>0 || prevLine.length>0){
            outLines.push(outLine);
            prevLines.push(prevLine);
          }
          // Each braille line becomes its own output line
          for(var bi=0;bi<brlParts.length;bi++){
            outLines.push(brlParts[bi]);
            // Attach the MathJax preview span to the first row only
            if(bi===0){
              prevLines.push('<span aria-label="math">\\('+esc(latex)+'\\)</span>');
            }else{
              prevLines.push('');
            }
          }
          outLine='';
          prevLine='';
        }else{
          // Add a single space before and after inline braille so it
          // doesn't run into adjacent prose. But only if the prose
          // doesn't already end/start with a space — avoid doubles.
          var pre = (outLine.length>0 && outLine.slice(-1)!==' ') ? ' ' : '';
          outLine+=pre+nemBrl+' ';
          // The trailing space will be trimmed if the next prose starts
          // with a space, via the final cleanup below.
          prevLine+='<span aria-label="math">\\('+esc(latex)+'\\)</span>';
        }
        mathCount++;
      }catch(e){
        errMsg=e.message;
        outLine+='[ERR:'+e.message+']';
        prevLine+='<span style="color:var(--red)" role="alert">[&#x932F;&#x8AA4;]</span>';
      }
      last=MATH_RE.lastIndex;
    }
    var tail=line.slice(last);
    if(outLine.slice(-1)===' ' && tail.charAt(0)===' ') tail=tail.slice(1);
    var tailNem=tail.replace(/×/g,'⠈⠡').replace(/÷/g,'⠨⠌');
    outLine+=tailNem; prevLine+=esc(tail);
    outLines.push(outLine);
    prevLines.push(prevLine);
  }

  _syncLineMap.l2n=lineMap;
  var ascii=l2nIsAscii();
  _l2nOutLinesUnicode=outLines.slice(); // 一律是 Unicode 點字，供「複製並開啟 bt」使用
  if(ascii) outLines=outLines.map(brlToAsciiMixed);
  _l2nOutLines=outLines;
  outEl.innerHTML=outLines.map(function(l,i){return'<div data-line="'+i+'">'+esc(l)+'</div>';}).join('');
  outEl.className='box mono'+(errMsg?' err':'')+(ascii?' font-ascii':' font-unicode');
  prevEl.innerHTML=prevLines.map(function(l,i){return'<div data-line="'+i+'">'+l+'</div>';}).join('');
  if(window.MathJax&&mathCount>0){
    MathJax.typesetPromise([prevEl]).then(function(){_syncToCursor('l2n');}).catch(function(){});
  }else{
    _syncToCursor('l2n');
  }
  var status=errMsg
    ?'\u2717 \u932f\u8aa4\uff1a'+errMsg
    :mathCount
      ?'\u2713 \u5df2\u8f49\u63db '+mathCount+' \u500b\u6578\u5b78\u5340\u584a'
      :'\uff08\u672a\u627e\u5230 \\(...\\) \u6578\u5b78\u5340\u584a\uff09';
  stEl.textContent=status;
  stEl.className='st'+(errMsg?' err':' ok');
  // Announce to screen readers
  stEl.setAttribute('aria-live','polite');
}

// Detect and reconstruct multi-line Nemeth environments.
// Input: a block of one or more lines containing braille (and possibly
// spaces). Output: a LaTeX string (without surrounding \(...\)) that best
// represents the spatial structure.
//
// Spec references (Nemeth 2022, BANA):
//   - Section 13.10, Example 13-37/38/39: simple spatial fraction bar is
//     "?<run of 3s>#" in Nemeth ASCII, i.e. U+283A + N×U+2812 + U+283D
//     in Unicode braille. Numerator line above, denominator line below.
//   - Section 13.8, Example 13-32/33: hypercomplex spatial fraction bar
//     is ",,?333...,,#" — the ,, (U+2820 U+2820) wrap indicates
//     hypercomplex opening/closing. Rare; we still reconstruct to \frac.
//   - Section 25.3.4: horizontal separation line in addition/subtraction
//     is a bare run of 3s with no ?/# wrapper. Not a fraction — we emit
//     an array environment for those.
function parseNemEnv(block){
  var blockLines=block.split('\n');
  // Strip trailing all-whitespace lines but keep interior blanks
  while(blockLines.length>1 && !/\S/.test(blockLines[blockLines.length-1])){
    blockLines.pop();
  }
  // Single-line: just delegate.
  if(blockLines.length===1){
    return nemBrlToLatex(blockLines[0]);
  }
  // A spatial fraction bar line, per 13.10: trimmed content is
  //   ?333...#       (simple spatial fraction)   or
  //   ,,?333...,,#   (hypercomplex spatial fraction)
  // Codepoints below are for this implementation's Pr table:
  //   ? -> U+2839 (idx 57),   # -> U+283C (idx 60),
  //   3 -> U+2812 (idx 18),   , -> U+2820 (idx 32)
  function isSimpleFracBar(s){
    var t=s.trim();
    return /^\u2839\u2812+\u283C$/.test(t);
  }
  function isHyperFracBar(s){
    var t=s.trim();
    return /^\u2820\u2820\u2839\u2812+\u2820\u2820\u283C$/.test(t);
  }
  function isFracBar(s){ return isSimpleFracBar(s) || isHyperFracBar(s); }
  // 3-line spatial fraction with a genuine ?...# bar
  if(blockLines.length===3 && isFracBar(blockLines[1])){
    var num=nemBrlToLatex(blockLines[0].trim());
    var den=nemBrlToLatex(blockLines[2].trim());
    return '\\frac{'+num+'}{'+den+'}';
  }
  // Generic multi-line (addition/subtraction separation lines per 25.3.4,
  // matrices, systems of equations, etc.): emit an array environment,
  // one row per line. Bar-only lines (bare run of U+2812, no ?/# wrapper)
  // render as \hline.
  function isBareSeparationLine(s){
    var t=s.trim();
    return /^\u2812+$/.test(t);
  }
  // Grouped-rows environments: each row is wrapped in a specific pair of
  // braille grouping symbols. Three variants per Nemeth 2022:
  //
  //   a) Enlarged grouping `,( ... `,) → bmatrix (bracketed matrix)
  //      (Example 25-60; U+2808 U+2820 U+2837 / U+2808 U+2820 U+283E)
  //   b) Brace grouping   .,( ... .,) → cases (system of equations)
  //      (Example 25-76; U+2828 U+2820 U+2837 / U+2828 U+2820 U+283E)
  //   c) Vertical-bar grouping ,\ ... ,\ → vmatrix (determinant)
  //      (Example 25-63; U+2820 U+2833 on both ends)
  //
  // We try each variant in turn; first one where every row matches wins.
  // Boundary condition notes (still apply):
  //   - Systems of equations WITHOUT braces (25-72..25-75) have none of
  //     these markers, fall through to generic array env.
  //   - Matrix with runover cells (25-62) uses REGULAR grouping ,( on
  //     continuation rows (no leading `), so it would fail variant (a)'s
  //     strict "every row" check. Intentional — we don't attempt to
  //     reconstruct runover matrices.
  //   - Adjacent-matrix products like `,(...`,)`*`,(...`,) on a single
  //     line are handled by the single-line nemBrlToLatex path, not here.
  var GROUPED_VARIANTS = [
    { name: 'bmatrix', env: 'bmatrix',
      open: '\u2808\u2820\u2837', close: '\u2808\u2820\u283E' },
    { name: 'cases',   env: 'cases',
      open: '\u2828\u2820\u2837', close: '\u2828\u2820\u283E' },
    { name: 'vmatrix', env: 'vmatrix',
      open: '\u2820\u2833',       close: '\u2820\u2833' },
  ];
  function rowCellsFor(variant, s){
    var t=s.trim();
    if(t.indexOf(variant.open)!==0) return null;
    // §17.4(a) — "if only the left or right grouping sign is shown in
    // print, only that symbol is shown in braille." For cases this means
    // the right enlarged brace `.,)` is optional (it's absent in the
    // standard LaTeX cases layout, Example 17-5; present in the two-
    // sided Example 17-6). Other variants (bmatrix, vmatrix) still
    // require matched close.
    var hasClose = (t.length >= variant.open.length + variant.close.length)
                   && (t.lastIndexOf(variant.close) === t.length - variant.close.length);
    if(variant.name !== 'cases' && !hasClose) return null;
    // Length guards differ per closing-brace status:
    //   with close: t must have room for open+close AND non-empty inner,
    //               so length > open+close (strict).
    //               This is also what prevents vmatrix (open==close) from
    //               self-matching a bare ",\,\" as empty cases.
    //   without close (cases only): just need open+at-least-one-inner-cell.
    if(hasClose){
      if(t.length <= variant.open.length + variant.close.length) return null;
    }else{
      // cases with no .,)  — require at least one cell of real content
      if(t.length <= variant.open.length) return null;
    }
    var inner = hasClose
      ? t.slice(variant.open.length, t.length - variant.close.length)
      : t.slice(variant.open.length);
    // cases rows are single equations, not multi-cell. Don't split on
    // spaces — the spaces around .K (=), .1 (>), etc. are Nemeth
    // syntax, not column separators. Treat the whole inner as one cell.
    if(variant.name === 'cases'){
      var whole = inner.replace(/^[\u2800 ]+|[\u2800 ]+$/g,'');
      return {cells: whole.length ? [whole] : [], hasClose: hasClose};
    }
    // matrix/vmatrix rows ARE multi-cell — split on blank braille cells
    // (U+2800) or ASCII spaces.
    return {
      cells: inner.split(/[\u2800 ]+/).filter(function(x){return x.length>0;}),
      hasClose: hasClose
    };
  }
  for(var vi=0; vi<GROUPED_VARIANTS.length; vi++){
    var variant = GROUPED_VARIANTS[vi];
    var allRows = true;
    var rowsForVariant = [];
    var closeFlags = [];
    for(var mi=0; mi<blockLines.length; mi++){
      var rowInfo = rowCellsFor(variant, blockLines[mi]);
      if(rowInfo === null){ allRows = false; break; }
      rowsForVariant.push(rowInfo.cells);
      closeFlags.push(rowInfo.hasClose);
    }
    if(allRows && rowsForVariant.length >= 1){
      // For cases: decide single-sided vs two-sided.
      //   all rows have .,)  → Example 17-6 form, emit \left\{…\right\}
      //                         with array (two-sided)
      //   no rows have .,)   → Example 17-5 form, emit \begin{cases}
      //   mixed              → fall back to \begin{cases} (conservative;
      //                         a mixed braille input is likely user typo
      //                         rather than an intentional layout)
      var twoSided = false;
      if(variant.name === 'cases'){
        var allClose = closeFlags.every(function(x){return x;});
        var noneClose = closeFlags.every(function(x){return !x;});
        twoSided = allClose;
        // (noneClose → single-sided; mixed → single-sided fallback)
      }
      var latexRows = [];
      for(var mr=0; mr<rowsForVariant.length; mr++){
        var rowCells = rowsForVariant[mr];
        var latexCells = [];
        for(var mc=0; mc<rowCells.length; mc++){
          var cell = rowCells[mc];
          // PDF 17.4(d): inside cases, the first numeric character
          // following the left enlarged brace has its numeric indicator
          // suppressed. When round-tripping N→L we must restore that #
          // so the downstream parser sees a properly-indicated number.
          // Only applies to the FIRST cell of each row (the one that
          // was in direct contact with the brace).
          if(variant.name === 'cases' && mc === 0){
            // Nemeth digits are the "lowered" (downshifted) a..j cells:
            // each letter's dots shift down one row. So '1' = ⠂ (U+2802,
            // dot 2 only), NOT ⠁ (U+2801, dot 1, which is 'a'/NABCC 1).
            // The numeric indicator ⠼ (U+283C) prefixes these cells.
            var NUM_IND = '\u283C';
            var DIGIT_CELLS =
              '\u2802\u2806\u2812\u2832\u2822\u2816\u2836\u2826\u2814\u2834';
              // 1=⠂ 2=⠆ 3=⠒ 4=⠲ 5=⠢ 6=⠖ 7=⠶ 8=⠦ 9=⠔ 0=⠴
            if(cell.length > 0 && cell.charAt(0) !== NUM_IND
               && DIGIT_CELLS.indexOf(cell.charAt(0)) >= 0){
              cell = NUM_IND + cell;
            }
          }
          latexCells.push(nemBrlToLatex(cell));
        }
        latexRows.push(latexCells.join(' & '));
      }
      if(twoSided){
        // Example 17-6: \left\{ <rows> \right\} wrapping an array{l}
        return '\\left\\{\\begin{array}{l}\n'+
               latexRows.join(' \\\\\n')+
               '\n\\end{array}\\right\\}';
      }
      return '\\begin{'+variant.env+'}\n'+
             latexRows.join(' \\\\\n')+
             '\n\\end{'+variant.env+'}';
    }
  }
  var rows=[];
  var hasSepLine=false;
  for(var li=0;li<blockLines.length;li++){
    var bl=blockLines[li];
    if(!/\S/.test(bl)){ rows.push(''); continue; }
    if(isBareSeparationLine(bl)){ rows.push('\\hline'); hasSepLine=true; continue; }
    rows.push(nemBrlToLatex(bl.trim()));
  }
  // If there are separation lines (vertical addition/subtraction), keep
  // the array format for spatial layout.
  if(hasSepLine){
    return '\\begin{array}{l}\n'+rows.join(' \\\\\n')+'\n\\end{array}';
  }
  // Otherwise these are independent equations on consecutive lines —
  // not a single spatial arrangement. Return them as separate \(...\)
  // expressions joined by newlines rather than collapsing into an array.
  return rows.map(function(r){
    return r==='' ? '' : '\\('+r+'\\)';
  }).join('\n');
}

// =====================================================================
// Nemeth -> LaTeX
// Cross-line scan: collect contiguous runs of braille-bearing lines into
// blocks, then pass each block through parseNemEnv so multi-line spatial
// layouts (stacked fractions, matrices) are reconstructed instead of
// being converted line-by-line and losing their structure.
// =====================================================================
function n2lConvert(){
  var input=document.getElementById('n2l-in').value;
  var outEl=document.getElementById('n2l-out');
  var prevEl=document.getElementById('n2l-prev');
  var stEl=document.getElementById('n2l-st');

  // Classify each line: does it contain any braille char?
  var lines=input.split('\n');
  function lineHasBrl(s){
    for(var i=0;i<s.length;i++){ if(isBrl(s[i])) return true; }
    return false;
  }
  // "Pure braille line" means every non-whitespace character is a braille
  // cell. These are what a multi-line math object looks like — rows of a
  // matrix, a stacked fraction, a system of equations. A line with prose
  // text mixed in is NOT part of a multi-line math object, even if it
  // contains braille runs: it's a mixed-content line that should be
  // converted inline on its own.
  function isPureBrlLine(s){
    var sawBrl=false;
    for(var i=0;i<s.length;i++){
      var c=s[i];
      if(c===' ' || c==='\t') continue;
      if(isBrl(c)){ sawBrl=true; continue; }
      return false; // any non-whitespace non-braille char disqualifies
    }
    return sawBrl;
  }

  var outLines=[], prevLines=[], lineMap=[], mathCount=0, hasErr=false;
  var li=0;
  while(li<lines.length){
    var line=lines[li];
    if(!lineHasBrl(line)){
      // Pure prose line — pass through unchanged
      lineMap[li]=prevLines.length;
      outLines.push(line);
      prevLines.push(esc(line));
      li++;
      continue;
    }
    // Line has braille. Three sub-cases:
    //   (a) Mixed prose + braille on a single line: convert each braille
    //       run inline, keep prose as-is.
    //   (b) This line is pure braille AND the next line(s) are also pure
    //       braille — this is a multi-line math object (matrix, cases,
    //       stacked fraction). Collect the run and feed parseNemEnv.
    //   (c) This line is pure braille but the next isn't — treat it as
    //       a single-line math object. parseNemEnv will delegate to
    //       nemBrlToLatex.
    if(!isPureBrlLine(line)){
      // Case (a): mixed line — convert inline, run by run.
      var outLatex='', prevHtml='', curBrl='';
      var flush=function(){
        if(!curBrl) return;
        try{
          var latex=nemBrlToLatex(curBrl);
          outLatex+='\\('+latex+'\\)';
          prevHtml+='<span aria-label="math">\\('+esc(latex)+'\\)</span>';
          mathCount++;
        }catch(e){
          hasErr=true;
          outLatex+='[ERR:'+e.message+']';
          prevHtml+='<span style="color:var(--red)" role="alert">[&#x932F;&#x8AA4;]</span>';
        }
        curBrl='';
      };
      for(var ci=0;ci<line.length;ci++){
        var c=line[ci];
        if(isBrl(c)){curBrl+=c;}
        else{flush();outLatex+=c;prevHtml+=esc(c);}
      }
      flush();
      lineMap[li]=prevLines.length;
      outLines.push(outLatex);
      prevLines.push(prevHtml);
      li++;
      continue;
    }
    // Pure braille line — look ahead for more pure braille lines
    var blockStart=li;
    var blockEnd=li;
    while(blockEnd+1<lines.length && isPureBrlLine(lines[blockEnd+1])){
      blockEnd++;
    }
    if(blockStart===blockEnd){
      // Case (c): single pure-braille line. Convert directly.
      lineMap[li]=prevLines.length;
      try{
        var latex=nemBrlToLatex(line.trim());
        outLines.push('\\('+latex+'\\)');
        prevLines.push('<span aria-label="math">\\('+esc(latex)+'\\)</span>');
        mathCount++;
      }catch(e){
        hasErr=true;
        outLines.push('[ERR:'+e.message+']');
        prevLines.push('<span style="color:var(--red)" role="alert">[&#x932F;&#x8AA4;]</span>');
      }
      li++;
    }else{
      // Case (b): Multi-line pure-braille block — feed parseNemEnv.
      var block=lines.slice(blockStart, blockEnd+1).join('\n');
      for(var bi=blockStart;bi<=blockEnd;bi++) lineMap[bi]=prevLines.length;
      try{
        var blockLatex=parseNemEnv(block);
        // parseNemEnv may return either:
        //   (i)  a raw LaTeX fragment (matrix, cases, fraction, etc.)
        //        → wrap in a single \(...\)
        //   (ii) a sequence of already-wrapped \(...\) lines
        //        (the independent-equations fallthrough path)
        //        → emit as-is, each line is already a complete expression
        if(blockLatex.indexOf('\\(')===0){
          outLines.push(blockLatex);
          prevLines.push(blockLatex.split('\n').map(function(ln){
            return ln ? '<span aria-label="math">'+esc(ln)+'</span>' : '';
          }).join('<br>'));
          mathCount++;
        }else{
          outLines.push('\\('+blockLatex+'\\)');
          prevLines.push('<span aria-label="math">\\('+esc(blockLatex)+'\\)</span>');
          mathCount++;
        }
      }catch(e){
        hasErr=true;
        outLines.push('[ERR:'+e.message+']');
        prevLines.push('<span style="color:var(--red)" role="alert">[&#x932F;&#x8AA4;]</span>');
      }
      li=blockEnd+1;
    }
  }

  outEl.textContent=outLines.join('\n');
  outEl.className='box mono'+(hasErr?' err':'');
  _syncLineMap.n2l=lineMap;
  prevEl.innerHTML=prevLines.map(function(l,i){return'<div data-line="'+i+'">'+l+'</div>';}).join('');
  if(window.MathJax&&mathCount>0){
    MathJax.typesetPromise([prevEl]).then(function(){_syncToCursor('n2l');}).catch(function(){});
  }else{
    _syncToCursor('n2l');
  }
  var status=hasErr
    ?'\u2717 \u90e8\u5206\u5931\u6557'
    :mathCount
      ?'\u2713 \u8f49\u63db '+mathCount+' \u500b\u9ede\u5b57\u5340\u584a'
      :'\uff08\u672a\u5075\u6e2c\u5230\u9ede\u5b57\uff09';
  stEl.textContent=status;
  stEl.className='st'+(hasErr?' err':' ok');
  stEl.setAttribute('aria-live','polite');
}

// Insert a LaTeX snippet into the L2N input textarea, auto-wrapping
// with \( ... \) when the cursor is not already inside a math env.
// Used by the 108 curriculum symbol table rows.
function insertLatexIntoL2N(latex){
  var ta=document.getElementById('l2n-in');
  if(!ta) return;
  var start=ta.selectionStart||0, end=ta.selectionEnd||0;
  var value=ta.value||'';
  // Detect whether the insertion point is inside an existing \( ... \)
  // or $ ... $ math environment. If so, don't re-wrap.
  function inMathEnv(pos){
    var before=value.slice(0,pos);
    var dollars=(before.match(/\$/g)||[]).length;
    var opens=(before.match(/\\\(/g)||[]).length;
    var closes=(before.match(/\\\)/g)||[]).length;
    return (dollars%2!==0) || (opens>closes);
  }
  var snippet, caretOffset;
  if(inMathEnv(start)){
    snippet=latex;
    caretOffset=latex.length;
  }else{
    snippet='\\('+latex+'\\)';
    caretOffset=snippet.length;
  }
  ta.value=value.slice(0,start)+snippet+value.slice(end);
  var caret=start+caretOffset;
  ta.selectionStart=ta.selectionEnd=caret;
  ta.focus();
  l2nConvert();
}

function buildSymRef(){
  var ref=document.getElementById('symRef');
  ref.innerHTML='';
  // Outer collapsible shell — the whole 108-curriculum table starts collapsed.
  var outerTitle=document.createElement('div');
  outerTitle.className='grade-title symref-outer';
  outerTitle.setAttribute('tabindex','0');
  outerTitle.setAttribute('role','button');
  outerTitle.setAttribute('aria-expanded','false');
  outerTitle.setAttribute('aria-controls','symRefBody');
  outerTitle.innerHTML='\u283F 108 \u8ab2\u7db1\u7b26\u865f\u5c0d\u7167\u8868\uff08\u9ede\u64ca\u63d2\u5165\uff09 <span class="grade-arrow" aria-hidden="true">&#x25B6;</span>';
  ref.appendChild(outerTitle);
  var outerBody=document.createElement('div');
  outerBody.id='symRefBody';
  outerBody.className='symref-body collapsed';
  ref.appendChild(outerBody);
  (function(titleEl,bodyEl){
    function toggle(){
      var open=titleEl.classList.contains('open');
      if(open){
        bodyEl.style.maxHeight='0';
        bodyEl.classList.add('collapsed');
        titleEl.classList.remove('open');
        titleEl.setAttribute('aria-expanded','false');
      }else{
        bodyEl.classList.remove('collapsed');
        bodyEl.style.maxHeight=bodyEl.scrollHeight+'px';
        titleEl.classList.add('open');
        titleEl.setAttribute('aria-expanded','true');
      }
    }
    titleEl.addEventListener('click',toggle);
    titleEl.addEventListener('keydown',function(e){
      if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}
    });
  })(outerTitle,outerBody);

  for(var gi=0;gi<GRADES.length;gi++){
    var grade=GRADES[gi];
    var sec=document.createElement('div');
    sec.className='grade-section';
    var titleEl=document.createElement('div');
    titleEl.className='grade-title';
    titleEl.setAttribute('tabindex','0');
    titleEl.setAttribute('role','button');
    titleEl.setAttribute('aria-expanded','false');
    var bodyId='grade-body-'+gi;
    titleEl.setAttribute('aria-controls',bodyId);
    titleEl.innerHTML=grade.title+' <span class="grade-arrow" aria-hidden="true">&#x25B6;</span>';
    sec.appendChild(titleEl);
    var grid=document.createElement('div');
    grid.id=bodyId;
    grid.className='sym-grid grade-body collapsed';
    grid.setAttribute('role','list');
    // Toggle handler (per-grade section, inside the outer shell)
    (function(titleEl,grid,outerBody){
      function toggle(){
        var open=titleEl.classList.contains('open');
        if(open){
          grid.style.maxHeight='0';
          grid.classList.add('collapsed');
          titleEl.classList.remove('open');
          titleEl.setAttribute('aria-expanded','false');
        }else{
          grid.classList.remove('collapsed');
          grid.style.maxHeight=grid.scrollHeight+'px';
          titleEl.classList.add('open');
          titleEl.setAttribute('aria-expanded','true');
        }
        // Outer body needs to re-measure so its maxHeight accommodates
        // the newly-opened inner section.
        if(outerBody.classList.contains('collapsed')===false){
          outerBody.style.maxHeight=outerBody.scrollHeight+'px';
        }
      }
      titleEl.addEventListener('click',toggle);
      titleEl.addEventListener('keydown',function(e){
        if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}
      });
    })(titleEl,grid,outerBody);
    for(var si=0;si<grade.items.length;si++){
      var item=grade.items[si];
      var row=document.createElement('div');
      row.className='sym-row';
      row.setAttribute('role','listitem');
      row.setAttribute('tabindex','0');
      row.setAttribute('aria-label',item.name+' LaTeX: '+item.l+' Nemeth: '+item.n);
      row.title='\u9ede\u64ca\u63d2\u5165\u5230\u8f38\u5165\u6846';
      var lx=document.createElement('span');
      lx.className='sym-latex'; lx.textContent=item.l; lx.setAttribute('aria-hidden','true');
      var nm=document.createElement('span');
      nm.className='sym-nemeth'; nm.textContent=item.n; nm.setAttribute('aria-hidden','true');
      var na=document.createElement('span');
      na.className='sym-name'; na.textContent=item.name; na.setAttribute('aria-hidden','true');
      row.appendChild(lx); row.appendChild(nm); row.appendChild(na);
      (function(latex,name){
        function doInsert(){
          insertLatexIntoL2N(latex);
          setStatus('l2n-st','\u2713 \u5df2\u63d2\u5165 '+latex,'ok');
        }
        row.onclick=doInsert;
        row.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();doInsert();}};
      })(item.l,item.name);
      grid.appendChild(row);
    }
    sec.appendChild(grid);
    outerBody.appendChild(sec);
  }
}

var _NC_SESSION_KEY='vi-nc-session';
var _ncSaveTimer=null;

function ncSaveSession(){
  var fmtEl=document.querySelector('input[name="l2n-output-format"]:checked');
  var data={
    v:1,
    type:'nc',
    savedAt:new Date().toISOString(),
    mode:curMode,
    l2nInput:document.getElementById('l2n-in').value,
    n2lInput:document.getElementById('n2l-in').value,
    l2nOutputFormat:fmtEl?fmtEl.value:'unicode'
  };
  try{localStorage.setItem(_NC_SESSION_KEY,JSON.stringify(data));}catch(e){}
}

function ncSaveSessionDebounced(){
  clearTimeout(_ncSaveTimer);
  _ncSaveTimer=setTimeout(ncSaveSession,800);
}

function _ncValidateSession(data){
  if(!data||typeof data!=='object') return '不是有效的 JSON 物件。';
  if(data.v!==1) return '版本不符（需要 v:1），此存檔可能來自不相容的舊版或未來版本。';
  if(data.type==='bt'||data.type==='b2t'){
    var names={bt:'文字轉點字',b2t:'點字轉文字'};
    return '此存檔是「'+names[data.type]+'」的存檔，無法載入至「數學點字」。';
  }
  // 備援：bt/b2t 存檔一定有 zhEdits 欄位，nc 沒有
  if(data.zhEdits!==undefined) return '此存檔不是「數學點字」的存檔，無法載入。';
  if(typeof data.l2nInput!=='string'||typeof data.n2lInput!=='string') return '存檔缺少 l2nInput/n2lInput 欄位。';
  return null;
}

function ncLoadSessionData(data){
  var err=_ncValidateSession(data);
  if(err){alert('無法載入存檔：'+err);return;}
  document.getElementById('l2n-in').value=data.l2nInput||'';
  document.getElementById('n2l-in').value=data.n2lInput||'';
  if(data.l2nOutputFormat==='ascii'||data.l2nOutputFormat==='unicode'){
    var r=document.querySelector('input[name="l2n-output-format"][value="'+data.l2nOutputFormat+'"]');
    if(r) r.checked=true;
  }
  setMode(data.mode==='n2l'?'n2l':'l2n');
  l2nConvert();
  n2lConvert();
}

  try{

// Build a self-contained preview HTML document from a prevEl's innerHTML.
// Two things the live in-app preview relies on that a bare innerHTML dump
// loses: (1) the app's own CSS, which is what gives each per-line <div>
// its line-height and therefore what makes a blank source line still take
// up a visible row; (2) that CSS on the empty <div data-line="N"></div>
// rows themselves only helps if the row has *some* content to lay out —
// so we also fill genuinely empty rows with &nbsp; as a belt-and-braces
// fix that keeps the blank line visible even under different CSS.
function buildStandalonePreviewHtml(inner,title){
  inner=inner.replace(/(<div data-line="\d+")(><\/div>)/g,'$1>&nbsp;</div>');
  var style='body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;'
    +'background:#ffffff;color:#101320;font-size:16px;line-height:1.65;'
    +'max-width:900px;margin:24px auto;padding:0 20px 60px;}'
    +'[data-line]{min-height:1.65em;}'
    +'span[aria-label="math"]{margin:0 2px;}';
  return '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>'+title+'<'+'/title>'
    +'<style>'+style+'<'+'/style><'+'/head><body>'+inner+'<'+'/body><'+'/html>';
}

// Wrap standalone numbers in the L2N input with \(...\) math delimiters.
// Skips:
//   - Numbers that are already inside \(...\) or $...$
//   - Item numbers: "1." "2." at start of line, or "(1)" "(2)" anywhere
//   - Numbers already adjacent to a math delimiter
function wrapStandaloneNumbers(){
  var ta=document.getElementById('l2n-in');
  if(!ta)return;
  var text=ta.value;
  var open=useParentheses?'\\(':'$';
  var close=useParentheses?'\\)':'$';
  // Process line by line to handle item-number detection easily
  var lines=text.split('\n');
  var result=[];
  for(var li=0;li<lines.length;li++){
    var line=lines[li];
    // Tokenise: find segments already in math mode and leave them alone.
    // Regex matches \(...\), $...$, or a "standalone number" candidate.
    // Standalone number: optional leading - or +, digits, optional decimal.
    // Excluded patterns (checked after match):
    //   - item number at line start: /^\s*\d+\.\s/ or /^\s*\(\d+\)\s/
    var out='';
    var pos=0;
    // We'll scan character by character tracking math mode
    var inMath=false;
    var mathOpen='', mathClose='';
    while(pos<line.length){
      // Check for math open
      if(!inMath){
        if(line.slice(pos,pos+2)==='\\('){
          inMath=true; mathOpen='\\('; mathClose='\\)';
          out+='\\('; pos+=2; continue;
        }
        if(line[pos]==='$'){
          inMath=true; mathOpen='$'; mathClose='$';
          out+='$'; pos+=1; continue;
        }
        // Try to match a standalone number (including optional sign at word boundary)
        // Pattern: optional -, digits, optional decimal point and more digits
        var numMatch=line.slice(pos).match(/^(-?\d+\.?\d*|\d*\.\d+)/);
        if(numMatch){
          var num=numMatch[0];
          // If num ends with '.' and what follows is a space or end-of-line,
          // the dot is punctuation (item label "1. "), not a decimal point.
          // Give the dot back to the stream so isItemDot can see it in `after`.
          if(num.slice(-1)==='.'&&(pos+num.length>=line.length||/\s/.test(line[pos+num.length]))){
            num=num.slice(0,-1);
          }
          var before=line.slice(0,pos);
          var after=line.slice(pos+num.length);
          // Skip item numbers:
          //   "N." at start of line (possibly with leading whitespace)
          var isItemDot=/^\s*$/.test(before)&&/^\.\s*$|^\.\s/.test(after);
          //   "(N)" pattern anywhere
          var isItemParen=before.endsWith('(')&&after.startsWith(')');
          // Skip if immediately adjacent to a math delimiter already
          var adjMath=/[\\$]$/.test(before)||/^[\\$]/.test(after);
          // Skip if char before is a letter or digit (mid-word, mid-number)
          var prevCh=before.slice(-1);
          var midWord=prevCh&&/[\w.]/.test(prevCh);
          if(isItemDot||isItemParen||adjMath||midWord){
            out+=num; pos+=num.length;
          }else{
            out+=open+num+close; pos+=num.length;
          }
          continue;
        }
        out+=line[pos]; pos++;
      }else{
        // Inside math: look for close
        if(line.slice(pos,pos+mathClose.length)===mathClose){
          inMath=false;
          out+=mathClose; pos+=mathClose.length; continue;
        }
        out+=line[pos]; pos++;
      }
    }
    result.push(out);
  }
  ta.value=result.join('\n');
  l2nConvert();
  setStatus('l2n-st','\u2713 \u5df2\u6a19\u793a\u6578\u5b57','ok');
}

// Theme toggle: dark (default) <-> light. Persisted in localStorage.
// Applied to <html> so CSS vars cascade before layout; avoids flash.
function applyTheme(t){
  var root=document.documentElement;
  if(t==='light'){
    root.setAttribute('data-theme','light');
  }else{
    root.removeAttribute('data-theme');
  }
}
// Initial theme: check saved preference, else system preference, else dark.
(function initTheme(){
  // Check site-wide theme from index.html first
  var siteTheme=null;
  try{siteTheme=localStorage.getItem('site-theme');}catch(e){}
  if(siteTheme==='light'||siteTheme==='dark'){
    applyTheme(siteTheme); return;
  }
  var saved=null;
  try{saved=localStorage.getItem('nemeth-theme');}catch(e){}
  if(saved==='light'||saved==='dark'){
    applyTheme(saved);
    return;
  }
  // No saved pref — respect system if available
  if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches){
    applyTheme('dark');
  }else{
    applyTheme('light');
  }
})();

// ── 框架主題控制 ──
window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'setTheme') {
        applyTheme(e.data.theme);
        try { localStorage.setItem('nemeth-theme', e.data.theme); } catch(ex) {}
    }
});

<script>
// ======================================================================
// 數學編輯器 modal 開關與套用
// ======================================================================
var _meModalReturn = null, _meModalTrap = null;
var _ME_FOCUSABLE = 'button:not([disabled]),[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';

function openMathEditor() {
  initMathEditor();
  var ta = document.getElementById('latexInput');
  var l2nIn = document.getElementById('l2n-in');
  if (ta && l2nIn) {
    ta.value = l2nIn.value;
    if (typeof updatePreview === 'function') updatePreview();
  }
  _meModalReturn = document.activeElement;
  var modalEl = document.getElementById('me-modal');
  modalEl.classList.add('open');
  setTimeout(function(){ if (ta) ta.focus(); }, 100);

  function onKey(e) {
    if (e.key === 'Escape') { e.preventDefault(); closeMathEditor(); return; }
    if (e.key !== 'Tab') return;
    var els = Array.from(modalEl.querySelectorAll(_ME_FOCUSABLE));
    if (!els.length) return;
    var first = els[0], last = els[els.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  modalEl.addEventListener('keydown', onKey);
  _meModalTrap = function() { modalEl.removeEventListener('keydown', onKey); };
}
function closeMathEditor() {
  document.getElementById('me-modal').classList.remove('open');
  if (_meModalTrap) { _meModalTrap(); _meModalTrap = null; }
  if (_meModalReturn) { _meModalReturn.focus(); _meModalReturn = null; }
}
function applyMathEditor() {
  var ta = document.getElementById('latexInput');
  var l2nIn = document.getElementById('l2n-in');
  if (ta && l2nIn) {
    l2nIn.value = ta.value;
    l2nConvert();
  }
  closeMathEditor();
}
// ESC 關閉 modal
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && document.getElementById('me-modal').classList.contains('open')) {
    closeMathEditor();
  }
});

// ======================================================================
// Math Editor (整合自 math-editor3q.htm)
// 所有函式放全域讓 HTML onclick 能找到；
// 需要 DOM 的事件綁定延遲到 initMathEditor() 首次呼叫
// ======================================================================
var _mathEditorInited = false;
function initMathEditor() {
  if (_mathEditorInited) return;
  _mathEditorInited = true;
  // 綁定 latexInput / preview 事件（modal 開啟後 DOM 已就緒）
  var _li = document.getElementById('latexInput');
  var _pv = document.getElementById('preview');
  if (_li) {
    _li.addEventListener('input', updatePreview);
    _li.addEventListener('scroll', syncScroll);
    _li.addEventListener('keydown', handleKeyDown);
    _li.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.key === 'm') { e.preventDefault(); wrapMathExpression(this, false); }
    });
    _li.addEventListener('keydown', function(e) {
      if (e.altKey && e.key === 'm') { e.preventDefault(); wrapMathExpression(this, true); }
    });
  }
  if (_pv) _pv.addEventListener('scroll', syncScroll);
  var _cadb = document.getElementById('convertAllDelimitersButton');
  if (_cadb) _cadb.textContent = "全部轉換為 \\( \\)";
  // Set initial textContent on the toggle button via JS rather than
  // leaving \( \) in the raw HTML — otherwise MathJax scans the DOM,
  // sees the delimiters, and renders the empty pair away, leaving only
  // "使用 " visible until the user clicks the button once.
  var _tdb = document.getElementById('toggleDelimiterButton');
  if (_tdb) _tdb.textContent = "使用 \\( \\)";
  var _spb = document.querySelector('#savePreviewButton');
  if (_spb) _spb.addEventListener('click', savePreviewAsHTML);
}

			function updateAllButtons() {
				// No-op: previous implementation called .match(...)[1] on every
				// button[onclick^="insertMath"] without null-checking, throwing

			function convertAllDelimiters() {
				const textarea = document.getElementById('latexInput');
				let text = textarea.value;
				
				const targetDelimiters = useParentheses ? ['\\(', '\\)'] : ['$', '$'];

				// 定義轉換函數
				function convertDelimiters(text, fromStart, fromEnd, toStart, toEnd) {
					let result = '';
					let insideMath = false;
					let depth = 0;
					let mathContent = '';

					for (let i = 0; i < text.length; i++) {
						if (text.startsWith(fromStart, i) && (!insideMath || depth > 0)) {
							if (insideMath) {
								mathContent += fromStart;
								depth++;
							} else {
								result += toStart;
								insideMath = true;
							}
							i += fromStart.length - 1;
						} else if (text.startsWith(fromEnd, i) && insideMath) {
							if (depth > 0) {
								mathContent += fromEnd;
								depth--;
							} else {
								result += mathContent + toEnd;
								mathContent = '';
								insideMath = false;
							}
							i += fromEnd.length - 1;
						} else if (insideMath) {
							mathContent += text[i];
						} else {
							result += text[i];
						}
					}

					// 處理未閉合的數學環境
					if (insideMath) {
						result += fromStart + mathContent;
					}

					return result;
				}

				// 轉換所有分隔符
				text = convertDelimiters(text, '$', '$', targetDelimiters[0], targetDelimiters[1]);
				text = convertDelimiters(text, '\\(', '\\)', targetDelimiters[0], targetDelimiters[1]);
				text = convertDelimiters(text, '\\[', '\\]', targetDelimiters[0], targetDelimiters[1]);

				textarea.value = text;
				updatePreview();
			}
		
			function insertMathDelimiters() {
				const delimiters = useParentheses ? ['\\(', '\\)'] : ['$', '$'];
				const textarea = document.getElementById('latexInput');
				const start = textarea.selectionStart;
				const end = textarea.selectionEnd;
				if (start !== end) {
					// Wrap the selected text with the delimiters
					const selected = textarea.value.slice(start, end);
					const wrapped = delimiters[0] + selected + delimiters[1];
					textarea.value = textarea.value.slice(0, start) + wrapped + textarea.value.slice(end);
					textarea.selectionStart = textarea.selectionEnd = start + wrapped.length;
				} else {
					// No selection: insert empty delimiters with cursor inside
					insertText(delimiters[0] + delimiters[1], delimiters[0].length);
				}
				textarea.focus();
				updatePreview();
			}

			function insertMath(math) {
				const textarea = document.getElementById('latexInput');
				const start = textarea.selectionStart;
				const end = textarea.selectionEnd;
				const value = textarea.value;
				
				function isInMathEnvironment(pos) {
					const beforeCursor = value.slice(0, pos);
					const dollarPairs = (beforeCursor.match(/\$/g) || []).length;
					const bracketPairs = (beforeCursor.match(/\\\(/g) || []).length - (beforeCursor.match(/\\\)/g) || []).length;
					return (dollarPairs % 2 !== 0) || (bracketPairs > 0);
				}

				let newText, cursorPosition;
				const delimiters = useParentheses ? ['\\(', '\\)'] : ['$', '$'];

				if (isInMathEnvironment(start)) {
					newText = value.slice(0, start) + math + value.slice(end);
					cursorPosition = start + math.length;
				} else {
					newText = value.slice(0, start) + delimiters[0] + math + delimiters[1] + value.slice(end);
					cursorPosition = start + delimiters[0].length + math.length;
				}

				const braceIndex = math.indexOf('{}');
				if (braceIndex !== -1) {
					cursorPosition = (isInMathEnvironment(start) ? start : start + delimiters[0].length) + braceIndex + 1;
				}

				textarea.value = newText;
				textarea.selectionStart = textarea.selectionEnd = cursorPosition;
				textarea.focus();
				updatePreview();
			}

			function updatePreview() {
				const latex = document.getElementById('latexInput').value.replace(/\n/g, '<br>');
				const preview = document.getElementById('preview');

				// 將所有數學式轉換為 \(...\) 格式
				let wrappedLatex = latex
					.replace(/(\$)(?!\$)(.+?)(?<!\$)(\$)/g, '\\($2\\)')
					.replace(/\\\[(.*?)\\\]/g, '\\($1\\)');
				
				// 確保所有 \(...\) 格式的數學式都被正確識別
				wrappedLatex = wrappedLatex.replace(/\\\((.+?)\\\)/g, '\\($1\\)');

	       function formatXML(xml) {
	           // 格式化 XML 以便更好地顯示
	           const PADDING = '  ';
	           const reg = /(>)(<)(\/*)/g;
	           let pad = 0;
	           let formatted = '';
	           xml = xml.replace(reg, '$1\r\n$2$3');
	           xml.split('\r\n').forEach((node, index) => {
	               let indent = 0;
	               if (node.match(/.+<\/\w[^>]*>$/)) {
	                   indent = 0;
	               } else if (node.match(/^<\/\w/)) {
	                   if (pad != 0) {
	                       pad -= 1;
	                   }
	               } else if (node.match(/^<\w([^>]*[^\/])?>.*$/)) {
	                   indent = 1;
	               } else {
	                   indent = 0;
	               }

	               let padding = '';
	               for (let i = 0; i < pad; i++) {
	                   padding += PADDING;
	               }

	               formatted += padding + node + '\r\n';
	               pad += indent;
	           });

	           return formatted;
	       }

		function jumpToNextBraceOrLatex(forward = true) {
			const textarea = document.getElementById('latexInput');
			const text = textarea.value;
			const cursorPosition = textarea.selectionStart;

			// 正則表達式匹配 {} 和 LaTeX 分隔符
			const regex = /\{|\}|\\\(|\\\)|\$\$/g;
			let match;
			let nextPosition = cursorPosition;

			if (forward) {
				// 向前搜索
				regex.lastIndex = cursorPosition;
				while ((match = regex.exec(text)) !== null) {
					if (match.index > cursorPosition) {
						nextPosition = match.index + match[0].length;
						break;
					}
				}
			} else {
				// 向後搜索
				const reverseText = text.split('').reverse().join('');
				const reverseRegex = /\}|\{|\)\\\(|\\\|\$\$/g;
				const reverseCursorPosition = text.length - cursorPosition;
				reverseRegex.lastIndex = reverseCursorPosition;
				while ((match = reverseRegex.exec(reverseText)) !== null) {
					if (match.index > reverseCursorPosition) {
						nextPosition = text.length - (match.index + match[0].length);
						break;
					}
				}
			}

			// 設置新的光標位置
			textarea.setSelectionRange(nextPosition, nextPosition);
			textarea.focus();
		}
		
    // ctrl+m / alt+m 綁定已搬到 initMathEditor() 統一處理
    
    function wrapMathExpression(textarea, moveCursorInside) {
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const value = textarea.value;
        // 找到當前行的開始和結束
        const lineStart = value.lastIndexOf('\n', start - 1) + 1;
        const lineEnd = value.indexOf('\n', end);
        const currentLine = value.substring(lineStart, lineEnd === -1 ? value.length : lineEnd);
        // 在當前行內找到包裹結束的位置
        const cursorPosInLine = start - lineStart;
        let wrapEndIndex = cursorPosInLine;
        const chineseRegex = /[\u4e00-\u9fa5]/; // 匹配中文字符
        const fullWidthPuncRegex = /[\uFF00-\uFFEF]/; // 匹配全形標點
        while (wrapEndIndex < currentLine.length) {
            const char = currentLine[wrapEndIndex];
            if (char === ' ' || chineseRegex.test(char) || fullWidthPuncRegex.test(char)) {
                break;
            }
            wrapEndIndex++;
        }
        // 獲取要包裹的文本
        const textToWrap = currentLine.substring(cursorPosInLine, wrapEndIndex);
        // 根據當前設置選擇分隔符
        const delimiters = useParentheses ? ['\\(', '\\)'] : ['$', '$'];
        // 創建新的行文本
        const newLineText = currentLine.substring(0, cursorPosInLine) + 
                            delimiters[0] + textToWrap + delimiters[1] + 
                            currentLine.substring(wrapEndIndex);
        // 更新整個文本區域的值
        textarea.value = value.substring(0, lineStart) + newLineText + value.substring(lineEnd === -1 ? value.length : lineEnd);
        
        let newCursorPos;
        if (moveCursorInside) {
            // 如果是 alt + M，將游標移動到分隔符內部
            newCursorPos = lineStart + cursorPosInLine + delimiters[0].length;
        } else {
            // 如果是 ctrl + M，保持原有邏輯
            const validStartRegex = /[a-zA-Z0-9\\]/;
            newCursorPos = lineStart + cursorPosInLine + delimiters[0].length + textToWrap.length + delimiters[1].length;
            let foundValid = false;
            while (newCursorPos < value.length) {
                if (value[newCursorPos] === '\n') {
                    // 如果遇到換行符，停在下一行開頭
                    newCursorPos++;
                    break;
                }
                if (validStartRegex.test(value[newCursorPos])) {
                    foundValid = true;
                    break;
                }
                newCursorPos++;
            }
            // 如果沒找到有效字符，則保持在包裹符號後
            if (!foundValid) {
                newCursorPos = lineStart + cursorPosInLine + delimiters[0].length + textToWrap.length + delimiters[1].length;
            }
        }
        
        // 更新光標位置
        textarea.setSelectionRange(newCursorPos, newCursorPos);
        // 更新預覽
        updatePreview();
    }


		
		function convertLatexTableToHTML(latexTable) {
			// 移除 tabular 环境的开始和结束标记
			latexTable = latexTable.replace(/\\begin{tabular}.*?\n/, '')
								   .replace(/\\end{tabular}/, '');

			let html = '<table border="1">';
			let rows = latexTable.split('\\\\').filter(row => row.trim() !== '');
			let inHeader = false;
			let isFirstRow = true;

			rows.forEach((row, index) => {
				row = row.trim();

				if (row.includes('\\hline')) {
					if (!isFirstRow) {
						html += inHeader ? '</th></tr>' : '</td></tr>';
					}
					inHeader = false;
					isFirstRow = false;
					row = row.replace('\\hline', '');
				}

				if (row !== '') {
					if (row.includes('\\multicolumn')) {
						html += '<tr><th colspan="2">';
						inHeader = true;
						row = row.replace(/\\multicolumn{\d+}{[^}]+}{([^}]+)}/, '$1');
					} else if (!inHeader && !isFirstRow) {
						html += '<tr>';
					}

					let cells = row.split('&');
					cells.forEach((cell, cellIndex) => {
						cell = cell.trim()
							.replace(/\\\w+{([^}]+)}/, '$1') // 处理 \textbf 等命令
							.replace(/(\$[^\$]+\$|\\\([^\)]+\\\))/g, match => {
								// 将数学式包裹在 \(...\) 中
								return '\\(' + match.replace(/^\$|\$$|\\\(|\\\)$/g, '') + '\\)';
							})
							.replace(/\\%/g, '%') // 处理百分号
							.replace(/\\\s/g, ' '); // 处理 LaTeX 空格
						
						if (inHeader) {
							html += (cellIndex === 0 && !isFirstRow ? '<th>' : '') + cell;
						} else {
							html += `<td>${cell}</td>`;
						}
					});

					isFirstRow = false;
				}
			});

			// 确保最后一行正确闭合
			if (!isFirstRow) {
				html += inHeader ? '</th></tr>' : '</td></tr>';
			}

			html += '</table>';
			return html;
		}

		function convertMarkdownToHTML() {
			const textarea = document.getElementById('latexInput');
			let text = textarea.value;

			// 首先替換 \(\qquad\)
			text = text.replace(/\\qquad/g, "----");

			// 轉換 LaTeX 表格
			text = text.replace(/\\begin{tabular}[\s\S]*?\\end{tabular}/g, match => {
				return convertLatexTableToHTML(match);
			});

			// 轉換圖片
			text = text.replace(/!\[([^\]]*)\]\(([^\)]+)\)/g, '<img src="$2" alt="Mathpix Image">');

			// 轉換 Markdown 表格
			text = text.replace(/(\|.+\|)\r?\n(\|[\s:]*[-]+[\s:]*\|[\s:]*[-]+[\s:]*\|.*)\r?\n((?:\|.+\|\r?\n?)+)/g, function(match, headerRow, separatorRow, bodyRows) {
				// 將表格分成頭部、分隔行和內容部分
				const headers = headerRow.trim().split('|').filter(cell => cell.trim() !== '');
				const body = bodyRows.trim().split('\n').map(row => 
					row.trim().split('|').filter(cell => cell.trim() !== '')
				);
				
				// 構建 HTML 表格 - 移除換行符
				let tableHTML = '<table border="1"><thead><tr>';
				
				// 添加表頭
				headers.forEach(header => {
					tableHTML += `<th>${header.trim()}</th>`;
				});
				
				tableHTML += '</tr></thead><tbody>';
				
				// 添加表格內容
				body.forEach(row => {
					tableHTML += '<tr>';
					row.forEach(cell => {
						tableHTML += `<td>${cell.trim()}</td>`;
					});
					tableHTML += '</tr>';
				});
				
				tableHTML += '</tbody></table>';
				return tableHTML;
			});

			// 處理沒有分隔符行的簡單表格格式 (如果上面的匹配沒有成功)
			text = text.replace(/(\|.+\|[\r\n]*)+/g, function(match) {
				if (match.includes('<table')) return match; // 已經轉換過的不再處理
				
				const rows = match.trim().split(/[\r\n]+/);
				if (rows.length <= 1) return match; // 只有一行則不處理
				
				// 檢查是否有分隔行 (|---|---|)
				const hasSeparator = rows.some(row => /^\|[\s:]*[-]+[\s:]*\|/.test(row));
				if (hasSeparator) return match; // 有分隔行的表格由上面的規則處理
				
				let tableHTML = '<table border="1">';
				let isFirstRow = true;
				
				for (let row of rows) {
					// 跳過分隔行
					if (/^\|[\s:]*[-]+[\s:]*\|/.test(row)) continue;
					
					const cells = row.split('|').filter(cell => cell.trim() !== '');
					if (cells.length === 0) continue;
					
					tableHTML += '<tr>';
					
					cells.forEach(cell => {
						const tag = isFirstRow ? 'th' : 'td';
						tableHTML += `<${tag}>${cell.trim()}</${tag}>`;
					});
					
					tableHTML += '</tr>';
					isFirstRow = false;
				}
				
				tableHTML += '</table>';
				return tableHTML;
			});

			// 轉換粗體
			text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

			// 轉換斜體
			text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');

			// 轉換標題
			text = text.replace(/^# (.*$)/gm, '<h1>$1</h1>');
			text = text.replace(/^## (.*$)/gm, '<h2>$1</h2>');
			text = text.replace(/^### (.*$)/gm, '<h3>$1</h3>');

			// 轉換列表
			text = text.replace(/^\s*\*\s(.*)$/gm, '<li>$1</li>');
			text = text.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');

			// 轉換連結
			text = text.replace(/\[([^\]]+)\]\(([^\)]+)\)/g, '<a href="$2">$1</a>');

			// 使用正則表達式替換 \section*{ } 和 \title{ }
			text = text.replace(/\\section\*\{(.*?)\}/g, '$1');
			text = text.replace(/\\title\s*\{([\s\S]*?)\}/g, '$1').trim();

			// 使用正則表達式替換 / /
			text = text.replace(/(\w+)\s*\/\s*\/\s*(\w+)/g, '$1 \\parallel $2');

			textarea.value = text;
			updatePreview();
		}
		function clearAll() {
        // 清空 latexInput
        document.getElementById('latexInput').value = '';
    
        // 清空 preview
        document.getElementById('preview').innerHTML = '';
    
        // MathJax 3 使用 typesetPromise，不再有 Hub
        if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
            MathJax.typesetPromise([document.getElementById('preview')]).catch(function(){});
        }
    }
		
		document.addEventListener('keydown', function(e) {
			const textarea = document.getElementById('latexInput');
			if (document.activeElement === textarea) {
				if (e.altKey && e.key === 'ArrowRight') {
					e.preventDefault();
					jumpToNextBraceOrLatex(true);
				} else if (e.altKey && e.key === 'ArrowLeft') {
					e.preventDefault();
					jumpToNextBraceOrLatex(false);
				}
			}
		});

				clonedDoc.body.innerHTML = '';

				// 移除所有不必要的元素
				const elementsToRemove = clonedDoc.querySelectorAll('script, link, style, meta:not([charset]), button, textarea');
				elementsToRemove.forEach(el => el.remove());

				// 確保有 charset meta 標籤
				if (!clonedDoc.querySelector('meta[charset]')) {
					const meta = clonedDoc.createElement('meta');
					meta.setAttribute('charset', 'UTF-8');
					clonedDoc.head.appendChild(meta);
				}

				// 修改標題
				const titleElement = clonedDoc.querySelector('title');
				if (titleElement) {
					titleElement.textContent = 'LaTeX Preview';
				} else {
					const newTitle = clonedDoc.createElement('title');
					newTitle.textContent = 'LaTeX Preview';
					clonedDoc.head.appendChild(newTitle);
				}

				// 添加 MathJax 腳本
				const mathJaxScript = clonedDoc.createElement('script');
				mathJaxScript.src = "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js";
				clonedDoc.head.appendChild(mathJaxScript);

				// 添加 MathJax 配置
				const mathJaxConfig = clonedDoc.createElement('script');
				mathJaxConfig.textContent = `
					window.MathJax = {
						tex: {
							inlineMath: [['$', '$'], ['\\\\(', '\\\\)']]
						}
					};
				`;
				clonedDoc.head.insertBefore(mathJaxConfig, mathJaxScript);

				const htmlContent = clonedDoc.documentElement.outerHTML;

				const blob = new Blob([htmlContent], { type: 'text/html' });
				const url = URL.createObjectURL(blob);
				const a = document.createElement('a');
				a.href = url;
				a.download = 'latex_preview.html';
				document.body.appendChild(a);
				a.click();
				document.body.removeChild(a);
				URL.revokeObjectURL(url);
			}

var _spb = document.querySelector('#savePreviewButton');
if (_spb) _spb.addEventListener('click', savePreviewAsHTML);

		function delspace() {
			const input = document.getElementById('latexInput');
			let text = input.value;
			
			// 移除 加減號前後空格
			text = text.replace(/\s([+\-])\s/g, '$1');
			
			// 1. 移除 \right 和 \left
			text = text.replace(/\\(right|left)(?![a-zA-Z])/g, '');
			
			// 2. 把 \mathrm{x} 變成 x (對任何單個字符)
			text = text.replace(/\\mathrm\{([a-zA-Z0-9])\}/g, '$1');
			
			// 3. 移除數字後面接 x 或 y 的空格
			text = text.replace(/(\d)\s+([xy])/g, '$1$2');
			
			// 原本的大寫字母間空格處理
			text = text.replace(/\\\((.*?)\\\)/g, function(match, content) {
				// 處理大寫字母之間的空格
				const processed = content.replace(/([A-Z])\s+(?=[A-Z])/g, '$1');
				return '\\(' + processed + '\\)';
			});
			
			input.value = text;
			// 觸發 change 事件
			input.dispatchEvent(new Event('change'));
		}
